goal: "Make this physics sandbox more fun, more surprising, and more satisfying to play with"
mode: propose
quality_bar: high
max_changes_per_run: 1
test_command: npm test
verify: both
branch: make-it-better
test_required: true
constraints:
  - "Auto upgrades must be feature work only: add new features or improve existing features."
  - "Do not redesign, restructure, or rearrange the app layout."
  - "Preserve the current shell: top bar, canvas area, object toolbar, and chaos bar."
  - "Keep the two bottom horizontally scrolling sections: #toolbar and #chaos-bar."
  - "New controls must be added inside the appropriate existing bottom scrolling section instead of replacing or adding new layout regions."
  - "Visual polish is allowed only when it supports a feature and does not move, resize, collapse, or replace the core layout."
  - "Every behavior or UI change must be verified with .cursor/skills/verify-chaos-engine: launch, doctor, drive the affected feature journeys, capture evidence, then cleanup. npm test and npm run build must pass. Vitest alone is not enough."
  - "New user-facing features need a features/*.md entry (mirror it under .cursor/skills/verify-chaos-engine/features/). Update the skill with /maintain-verification-skill when the UI or selectors change."
  - "PR descriptions must include a Verification section that lists the journeys run and the evidence paths."
