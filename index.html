<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CHAOS ENGINE</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
/* ── RESET & BASE ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#0a0a0a; color:#00ff41;
  font-family:'VT323', monospace; font-size:18px;
  touch-action:manipulation; user-select:none;
  -webkit-user-select:none;
}

/* ── SCANLINE OVERLAY ── */
body::after {
  content:''; position:fixed; inset:0; z-index:9999;
  pointer-events:none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,255,65,0.03) 0px,
    rgba(0,255,65,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
}

/* ── LAYOUT ── */
#app {
  display:flex; flex-direction:column;
  width:100%; height:100%;
}

/* ── TOP BAR ── */
#topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; gap:8px; flex-shrink:0;
  background:#0d1117;
  border-bottom:2px solid #0abdc6;
  box-shadow:0 2px 12px rgba(10,189,198,0.3);
  z-index:10;
}
#topbar .title {
  font-size:28px; color:#00ff41; letter-spacing:4px;
  text-shadow:0 0 10px rgba(0,255,65,0.6);
  white-space:nowrap;
}
#gravity-panel {
  display:flex; align-items:center; gap:6px; flex-wrap:nowrap;
}
#gravity-panel .planet-btn {
  background:#111820; border:1px solid #0abdc6;
  color:#0abdc6; font-family:'VT323',monospace; font-size:16px;
  padding:4px 10px; cursor:pointer; border-radius:2px;
  transition: all .15s;
}
#gravity-panel .planet-btn.active,
#gravity-panel .planet-btn:hover {
  background:#0abdc6; color:#0a0a0a;
  box-shadow:0 0 8px rgba(10,189,198,0.5);
}
#stats {
  font-size:18px; color:#0abdc6; white-space:nowrap;
  text-shadow:0 0 6px rgba(10,189,198,0.4);
}

/* ── CANVAS AREA ── */
#canvas-wrap {
  flex:1; position:relative; overflow:hidden;
  /* CRT curvature */
  border-radius:8px;
  /* subtle barrel distortion via box-shadow inset */
  box-shadow: inset 0 0 60px rgba(0,0,0,0.8), inset 0 0 15px rgba(10,189,198,0.08);
}
#canvas-wrap::before {
  content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
  border-radius:8px;
  box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
}
canvas#game {
  display:block; width:100%; height:100%;
  background:#080c10;
  touch-action:none;
}

/* ── OBJECT TOOLBAR ── */
#toolbar {
  display:flex; align-items:center; justify-content:center;
  gap:4px; padding:6px 8px; flex-shrink:0;
  background:#0d1117;
  border-top:2px solid #0abdc6;
  border-bottom:2px solid #0abdc6;
  box-shadow:0 -2px 12px rgba(10,189,198,0.2);
  overflow-x:auto; flex-wrap:nowrap;
}
.tool-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:64px; height:58px; padding:2px 6px;
  background:#111820; border:2px solid #1a3a2a;
  color:#00ff41; font-family:'VT323',monospace; font-size:13px;
  cursor:pointer; border-radius:3px; transition:all .15s;
  flex-shrink:0;
}
.tool-btn .icon { font-size:24px; line-height:1; }
.tool-btn.active, .tool-btn:hover {
  border-color:#00ff41; background:#0a2a1a;
  box-shadow:0 0 10px rgba(0,255,65,0.3);
}
.tool-btn.draw-btn.active {
  border-color:#ff6600; background:#2a1a0a;
  box-shadow:0 0 10px rgba(255,102,0,0.4);
  color:#ff6600;
}
.tool-btn.slomo-btn.active {
  border-color:#cc00ff; background:#1a0a2a;
  box-shadow:0 0 10px rgba(204,0,255,0.4);
  color:#cc00ff;
}

/* ── CHAOS BUTTONS ── */
#chaos-bar {
  display:flex; align-items:center; justify-content:center;
  gap:4px; padding:6px 8px; flex-shrink:0;
  background:#0d1117;
  border-top:2px solid #00ff41;
  box-shadow:0 -2px 12px rgba(0,255,65,0.15);
}
.chaos-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:68px; height:52px; padding:2px 8px;
  background:#1a0a0a; border:2px solid #ff3333;
  color:#ff3333; font-family:'VT323',monospace; font-size:12px;
  cursor:pointer; border-radius:3px; transition:all .15s;
  flex-shrink:0;
}
.chaos-btn .icon { font-size:20px; line-height:1; }
.chaos-btn:hover, .chaos-btn:active {
  background:#3a0a0a; border-color:#ff6666;
  box-shadow:0 0 12px rgba(255,51,51,0.4);
}
.chaos-btn.safe { border-color:#0abdc6; color:#0abdc6; background:#0a1a1a; }
.chaos-btn.safe:hover { background:#0a2a2a; box-shadow:0 0 12px rgba(10,189,198,0.4); }

/* ── SCROLLABLE TOOLBARS ── */
#toolbar, #chaos-bar {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  scrollbar-width: none;
}
#toolbar::-webkit-scrollbar, #chaos-bar::-webkit-scrollbar { display:none; }

/* ── COLLAPSE TOGGLES ── */
.bar-toggle {
  display:none; /* hidden on desktop */
  background:#0d1117; border:1px solid #0abdc6;
  color:#0abdc6; font-family:'VT323',monospace; font-size:16px;
  padding:4px 12px; cursor:pointer; text-align:center;
  width:100%; flex-shrink:0;
}
.bar-toggle:active { background:#0abdc6; color:#0a0a0a; }

/* ── MOBILE TWEAKS ── */
@media(max-width:600px) {
  #topbar {
    flex-wrap:wrap; padding:4px 8px; gap:4px;
  }
  #topbar .title { font-size:18px; letter-spacing:2px; }
  #gravity-panel {
    order:3; width:100%; justify-content:center;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    touch-action:pan-x; padding:2px 0;
  }
  #gravity-panel::-webkit-scrollbar { display:none; }
  #gravity-panel .planet-btn { font-size:13px; padding:4px 8px; min-height:32px; }
  #stats { font-size:14px; }
  .tool-btn { min-width:52px; height:50px; font-size:11px; }
  .tool-btn .icon { font-size:20px; }
  .chaos-btn { min-width:56px; height:46px; font-size:11px; }
  .bar-toggle { display:block; }
  #toolbar.collapsed, #chaos-bar.collapsed { display:none; }
}

/* ── TABLET TWEAKS ── */
@media(min-width:601px) and (max-width:1024px) {
  #topbar .title { font-size:22px; letter-spacing:3px; }
  .tool-btn { min-width:56px; height:52px; font-size:12px; }
  .chaos-btn { min-width:60px; height:48px; font-size:12px; }
}
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════════════
//  CHAOS ENGINE — Matter.js 2D Physics Sandbox
// ═══════════════════════════════════════════════

const { Engine, World, Bodies, Body, Composite, Events, Mouse, Vector, Constraint } = Matter;

// ── SETUP ──
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  rebuildWalls();
}

const engine = Engine.create({ enableSleeping: true });
const world = engine.world;
let walls = [];
let paused = false;
let currentTool = 'ball';
let drawMode = false;
let drawPoints = [];
let slingStart = null;
let slingCurrent = null;
let particles = [];
let explosions = [];
let ripples = [];
let rocketBodies = [];
let shakeOffset = { x: 0, y: 0 };
let shakeIntensity = 0;
let windForce = 0;
let windTimer = 0;
let gravityTarget = 1;
let blackHoleActive = false;
let blackHoleTimer = 0;
let blackHolePos = { x: 0, y: 0 };
let blackHoleAlpha = 0;
let antiGravActive = false;
let antiGravTimer = 0;
let trails = []; // object afterimage trails
let timeWarpActive = false;
let timeWarpTimer = 0;
let portals = []; // array of {x, y, color, partner} — max 2, linked pair
let portalCooldowns = new Map(); // body.id -> cooldown frames to prevent re-teleport
let bumpers = []; // placed pinball bumpers {body, hitFlash}
let gravityAngle = 0; // 0=down, 1=right, 2=up, 3=left
let megaBounceActive = false;
let megaBounceTimer = 0;
let megaBounceOriginal = new Map(); // body.id -> original restitution
let konamiBuffer = [];
const konamiCode = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let seesaws = []; // {plank, pivot, constraint} sets
let oceanMode = false;
let oceanBubbles = [];
let ultraChaosActive = false;
let ultraChaosTimer = 0;
let tornadoActive = false;
let tornadoTimer = 0;
let tornadoX = 0;
let tornadoDir = 1;
let freezeActive = false;
let freezeTimer = 0;
let frozenVelocities = new Map();
let conveyors = []; // {body, dir} — dir: 1=right, -1=left
let popcornActive = false;
let popcornTimer = 0;
let chromaticAberration = 0; // intensity, decays over time
let destructionMeter = 0; // total energy released
let destructionFlash = 0; // flash on big hits
let wreckingBalls = []; // {ball, chain, anchor} sets
let discoMode = false;
let discoTimer = 0;
let titleTapCount = 0;
let titleTapTimer = 0;

// Target Practice
let targetMode = false;
let targetTimer = 0;
let targetScore = 0;
let targetBodies = [];
let targetCleared = false;
let targetClearedTimer = 0;

// Magnets
let magnets = []; // {body, attracting: true/false}

// Speed glow (purely visual, no state needed)

// Rope tool
let ropeFirstBody = null;
let ropes = []; // constraints created by rope tool

// Slow motion toggle
let sloMoActive = false;

// Grab and throw tool
let grabActive = false;
let grabBody = null;
let grabOffsetX = 0;
let grabOffsetY = 0;
let grabHistory = []; // [{x, y, t}] for velocity tracking

// Block shattering
let shatterDebounce = new Set(); // prevent double-shattering same body

// Per-body speed trails (line-based)
const bodyTrails = new Map(); // body.id -> [{x, y}]

// Spawn pop animation
const SPAWN_POP_MS = 150;

function getSpawnPopScale(elapsed) {
  const t = Math.min(Math.max(elapsed / SPAWN_POP_MS, 0), 1);
  if (t < 0.6) return Math.max(0.05, (t / 0.6) * 1.15);
  return 1.15 - ((t - 0.6) / 0.4) * 0.15;
}

function markSpawnPop(target, now = performance.now()) {
  const bodies = Array.isArray(target) ? target : (target?.bodies || (target ? [target] : []));
  bodies.forEach(b => {
    if (!b || b.label === 'wall') return;
    b.spawnTime = now;
    b.spawnScale = 0.05;
  });
}

function updateSpawnPopAnimations(now = performance.now()) {
  Composite.allBodies(world).forEach(b => {
    if (b.spawnTime == null) return;
    const elapsed = now - b.spawnTime;
    if (elapsed >= SPAWN_POP_MS) {
      b.spawnScale = 1;
      delete b.spawnTime;
      return;
    }
    b.spawnScale = getSpawnPopScale(elapsed);
  });
}

// ── AUDIO ──
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ── AMBIENT HUM (reacts to chaos level) ──
let ambientOsc = null;
let ambientGain = null;
let ambientActive = false;

function startAmbientHum() {
  if (ambientActive) return;
  const a = getAudio();
  
  // Create dual oscillators for rich ambient texture
  const osc1 = a.createOscillator();
  const osc2 = a.createOscillator();
  ambientGain = a.createGain();
  
  osc1.type = 'sine';
  osc2.type = 'triangle';
  osc1.frequency.setValueAtTime(40, a.currentTime); // Low bass hum
  osc2.frequency.setValueAtTime(40.5, a.currentTime); // Slight detune for thickness
  
  ambientGain.gain.setValueAtTime(0, a.currentTime);
  ambientGain.gain.linearRampToValueAtTime(0.015, a.currentTime + 0.5); // Fade in
  
  osc1.connect(ambientGain);
  osc2.connect(ambientGain);
  ambientGain.connect(a.destination);
  
  osc1.start();
  osc2.start();
  
  ambientOsc = { osc1, osc2 };
  ambientActive = true;
}

function stopAmbientHum() {
  if (!ambientActive || !ambientOsc || !ambientGain) return;
  const a = getAudio();
  
  // Fade out
  ambientGain.gain.linearRampToValueAtTime(0, a.currentTime + 0.5);
  
  setTimeout(() => {
    if (ambientOsc) {
      ambientOsc.osc1.stop();
      ambientOsc.osc2.stop();
      ambientOsc = null;
    }
    ambientActive = false;
  }, 600);
}

function updateAmbientHum() {
  if (!ambientActive || !ambientOsc || !ambientGain) return;
  const a = getAudio();
  
  // Map destruction meter to frequency and volume
  // Level 0 (CALM): 40Hz, volume 0.015
  // Level 6 (GODLIKE): 120Hz, volume 0.08
  const level = Math.floor(Math.log10(Math.max(destructionMeter, 1)));
  const normalizedChaos = Math.min(level / 6, 1);
  
  const targetFreq = 40 + normalizedChaos * 80; // 40Hz to 120Hz
  const targetVol = 0.015 + normalizedChaos * 0.065; // 0.015 to 0.08
  
  // Smooth transitions
  ambientOsc.osc1.frequency.linearRampToValueAtTime(targetFreq, a.currentTime + 0.3);
  ambientOsc.osc2.frequency.linearRampToValueAtTime(targetFreq + 0.5, a.currentTime + 0.3); // Detune
  ambientGain.gain.linearRampToValueAtTime(targetVol, a.currentTime + 0.3);
}
function playSound(freq, dur, type='square', vol=0.12) {
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, a.currentTime);
    gain.gain.setValueAtTime(vol, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(); osc.stop(a.currentTime + dur);
  } catch(e) {}
}
function playBoom() {
  try {
    const a = getAudio();
    const buf = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const src = a.createBufferSource();
    src.buffer = buf;
    const gain = a.createGain();
    gain.gain.setValueAtTime(0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.5);
    src.connect(gain); gain.connect(a.destination);
    src.start();
  } catch(e) {}
}
function playBounce() { playSound(200 + Math.random()*300, 0.08, 'sine', 0.08); }
function playSqueak() {
  playSound(900 + Math.random()*400, 0.15, 'sine', 0.15);
  setTimeout(() => playSound(1100 + Math.random()*300, 0.1, 'sine', 0.1), 50);
}
function playSpawn() { playSound(800, 0.1, 'square', 0.06); }
function playWhoosh(power) {
  // Whoosh sound scaled to slingshot power (power range: 0-25)
  // Sweep from low freq upward with volume and duration scaled to power
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    
    // Scale parameters based on power
    const normalizedPower = Math.min(power / 25, 1); // 0-1
    const startFreq = 80 + normalizedPower * 40; // 80-120 Hz
    const endFreq = 200 + normalizedPower * 400; // 200-600 Hz
    const duration = 0.15 + normalizedPower * 0.15; // 0.15-0.3 sec
    const volume = 0.08 + normalizedPower * 0.08; // 0.08-0.16
    
    osc.type = 'sawtooth'; // Airy whoosh sound
    osc.frequency.setValueAtTime(startFreq, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(endFreq, a.currentTime + duration);
    
    gain.gain.setValueAtTime(volume, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(a.destination);
    osc.start();
    osc.stop(a.currentTime + duration);
  } catch(e) {}
}

// ── MATERIAL-BASED IMPACT SOUNDS ──
function playImpactSound(materialA, materialB, intensity) {
  const vol = Math.min(intensity * 0.05, 0.15);
  if (vol < 0.02) return; // Too quiet to play
  
  // Detect material collision type
  const materials = [materialA, materialB].sort().join('-');
  
  // Metal impacts - high, sharp clangs
  if (materials.includes('metal')) {
    const freq = 800 + Math.random() * 600;
    playSound(freq, 0.08 + intensity * 0.02, 'square', vol);
    setTimeout(() => playSound(freq * 1.2, 0.05, 'sine', vol * 0.6), 20);
  }
  // Rubber impacts - bouncy boings
  else if (materials.includes('rubber')) {
    const freq = 150 + Math.random() * 200;
    playSound(freq, 0.12, 'sine', vol);
    playSound(freq * 1.5, 0.08, 'sine', vol * 0.5);
  }
  // Wood impacts - hollow thunks
  else if (materials.includes('wood')) {
    const freq = 100 + Math.random() * 100;
    playSound(freq, 0.15, 'triangle', vol * 1.2);
    playSound(freq * 0.7, 0.1, 'sawtooth', vol * 0.4);
  }
  // Glass/ice impacts - crystalline tings
  else if (materials.includes('glass') || materials.includes('ice')) {
    const freq = 1200 + Math.random() * 800;
    playSound(freq, 0.06, 'sine', vol * 0.8);
    playSound(freq * 1.4, 0.04, 'sine', vol * 0.5);
  }
  // Plastic impacts - light taps
  else if (materials.includes('plastic')) {
    const freq = 400 + Math.random() * 300;
    playSound(freq, 0.08, 'triangle', vol * 0.7);
  }
  // Default (generic) - current behavior
  else {
    playSound(200 + Math.random() * 300, 0.08, 'sine', vol);
  }
}

// ── WALLS ──
function rebuildWalls() {
  walls.forEach(w => Composite.remove(world, w));
  const W = canvas.width, H = canvas.height, T = 40;
  const opts = { isStatic: true, restitution: 0.3, friction: 0.5, label: 'wall' };
  walls = [
    Bodies.rectangle(W/2, H + T/2, W + T*2, T, opts),   // floor
    Bodies.rectangle(W/2, -T/2, W + T*2, T, opts),        // ceiling
    Bodies.rectangle(-T/2, H/2, T, H + T*2, opts),        // left
    Bodies.rectangle(W + T/2, H/2, T, H + T*2, opts),     // right
  ];
  Composite.add(world, walls);
}

// ── SPAWN OBJECTS ──
function spawnObject(x, y, vx=0, vy=0) {
  let body;
  const colors = ['#00ff41','#0abdc6','#33ff77','#00ccaa','#66ffcc'];
  const color = colors[Math.floor(Math.random()*colors.length)];

  switch(currentTool) {
    case 'ball': {
      const r = 15 + Math.random()*20;
      body = Bodies.circle(x, y, r, {
        restitution: 0.7 + Math.random()*0.3,
        friction: 0.3, frictionAir: 0.001,
        render: { type:'ball', color, radius:r }
      });
      body.material = 'rubber';
      break;
    }
    case 'block': {
      const s = 30 + Math.random()*25;
      body = Bodies.rectangle(x, y, s, s, {
        restitution: 0.2, friction: 0.6,
        render: { type:'block', color, size:s }
      });
      body.material = 'wood';
      break;
    }
    case 'rocket': {
      body = Bodies.rectangle(x, y, 18, 50, {
        restitution: 0.1, friction: 0.3, frictionAir: 0.02,
        render: { type:'rocket', color:'#ff6600' }
      });
      body.material = 'metal';
      rocketBodies.push(body);
      break;
    }
    case 'car': {
      body = createCar(x, y);
      break;
    }
    case 'dino': {
      body = createDino(x, y, color);
      break;
    }
    case 'bomb': {
      body = Bodies.circle(x, y, 18, {
        restitution: 0.3, friction: 0.5,
        render: { type:'bomb', color:'#ff3333' }
      });
      body.isBomb = true;
      body.material = 'plastic';
      break;
    }
    case 'balloon': {
      const bR = 18 + Math.random()*10;
      const balloonColors = ['#ff3399','#ff6600','#00ff41','#0abdc6','#ffdd00','#cc00ff','#ff3333'];
      const bColor = balloonColors[Math.floor(Math.random()*balloonColors.length)];
      body = Bodies.circle(x, y, bR, {
        restitution: 0.6,
        friction: 0.1,
        frictionAir: 0.04,
        density: 0.0002, // very light
        render: { type:'balloon', color: bColor, radius: bR }
      });
      body.isBalloon = true;
      body.material = 'rubber';
      break;
    }
    case 'star': {
      const outerR = 20 + Math.random()*15;
      const innerR = outerR * 0.45;
      const points = 5;
      const starVerts = [];
      for (let i = 0; i < points * 2; i++) {
        const angle = (Math.PI * 2 * i) / (points * 2) - Math.PI / 2;
        const r = i % 2 === 0 ? outerR : innerR;
        starVerts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
      }
      const starColors = ['#ffdd00','#ff6600','#00ff41','#0abdc6','#ff3399'];
      const starColor = starColors[Math.floor(Math.random()*starColors.length)];
      body = Bodies.fromVertices(x, y, starVerts, {
        restitution: 0.95,
        friction: 0.1,
        frictionAir: 0.001,
        render: { type:'star', color: starColor, outerR }
      });
      body.material = 'metal';
      break;
    }
    case 'beachball': {
      const r = 35 + Math.random()*15;
      const stripeColors = ['#ff3333','#ffdd00','#00ccff','#ff6600','#00ff41','#cc00ff'];
      const c1 = stripeColors[Math.floor(Math.random()*stripeColors.length)];
      let c2 = stripeColors[Math.floor(Math.random()*stripeColors.length)];
      while (c2 === c1) c2 = stripeColors[Math.floor(Math.random()*stripeColors.length)];
      body = Bodies.circle(x, y, r, {
        restitution: 0.92,
        friction: 0.05,
        frictionAir: 0.008,
        density: 0.0003,
        render: { type:'beachball', color: c1, color2: c2, radius: r }
      });
      body.material = 'plastic';
      break;
    }
    case 'duck': {
      const duckR = 18;
      body = Bodies.circle(x, y, duckR, {
        restitution: 0.6,
        friction: 0.4,
        density: 0.002,
        render: { type:'duck', color:'#ffdd00', radius: duckR }
      });
      body.isDuck = true;
      body.material = 'rubber';
      break;
    }
    case 'domino': {
      const dH = 50 + Math.random()*15;
      const dW = 12;
      body = Bodies.rectangle(x, y, dW, dH, {
        restitution: 0.1,
        friction: 0.6,
        density: 0.003,
        render: { type:'domino', color:'#ff8844', width: dW, height: dH }
      });
      body.material = 'wood';
      break;
    }
    case 'anvil': {
      const aW = 45 + Math.random()*15;
      const aH = 35 + Math.random()*10;
      const anvilVerts = [
        {x: -aW*0.6, y: -aH*0.5},
        {x: aW*0.6, y: -aH*0.5},
        {x: aW*0.35, y: -aH*0.1},
        {x: aW*0.3, y: aH*0.5},
        {x: -aW*0.3, y: aH*0.5},
        {x: -aW*0.35, y: -aH*0.1},
      ];
      body = Bodies.fromVertices(x, y, anvilVerts, {
        restitution: 0.05,
        friction: 0.9,
        density: 0.02,
        render: { type:'anvil', color:'#aaaaaa', width: aW, height: aH }
      });
      body.material = 'metal';
      break;
    }
    case 'ragdoll': {
      body = createRagdoll(x, y);
      break;
    }
    case 'trampoline': {
      const tW = 80 + Math.random()*30;
      const tH = 10;
      body = Bodies.rectangle(x, y, tW, tH, {
        isStatic: true,
        restitution: 2.0,
        label: 'trampoline',
        render: { type:'trampoline', color:'#00ff99', width: tW, height: tH }
      });
      body.isTrampoline = true;
      break;
    }
    case 'conveyor-left':
    case 'conveyor-right': {
      const cW = 100 + Math.random()*40;
      const cH = 12;
      const dir = currentTool === 'conveyor-right' ? 1 : -1;
      body = Bodies.rectangle(x, y, cW, cH, {
        isStatic: true,
        friction: 1.0,
        label: 'conveyor',
        render: { type:'conveyor', color:'#ff8800', width: cW, height: cH, dir }
      });
      body.isConveyor = true;
      body.conveyorDir = dir;
      body.conveyorSpeed = 3;
      conveyors.push(body);
      break;
    }
    case 'wrecking': {
      const wr = 22 + Math.random()*8;
      const chainLen = 120 + Math.random()*40;
      const anchor = Bodies.circle(x, y, 5, {
        isStatic: true,
        render: { type:'wrecking-anchor', color:'#ff4444', radius: 5 }
      });
      const wBall = Bodies.circle(x, y + chainLen, wr, {
        restitution: 0.2, friction: 0.3, density: 0.015,
        render: { type:'wrecking-ball', color:'#444444', radius: wr }
      });
      const chain = Constraint.create({
        bodyA: anchor, bodyB: wBall,
        length: chainLen, stiffness: 0.9, damping: 0.01,
        render: { visible: false }
      });
      markSpawnPop([anchor, wBall]);
      Composite.add(world, [anchor, wBall, chain]);
      wreckingBalls.push({ anchor, ball: wBall, chain });
      Body.setVelocity(wBall, { x: 8 + Math.random()*5, y: 0 });
      playSpawn();
      playSound(200, 0.3, 'sine', 0.1);
      pointerDown = false;
      return;
    }
    case 'ice': {
      const iS = 25 + Math.random()*15;
      body = Bodies.rectangle(x, y, iS, iS, {
        restitution: 0.15,
        friction: 0.01,
        frictionStatic: 0.01,
        frictionAir: 0.0005,
        density: 0.002,
        render: { type:'ice', color:'#aaeeff', size: iS }
      });
      body.material = 'ice';
      break;
    }
    case 'fan': {
      const fW = 50, fH = 40;
      body = Bodies.rectangle(x, y, fW, fH, {
        isStatic: true,
        label: 'fan',
        render: { type:'fan', color:'#66ddff', width: fW, height: fH }
      });
      body.isFan = true;
      body.fanRange = 180;
      body.fanStrength = 0.003;
      break;
    }
    case 'magnet': {
      // Check if there's already a magnet near this position — toggle to repel
      let existingMagnet = null;
      for (const m of magnets) {
        const mdx = m.body.position.x - x;
        const mdy = m.body.position.y - y;
        if (Math.sqrt(mdx*mdx + mdy*mdy) < 40) { existingMagnet = m; break; }
      }
      if (existingMagnet) {
        existingMagnet.attracting = !existingMagnet.attracting;
        existingMagnet.body.render.color = existingMagnet.attracting ? '#ff4466' : '#4466ff';
        playSound(existingMagnet.attracting ? 600 : 400, 0.15, 'sine', 0.1);
        pointerDown = false;
        return;
      }
      const mW = 40, mH = 50;
      body = Bodies.rectangle(x, y, mW, mH, {
        isStatic: true,
        label: 'magnet',
        render: { type:'magnet', color:'#ff4466', width: mW, height: mH }
      });
      body.isMagnet = true;
      const magEntry = { body, attracting: true };
      magnets.push(magEntry);
      break;
    }
    case 'bumper': {
      const r = 22;
      body = Bodies.circle(x, y, r, {
        isStatic: true,
        restitution: 1.5,
        label: 'bumper',
        render: { type:'bumper', color:'#ff3399', radius: r }
      });
      body.isBumper = true;
      body.hitFlash = 0;
      bumpers.push(body);
      break;
    }
    case 'pin': {
      const pH = 55 + Math.random()*10;
      const pW = 14;
      body = Bodies.rectangle(x, y, pW, pH, {
        restitution: 0.1,
        friction: 0.5,
        frictionStatic: 0.4,
        density: 0.001,
        render: { type:'pin', color:'#fff8ee', width: pW, height: pH }
      });
      body.material = 'wood';
      break;
    }
    case 'seesaw': {
      const plankW = 120, plankH = 8;
      const pivotH = 20;
      const plank = Bodies.rectangle(x, y - pivotH/2, plankW, plankH, {
        restitution: 0.1,
        friction: 0.8,
        density: 0.003,
        render: { type:'seesaw-plank', color:'#aa8844', width: plankW, height: plankH }
      });
      const pivotVerts = [
        {x: 0, y: -pivotH/2},
        {x: pivotH*0.6, y: pivotH/2},
        {x: -pivotH*0.6, y: pivotH/2}
      ];
      const pivot = Bodies.fromVertices(x, y + pivotH/2, pivotVerts, {
        isStatic: true,
        render: { type:'seesaw-pivot', color:'#886633', height: pivotH }
      });
      const constraint = Constraint.create({
        bodyA: pivot,
        bodyB: plank,
        pointA: { x: 0, y: -pivotH/2 },
        pointB: { x: 0, y: 0 },
        length: 0,
        stiffness: 1,
        render: { visible: false }
      });
      markSpawnPop([plank, pivot]);
      Composite.add(world, [plank, pivot, constraint]);
      seesaws.push({ plank, pivot, constraint });
      playSpawn();
      playSound(300, 0.2, 'triangle', 0.1);
      pointerDown = false;
      return;
    }
  }

  if (body) {
    if (vx || vy) {
      if (body.bodies) {
        // composite
        body.bodies.forEach(b => Body.setVelocity(b, {x:vx, y:vy}));
      } else {
        Body.setVelocity(body, {x:vx, y:vy});
      }
    }
    markSpawnPop(body);
    if (body.bodies) {
      // It's a composite (car)
      Composite.add(world, body);
    } else {
      Composite.add(world, body);
    }
    playSpawn();
    // Birth flash effect
    const spawnX = body.position ? body.position.x : x;
    const spawnY = body.position ? body.position.y : y;
    for (let bf = 0; bf < 8; bf++) {
      const angle = (Math.PI * 2 * bf) / 8;
      particles.push({
        x: spawnX, y: spawnY,
        vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3 - 1,
        size: 3, life: 0.4, color: '#ffffff', isBirthFlash: true
      });
    }
    // Expanding ring stored in explosions array
    explosions.push({ x: spawnX, y: spawnY, r: 5, maxR: 50, alpha: 0.8, isBirthRing: true });
  }
  return body;
}

function createCar(x, y) {
  const chassisW = 60, chassisH = 20;
  const wheelR = 10;
  const chassis = Bodies.rectangle(x, y, chassisW, chassisH, {
    friction: 0.5, render: { type:'car-body', color:'#0abdc6' }
  });
  chassis.material = 'metal';
  const wheelL = Bodies.circle(x - 20, y + 15, wheelR, {
    friction: 0.8, restitution: 0.3,
    render: { type:'wheel', color:'#00ff41', radius:wheelR }
  });
  wheelL.material = 'rubber';
  const wheelR2 = Bodies.circle(x + 20, y + 15, wheelR, {
    friction: 0.8, restitution: 0.3,
    render: { type:'wheel', color:'#00ff41', radius:wheelR }
  });
  wheelR2.material = 'rubber';
  const axleL = Constraint.create({ bodyA: chassis, pointA: {x:-20, y:15}, bodyB: wheelL, stiffness: 0.5, damping: 0.1, length: 0 });
  const axleR = Constraint.create({ bodyA: chassis, pointA: {x:20, y:15}, bodyB: wheelR2, stiffness: 0.5, damping: 0.1, length: 0 });

  const comp = Composite.create();
  Composite.add(comp, [chassis, wheelL, wheelR2, axleL, axleR]);
  return comp;
}

function createDino(x, y, color) {
  // T-Rex-ish shape using vertices
  const scale = 0.7 + Math.random() * 0.4;
  const verts = [
    {x:0, y:-30}, {x:15, y:-30}, {x:20, y:-20}, {x:30, y:-20},
    {x:30, y:-10}, {x:20, y:-10}, {x:20, y:0}, {x:25, y:10},
    {x:25, y:30}, {x:15, y:30}, {x:15, y:15}, {x:5, y:15},
    {x:5, y:30}, {x:-5, y:30}, {x:-5, y:10}, {x:-15, y:0},
    {x:-15, y:-15}, {x:-5, y:-20}
  ].map(v => ({x: v.x * scale, y: v.y * scale}));

  const body = Bodies.fromVertices(x, y, verts, {
    restitution: 0.4, friction: 0.5,
    render: { type:'dino', color }
  });
  return body;
}

function createRagdoll(x, y) {
  const scale = 0.8;
  const ragColor = '#ff6644';
  const group = Body.nextGroup(true); // parts don't collide with each other

  // Head
  const head = Bodies.circle(x, y - 40*scale, 10*scale, {
    friction: 0.4, restitution: 0.2, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-head', color: ragColor, radius: 10*scale }
  });

  // Torso
  const torso = Bodies.rectangle(x, y, 14*scale, 30*scale, {
    friction: 0.4, restitution: 0.1, density: 0.003,
    collisionFilter: { group },
    render: { type:'ragdoll-torso', color: ragColor, width: 14*scale, height: 30*scale }
  });

  // Upper arms
  const upperArmL = Bodies.rectangle(x - 18*scale, y - 10*scale, 16*scale, 7*scale, {
    friction: 0.3, restitution: 0.1, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: ragColor, width: 16*scale, height: 7*scale }
  });
  const upperArmR = Bodies.rectangle(x + 18*scale, y - 10*scale, 16*scale, 7*scale, {
    friction: 0.3, restitution: 0.1, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: ragColor, width: 16*scale, height: 7*scale }
  });

  // Lower arms
  const lowerArmL = Bodies.rectangle(x - 34*scale, y - 10*scale, 14*scale, 6*scale, {
    friction: 0.3, restitution: 0.1, density: 0.0015,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: '#ff8866', width: 14*scale, height: 6*scale }
  });
  const lowerArmR = Bodies.rectangle(x + 34*scale, y - 10*scale, 14*scale, 6*scale, {
    friction: 0.3, restitution: 0.1, density: 0.0015,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: '#ff8866', width: 14*scale, height: 6*scale }
  });

  // Upper legs
  const upperLegL = Bodies.rectangle(x - 5*scale, y + 24*scale, 7*scale, 18*scale, {
    friction: 0.4, restitution: 0.1, density: 0.003,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: ragColor, width: 7*scale, height: 18*scale }
  });
  const upperLegR = Bodies.rectangle(x + 5*scale, y + 24*scale, 7*scale, 18*scale, {
    friction: 0.4, restitution: 0.1, density: 0.003,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: ragColor, width: 7*scale, height: 18*scale }
  });

  // Lower legs
  const lowerLegL = Bodies.rectangle(x - 5*scale, y + 44*scale, 6*scale, 16*scale, {
    friction: 0.5, restitution: 0.1, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: '#ff8866', width: 6*scale, height: 16*scale }
  });
  const lowerLegR = Bodies.rectangle(x + 5*scale, y + 44*scale, 6*scale, 16*scale, {
    friction: 0.5, restitution: 0.1, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: '#ff8866', width: 6*scale, height: 16*scale }
  });

  // Constraints (joints)
  const jointStiff = 0.6;
  const jointDamp = 0.1;

  // Neck: head to torso
  const neck = Constraint.create({ bodyA: head, pointA: {x:0, y:10*scale}, bodyB: torso, pointB: {x:0, y:-15*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Shoulders
  const shoulderL = Constraint.create({ bodyA: torso, pointA: {x:-7*scale, y:-10*scale}, bodyB: upperArmL, pointB: {x:8*scale, y:0}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });
  const shoulderR = Constraint.create({ bodyA: torso, pointA: {x:7*scale, y:-10*scale}, bodyB: upperArmR, pointB: {x:-8*scale, y:0}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Elbows
  const elbowL = Constraint.create({ bodyA: upperArmL, pointA: {x:-8*scale, y:0}, bodyB: lowerArmL, pointB: {x:7*scale, y:0}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });
  const elbowR = Constraint.create({ bodyA: upperArmR, pointA: {x:8*scale, y:0}, bodyB: lowerArmR, pointB: {x:-7*scale, y:0}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Hips
  const hipL = Constraint.create({ bodyA: torso, pointA: {x:-5*scale, y:15*scale}, bodyB: upperLegL, pointB: {x:0, y:-9*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });
  const hipR = Constraint.create({ bodyA: torso, pointA: {x:5*scale, y:15*scale}, bodyB: upperLegR, pointB: {x:0, y:-9*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Knees
  const kneeL = Constraint.create({ bodyA: upperLegL, pointA: {x:0, y:9*scale}, bodyB: lowerLegL, pointB: {x:0, y:-8*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });
  const kneeR = Constraint.create({ bodyA: upperLegR, pointA: {x:0, y:9*scale}, bodyB: lowerLegR, pointB: {x:0, y:-8*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Angle-limit constraints (keep it human-ish, prevent spaghetti)
  const limitStiff = 0.3;
  // Head-to-torso distance limit
  const headLimit = Constraint.create({ bodyA: head, bodyB: torso, stiffness: limitStiff, damping: 0.2, length: 25*scale, render: { visible: false } });
  // Arm span limits
  const armLimitL = Constraint.create({ bodyA: torso, pointA:{x:-7*scale, y:-10*scale}, bodyB: lowerArmL, pointB:{x:-7*scale, y:0}, stiffness: 0.1, damping: 0.15, length: 30*scale, render: { visible: false } });
  const armLimitR = Constraint.create({ bodyA: torso, pointA:{x:7*scale, y:-10*scale}, bodyB: lowerArmR, pointB:{x:7*scale, y:0}, stiffness: 0.1, damping: 0.15, length: 30*scale, render: { visible: false } });
  // Leg limits
  const legLimitL = Constraint.create({ bodyA: torso, pointA:{x:-5*scale, y:15*scale}, bodyB: lowerLegL, pointB:{x:0, y:8*scale}, stiffness: 0.1, damping: 0.15, length: 32*scale, render: { visible: false } });
  const legLimitR = Constraint.create({ bodyA: torso, pointA:{x:5*scale, y:15*scale}, bodyB: lowerLegR, pointB:{x:0, y:8*scale}, stiffness: 0.1, damping: 0.15, length: 32*scale, render: { visible: false } });

  const comp = Composite.create();
  Composite.add(comp, [head, torso, upperArmL, upperArmR, lowerArmL, lowerArmR, upperLegL, upperLegR, lowerLegL, lowerLegR]);
  Composite.add(comp, [neck, shoulderL, shoulderR, elbowL, elbowR, hipL, hipR, kneeL, kneeR]);
  Composite.add(comp, [headLimit, armLimitL, armLimitR, legLimitL, legLimitR]);
  return comp;
}

// ── BOMB EXPLOSION ──
function explodeBomb(bomb) {
  const pos = bomb.position;
  const radius = 150;
  const force = 0.08;

  // Visual explosion
  explosions.push({ x:pos.x, y:pos.y, r:0, maxR:radius, alpha:1 });
  // Particles
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x: pos.x, y: pos.y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.5 + Math.random()*0.5,
      color: ['#ff3333','#ff6600','#ffaa00','#ff0000'][Math.floor(Math.random()*4)],
      size: 2 + Math.random()*4
    });
  }

  // Apply force to nearby bodies
  const allBodies = Composite.allBodies(world);
  allBodies.forEach(b => {
    if (b.isStatic || b === bomb) return;
    const dx = b.position.x - pos.x;
    const dy = b.position.y - pos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < radius && dist > 0) {
      const strength = force * (1 - dist/radius);
      Body.applyForce(b, b.position, {
        x: (dx/dist) * strength,
        y: (dy/dist) * strength
      });
      Body.setAngularVelocity(b, (Math.random()-0.5)*0.3);
    }
  });

  // Chain reaction: check for nearby bombs and trigger them with stagger
  const chainRadius = radius * 1.3;
  allBodies.forEach(b => {
    if (!b.isBomb || b === bomb) return;
    const dx = b.position.x - pos.x;
    const dy = b.position.y - pos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < chainRadius) {
      const delay = 120 + Math.random() * 100; // 120-220ms stagger
      setTimeout(() => {
        if (Composite.get(world, b.id, 'body')) explodeBomb(b);
      }, delay);
    }
  });

  Composite.remove(world, bomb);
  playBoom();
}

// ── BLOCK SHATTERING ──
function shatterBlock(b) {
  if (!Composite.get(world, b.id, 'body')) return; // already removed
  const pos = { x: b.position.x, y: b.position.y };
  const vel = { x: b.velocity.x, y: b.velocity.y };
  const color = b.render?.color || '#00ff41';
  const origSize = b.render?.size || 30;

  Composite.remove(world, b);
  shatterDebounce.delete(b.id);

  // Particle burst at impact
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x: pos.x, y: pos.y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.4 + Math.random()*0.5,
      color, size: 2 + Math.random()*4
    });
  }

  // Create 4-6 fragments
  const fragCount = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < fragCount; i++) {
    const angle = (Math.PI * 2 * i / fragCount) + Math.random() * 0.8;
    const fW = origSize * (0.25 + Math.random() * 0.25);
    const fH = origSize * (0.25 + Math.random() * 0.25);
    const fragX = pos.x + Math.cos(angle) * origSize * 0.35;
    const fragY = pos.y + Math.sin(angle) * origSize * 0.35;
    const frag = Bodies.rectangle(fragX, fragY, fW, fH, {
      restitution: 0.3, friction: 0.5,
      angle: Math.random() * Math.PI * 2,
      render: { type: 'block', color, size: Math.max(fW, fH) }
    });
    frag.material = 'wood';
    frag.isFragment = true; // don't shatter fragments again
    const fragSpeed = 3 + Math.random() * 5;
    Body.setVelocity(frag, {
      x: vel.x * 0.2 + Math.cos(angle) * fragSpeed,
      y: vel.y * 0.2 + Math.sin(angle) * fragSpeed
    });
    Body.setAngularVelocity(frag, (Math.random()-0.5)*0.6);
    Composite.add(world, frag);
  }

  explosions.push({ x: pos.x, y: pos.y, r: 0, maxR: origSize * 2.5, alpha: 0.5 });
  playSound(180 + Math.random()*80, 0.12, 'triangle', 0.1);
  shakeIntensity = Math.max(shakeIntensity, 6);
  chromaticAberration = Math.max(chromaticAberration, 2);
}

// ── PORTALS ──
function placePortal(x, y) {
  const portalColors = ['#cc00ff', '#00ffcc'];
  if (portals.length >= 2) {
    // Replace oldest pair — start fresh
    portals = [];
  }
  const idx = portals.length;
  const portal = { x, y, color: portalColors[idx], radius: 30, spawnTime: performance.now() };
  portals.push(portal);
  // Link partners
  if (portals.length === 2) {
    portals[0].partner = 1;
    portals[1].partner = 0;
  }
  playSound(600 + idx * 400, 0.2, 'sine', 0.1);
  playSound(900 + idx * 300, 0.15, 'square', 0.05);
  // Spawn burst
  for (let i = 0; i < 15; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.5 + Math.random()*0.5,
      color: portalColors[idx],
      size: 2 + Math.random()*3
    });
  }
}

        Composite.add(world, b);
      }
    } else {
      // 3 vertical-ish blocks (rotated 90°)
      for (let col = -1; col <= 1; col++) {
        const bx = cx + col * (blockW / 3 + gap);
        const b = Bodies.rectangle(bx, y, blockH, blockW / 3, {
          restitution: 0.1, friction: 0.8, density: 0.002,
          angle: 0,
          render: { type: 'jenga', color: '#b89448' }
        });
        Composite.add(world, b);
      }
    }
    // Ascending build sound
    setTimeout(() => playSound(300 + row * 60, 0.05, 'square', 0.04), row * 50);
  }
  shakeIntensity = 5;
  setTimeout(() => playSound(800, 0.3, 'sine', 0.1), rows * 50);
});

// ── POINTER / TOUCH INPUT ──
function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function getPointerPosFromEnd(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.changedTouches ? e.changedTouches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function getToolAccentColor(tool) {
  const colors = {
    ball: '#00ff41',
    block: '#0abdc6',
    rocket: '#ff6600',
    bomb: '#ff3333',
    balloon: '#ff3399',
    star: '#ffdd00',
    portal: '#cc00ff',
    bumper: '#ff3399',
    beachball: '#00ccff',
    duck: '#ffdd00',
    domino: '#ff8844',
    anvil: '#aaaaaa',
    trampoline: '#00ff99',
    ice: '#aaeeff',
    fan: '#66ddff',
    magnet: '#ff4466',
    pin: '#ffffff',
    seesaw: '#ffcc00',
    rope: '#cc8844',
    draw: '#ff6600',
    grab: '#ffdd00'
  };
  return colors[tool] || '#0abdc6';
}

function addRipple(x, y) {
  ripples.push({
    x, y,
    r: 5,
    maxR: 42,
    alpha: 0.65,
    color: getToolAccentColor(currentTool)
  });
}

let pointerDown = false;
let pointerStartTime = 0;

function onDown(e) {
  e.preventDefault();
  const pos = getPointerPos(e);
  addRipple(pos.x, pos.y);
  pointerDown = true;
  pointerStartTime = Date.now();

  if (drawMode) {
    drawPoints = [pos];
    return;
  }

  // Portal placement
  if (currentTool === 'portal') {
    placePortal(pos.x, pos.y);
    pointerDown = false;
    return;
  }

  // Rope tool — connect two bodies
  if (currentTool === 'rope') {
    const allB = Composite.allBodies(world);
    let nearest = null, nearDist = 50;
    for (const b of allB) {
      if (b.isStatic) continue;
      const dx = b.position.x - pos.x, dy = b.position.y - pos.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < nearDist) { nearest = b; nearDist = d; }
    }
    if (nearest) {
      if (!ropeFirstBody) {
        ropeFirstBody = nearest;
        // Flash to indicate selection
        particles.push({ x: nearest.position.x, y: nearest.position.y, vx:0, vy:-1, size:6, life:0.5, color:'#cc8844' });
        playSound(600, 0.1, 'sine', 0.08);
      } else if (nearest !== ropeFirstBody) {
        const rope = Constraint.create({
          bodyA: ropeFirstBody, bodyB: nearest,
          stiffness: 0.02, damping: 0.05,
          render: { type:'rope' }
        });
        Composite.add(world, rope);
        ropes.push(rope);
        // Particles at both ends
        for (const b of [ropeFirstBody, nearest]) {
          for (let i = 0; i < 5; i++) {
            particles.push({ x: b.position.x, y: b.position.y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, size:3, life:0.4, color:'#cc8844' });
          }
        }
        playSound(400, 0.15, 'sine', 0.1);
        playSound(500, 0.1, 'square', 0.06);
        ropeFirstBody = null;
      }
    }
    pointerDown = false;
    return;
  }

  // GRAB tool — pick up and throw objects
  if (currentTool === 'grab') {
    const allGrab = Composite.allBodies(world);
    for (const b of allGrab) {
      if (b.isStatic) continue;
      const dx = pos.x - b.position.x;
      const dy = pos.y - b.position.y;
      const r = (b.render?.radius || b.render?.size || 20) * 1.4;
      if (Math.sqrt(dx*dx + dy*dy) < r) {
        grabActive = true;
        grabBody = b;
        grabOffsetX = dx;
        grabOffsetY = dy;
        grabHistory = [{ x: pos.x, y: pos.y, t: Date.now() }];
        Body.setVelocity(b, { x: 0, y: 0 });
        Body.setAngularVelocity(b, 0);
        playSound(600, 0.08, 'sine', 0.06);
        break;
      }
    }
    pointerDown = false;
    return;
  }

  // Check if clicking a bomb
  const allBodies = Composite.allBodies(world);
  for (const b of allBodies) {
    if (b.isBomb && Matter.Bounds.contains(b.bounds, pos)) {
      const dx = pos.x - b.position.x;
      const dy = pos.y - b.position.y;
      if (dx*dx + dy*dy < 900) { // ~30px radius
        explodeBomb(b);
        pointerDown = false;
        return;
      }
    }
  }

  slingStart = pos;
  slingCurrent = pos;
}

function onMove(e) {
  e.preventDefault();
  const pos = getPointerPos(e);

  // Handle grab drag (doesn't need pointerDown)
  if (grabActive && grabBody) {
    if (Composite.get(world, grabBody.id, 'body')) {
      Body.setPosition(grabBody, {
        x: pos.x - grabOffsetX,
        y: pos.y - grabOffsetY
      });
      Body.setVelocity(grabBody, { x: 0, y: 0 });
      grabHistory.push({ x: pos.x, y: pos.y, t: Date.now() });
      if (grabHistory.length > 15) grabHistory.shift();
    } else {
      grabActive = false;
      grabBody = null;
    }
    return;
  }

  if (!pointerDown) return;

  if (drawMode) {
    drawPoints.push(pos);
    return;
  }

  slingCurrent = pos;
}

function onUp(e) {
  e.preventDefault();
  const pos = getPointerPosFromEnd(e);

  // Release grab
  if (grabActive) {
    grabActive = false;
    if (grabBody && Composite.get(world, grabBody.id, 'body')) {
      if (grabHistory.length >= 2) {
        const recent = grabHistory.slice(-4);
        const first = recent[0];
        const last = recent[recent.length - 1];
        const timeDelta = Math.max(last.t - first.t, 8);
        // Convert px/ms to px/physics-step
        const throwVx = ((last.x - first.x) / timeDelta) * (1000 / 60);
        const throwVy = ((last.y - first.y) / timeDelta) * (1000 / 60);
        const speed = Math.sqrt(throwVx*throwVx + throwVy*throwVy);
        const maxSpeed = 30;
        const scale = speed > maxSpeed ? maxSpeed / speed : 1;
        Body.setVelocity(grabBody, { x: throwVx * scale, y: throwVy * scale });
        if (speed > 3) playWhoosh(Math.min(speed, 25));
      }
    }
    grabBody = null;
    grabHistory = [];
    return;
  }

  if (!pointerDown) return;
  pointerDown = false;

  if (drawMode && drawPoints.length > 1) {
    // Create static wall segments from drawn points
    // Simplify points
    const simplified = simplifyPath(drawPoints, 8);
    for (let i = 0; i < simplified.length - 1; i++) {
      const p1 = simplified[i], p2 = simplified[i+1];
      const mx = (p1.x + p2.x)/2, my = (p1.y + p2.y)/2;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len < 5) continue;
      const angle = Math.atan2(dy, dx);
      const seg = Bodies.rectangle(mx, my, len, 6, {
        isStatic: true, angle,
        friction: 0.5, restitution: 0.3,
        label: 'drawn',
        render: { type:'drawn', color:'#ff6600' }
      });
      Composite.add(world, seg);
    }
    playSound(500, 0.1, 'sine', 0.06);
    drawPoints = [];
    return;
  }

  if (slingStart) {
    const dx = slingStart.x - pos.x;
    const dy = slingStart.y - pos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 10) {
      // Simple tap — spawn at location
      spawnObject(slingStart.x, slingStart.y);
    } else {
      // Slingshot launch
      const power = Math.min(dist / 15, 25);
      const vx = (dx / dist) * power;
      const vy = (dy / dist) * power;
      playWhoosh(power); // Launch sound scaled to power
      spawnObject(slingStart.x, slingStart.y, vx, vy);
    }
  }

  slingStart = null;
  slingCurrent = null;
}

function simplifyPath(points, tolerance) {
  if (points.length < 3) return points;
  const result = [points[0]];
  let last = points[0];
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - last.x;
    const dy = points[i].y - last.y;
    if (dx*dx + dy*dy > tolerance*tolerance) {
      result.push(points[i]);
      last = points[i];
    }
  }
  result.push(points[points.length-1]);
  return result;
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);

canvas.addEventListener('touchstart', onDown, {passive:false});
