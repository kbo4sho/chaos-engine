  }

  // Mirror tool — reflect one standalone part and its motion across the canvas centerline.
  if (currentTool === 'mirror') {
    mirrorBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Web tool — place a collision-triggered sticky trap or release everything it caught.
  if (currentTool === 'web') {
    placeOrReleaseWebAt(pos);
    pointerDown = false;
    return;
  }

  // Ramp tool — place a solid triangular slope or flip an existing ramp in place.
  if (currentTool === 'ramp') {
    placeOrFlipRampAt(pos);
    pointerDown = false;
    return;
  }

  // Pinwheel tool — place a pinned four-arm rotor or kick an existing one in reverse.
  if (currentTool === 'pinwheel') {
    placeOrKickPinwheelAt(pos);
    pointerDown = false;
    return;
  }

  // Basket tool — place a dynamic open-top catcher or hop and tip an existing basket.
  if (currentTool === 'basket') {
    placeOrTipBasketAt(pos);
    pointerDown = false;
    return;
  }

  // Cannon tool — place a reusable launcher or fire a real dynamic cannonball.
  if (currentTool === 'cannon') {
    placeOrFireCannonAt(pos);
    pointerDown = false;
    return;
  }

  // Snip tool — cut one visible physical connection without removing its bodies.
  if (currentTool === 'snip') {
    snipConstraintAt(pos);
    pointerDown = false;
    return;
  }

  // Fission tool — replace one standalone body with two smaller, separating twins.
  if (currentTool === 'fission') {
    fissionBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Alchemy tool — cycle a standalone body's real physics material.
  if (currentTool === 'alchemy') {
    transmuteBodyAt(pos);
    pointerDown = false;
    return;
  }

  // GRAB tool — pick up and throw objects
  if (currentTool === 'grab') {
    const allGrab = Composite.allBodies(world);
    for (const b of allGrab) {
      if (b.isStatic) continue;
      const dx = pos.x - b.position.x;
      const dy = pos.y - b.position.y;
      const r = (b.render?.radius || b.render?.size || 20) * 1.4;
      if (Math.sqrt(dx*dx + dy*dy) < r) {
        grabActive = true;
        grabBody = b;
        grabOffsetX = dx;
        grabOffsetY = dy;
        grabHistory = [{ x: pos.x, y: pos.y, t: Date.now() }];
        Body.setVelocity(b, { x: 0, y: 0 });
        Body.setAngularVelocity(b, 0);
        playSound(600, 0.08, 'sine', 0.06);
        break;
      }
    }
    pointerDown = false;
    return;
  }

  // Eraser tool — tap a placed object to delete it with a poof.
  if (currentTool === 'eraser') {
    eraseBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Anchor tool — tap a dynamic object to lock it in place; tap again to release.
  if (currentTool === 'anchor') {
    toggleAnchorAt(pos);
    pointerDown = false;
    return;
  }

  // Resize tool — tap a standalone body to grow or shrink it.
  if (currentTool === 'resize') {
    resizeBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Clone tool — tap a standalone body to duplicate it nearby.
  if (currentTool === 'clone') {
    cloneBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Motor tool — tap a body to cycle clockwise, counter-clockwise, and off.
  if (currentTool === 'motor') {
    toggleMotorAt(pos);
    pointerDown = false;
    return;
  }

  // Flipper tool — tap empty canvas to place one; tap a placed paddle to fire it.
  if (currentTool === 'flipper') {
    placeOrActivateFlipperAt(pos);
    pointerDown = false;
    return;
  }

  // Swap tool — select two standalone bodies to exchange canvas-safe positions.
  if (currentTool === 'swap') {
    swapBodiesAt(pos);
    pointerDown = false;
    return;
  }

  // Check if clicking a bomb
  const allBodies = Composite.allBodies(world);
  for (const b of allBodies) {
    if (b.isBomb && Matter.Bounds.contains(b.bounds, pos)) {
      const dx = pos.x - b.position.x;
      const dy = pos.y - b.position.y;
      if (dx*dx + dy*dy < 900) { // ~30px radius
        explodeBomb(b);
        pointerDown = false;
        return;
      }
    }
  }

  slingStart = pos;
  slingCurrent = pos;
}

function onMove(e) {
  e.preventDefault();
  const pos = getPointerPos(e);

  if (currentTool === 'launch' && launchBody) launchAimPoint = pos;
  if (currentTool === 'blink' && blinkBody) blinkAimPoint = pos;

  // Handle grab drag (doesn't need pointerDown)
  if (grabActive && grabBody) {
    if (Composite.get(world, grabBody.id, 'body')) {
      Body.setPosition(grabBody, {
        x: pos.x - grabOffsetX,
        y: pos.y - grabOffsetY
      });
      Body.setVelocity(grabBody, { x: 0, y: 0 });
      grabHistory.push({ x: pos.x, y: pos.y, t: Date.now() });
      if (grabHistory.length > 15) grabHistory.shift();
    } else {
      grabActive = false;
      grabBody = null;
    }
    return;
  }

  if (!pointerDown) return;

  if (drawMode) {
    drawPoints.push(pos);
    return;
  }

  slingCurrent = pos;
}

function onUp(e) {
  e.preventDefault();
  const pos = getPointerPosFromEnd(e);

  // Release grab
  if (grabActive) {
    grabActive = false;
    if (grabBody && Composite.get(world, grabBody.id, 'body')) {
      if (grabHistory.length >= 2) {
        const recent = grabHistory.slice(-4);
        const first = recent[0];
        const last = recent[recent.length - 1];
        const timeDelta = Math.max(last.t - first.t, 8);
        // Convert px/ms to px/physics-step
        const throwVx = ((last.x - first.x) / timeDelta) * (1000 / 60);
        const throwVy = ((last.y - first.y) / timeDelta) * (1000 / 60);
        const speed = Math.sqrt(throwVx*throwVx + throwVy*throwVy);
        const maxSpeed = 30;
        const scale = speed > maxSpeed ? maxSpeed / speed : 1;
        Body.setVelocity(grabBody, { x: throwVx * scale, y: throwVy * scale });
        if (speed > 3) playWhoosh(Math.min(speed, 25));
      }
    }
    grabBody = null;
    grabHistory = [];
    return;
  }

  if (!pointerDown) return;
  pointerDown = false;

  if (drawMode && drawPoints.length > 1) {
    // Create static wall segments from drawn points
    // Simplify points
    const simplified = simplifyPath(drawPoints, 8);
    for (let i = 0; i < simplified.length - 1; i++) {
      const p1 = simplified[i], p2 = simplified[i+1];
      const mx = (p1.x + p2.x)/2, my = (p1.y + p2.y)/2;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len < 5) continue;
      const angle = Math.atan2(dy, dx);
      const seg = Bodies.rectangle(mx, my, len, 6, {
        isStatic: true, angle,
        friction: 0.5, restitution: 0.3,
        label: 'drawn',
        render: { type:'drawn', color:'#ff6600' }
      });
      Composite.add(world, seg);
    }
    playSound(500, 0.1, 'sine', 0.06);
    drawPoints = [];
    return;
  }

  if (slingStart) {
    const launch = getSlingshotLaunch(slingStart, pos);

    if (launch.dist < 10) {
      // Simple tap — spawn at location
      spawnObject(slingStart.x, slingStart.y);
    } else {
      // Slingshot launch
      haptic([15]);
      playWhoosh(launch.power); // Launch sound scaled to power
      spawnObject(slingStart.x, slingStart.y, launch.vx, launch.vy);
    }
  }

  slingStart = null;
  slingCurrent = null;
}

function simplifyPath(points, tolerance) {
  if (points.length < 3) return points;
  const result = [points[0]];
  let last = points[0];
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - last.x;
    const dy = points[i].y - last.y;
    if (dx*dx + dy*dy > tolerance*tolerance) {
      result.push(points[i]);
      last = points[i];
    }
  }
  result.push(points[points.length-1]);
  return result;
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp, {passive:false});

// ── COLLISION EVENTS ──
Events.on(engine, 'collisionStart', (e) => {
  e.pairs.forEach(pair => {
    // Web traps catch up to three dynamic parts on contact until tapped to release.
    const webBody = pair.bodyA.isWebTrap ? pair.bodyA : (pair.bodyB.isWebTrap ? pair.bodyB : null);
    const capturedBody = webBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (webBody && capturedBody && !capturedBody.isStatic) {
      const contact = pair.collision.supports?.[0] || {
        x:(webBody.position.x + capturedBody.position.x) / 2,
        y:(webBody.position.y + capturedBody.position.y) / 2
      };
      attachBodyToWeb(webBody, capturedBody, contact);
    }

    // Target hit detection
    const targetBody = pair.bodyA.isTarget ? pair.bodyA : (pair.bodyB.isTarget ? pair.bodyB : null);
    const hitterBody = targetBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (targetBody && hitterBody && !hitterBody.isStatic && !targetBody.targetHit) {
      targetBody.targetHit = true;
      targetScore += 10;
      // Explosion particles
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x: targetBody.position.x, y: targetBody.position.y,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.4 + Math.random()*0.4,
          color: ['#ff3333','#ffffff','#ffdd00','#ff6600'][Math.floor(Math.random()*4)],
          size: 2 + Math.random()*4
        });
      }
      // Remove target
      Composite.remove(world, targetBody);
      // Ding sound
      playSound(1200, 0.15, 'sine', 0.15);
      playSound(1800, 0.1, 'sine', 0.08);
      shakeIntensity = Math.max(shakeIntensity, 6);
    }

    // Bumper hit detection
    const bumperBody = pair.bodyA.isBumper ? pair.bodyA : (pair.bodyB.isBumper ? pair.bodyB : null);
    const otherBody = bumperBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (bumperBody && otherBody && !otherBody.isStatic) {
      bumperBody.hitFlash = 1;
      const dx = otherBody.position.x - bumperBody.position.x;
      const dy = otherBody.position.y - bumperBody.position.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      Body.setVelocity(otherBody, {
        x: (dx/dist) * 18,
        y: (dy/dist) * 18
      });
      playSound(800 + Math.random()*400, 0.12, 'sine', 0.12);
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x: bumperBody.position.x, y: bumperBody.position.y,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.3 + Math.random()*0.3,
          color: ['#ff3399','#ffdd00','#ffffff'][Math.floor(Math.random()*3)],
          size: 2 + Math.random()*3
        });
      }
      shakeIntensity = Math.max(shakeIntensity, 5);
    }

    // Trampoline super-bounce
    const trampBody = pair.bodyA.isTrampoline ? pair.bodyA : (pair.bodyB.isTrampoline ? pair.bodyB : null);
    const bouncedBody = trampBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (trampBody && bouncedBody && !bouncedBody.isStatic) {
      // Launch upward with extra oomph
      const speed = Math.sqrt(bouncedBody.velocity.x*bouncedBody.velocity.x + bouncedBody.velocity.y*bouncedBody.velocity.y);
      Body.setVelocity(bouncedBody, { x: bouncedBody.velocity.x * 1.2, y: -Math.max(Math.abs(bouncedBody.velocity.y), 8) * 1.5 });
      playSound(300, 0.15, 'sine', 0.12);
      playSound(600, 0.1, 'sine', 0.08);
      // Spring particles
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: bouncedBody.position.x + (Math.random()-0.5)*40,
          y: trampBody.position.y - 5,
          vx: (Math.random()-0.5)*3, vy: -(2 + Math.random()*4),
          life: 0.4 + Math.random()*0.3,
          color: ['#00ff99','#66ffcc','#ffffff'][Math.floor(Math.random()*3)],
          size: 2 + Math.random()*2
        });
      }
      shakeIntensity = Math.max(shakeIntensity, 4);
    }

    // Duck squeak on any collision
    if ((pair.bodyA.isDuck || pair.bodyB.isDuck)) {
      const duckBody = pair.bodyA.isDuck ? pair.bodyA : pair.bodyB;
      const dv = duckBody.velocity;
      const dSpeed = Math.sqrt(dv.x*dv.x + dv.y*dv.y);
      if (dSpeed > 1.5) {
        playSqueak();
        // Yellow particles
        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          particles.push({
            x: duckBody.position.x, y: duckBody.position.y,
            vx: Math.cos(angle)*2, vy: Math.sin(angle)*2 - 1,
            life: 0.4, color: '#ffdd00', size: 2 + Math.random()*2
          });
        }
      }
    }

    // Balloon pop on hard impact
    const balloonBody = pair.bodyA.isBalloon ? pair.bodyA : (pair.bodyB.isBalloon ? pair.bodyB : null);
    const balloonHitter = balloonBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (balloonBody && balloonHitter && !balloonHitter.isStatic) {
      const balloonRelVel = getRelativeVelocity(balloonBody, balloonHitter);
      if (balloonRelVel > BALLOON_POP_REL_VELOCITY) {
        popBalloon(balloonBody, balloonRelVel);
        return;
      }
    }

    // Pixel dust cloud on hard wall/floor impact
    const wallBody = pair.bodyA.label === 'wall' ? pair.bodyA : (pair.bodyB.label === 'wall' ? pair.bodyB : null);
    const impactBody = wallBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (wallBody && impactBody && !impactBody.isStatic) {
      const impactSpeed = Math.sqrt(impactBody.velocity.x*impactBody.velocity.x + impactBody.velocity.y*impactBody.velocity.y);
      if (impactSpeed > 6) {
        const dustCount = Math.min(Math.floor(impactSpeed * 1.5), 20);
        const contact = pair.collision.supports && pair.collision.supports[0] ? pair.collision.supports[0] : impactBody.position;
        const dustX = contact.x || impactBody.position.x;
        const dustY = contact.y || impactBody.position.y;
        for (let d = 0; d < dustCount; d++) {
          const angle = Math.random() * Math.PI; // upward arc
          const speed = 1 + Math.random() * 3;
          particles.push({
            x: dustX + (Math.random()-0.5)*20,
            y: dustY,
            vx: Math.cos(angle - Math.PI/2) * speed * (Math.random() > 0.5 ? 1 : -1),
            vy: -Math.abs(Math.sin(angle)) * speed,
            life: 0.4 + Math.random()*0.6,
            color: ['#443322','#665544','#887766','#aa9988'][Math.floor(Math.random()*4)],
            size: 2 + Math.random()*4,
            isDust: true
          });
        }
      }
    }

    const relVel = getRelativeVelocity(pair.bodyA, pair.bodyB);
    if (relVel > 2) {
      // Spark particles at collision point
      const contact = pair.collision.supports && pair.collision.supports[0]
        ? pair.collision.supports[0] : pair.bodyA.position;
      const px = contact.x || pair.bodyA.position.x;
      const py = contact.y || pair.bodyA.position.y;
      recordCollisionHeat(px, py, relVel);
      const count = Math.min(Math.floor(relVel), 8);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x: px, y: py,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.2 + Math.random()*0.3,
          color: '#00ff41',
          size: 1 + Math.random()*2
        });
      }
      // Block shattering on hard impact
      if (relVel > 9) {
        [pair.bodyA, pair.bodyB].forEach(b => {
          if (!b.isStatic && b.render?.type === 'block' && !b.isFragment && !shatterDebounce.has(b.id)) {
            shatterDebounce.add(b.id);
            setTimeout(() => shatterBlock(b), 0);
          }
        });
      }

      // Material-based impact sounds
      if (relVel > 3) {
        const matA = pair.bodyA.material || 'default';
        const matB = pair.bodyB.material || 'default';
        playImpactSound(matA, matB, relVel);
      }

      // Destruction meter — track energy from all impacts
      destructionMeter += relVel * relVel * 0.1;
      if (relVel > 5) destructionFlash = Math.min(relVel * 0.1, 1);
      const destructionLevel = getDestructionLevel();
      if (destructionLevel > lastDestructionLevel) {
        lastDestructionLevel = destructionLevel;
        celebrateDestructionLevel(destructionLevel);
      }
      
      // Update ambient hum based on new chaos level
      updateAmbientHum();
      registerImpactCombo(relVel, px, py);

      // 🎉 CONFETTI BURST on hard impacts!
      if (relVel > 8) {
        hapticThrottled([10]);
        const confettiCount = Math.min(Math.floor(relVel * 2), 30);
        const confettiColors = ['#ff3399','#ffdd00','#00ff41','#0abdc6','#ff6600','#cc00ff','#ffffff','#ff3333'];
        for (let c = 0; c < confettiCount; c++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          particles.push({
            x: px, y: py,
            vx: Math.cos(angle)*speed,
            vy: Math.sin(angle)*speed - 2, // bias upward for celebration feel
            life: 0.8 + Math.random()*1.2,
            color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
            size: 2 + Math.random()*4,
            isConfetti: true
          });
        }
        // Impact flash
        explosions.push({ x:px, y:py, r:0, maxR: relVel * 5, alpha: 0.6 });
        // Satisfying crunch sound
        playSound(150 + Math.random()*100, 0.12, 'sawtooth', 0.08);
        // Small screen shake + chromatic aberration
        shakeIntensity = Math.max(shakeIntensity, Math.min(relVel * 0.5, 10));
        chromaticAberration = Math.max(chromaticAberration, Math.min(relVel * 0.6, 8));
      }
    }
  });
});

// ── RENDERING ──
function drawBody(b) {
  const r = b.render || {};
  const type = r.type || 'default';
  const color = r.color || '#00ff41';
  const spawnScale = b.spawnScale || 1;
  const clearScale = r.clearScale || 1;

  ctx.save();
  if (b.isPhased) ctx.globalAlpha = 0.42;
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  const resizeScale = b.resizeScale || 1;
  const squashScaleX = b.squashScaleX || 1;
  const squashScaleY = b.squashScaleY || 1;
  if (spawnScale !== 1 || clearScale !== 1 || resizeScale !== 1 || squashScaleX !== 1 || squashScaleY !== 1) {
    ctx.scale(
      spawnScale * clearScale * resizeScale * squashScaleX,
      spawnScale * clearScale * resizeScale * squashScaleY
    );
  }

  switch(type) {
    case 'ball': {
      const radius = r.radius || 20;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = color + '33';
      ctx.fill();
      // Inner ring
      ctx.beginPath();
      ctx.arc(0, 0, radius*0.5, 0, Math.PI*2);
      ctx.strokeStyle = color + '88';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'fusion-core': {
      const radius = r.radius || 28;
      const pulse = 0.88 + Math.sin(performance.now() / 120 + b.id) * 0.1;
      const gradient = ctx.createLinearGradient(-radius, -radius, radius, radius);
      gradient.addColorStop(0, r.colorA || '#00ffee');
      gradient.addColorStop(1, r.colorB || '#ff66ff');
      ctx.shadowColor = '#ff66ff';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(0, 0, radius * pulse, 0, Math.PI * 2);
      ctx.fillStyle = '#ff66ff33';
      ctx.fill();
      ctx.strokeStyle = gradient;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.shadowBlur = 8;
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.rotate(performance.now() / 700 + i * Math.PI / 3);
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 0.78, radius * 0.3, 0, 0, Math.PI * 2);
        ctx.strokeStyle = i % 2 === 0 ? (r.colorA || '#00ffee') : (r.colorB || '#ff66ff');
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(4, radius * 0.16), 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      break;
    }
    case 'block': {
      const s = r.size || 30;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.fillStyle = color + '22';
      ctx.fillRect(-s/2, -s/2, s, s);
      // Cross
      ctx.beginPath();
      ctx.moveTo(-s/2, -s/2); ctx.lineTo(s/2, s/2);
      ctx.moveTo(s/2, -s/2); ctx.lineTo(-s/2, s/2);
      ctx.strokeStyle = color + '44';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'rocket': {
      // Body
      ctx.fillStyle = '#ff660044';
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -25);
      ctx.lineTo(9, -10);
      ctx.lineTo(9, 20);
      ctx.lineTo(13, 25);
      ctx.lineTo(-13, 25);
      ctx.lineTo(-9, 20);
      ctx.lineTo(-9, -10);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // Flame
      if (!b.isSleeping) {
        const flicker = 5 + Math.random()*10;
        ctx.fillStyle = `rgba(255,${100+Math.random()*155},0,0.8)`;
        ctx.beginPath();
        ctx.moveTo(-6, 25);
        ctx.lineTo(0, 25 + flicker);
        ctx.lineTo(6, 25);
        ctx.fill();
      }
      break;
    }
    case 'car-body': {
      ctx.fillStyle = color + '33';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-30, -10, 60, 20);
      ctx.fillRect(-30, -10, 60, 20);
      // Window
      ctx.strokeStyle = color + 'aa';
      ctx.strokeRect(-15, -8, 20, 10);
      break;
    }
    case 'wheel': {
      const wr = r.radius || 10;
      ctx.beginPath();
      ctx.arc(0, 0, wr, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Spoke
      ctx.beginPath();
      ctx.moveTo(0, -wr); ctx.lineTo(0, wr);
      ctx.strokeStyle = color + '88';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'bomb': {
      // Dynamite stick body
      const stickW = 14, stickH = 36;
      ctx.fillStyle = '#cc2200';
      ctx.fillRect(-stickW/2, -stickH/2, stickW, stickH);
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 2;
      ctx.strokeRect(-stickW/2, -stickH/2, stickW, stickH);
      // Darker end caps
      ctx.fillStyle = '#991100';
      ctx.fillRect(-stickW/2, -stickH/2, stickW, 5);
      ctx.fillRect(-stickW/2, stickH/2 - 5, stickW, 5);
      // TNT label
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('T', 0, -6);
      ctx.fillText('N', 0, 3);
      ctx.fillText('T', 0, 12);
      ctx.restore();
      // Fuse coming out the top
      ctx.beginPath();
      ctx.moveTo(0, -stickH/2);
      ctx.quadraticCurveTo(8, -stickH/2 - 10, 5, -stickH/2 - 16);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Spark on fuse tip
      const sparkSize = 2 + Math.random()*3;
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.arc(5, -stickH/2 - 16, sparkSize, 0, Math.PI*2);
      ctx.fill();
      // Extra spark glow
      ctx.fillStyle = `rgba(255,200,0,${0.3 + Math.random()*0.3})`;
      ctx.beginPath();
      ctx.arc(5, -stickH/2 - 16, sparkSize + 3, 0, Math.PI*2);
      ctx.fill();
      break;
    }
    case 'balloon': {
      const bRadius = r.radius || 20;
      // Balloon body (oval)
      ctx.beginPath();
      ctx.ellipse(0, 0, bRadius, bRadius * 1.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = color + '88';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Shine highlight
      ctx.beginPath();
      ctx.ellipse(-bRadius*0.3, -bRadius*0.4, bRadius*0.2, bRadius*0.35, -0.3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fill();
      // Knot at bottom
      ctx.beginPath();
      ctx.moveTo(-3, bRadius * 1.2);
      ctx.lineTo(0, bRadius * 1.2 + 6);
      ctx.lineTo(3, bRadius * 1.2);
      ctx.fillStyle = color;
      ctx.fill();
      // String
      ctx.beginPath();
      ctx.moveTo(0, bRadius * 1.2 + 6);
      const time = performance.now();
      const sway = Math.sin(time / 300 + b.position.x) * 4;
      ctx.quadraticCurveTo(sway, bRadius * 1.2 + 20, -sway, bRadius * 1.2 + 35);
      ctx.strokeStyle = color + 'aa';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'star': {
      // Draw star shape

      ctx.fill();
      ctx.strokeStyle = '#ffaa88';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
      // Eyes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-3, -2, 1.5, 0, Math.PI*2);
      ctx.arc(3, -2, 1.5, 0, Math.PI*2);
      ctx.fill();
      break;
    }
    case 'ragdoll-torso': {
      const tw = r.width || 11;
      const th = r.height || 24;
      ctx.shadowColor = color;
      ctx.shadowBlur = 6;
      ctx.fillStyle = color + 'bb';
      ctx.fillRect(-tw/2, -th/2, tw, th);
      ctx.strokeStyle = '#ffaa88';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-tw/2, -th/2, tw, th);
      ctx.shadowBlur = 0;
      break;
    }
    case 'ragdoll-limb': {
      const lw = r.width || 10;
      const lh = r.height || 6;
      ctx.shadowColor = color;
      ctx.shadowBlur = 5;
      ctx.fillStyle = color + 'aa';
      ctx.fillRect(-lw/2, -lh/2, lw, lh);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.strokeRect(-lw/2, -lh/2, lw, lh);
      ctx.shadowBlur = 0;
      break;
    }
    case 'ice': {
      const iS = r.size || 25;
      // Translucent icy block
      ctx.fillStyle = 'rgba(170,238,255,0.25)';
      ctx.fillRect(-iS/2, -iS/2, iS, iS);
      ctx.strokeStyle = '#aaeeff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-iS/2, -iS/2, iS, iS);
      // Internal cracks
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-iS*0.3, -iS*0.2);
      ctx.lineTo(0, iS*0.1);
      ctx.lineTo(iS*0.2, -iS*0.3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(iS*0.1, iS*0.1);
      ctx.lineTo(iS*0.3, iS*0.35);
      ctx.stroke();
      // Shine highlight
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.moveTo(-iS*0.35, -iS*0.45);
      ctx.lineTo(-iS*0.15, -iS*0.45);
      ctx.lineTo(-iS*0.35, -iS*0.25);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'fan': {
      const fw = r.width || 50;
      const fh = r.height || 40;
      // Housing
      ctx.fillStyle = '#0a2a3a';
      ctx.fillRect(-fw/2, -fh/2, fw, fh);
      ctx.strokeStyle = '#66ddff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-fw/2, -fh/2, fw, fh);
      // Fan blades (animated)
      const time = performance.now();
      const bladeAngle = time / 60;
      ctx.strokeStyle = '#66ddffcc';
      ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        const a = bladeAngle + (Math.PI*2/3)*i;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a)*fh*0.35, Math.sin(a)*fh*0.35);
        ctx.stroke();
      }
      // Center hub
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI*2);
      ctx.fillStyle = '#66ddff';
      ctx.fill();
      // Direction arrow (blows upward)
      ctx.fillStyle = '#66ddff88';
      ctx.font = '14px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('↑↑↑', 0, -fh/2 - 10);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      break;
    }
    case 'drawn': {
      // Draw the rectangle
      const w = b.bounds.max.x - b.bounds.min.x;
      const h = b.bounds.max.y - b.bounds.min.y;
      // Use vertices for drawn segments
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let i = 1; i < verts.length; i++) {
        ctx.lineTo(verts[i].x, verts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#ff660066';
      ctx.fill();
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      return;
    }
    case 'dino': {
      // Draw vertices as polygon
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let i = 1; i < verts.length; i++) {
        ctx.lineTo(verts[i].x, verts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = color + '44';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Eye
      ctx.fillStyle = '#ff0000';
      const cx = b.position.x + 5, cy = b.position.y - 10;
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      return;
    }
    case 'magnet': {
      const mw = r.width || 40;
      const mh = r.height || 50;
      const isAttract = color === '#ff4466';
      // Horseshoe magnet body
      ctx.fillStyle = '#888888';
      ctx.fillRect(-mw/2, -mh/2, mw, mh);
      // Red pole (left)
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(-mw/2, -mh/2, mw/2 - 2, mh*0.4);
      // Blue pole (right)
      ctx.fillStyle = '#3333ff';
      ctx.fillRect(2, -mh/2, mw/2 - 2, mh*0.4);
      // Border
      ctx.strokeStyle = isAttract ? '#ff4466' : '#4466ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-mw/2, -mh/2, mw, mh);
      // Label
      ctx.fillStyle = isAttract ? '#ff4466' : '#4466ff';
      ctx.font = '12px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isAttract ? 'PULL' : 'PUSH', 0, mh*0.15);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      break;
    }
    case 'target': {
      const tR = r.radius || 25;
      // Concentric rings: red/white/red/white/red
      const ringColors = ['#ff3333','#ffffff','#ff3333','#ffffff','#ff3333'];
      for (let i = 4; i >= 0; i--) {
        const ringR = tR * (i + 1) / 5;
        ctx.beginPath();
        ctx.arc(0, 0, ringR, 0, Math.PI*2);
        ctx.fillStyle = ringColors[i];
        ctx.fill();
      }
      // Bullseye center dot
      ctx.beginPath();
      ctx.arc(0, 0, tR * 0.12, 0, Math.PI*2);
      ctx.fillStyle = '#ffdd00';
      ctx.fill();
      break;
    }
    case 'pin': {
      const pw = r.width || 14;
      const ph = r.height || 60;
      // Main body - cream white
      ctx.fillStyle = '#fff8ee';
      ctx.fillRect(-pw/2, -ph/2, pw, ph);
      // Rounded top cap
      ctx.beginPath();
      ctx.arc(0, -ph/2, pw/2 + 1, Math.PI, 0);
      ctx.fillStyle = '#fff8ee';
      ctx.fill();
      // Red neck stripe
      ctx.fillStyle = '#cc2222';
      ctx.fillRect(-pw/2, -ph*0.15, pw, ph*0.06);
      ctx.fillRect(-pw/2, -ph*0.08, pw, ph*0.06);
      // Outline
      ctx.strokeStyle = '#ccbbaa';
      ctx.lineWidth = 1;
      ctx.strokeRect(-pw/2, -ph/2, pw, ph);
      break;
    }
    case 'seesaw-plank': {
      const sw = r.width || 120;
      const sh = r.height || 8;
      ctx.fillStyle = '#aa8844';
      ctx.fillRect(-sw/2, -sh/2, sw, sh);
      ctx.strokeStyle = '#ccaa55';
      ctx.lineWidth = 1;
      ctx.strokeRect(-sw/2, -sh/2, sw, sh);
      // Wood grain lines
      ctx.strokeStyle = '#99773344';
      ctx.lineWidth = 0.5;
      for (let i = -sw/2 + 10; i < sw/2; i += 20) {
        ctx.beginPath();
        ctx.moveTo(i, -sh/2);
        ctx.lineTo(i, sh/2);
        ctx.stroke();
      }
      break;
    }
    case 'jenga': {
      // Wooden Jenga block with grain lines
      const jw = r.width || 26, jh = r.height || 18;
      const verts = b.vertices;
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let v = 1; v < verts.length; v++) ctx.lineTo(verts[v].x, verts[v].y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      // Wood grain
      ctx.strokeStyle = '#a07830';
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = 0.4;
      for (let g = 0; g < 3; g++) {
        const gy = b.position.y - 6 + g * 5;
        ctx.beginPath();
        ctx.moveTo(b.position.x - 15, gy);
        ctx.lineTo(b.position.x + 15, gy);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // Outline
      ctx.strokeStyle = '#8a6e2f';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let v = 1; v < verts.length; v++) ctx.lineTo(verts[v].x, verts[v].y);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      return;
    }
    case 'seesaw-pivot': {
      const pvH = r.height || 20;
      ctx.beginPath();
      ctx.moveTo(0, -pvH/2);
      ctx.lineTo(pvH*0.6, pvH/2);
      ctx.lineTo(-pvH*0.6, pvH/2);
      ctx.closePath();
      ctx.fillStyle = '#886633';
      ctx.fill();
      ctx.strokeStyle = '#aa8844';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      break;
    }
    default: {
      // Generic polygon
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      if (verts && verts.length) {
        ctx.beginPath();
        ctx.moveTo(verts[0].x, verts[0].y);
        for (let i = 1; i < verts.length; i++) {
          ctx.lineTo(verts[i].x, verts[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = '#00ff4122';
        ctx.fill();
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
  }
  ctx.restore();
}

function drawWalls() {
  ctx.strokeStyle = '#0abdc644';
  ctx.lineWidth = 2;
  walls.forEach(w => {
    const v = w.vertices;
    ctx.beginPath();
    ctx.moveTo(v[0].x, v[0].y);
    for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath();
    ctx.stroke();
  });

  // Floor indicator line
  if (walls[0]) {
    const floorY = walls[0].position.y - 20;
    ctx.strokeStyle = '#0abdc6';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(0, floorY);
    ctx.lineTo(canvas.width, floorY);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawConstraints() {
  const constraints = Composite.allConstraints(world);
  // Check which constraints are wrecking ball chains
  const wreckingChains = new Set(wreckingBalls.map(wb => wb.chain));
  constraints.forEach(c => {
    if (!c.bodyA || !c.bodyB) return;
    if (c.render?.type === 'flipper-pin') return;
    const pA = Vector.add(c.bodyA.position, Vector.rotate(c.pointA, c.bodyA.angle));
    const pB = Vector.add(c.bodyB.position, Vector.rotate(c.pointB, c.bodyB.angle));
    if (c.render?.type === 'web-attachment') {
      const dx = pB.x - pA.x;
      const dy = pB.y - pA.y;
      const distance = Math.hypot(dx, dy) || 1;
      const nx = -dy / distance;
      const ny = dx / distance;
      const segments = Math.max(3, Math.min(8, Math.round(distance / 8)));
      ctx.save();
      ctx.strokeStyle = '#f58cff';
      ctx.shadowColor = '#f58cff';
      ctx.shadowBlur = 9;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      for (let i = 1; i < segments; i++) {
        const t = i / segments;
        const wave = (i % 2 === 0 ? -1 : 1) * 4;
        ctx.lineTo(pA.x + dx * t + nx * wave, pA.y + dy * t + ny * wave);
      }
      ctx.lineTo(pB.x, pB.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      [pA, pB].forEach(point => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#bdfcff';
        ctx.fill();
      });
      ctx.restore();
    } else if (c.render?.type === 'strut') {
      const dx = pB.x - pA.x;
      const dy = pB.y - pA.y;
      const dist = Math.hypot(dx, dy) || 1;
      const nx = -dy / dist;
      const ny = dx / dist;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.shadowColor = '#66ffff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.strokeStyle = '#123f4a';
      ctx.lineWidth = 9;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.strokeStyle = '#66ffff';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.shadowBlur = 0;
      const braceCount = Math.max(1, Math.floor(dist / 34));
      for (let i = 1; i <= braceCount; i++) {
        const t = i / (braceCount + 1);
        const x = pA.x + dx * t;
        const y = pA.y + dy * t;
        ctx.beginPath();
        ctx.moveTo(x - nx * 5, y - ny * 5);
        ctx.lineTo(x + nx * 5, y + ny * 5);
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      [pA, pB].forEach(point => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#071014';
        ctx.fill();
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
      ctx.restore();
    } else if (c.render?.type === 'weld') {
      const seam = { x:(pA.x + pB.x) / 2, y:(pA.y + pB.y) / 2 };
      const pulse = 0.78 + Math.sin(performance.now() / 110 + c.id) * 0.18;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.strokeStyle = '#5a3517';
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.strokeStyle = '#ffb347';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.translate(seam.x, seam.y);
      ctx.rotate(Math.PI / 4);
      ctx.globalAlpha = pulse;
      ctx.shadowColor = '#ffb347';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#11181c';
      ctx.strokeStyle = '#ffb347';
      ctx.lineWidth = 3;
      ctx.fillRect(-9, -9, 18, 18);
      ctx.strokeRect(-9, -9, 18, 18);
      ctx.rotate(-Math.PI / 4);
      ctx.strokeStyle = '#65f7ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-6, -6);
      ctx.lineTo(6, 6);
      ctx.moveTo(6, -6);
      ctx.lineTo(-6, 6);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    } else if (c.render?.type === 'hinge') {
      const joint = { x:(pA.x + pB.x) / 2, y:(pA.y + pB.y) / 2 };
      ctx.save();
      ctx.shadowColor = '#ffcc66';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#ffcc66';
      ctx.fillStyle = '#101820';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(joint.x, joint.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff2b3';
      ctx.beginPath();
      ctx.arc(joint.x, joint.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (c.render?.type === 'spring') {
      const dx = pB.x - pA.x;
      const dy = pB.y - pA.y;
      const dist = Math.hypot(dx, dy) || 1;
      const nx = -dy / dist;
      const ny = dx / dist;
      const turns = Math.max(5, Math.min(14, Math.round(dist / 14)));
      const points = turns * 2;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#b6ff4a';
      ctx.shadowColor = '#b6ff4a';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      for (let i = 1; i < points; i++) {
        const t = i / points;
        const amplitude = i % 2 === 0 ? -8 : 8;
        ctx.lineTo(
          pA.x + dx * t + nx * amplitude,
          pA.y + dy * t + ny * amplitude
        );
      }
      ctx.lineTo(pB.x, pB.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
      [pA, pB].forEach(point => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#071014';
        ctx.fill();
        ctx.strokeStyle = '#ffdd55';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
      ctx.restore();
    } else if (wreckingChains.has(c) || c.render?.type === 'chain-link-constraint') {
      // Draw chain links
      const dx = pB.x - pA.x, dy = pB.y - pA.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const links = Math.max(Math.floor(dist / 12), 3);
      for (let i = 0; i < links; i++) {
        const t = i / links;
        const lx = pA.x + dx * t;
        const ly = pA.y + dy * t;
        ctx.beginPath();
        ctx.arc(lx, ly, 3, 0, Math.PI*2);
        ctx.strokeStyle = c.render?.type === 'chain-link-constraint'
          ? (i % 2 === 0 ? '#99ccff' : '#d8f2ff')
          : (i % 2 === 0 ? '#888888' : '#666666');
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.strokeStyle = '#0abdc688';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
}

function drawSlingshot() {
  if (!slingStart || !slingCurrent || drawMode) return;
  const launch = getSlingshotLaunch(slingStart, slingCurrent);
  if (launch.dist < 10) return;

  // Direction line
  ctx.beginPath();
  ctx.moveTo(slingStart.x, slingStart.y);
  ctx.lineTo(slingStart.x + launch.dx*0.5, slingStart.y + launch.dy*0.5);
  ctx.strokeStyle = '#00ff41';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  drawTrajectoryPreview(slingStart, launch);

  // Power indicator
  ctx.fillStyle = '#00ff41';
  ctx.font = '16px VT323';
  ctx.fillText(`PWR: ${Math.round(launch.power)}`, slingStart.x + 15, slingStart.y - 15);

  // Launch dot
  ctx.beginPath();
  ctx.arc(slingStart.x, slingStart.y, 6, 0, Math.PI*2);
  ctx.fillStyle = '#00ff4188';
  ctx.fill();
  ctx.strokeStyle = '#00ff41';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Rubber band lines
  ctx.beginPath();
  ctx.moveTo(slingCurrent.x, slingCurrent.y);
  ctx.lineTo(slingStart.x, slingStart.y);
  ctx.strokeStyle = '#ff660088';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawDrawing() {
  if (!drawMode || drawPoints.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
  for (let i = 1; i < drawPoints.length; i++) {
    ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
  }
  ctx.strokeStyle = '#ff6600';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawRopes() {
  for (const rope of ropes) {
    if (!rope.bodyA || !rope.bodyB) continue;
    const ax = rope.bodyA.position.x, ay = rope.bodyA.position.y;
    const bx = rope.bodyB.position.x, by = rope.bodyB.position.y;
    const dx = bx - ax, dy = by - ay;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const segs = Math.max(6, Math.floor(dist / 15));
    // Draw sagging rope segments
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    for (let s = 1; s <= segs; s++) {
      const t = s / segs;
      const mx = ax + dx * t;
      const sag = Math.sin(t * Math.PI) * dist * 0.08;
      const my = ay + dy * t + sag;
      ctx.lineTo(mx, my);
    }
    ctx.stroke();
    // Rope highlight
    ctx.strokeStyle = '#cc884466';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    for (let s = 1; s <= segs; s++) {
      const t = s / segs;
      const mx = ax + dx * t;
      const sag = Math.sin(t * Math.PI) * dist * 0.08 - 1;
      const my = ay + dy * t + sag;
      ctx.lineTo(mx, my);
    }
    ctx.stroke();
    // Knot dots at ends
    ctx.fillStyle = '#6B4914';
    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI*2); ctx.fill();
  }
  // Highlight selected first body for rope tool
  if (ropeFirstBody && currentTool === 'rope') {
    ctx.strokeStyle = '#cc8844';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(ropeFirstBody.position.x, ropeFirstBody.position.y, 30, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1; // gravity on particles
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;

    if (p.isDust) {
      // Dust: soft round puffs that expand and fade
      p.vx *= 0.96; // air drag
      p.vy *= 0.95;
      p.size += 0.15; // expand as it dissipates
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    } else if (p.isConfetti) {
      // Confetti: tumbling rectangles that flutter
      p.vx *= 0.99; // air drag
      p.vy += Math.sin(p.x * 0.1) * 0.03; // flutter
      if (!p.spin) p.spin = Math.random() * Math.PI * 2;
      p.spin += 0.15;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin);
      const w = p.size * 1.5;
      const h = p.size * 0.7;
      ctx.fillRect(-w/2, -h/2, w, h);
      ctx.restore();
    } else if (p.isBirthFlash) {
      // Bright sparkle that fades
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life / 0.4), 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else if (p.isBalloonString) {
      // Small falling string curls after a balloon pop.
      p.vx *= 0.98;
      p.spin += 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -p.size * 3);
      ctx.quadraticCurveTo(p.size, 0, 0, p.size * 3);
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += (r.maxR - r.r) * 0.22;
    r.alpha -= dt * 1.8;
    if (r.alpha <= 0.01) { ripples.splice(i, 1); continue; }

    const progress = Math.min(r.r / r.maxR, 1);
    ctx.globalAlpha = r.alpha;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = Math.max(0.5, 2.5 - progress * 1.8);
    ctx.shadowColor = r.color;
    ctx.shadowBlur = 8 * (1 - progress);
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.r += (ex.maxR - ex.r) * 0.15;
    ex.alpha -= dt * 2;
    if (ex.alpha <= 0) { explosions.splice(i, 1); continue; }
    if (ex.isBirthRing) {
      // White expanding ring for spawn effect
      ctx.globalAlpha = ex.alpha * 0.7;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00ff41';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ex.alpha -= dt * 1.5; // fade faster
    } else {
      ctx.globalAlpha = ex.alpha * 0.4;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2);
      ctx.fillStyle = '#ff6600';
      ctx.fill();
      ctx.globalAlpha = ex.alpha * 0.6;
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawWindIndicator() {
  if (windTimer <= 0) return;
  const dir = windForce > 0 ? '→' : '←';
  ctx.fillStyle = '#0abdc6';
  ctx.font = '24px VT323';
  ctx.textAlign = 'center';
  ctx.fillText(`WIND ${dir}${dir}${dir}`, canvas.width/2, 40);
  ctx.textAlign = 'left';
}

function drawGrid() {
  ctx.strokeStyle = '#0a1a1a';
  ctx.lineWidth = 0.5;
  const step = 50;
  for (let x = 0; x < canvas.width; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawAnchorMarkers(timestamp) {
  anchoredBodies.forEach(b => {
    if (!Composite.get(world, b.id, 'body')) {
      anchoredBodies.delete(b);
      return;
    }

    const halfW = (b.bounds.max.x - b.bounds.min.x) / 2;
    const halfH = (b.bounds.max.y - b.bounds.min.y) / 2;
    const radius = Math.max(18, Math.min(58, Math.sqrt(halfW*halfW + halfH*halfH) + 8));
    const pulse = 0.72 + Math.sin(timestamp / 180 + b.id) * 0.2;

    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.strokeStyle = `rgba(0,229,255,${pulse})`;
    ctx.fillStyle = `rgba(0,229,255,${0.12 + pulse * 0.08})`;
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);

    // Small geometric anchor badge that stays readable at any body rotation.
    ctx.beginPath();
    ctx.arc(0, -5, 3, 0, Math.PI * 2);
    ctx.moveTo(0, -2);
    ctx.lineTo(0, 8);
    ctx.moveTo(-7, 3);
    ctx.quadraticCurveTo(-6, 10, 0, 10);
    ctx.quadraticCurveTo(6, 10, 7, 3);
    ctx.stroke();
    ctx.restore();
  });
}

function drawMotorMarkers(timestamp) {
  motorizedBodies.forEach((direction, b) => {
    if (!Composite.get(world, b.id, 'body')) {
      motorizedBodies.delete(b);
      return;
    }

    const halfW = (b.bounds.max.x - b.bounds.min.x) / 2;
    const halfH = (b.bounds.max.y - b.bounds.min.y) / 2;
    const radius = Math.max(22, Math.min(64, Math.sqrt(halfW*halfW + halfH*halfH) + 10));
    const spin = direction * timestamp / 260;
    const pulse = 0.72 + Math.sin(timestamp / 120 + b.id) * 0.2;

    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.strokeStyle = `rgba(255,102,204,${pulse})`;
    ctx.fillStyle = `rgba(255,102,204,${0.08 + pulse * 0.06})`;
    ctx.shadowColor = '#ff66cc';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    for (let i = 0; i < 8; i++) {
      const angle = spin + i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * (radius - 3), Math.sin(angle) * (radius - 3));
      ctx.lineTo(Math.cos(angle) * (radius + 5), Math.sin(angle) * (radius + 5));
      ctx.stroke();
    }

    ctx.fillStyle = '#ff66cc';
    ctx.font = '20px VT323';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(direction === 1 ? '↻' : '↺', 0, 1);
    ctx.restore();
  });
}

function drawFloatMarkers(timestamp) {

function drawReverseFlash(timestamp) {
  if (!reverseFlash) return;
  if (!Composite.get(world, reverseFlash.body.id, 'body')) {
    reverseFlash = null;
    return;
  }

  const elapsed = timestamp - reverseFlash.startedAt;
  if (elapsed >= 520) {
    reverseFlash = null;
    return;
  }

  const body = reverseFlash.body;
  const progress = elapsed / 520;
  const radius = Math.max(
    24,
    Math.min(58, Math.max(body.bounds.max.x - body.bounds.min.x, body.bounds.max.y - body.bounds.min.y) * 0.68)
  );
  ctx.save();
  ctx.translate(body.position.x, body.position.y);
  ctx.rotate(-progress * Math.PI * 1.6);
  ctx.globalAlpha = 1 - progress;
  ctx.strokeStyle = '#ff6bff';
  ctx.fillStyle = '#ff6bff';
  ctx.shadowColor = '#ff6bff';
  ctx.shadowBlur = 16;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, radius, -Math.PI * 0.1, Math.PI * 1.45);
  ctx.stroke();
  const arrowAngle = Math.PI * 1.45;
  ctx.translate(Math.cos(arrowAngle) * radius, Math.sin(arrowAngle) * radius);
  ctx.rotate(arrowAngle + Math.PI / 2);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-7, -11);
  ctx.lineTo(7, -11);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBrakeFlash(timestamp) {
  if (!brakeFlash) return;
  const { body, fromVelocity, startedAt } = brakeFlash;
  if (!Composite.get(world, body.id, 'body')) {
    brakeFlash = null;
    return;
  }
  const progress = Math.max(0, (timestamp - startedAt) / 560);
  if (progress >= 1) {
    brakeFlash = null;
    return;
  }

  const halfW = (body.bounds.max.x - body.bounds.min.x) / 2;
  const halfH = (body.bounds.max.y - body.bounds.min.y) / 2;
  const radius = Math.max(24, Math.min(62, Math.hypot(halfW, halfH) + 14));
  const travelAngle = Math.atan2(fromVelocity.y, fromVelocity.x);
  const collapse = 1 - progress;
  ctx.save();
  ctx.translate(body.position.x, body.position.y);
  ctx.globalAlpha = collapse;
  ctx.strokeStyle = '#ff5f57';
  ctx.fillStyle = '#ffe66d';
  ctx.shadowColor = '#ff5f57';
  ctx.shadowBlur = 16;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, radius * (0.72 + collapse * 0.28), 0, Math.PI * 2);
  ctx.stroke();
  ctx.rotate(travelAngle);
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * (radius + 14) * collapse, -13);
    ctx.lineTo(side * (radius + 2), -6);
    ctx.lineTo(side * (radius + 2), 6);
    ctx.lineTo(side * (radius + 14) * collapse, 13);
    ctx.stroke();
  }
  ctx.rotate(-travelAngle);
  ctx.font = 'bold 18px VT323';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('STOP', 0, 1);
  ctx.restore();
}

function drawThrusterMarkers(timestamp) {
  thrusterBodies.forEach(body => {
    if (!Composite.get(world, body.id, 'body')) {
      thrusterBodies.delete(body);
      return;
    }

    const halfW = (body.bounds.max.x - body.bounds.min.x) / 2;
    const halfH = (body.bounds.max.y - body.bounds.min.y) / 2;
    const radius = Math.max(20, Math.min(62, Math.hypot(halfW, halfH) + 7));
    const pulse = 0.78 + Math.sin(timestamp / 70 + body.id) * 0.2;
    const flameLength = 13 + pulse * 11;

    ctx.save();
    ctx.translate(body.position.x, body.position.y);
    ctx.rotate(body.angle || 0);
    ctx.globalAlpha = body.isStatic ? 0.45 : 1;
    ctx.strokeStyle = '#ff9f1c';
    ctx.fillStyle = '#ff9f1c';
    ctx.shadowColor = '#ff3d00';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.moveTo(radius + 2, 0);
    ctx.lineTo(radius + 19, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(radius + 20, 0);
    ctx.lineTo(radius + 10, -6);
    ctx.lineTo(radius + 10, 6);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-radius + 2, -7);
    ctx.lineTo(-radius - flameLength, 0);
    ctx.lineTo(-radius + 2, 7);
    ctx.closePath();
    ctx.fillStyle = '#ff3d00';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-radius + 2, -3.5);
    ctx.lineTo(-radius - flameLength * 0.58, 0);
    ctx.lineTo(-radius + 2, 3.5);
    ctx.closePath();
    ctx.fillStyle = '#fff176';
    ctx.fill();

    ctx.strokeStyle = `rgba(255,159,28,${pulse})`;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  });
}

function drawChargeMarkers(timestamp) {
  const charged = Composite.allBodies(world).filter(body => body.electricCharge === 1 || body.electricCharge === -1);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < charged.length; i++) {
    for (let j = i + 1; j < charged.length; j++) {
      const bodyA = charged[i];
      const bodyB = charged[j];
      const dx = bodyB.position.x - bodyA.position.x;
      const dy = bodyB.position.y - bodyA.position.y;
      const distance = Math.hypot(dx, dy);
      const force = getChargePairForce(bodyA.electricCharge, bodyB.electricCharge, dx, dy, distance);
      if (!force) continue;
      const alpha = 0.18 + Math.min(0.42, force.strength * 130);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = force.interaction === 'attract' ? '#b8ff5a' : '#ff8a5b';
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 8;
      ctx.lineWidth = 1.5;
      ctx.setLineDash(force.interaction === 'attract' ? [7, 5] : [2, 7]);
      ctx.lineDashOffset = -(timestamp / 45) % 12;
      ctx.beginPath();
      ctx.moveTo(bodyA.position.x, bodyA.position.y);
      ctx.lineTo(bodyB.position.x, bodyB.position.y);
      ctx.stroke();
    }
  }
  ctx.restore();

  charged.forEach(body => {
    const halfW = (body.bounds.max.x - body.bounds.min.x) / 2;
    const halfH = (body.bounds.max.y - body.bounds.min.y) / 2;
    const radius = Math.max(22, Math.min(66, Math.hypot(halfW, halfH) + 8));
    const positive = body.electricCharge === 1;
    const color = positive ? '#ff4fd8' : '#4de8ff';
    const pulse = 0.72 + Math.sin(timestamp / 85 + body.id) * 0.2;
    ctx.save();
    ctx.translate(body.position.x, body.position.y);
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = color;
    ctx.fillStyle = '#080c10';
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, radius, timestamp / 700, timestamp / 700 + Math.PI * 1.45);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(0, -radius - 8, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = 'bold 19px VT323';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(positive ? '+' : '−', 0, -radius - 7);
    ctx.restore();
  });
}

function drawTwistFlash(timestamp) {
  if (!twistFlash) return;
  const { body, direction, startedAt } = twistFlash;
  if (!Composite.get(world, body.id, 'body')) {
    twistFlash = null;
    return;
  }

  const progress = Math.max(0, (timestamp - startedAt) / 680);
  if (progress >= 1) {
    twistFlash = null;
    return;
  }

  const halfW = (body.bounds.max.x - body.bounds.min.x) / 2;
  const halfH = (body.bounds.max.y - body.bounds.min.y) / 2;
  const radius = Math.max(28, Math.min(70, Math.hypot(halfW, halfH) + 14 + progress * 10));
  const alpha = 1 - progress;
  const color = direction === 1 ? '#ffcf40' : '#59e3ff';
  const start = -Math.PI * 0.8 + direction * progress * Math.PI * 1.4;
  const end = start + direction * Math.PI * 1.35;

  ctx.save();
  ctx.translate(body.position.x, body.position.y);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 18;
  ctx.lineWidth = 3.5 - progress * 1.5;
  ctx.setLineDash([8, 4]);
  ctx.beginPath();
  ctx.arc(0, 0, radius, start, end, direction < 0);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.save();
  ctx.translate(Math.cos(end) * radius, Math.sin(end) * radius);
  ctx.rotate(end + direction * Math.PI / 2);
  ctx.beginPath();
  ctx.moveTo(9, 0);
  ctx.lineTo(-5, -6);
  ctx.lineTo(-5, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.globalAlpha = alpha * 0.9;
  ctx.font = 'bold 22px VT323';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(direction === 1 ? '↻' : '↺', 0, 1);
  ctx.restore();
}

function drawLiftMarkers(timestamp) {
  const gx = engine.gravity.x || 0;
  const gy = engine.gravity.y || 0;
  const gravityMagnitude = Math.hypot(gx, gy);
  const liftAngle = gravityMagnitude > 0.001 ? Math.atan2(-gy, -gx) : -Math.PI / 2;

  liftedBodies.forEach(body => {
    if (!Composite.get(world, body.id, 'body')) {
      liftedBodies.delete(body);
      return;
    }
    const halfW = (body.bounds.max.x - body.bounds.min.x) / 2;
    const halfH = (body.bounds.max.y - body.bounds.min.y) / 2;
    const radius = Math.max(23, Math.min(68, Math.hypot(halfW, halfH) + 10));
    const pulse = 0.72 + Math.sin(timestamp / 90 + body.id) * 0.2;
    ctx.save();
    ctx.translate(body.position.x, body.position.y);
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#9d7cff';
    ctx.fillStyle = '#7df9ff';
    ctx.shadowColor = '#9d7cff';
    ctx.shadowBlur = 15;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.rotate(liftAngle);
    ctx.beginPath();
    ctx.moveTo(-radius * 0.5, 0);
    ctx.lineTo(radius * 0.45, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(radius * 0.62, 0);
    ctx.lineTo(radius * 0.35, -8);
    ctx.lineTo(radius * 0.35, 8);
    ctx.closePath();
    ctx.fill();
    ctx.rotate(-liftAngle);
    ctx.fillStyle = '#9d7cff';
    ctx.font = 'bold 15px VT323';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('−G', 0, 1);
    ctx.restore();
  });
}

function drawOrbitMarkers(timestamp) {
  if (orbitSelection && Composite.get(world, orbitSelection.id, 'body')) {
    const radius = Math.max(26, Math.min(70, Math.hypot(
      orbitSelection.bounds.max.x - orbitSelection.bounds.min.x,
      orbitSelection.bounds.max.y - orbitSelection.bounds.min.y
    ) / 2 + 12));
    const pulse = 0.72 + Math.sin(timestamp / 110) * 0.22;
    ctx.save();
    ctx.translate(orbitSelection.position.x, orbitSelection.position.y);
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#54f7ff';
    ctx.fillStyle = '#ff4fd8';
    ctx.shadowColor = '#54f7ff';
    ctx.shadowBlur = 16;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = 'bold 16px VT323';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CENTER?', 0, -radius - 10);
    ctx.restore();
  } else if (orbitSelection) {
    orbitSelection = null;
  }

  orbitingBodies.forEach((orbit, body) => {
    if (!Composite.get(world, body.id, 'body')) {
      orbitingBodies.delete(body);
      return;
    }
    const dx = body.position.x - orbit.center.x;
    const dy = body.position.y - orbit.center.y;
    const distance = Math.max(1, Math.hypot(dx, dy));
    const radial = { x:dx / distance, y:dy / distance };
    const tangent = { x:-radial.y * orbit.direction, y:radial.x * orbit.direction };
    const pulse = 0.6 + Math.sin(timestamp / 130 + body.id) * 0.18;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#54f7ff';
    ctx.fillStyle = '#ff4fd8';
    ctx.shadowColor = '#54f7ff';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 7]);
    ctx.beginPath();
    ctx.arc(orbit.center.x, orbit.center.y, orbit.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha *= 0.58;
    ctx.beginPath();
    ctx.moveTo(orbit.center.x, orbit.center.y);
    ctx.lineTo(body.position.x, body.position.y);
    ctx.stroke();
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    ctx.arc(orbit.center.x, orbit.center.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(orbit.center.x - 10, orbit.center.y);
    ctx.lineTo(orbit.center.x + 10, orbit.center.y);
    ctx.moveTo(orbit.center.x, orbit.center.y - 10);
    ctx.lineTo(orbit.center.x, orbit.center.y + 10);
    ctx.stroke();
    const arrowX = body.position.x + tangent.x * 28;
    const arrowY = body.position.y + tangent.y * 28;
    ctx.translate(arrowX, arrowY);
    ctx.rotate(Math.atan2(tangent.y, tangent.x));
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-5, -6);
    ctx.lineTo(-5, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
}

function drawPunchFlash(timestamp) {
  if (!punchFlash) return;
  if (!Composite.get(world, punchFlash.body.id, 'body')) {
    punchFlash = null;
    return;
  }

  const elapsed = timestamp - punchFlash.startedAt;
  if (elapsed >= 420) {
    punchFlash = null;
    return;
  }

  const progress = elapsed / 420;
  const angle = Math.atan2(punchFlash.force.y, punchFlash.force.x);
  const radius = 10 + progress * 34;
  ctx.save();
  ctx.translate(punchFlash.point.x, punchFlash.point.y);
  ctx.rotate(angle);
  ctx.globalAlpha = 1 - progress;
  ctx.strokeStyle = '#ff8c42';
  ctx.fillStyle = '#fff4cc';
  ctx.shadowColor = '#ff8c42';
  ctx.shadowBlur = 18;
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const a = i * Math.PI / 8;
    const r = i % 2 === 0 ? radius : radius * 0.45;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-8, 0);
  ctx.lineTo(-34 - progress * 18, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-40 - progress * 18, 0);
  ctx.lineTo(-29 - progress * 18, -7);
  ctx.lineTo(-29 - progress * 18, 7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawStackMarker(timestamp) {
  if (stackFirstBody && currentTool === 'stack') {
    if (!Composite.get(world, stackFirstBody.id, 'body')) {

    } else {
      const halfWidth = (stackFirstBody.bounds.max.x - stackFirstBody.bounds.min.x) / 2;
      const halfHeight = (stackFirstBody.bounds.max.y - stackFirstBody.bounds.min.y) / 2;
      const radius = Math.max(24, Math.min(68, Math.hypot(halfWidth, halfHeight) + 12));
      const pulse = 0.75 + Math.sin(timestamp / 100) * 0.2;
      ctx.save();
      ctx.translate(stackFirstBody.position.x, stackFirstBody.position.y);
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#70ffb4';
      ctx.fillStyle = '#ffcf40';
      ctx.shadowColor = '#70ffb4';
      ctx.shadowBlur = 14;
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(-12, radius + 7);
      ctx.lineTo(12, radius + 7);
      ctx.moveTo(-7, radius + 2);
      ctx.lineTo(0, radius + 9);
      ctx.lineTo(7, radius + 2);
      ctx.stroke();
      ctx.font = 'bold 15px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('TOP?', 0, -radius - 10);

  if (!stackFlash) return;
  const progress = (timestamp - stackFlash.startedAt) / 700;
  if (progress >= 1) {
    stackFlash = null;
    return;
  }
  const eased = 1 - Math.pow(1 - progress, 3);
  const x = stackFlash.from.x + (stackFlash.to.x - stackFlash.from.x) * eased;
  const y = stackFlash.from.y + (stackFlash.to.y - stackFlash.from.y) * eased;
  const alpha = 1 - progress;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#70ffb4';
  ctx.fillStyle = '#ffcf40';
  ctx.shadowColor = '#70ffb4';
  ctx.shadowBlur = 14;
  ctx.lineWidth = 2.5;
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.moveTo(stackFlash.from.x, stackFlash.from.y);
  ctx.lineTo(stackFlash.to.x, stackFlash.to.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.rect(x - 8, y - 6, 16, 12);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(stackFlash.to.x - 28, stackFlash.targetTop);
  ctx.lineTo(stackFlash.to.x + 28, stackFlash.targetTop);
  ctx.stroke();
  ctx.font = 'bold 16px VT323';
  ctx.textAlign = 'center';
  ctx.fillText('STACKED', stackFlash.to.x, stackFlash.targetTop - 10);
  ctx.restore();
}

  ctx.lineTo(axisX, canvas.height - 28);

  ctx.beginPath();
  ctx.moveTo(mirrorFlash.from.x, beamY);
  ctx.lineTo(mirrorFlash.to.x, beamY);
  ctx.stroke();
  [mirrorFlash.from.x, mirrorFlash.to.x].forEach((x, index) => {
    ctx.globalAlpha = alpha * (index ? 1 : 0.62);
    ctx.beginPath();
    ctx.arc(x, beamY, 10 + progress * 18, 0, Math.PI * 2);

  [
    { t:progress, color:'#ffcf40' },
    { t:1 - progress, color:'#ff66cc' }
  ].forEach(({ t, color }) => {
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.beginPath();
    ctx.arc(firstPosition.x + dx * t, firstPosition.y + dy * t, 6, 0, Math.PI * 2);
