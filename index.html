<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CHAOS ENGINE</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
/* ── RESET & BASE ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#0a0a0a; color:#00ff41;
  font-family:'VT323', monospace; font-size:18px;
  touch-action:none; user-select:none;
  -webkit-user-select:none;
}

/* ── SCANLINE OVERLAY ── */
body::after {
  content:''; position:fixed; inset:0; z-index:9999;
  pointer-events:none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,255,65,0.03) 0px,
    rgba(0,255,65,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
}

/* ── LAYOUT ── */
#app {
  display:flex; flex-direction:column;
  width:100%; height:100%;
}

/* ── TOP BAR ── */
#topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; gap:8px; flex-shrink:0;
  background:#0d1117;
  border-bottom:2px solid #0abdc6;
  box-shadow:0 2px 12px rgba(10,189,198,0.3);
  z-index:10;
}
#topbar .title {
  font-size:28px; color:#00ff41; letter-spacing:4px;
  text-shadow:0 0 10px rgba(0,255,65,0.6);
  white-space:nowrap;
}
#gravity-panel {
  display:flex; align-items:center; gap:6px; flex-wrap:nowrap;
}
#gravity-panel .planet-btn {
  background:#111820; border:1px solid #0abdc6;
  color:#0abdc6; font-family:'VT323',monospace; font-size:16px;
  padding:4px 10px; cursor:pointer; border-radius:2px;
  transition: all .15s;
}
#gravity-panel .planet-btn.active,
#gravity-panel .planet-btn:hover {
  background:#0abdc6; color:#0a0a0a;
  box-shadow:0 0 8px rgba(10,189,198,0.5);
}
#stats {
  font-size:18px; color:#0abdc6; white-space:nowrap;
  text-shadow:0 0 6px rgba(10,189,198,0.4);
}

/* ── CANVAS AREA ── */
#canvas-wrap {
  flex:1; position:relative; overflow:hidden;
  /* CRT curvature */
  border-radius:8px;
  /* subtle barrel distortion via box-shadow inset */
  box-shadow: inset 0 0 60px rgba(0,0,0,0.8), inset 0 0 15px rgba(10,189,198,0.08);
}
#canvas-wrap::before {
  content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
  border-radius:8px;
  box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
}
canvas#game {
  display:block; width:100%; height:100%;
  background:#080c10;
}

/* ── OBJECT TOOLBAR ── */
#toolbar {
  display:flex; align-items:center; justify-content:center;
  gap:4px; padding:6px 8px; flex-shrink:0;
  background:#0d1117;
  border-top:2px solid #0abdc6;
  border-bottom:2px solid #0abdc6;
  box-shadow:0 -2px 12px rgba(10,189,198,0.2);
  overflow-x:auto; flex-wrap:nowrap;
}
.tool-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:64px; height:58px; padding:2px 6px;
  background:#111820; border:2px solid #1a3a2a;
  color:#00ff41; font-family:'VT323',monospace; font-size:13px;
  cursor:pointer; border-radius:3px; transition:all .15s;
  flex-shrink:0;
}
.tool-btn .icon { font-size:24px; line-height:1; }
.tool-btn.active, .tool-btn:hover {
  border-color:#00ff41; background:#0a2a1a;
  box-shadow:0 0 10px rgba(0,255,65,0.3);
}
.tool-btn.draw-btn.active {
  border-color:#ff6600; background:#2a1a0a;
  box-shadow:0 0 10px rgba(255,102,0,0.4);
  color:#ff6600;
}

/* ── CHAOS BUTTONS ── */
#chaos-bar {
  display:flex; align-items:center; justify-content:center;
  gap:4px; padding:6px 8px; flex-shrink:0;
  background:#0d1117;
  border-top:2px solid #00ff41;
  box-shadow:0 -2px 12px rgba(0,255,65,0.15);
}
.chaos-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:68px; height:52px; padding:2px 8px;
  background:#1a0a0a; border:2px solid #ff3333;
  color:#ff3333; font-family:'VT323',monospace; font-size:12px;
  cursor:pointer; border-radius:3px; transition:all .15s;
  flex-shrink:0;
}
.chaos-btn .icon { font-size:20px; line-height:1; }
.chaos-btn:hover, .chaos-btn:active {
  background:#3a0a0a; border-color:#ff6666;
  box-shadow:0 0 12px rgba(255,51,51,0.4);
}
.chaos-btn.safe { border-color:#0abdc6; color:#0abdc6; background:#0a1a1a; }
.chaos-btn.safe:hover { background:#0a2a2a; box-shadow:0 0 12px rgba(10,189,198,0.4); }

/* ── MOBILE TWEAKS ── */
@media(max-width:600px) {
  #topbar .title { font-size:20px; letter-spacing:2px; }
  .tool-btn { min-width:52px; height:50px; font-size:11px; }
  .tool-btn .icon { font-size:20px; }
  .chaos-btn { min-width:56px; height:46px; font-size:11px; }
  #gravity-panel .planet-btn { font-size:13px; padding:3px 6px; }
  #stats { font-size:14px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="title">⚡ CHAOS ENGINE</div>
    <div id="gravity-panel">
      <span style="font-size:14px;color:#0abdc6;">GRAV:</span>
      <button class="planet-btn active" data-gravity="1" data-name="Earth">🌍</button>
      <button class="planet-btn" data-gravity="0.166" data-name="Moon">🌙</button>
      <button class="planet-btn" data-gravity="0.38" data-name="Mars">🔴</button>
      <button class="planet-btn" data-gravity="2.53" data-name="Jupiter">🟠</button>
      <button class="planet-btn" data-gravity="0" data-name="Space">🚀</button>
    </div>
    <div id="stats">
      <span id="planet-name">EARTH</span> |
      OBJ: <span id="obj-count">0</span>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
  </div>

  <!-- OBJECT TOOLBAR -->
  <div id="toolbar">
    <button class="tool-btn active" data-tool="ball"><span class="icon">⚽</span>Ball</button>
    <button class="tool-btn" data-tool="block"><span class="icon">📦</span>Block</button>
    <button class="tool-btn" data-tool="rocket"><span class="icon">🚀</span>Rocket</button>
    <button class="tool-btn" data-tool="car"><span class="icon">🚗</span>Car</button>
    <button class="tool-btn" data-tool="dino"><span class="icon">🦕</span>Dino</button>
    <button class="tool-btn" data-tool="bomb"><span class="icon">💣</span>Bomb</button>
    <button class="tool-btn draw-btn" data-tool="draw"><span class="icon">✏️</span>Draw</button>
  </div>

  <!-- CHAOS BAR -->
  <div id="chaos-bar">
    <button class="chaos-btn" id="btn-explode"><span class="icon">💥</span>EXPLODE</button>
    <button class="chaos-btn" id="btn-quake"><span class="icon">🌋</span>QUAKE</button>
    <button class="chaos-btn" id="btn-wind"><span class="icon">🌪️</span>WIND</button>
    <button class="chaos-btn safe" id="btn-clear"><span class="icon">🗑️</span>CLEAR</button>
    <button class="chaos-btn safe" id="btn-pause"><span class="icon">⏸️</span>PAUSE</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  CHAOS ENGINE — Matter.js 2D Physics Sandbox
// ═══════════════════════════════════════════════

const { Engine, World, Bodies, Body, Composite, Events, Mouse, Vector, Constraint } = Matter;

// ── SETUP ──
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  rebuildWalls();
}

const engine = Engine.create({ enableSleeping: true });
const world = engine.world;
let walls = [];
let paused = false;
let currentTool = 'ball';
let drawMode = false;
let drawPoints = [];
let slingStart = null;
let slingCurrent = null;
let particles = [];
let explosions = [];
let rocketBodies = [];
let shakeOffset = { x: 0, y: 0 };
let shakeIntensity = 0;
let windForce = 0;
let windTimer = 0;
let gravityTarget = 1;

// ── AUDIO ──
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(freq, dur, type='square', vol=0.12) {
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, a.currentTime);
    gain.gain.setValueAtTime(vol, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(); osc.stop(a.currentTime + dur);
  } catch(e) {}
}
function playBoom() {
  try {
    const a = getAudio();
    const buf = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const src = a.createBufferSource();
    src.buffer = buf;
    const gain = a.createGain();
    gain.gain.setValueAtTime(0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.5);
    src.connect(gain); gain.connect(a.destination);
    src.start();
  } catch(e) {}
}
function playBounce() { playSound(200 + Math.random()*300, 0.08, 'sine', 0.08); }
function playSpawn() { playSound(800, 0.1, 'square', 0.06); }

// ── WALLS ──
function rebuildWalls() {
  walls.forEach(w => Composite.remove(world, w));
  const W = canvas.width, H = canvas.height, T = 40;
  const opts = { isStatic: true, restitution: 0.3, friction: 0.5, label: 'wall' };
  walls = [
    Bodies.rectangle(W/2, H + T/2, W + T*2, T, opts),   // floor
    Bodies.rectangle(W/2, -T/2, W + T*2, T, opts),        // ceiling
    Bodies.rectangle(-T/2, H/2, T, H + T*2, opts),        // left
    Bodies.rectangle(W + T/2, H/2, T, H + T*2, opts),     // right
  ];
  Composite.add(world, walls);
}

// ── INIT ──
resize();
window.addEventListener('resize', resize);

// ── GRAVITY BUTTONS ──
document.querySelectorAll('.planet-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gravityTarget = parseFloat(btn.dataset.gravity);
    document.getElementById('planet-name').textContent = btn.dataset.name.toUpperCase();
    playSound(600, 0.15, 'sine', 0.08);
  });
});

// ── TOOL BUTTONS ──
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tool = btn.dataset.tool;
    if (tool === 'draw') {
      drawMode = !drawMode;
      btn.classList.toggle('active', drawMode);
      if (!drawMode) drawPoints = [];
      // Deselect doesn't happen for draw toggle
    } else {
      drawMode = false;
      document.querySelector('.draw-btn').classList.remove('active');
      document.querySelectorAll('.tool-btn:not(.draw-btn)').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTool = tool;
    }
    playSound(1000, 0.05, 'square', 0.05);
  });
});

// ── SPAWN OBJECTS ──
function spawnObject(x, y, vx=0, vy=0) {
  let body;
  const colors = ['#00ff41','#0abdc6','#33ff77','#00ccaa','#66ffcc'];
  const color = colors[Math.floor(Math.random()*colors.length)];

  switch(currentTool) {
    case 'ball': {
      const r = 15 + Math.random()*20;
      body = Bodies.circle(x, y, r, {
        restitution: 0.7 + Math.random()*0.3,
        friction: 0.3, frictionAir: 0.001,
        render: { type:'ball', color, radius:r }
      });
      break;
    }
    case 'block': {
      const s = 30 + Math.random()*25;
      body = Bodies.rectangle(x, y, s, s, {
        restitution: 0.2, friction: 0.6,
        render: { type:'block', color, size:s }
      });
      break;
    }
    case 'rocket': {
      body = Bodies.rectangle(x, y, 18, 50, {
        restitution: 0.1, friction: 0.3, frictionAir: 0.02,
        render: { type:'rocket', color:'#ff6600' }
      });
      rocketBodies.push(body);
      break;
    }
    case 'car': {
      body = createCar(x, y);
      break;
    }
    case 'dino': {
      body = createDino(x, y, color);
      break;
    }
    case 'bomb': {
      body = Bodies.circle(x, y, 18, {
        restitution: 0.3, friction: 0.5,
        render: { type:'bomb', color:'#ff3333' }
      });
      body.isBomb = true;
      break;
    }
  }

  if (body) {
    if (vx || vy) {
      if (body.bodies) {
        // composite
        body.bodies.forEach(b => Body.setVelocity(b, {x:vx, y:vy}));
      } else {
        Body.setVelocity(body, {x:vx, y:vy});
      }
    }
    if (body.bodies) {
      // It's a composite (car)
      Composite.add(world, body);
    } else {
      Composite.add(world, body);
    }
    playSpawn();
  }
  return body;
}

function createCar(x, y) {
  const chassisW = 60, chassisH = 20;
  const wheelR = 10;
  const chassis = Bodies.rectangle(x, y, chassisW, chassisH, {
    friction: 0.5, render: { type:'car-body', color:'#0abdc6' }
  });
  const wheelL = Bodies.circle(x - 20, y + 15, wheelR, {
    friction: 0.8, restitution: 0.3,
    render: { type:'wheel', color:'#00ff41', radius:wheelR }
  });
  const wheelR2 = Bodies.circle(x + 20, y + 15, wheelR, {
    friction: 0.8, restitution: 0.3,
    render: { type:'wheel', color:'#00ff41', radius:wheelR }
  });
  const axleL = Constraint.create({ bodyA: chassis, pointA: {x:-20, y:15}, bodyB: wheelL, stiffness: 0.5, damping: 0.1, length: 0 });
  const axleR = Constraint.create({ bodyA: chassis, pointA: {x:20, y:15}, bodyB: wheelR2, stiffness: 0.5, damping: 0.1, length: 0 });

  const comp = Composite.create();
  Composite.add(comp, [chassis, wheelL, wheelR2, axleL, axleR]);
  return comp;
}

function createDino(x, y, color) {
  // T-Rex-ish shape using vertices
  const scale = 0.7 + Math.random() * 0.4;
  const verts = [
    {x:0, y:-30}, {x:15, y:-30}, {x:20, y:-20}, {x:30, y:-20},
    {x:30, y:-10}, {x:20, y:-10}, {x:20, y:0}, {x:25, y:10},
    {x:25, y:30}, {x:15, y:30}, {x:15, y:15}, {x:5, y:15},
    {x:5, y:30}, {x:-5, y:30}, {x:-5, y:10}, {x:-15, y:0},
    {x:-15, y:-15}, {x:-5, y:-20}
  ].map(v => ({x: v.x * scale, y: v.y * scale}));

  const body = Bodies.fromVertices(x, y, verts, {
    restitution: 0.4, friction: 0.5,
    render: { type:'dino', color }
  });
  return body;
}

// ── BOMB EXPLOSION ──
function explodeBomb(bomb) {
  const pos = bomb.position;
  const radius = 150;
  const force = 0.08;

  // Visual explosion
  explosions.push({ x:pos.x, y:pos.y, r:0, maxR:radius, alpha:1 });
  // Particles
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x: pos.x, y: pos.y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.5 + Math.random()*0.5,
      color: ['#ff3333','#ff6600','#ffaa00','#ff0000'][Math.floor(Math.random()*4)],
      size: 2 + Math.random()*4
    });
  }

  // Apply force to nearby bodies
  const allBodies = Composite.allBodies(world);
  allBodies.forEach(b => {
    if (b.isStatic || b === bomb) return;
    const dx = b.position.x - pos.x;
    const dy = b.position.y - pos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < radius && dist > 0) {
      const strength = force * (1 - dist/radius);
      Body.applyForce(b, b.position, {
        x: (dx/dist) * strength,
        y: (dy/dist) * strength
      });
      Body.setAngularVelocity(b, (Math.random()-0.5)*0.3);
    }
  });

  Composite.remove(world, bomb);
  playBoom();
}

// ── RANDOM EXPLOSION (CHAOS BUTTON) ──
function randomExplosion() {
  const x = 100 + Math.random() * (canvas.width - 200);
  const y = 100 + Math.random() * (canvas.height - 200);
  const radius = 200;
  const force = 0.1;

  explosions.push({ x, y, r:0, maxR:radius, alpha:1 });
  for (let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 8;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.5 + Math.random()*0.8,
      color: ['#ff3333','#ff6600','#ffaa00','#ffffff','#00ff41'][Math.floor(Math.random()*5)],
      size: 2 + Math.random()*5
    });
  }

  const allBodies = Composite.allBodies(world);
  allBodies.forEach(b => {
    if (b.isStatic) return;
    const dx = b.position.x - x;
    const dy = b.position.y - y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < radius && dist > 0) {
      const strength = force * (1 - dist/radius);
      Body.applyForce(b, b.position, {
        x: (dx/dist)*strength, y: (dy/dist)*strength
      });
    }
  });
  playBoom();
  shakeIntensity = 15;
}

// ── CHAOS BUTTONS ──
document.getElementById('btn-explode').addEventListener('click', () => {
  randomExplosion();
});

document.getElementById('btn-quake').addEventListener('click', () => {
  shakeIntensity = 25;
  const allBodies = Composite.allBodies(world);
  allBodies.forEach(b => {
    if (b.isStatic) return;
    Body.applyForce(b, b.position, {
      x: (Math.random()-0.5)*0.05,
      y: -Math.random()*0.05
    });
    Body.setAngularVelocity(b, (Math.random()-0.5)*0.5);
  });
  playBoom();
  playSound(80, 0.4, 'sawtooth', 0.15);
});

document.getElementById('btn-wind').addEventListener('click', () => {
  windForce = (Math.random() > 0.5 ? 1 : -1) * 0.002;
  windTimer = 180; // 3 seconds at 60fps
  playSound(300, 0.3, 'sawtooth', 0.06);
});

document.getElementById('btn-clear').addEventListener('click', () => {
  const allBodies = Composite.allBodies(world);
  allBodies.forEach(b => {
    if (!b.isStatic) Composite.remove(world, b);
  });
  // Remove constraints too
  const allConstraints = Composite.allConstraints(world);
  allConstraints.forEach(c => Composite.remove(world, c));
  // Remove drawn walls (non-boundary statics)
  allBodies.forEach(b => {
    if (b.isStatic && b.label === 'drawn') Composite.remove(world, b);
  });
  rocketBodies = [];
  particles = [];
  explosions = [];
  playSound(400, 0.2, 'sine', 0.1);
});

const pauseBtn = document.getElementById('btn-pause');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.querySelector('.icon').textContent = paused ? '▶️' : '⏸️';
  pauseBtn.querySelector('.icon').nextSibling.textContent = paused ? 'PLAY' : 'PAUSE';
  playSound(paused ? 300 : 600, 0.1, 'square', 0.06);
});

// ── POINTER / TOUCH INPUT ──
function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function getPointerPosFromEnd(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.changedTouches ? e.changedTouches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (canvas.height / rect.height)
  };
}

let pointerDown = false;
let pointerStartTime = 0;

function onDown(e) {
  e.preventDefault();
  const pos = getPointerPos(e);
  pointerDown = true;
  pointerStartTime = Date.now();

  if (drawMode) {
    drawPoints = [pos];
    return;
  }

  // Check if clicking a bomb
  const allBodies = Composite.allBodies(world);
  for (const b of allBodies) {
    if (b.isBomb && Matter.Bounds.contains(b.bounds, pos)) {
      const dx = pos.x - b.position.x;
      const dy = pos.y - b.position.y;
      if (dx*dx + dy*dy < 900) { // ~30px radius
        explodeBomb(b);
        pointerDown = false;
        return;
      }
    }
  }

  slingStart = pos;
  slingCurrent = pos;
}

function onMove(e) {
  e.preventDefault();
  if (!pointerDown) return;
  const pos = getPointerPos(e);

  if (drawMode) {
    drawPoints.push(pos);
    return;
  }

  slingCurrent = pos;
}

function onUp(e) {
  e.preventDefault();
  if (!pointerDown) return;
  pointerDown = false;
  const pos = getPointerPosFromEnd(e);

  if (drawMode && drawPoints.length > 1) {
    // Create static wall segments from drawn points
    // Simplify points
    const simplified = simplifyPath(drawPoints, 8);
    for (let i = 0; i < simplified.length - 1; i++) {
      const p1 = simplified[i], p2 = simplified[i+1];
      const mx = (p1.x + p2.x)/2, my = (p1.y + p2.y)/2;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len < 5) continue;
      const angle = Math.atan2(dy, dx);
      const seg = Bodies.rectangle(mx, my, len, 6, {
        isStatic: true, angle,
        friction: 0.5, restitution: 0.3,
        label: 'drawn',
        render: { type:'drawn', color:'#ff6600' }
      });
      Composite.add(world, seg);
    }
    playSound(500, 0.1, 'sine', 0.06);
    drawPoints = [];
    return;
  }

  if (slingStart) {
    const dx = slingStart.x - pos.x;
    const dy = slingStart.y - pos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 10) {
      // Simple tap — spawn at location
      spawnObject(slingStart.x, slingStart.y);
    } else {
      // Slingshot launch
      const power = Math.min(dist / 15, 25);
      const vx = (dx / dist) * power;
      const vy = (dy / dist) * power;
      spawnObject(slingStart.x, slingStart.y, vx, vy);
    }
  }

  slingStart = null;
  slingCurrent = null;
}

function simplifyPath(points, tolerance) {
  if (points.length < 3) return points;
  const result = [points[0]];
  let last = points[0];
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - last.x;
    const dy = points[i].y - last.y;
    if (dx*dx + dy*dy > tolerance*tolerance) {
      result.push(points[i]);
      last = points[i];
    }
  }
  result.push(points[points.length-1]);
  return result;
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp, {passive:false});

// ── COLLISION EVENTS ──
Events.on(engine, 'collisionStart', (e) => {
  e.pairs.forEach(pair => {
    const velA = pair.bodyA.velocity || {x:0,y:0};
    const velB = pair.bodyB.velocity || {x:0,y:0};
    const relVel = Math.sqrt(
      Math.pow(velA.x-velB.x,2) + Math.pow(velA.y-velB.y,2)
    );
    if (relVel > 2) {
      // Spark particles at collision point
      const contact = pair.collision.supports && pair.collision.supports[0]
        ? pair.collision.supports[0] : pair.bodyA.position;
      const px = contact.x || pair.bodyA.position.x;
      const py = contact.y || pair.bodyA.position.y;
      const count = Math.min(Math.floor(relVel), 8);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x: px, y: py,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.2 + Math.random()*0.3,
          color: '#00ff41',
          size: 1 + Math.random()*2
        });
      }
      if (relVel > 3) playBounce();
    }
  });
});

// ── RENDERING ──
function drawBody(b) {
  const r = b.render || {};
  const type = r.type || 'default';
  const color = r.color || '#00ff41';

  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);

  switch(type) {
    case 'ball': {
      const radius = r.radius || 20;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = color + '33';
      ctx.fill();
      // Inner ring
      ctx.beginPath();
      ctx.arc(0, 0, radius*0.5, 0, Math.PI*2);
      ctx.strokeStyle = color + '88';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'block': {
      const s = r.size || 30;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.fillStyle = color + '22';
      ctx.fillRect(-s/2, -s/2, s, s);
      // Cross
      ctx.beginPath();
      ctx.moveTo(-s/2, -s/2); ctx.lineTo(s/2, s/2);
      ctx.moveTo(s/2, -s/2); ctx.lineTo(-s/2, s/2);
      ctx.strokeStyle = color + '44';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'rocket': {
      // Body
      ctx.fillStyle = '#ff660044';
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -25);
      ctx.lineTo(9, -10);
      ctx.lineTo(9, 20);
      ctx.lineTo(13, 25);
      ctx.lineTo(-13, 25);
      ctx.lineTo(-9, 20);
      ctx.lineTo(-9, -10);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // Flame
      if (!b.isSleeping) {
        const flicker = 5 + Math.random()*10;
        ctx.fillStyle = `rgba(255,${100+Math.random()*155},0,0.8)`;
        ctx.beginPath();
        ctx.moveTo(-6, 25);
        ctx.lineTo(0, 25 + flicker);
        ctx.lineTo(6, 25);
        ctx.fill();
      }
      break;
    }
    case 'car-body': {
      ctx.fillStyle = color + '33';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-30, -10, 60, 20);
      ctx.fillRect(-30, -10, 60, 20);
      // Window
      ctx.strokeStyle = color + 'aa';
      ctx.strokeRect(-15, -8, 20, 10);
      break;
    }
    case 'wheel': {
      const wr = r.radius || 10;
      ctx.beginPath();
      ctx.arc(0, 0, wr, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Spoke
      ctx.beginPath();
      ctx.moveTo(0, -wr); ctx.lineTo(0, wr);
      ctx.strokeStyle = color + '88';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'bomb': {
      // Dynamite stick body
      const stickW = 14, stickH = 36;
      ctx.fillStyle = '#cc2200';
      ctx.fillRect(-stickW/2, -stickH/2, stickW, stickH);
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 2;
      ctx.strokeRect(-stickW/2, -stickH/2, stickW, stickH);
      // Darker end caps
      ctx.fillStyle = '#991100';
      ctx.fillRect(-stickW/2, -stickH/2, stickW, 5);
      ctx.fillRect(-stickW/2, stickH/2 - 5, stickW, 5);
      // TNT label
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('T', 0, -6);
      ctx.fillText('N', 0, 3);
      ctx.fillText('T', 0, 12);
      ctx.restore();
      // Fuse coming out the top
      ctx.beginPath();
      ctx.moveTo(0, -stickH/2);
      ctx.quadraticCurveTo(8, -stickH/2 - 10, 5, -stickH/2 - 16);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Spark on fuse tip
      const sparkSize = 2 + Math.random()*3;
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.arc(5, -stickH/2 - 16, sparkSize, 0, Math.PI*2);
      ctx.fill();
      // Extra spark glow
      ctx.fillStyle = `rgba(255,200,0,${0.3 + Math.random()*0.3})`;
      ctx.beginPath();
      ctx.arc(5, -stickH/2 - 16, sparkSize + 3, 0, Math.PI*2);
      ctx.fill();
      break;
    }
    case 'drawn': {
      // Draw the rectangle
      const w = b.bounds.max.x - b.bounds.min.x;
      const h = b.bounds.max.y - b.bounds.min.y;
      // Use vertices for drawn segments
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let i = 1; i < verts.length; i++) {
        ctx.lineTo(verts[i].x, verts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#ff660066';
      ctx.fill();
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      return;
    }
    case 'dino': {
      // Draw vertices as polygon
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let i = 1; i < verts.length; i++) {
        ctx.lineTo(verts[i].x, verts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = color + '44';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Eye
      ctx.fillStyle = '#ff0000';
      const cx = b.position.x + 5, cy = b.position.y - 10;
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      return;
    }
    default: {
      // Generic polygon
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      if (verts && verts.length) {
        ctx.beginPath();
        ctx.moveTo(verts[0].x, verts[0].y);
        for (let i = 1; i < verts.length; i++) {
          ctx.lineTo(verts[i].x, verts[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = '#00ff4122';
        ctx.fill();
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
  }
  ctx.restore();
}

function drawWalls() {
  ctx.strokeStyle = '#0abdc644';
  ctx.lineWidth = 2;
  walls.forEach(w => {
    const v = w.vertices;
    ctx.beginPath();
    ctx.moveTo(v[0].x, v[0].y);
    for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath();
    ctx.stroke();
  });

  // Floor indicator line
  if (walls[0]) {
    const floorY = walls[0].position.y - 20;
    ctx.strokeStyle = '#0abdc6';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(0, floorY);
    ctx.lineTo(canvas.width, floorY);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawConstraints() {
  const constraints = Composite.allConstraints(world);
  constraints.forEach(c => {
    if (!c.bodyA || !c.bodyB) return;
    const pA = Vector.add(c.bodyA.position, Vector.rotate(c.pointA, c.bodyA.angle));
    const pB = Vector.add(c.bodyB.position, Vector.rotate(c.pointB, c.bodyB.angle));
    ctx.beginPath();
    ctx.moveTo(pA.x, pA.y);
    ctx.lineTo(pB.x, pB.y);
    ctx.strokeStyle = '#0abdc688';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function drawSlingshot() {
  if (!slingStart || !slingCurrent || drawMode) return;
  const dx = slingStart.x - slingCurrent.x;
  const dy = slingStart.y - slingCurrent.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 10) return;

  // Direction line
  ctx.beginPath();
  ctx.moveTo(slingStart.x, slingStart.y);
  ctx.lineTo(slingStart.x + dx*0.5, slingStart.y + dy*0.5);
  ctx.strokeStyle = '#00ff41';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Power indicator
  const power = Math.min(dist / 15, 25);
  ctx.fillStyle = '#00ff41';
  ctx.font = '16px VT323';
  ctx.fillText(`PWR: ${Math.round(power)}`, slingStart.x + 15, slingStart.y - 15);

  // Launch dot
  ctx.beginPath();
  ctx.arc(slingStart.x, slingStart.y, 6, 0, Math.PI*2);
  ctx.fillStyle = '#00ff4188';
  ctx.fill();
  ctx.strokeStyle = '#00ff41';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Rubber band lines
  ctx.beginPath();
  ctx.moveTo(slingCurrent.x, slingCurrent.y);
  ctx.lineTo(slingStart.x, slingStart.y);
  ctx.strokeStyle = '#ff660088';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawDrawing() {
  if (!drawMode || drawPoints.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
  for (let i = 1; i < drawPoints.length; i++) {
    ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
  }
  ctx.strokeStyle = '#ff6600';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1; // gravity on particles
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.r += (ex.maxR - ex.r) * 0.15;
    ex.alpha -= dt * 2;
    if (ex.alpha <= 0) { explosions.splice(i, 1); continue; }
    ctx.globalAlpha = ex.alpha * 0.4;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2);
    ctx.fillStyle = '#ff6600';
    ctx.fill();
    ctx.globalAlpha = ex.alpha * 0.6;
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawWindIndicator() {
  if (windTimer <= 0) return;
  const dir = windForce > 0 ? '→' : '←';
  ctx.fillStyle = '#0abdc6';
  ctx.font = '24px VT323';
  ctx.textAlign = 'center';
  ctx.fillText(`WIND ${dir}${dir}${dir}`, canvas.width/2, 40);
  ctx.textAlign = 'left';
}

function drawGrid() {
  ctx.strokeStyle = '#0a1a1a';
  ctx.lineWidth = 0.5;
  const step = 50;
  for (let x = 0; x < canvas.width; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

// ── MAIN LOOP ──
let lastTime = 0;

function loop(timestamp) {
  requestAnimationFrame(loop);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Smooth gravity transition
  const currentG = engine.gravity.y;
  engine.gravity.y += (gravityTarget - currentG) * 0.05;

  // Wind
  if (windTimer > 0) {
    windTimer--;
    const allBodies = Composite.allBodies(world);
    allBodies.forEach(b => {
      if (!b.isStatic) Body.applyForce(b, b.position, {x: windForce, y: 0});
    });
  }

  // Rocket thrust
  rocketBodies = rocketBodies.filter(r => {
    if (!Composite.get(world, r.id, 'body')) return false;
    if (!r.isSleeping) {
      Body.applyForce(r, r.position, {
        x: Math.sin(r.angle) * 0.002,
        y: -Math.cos(r.angle) * 0.002
      });
    }
    return true;
  });

  // Shake
  if (shakeIntensity > 0) {
    shakeOffset.x = (Math.random()-0.5) * shakeIntensity;
    shakeOffset.y = (Math.random()-0.5) * shakeIntensity;
    shakeIntensity *= 0.92;
    if (shakeIntensity < 0.5) shakeIntensity = 0;
  } else {
    shakeOffset.x = 0;
    shakeOffset.y = 0;
  }

  // Physics step
  if (!paused) {
    Engine.update(engine, 1000/60);
  }

  // Update object count
  const allBodies = Composite.allBodies(world);
  const dynamicCount = allBodies.filter(b => !b.isStatic).length;
  document.getElementById('obj-count').textContent = dynamicCount;

  // ── RENDER ──
  ctx.save();
  ctx.translate(shakeOffset.x, shakeOffset.y);

  // Clear
  ctx.fillStyle = '#080c10';
  ctx.fillRect(-10, -10, canvas.width+20, canvas.height+20);

  // Grid
  drawGrid();

  // Walls
  drawWalls();

  // Constraints (car axles)
  drawConstraints();

  // Bodies
  allBodies.forEach(b => {
    if (b.label === 'wall') return;
    drawBody(b);
  });

  // Effects
  drawExplosions(dt);
  drawParticles(dt);
  drawSlingshot();
  drawDrawing();
  drawWindIndicator();

  // Draw mode indicator
  if (drawMode) {
    ctx.fillStyle = '#ff6600';
    ctx.font = '20px VT323';
    ctx.fillText('✏️ DRAW MODE — draw walls & ramps!', 15, 30);
  }

  // Pause overlay
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = '48px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ PAUSED', canvas.width/2, canvas.height/2);
    ctx.textAlign = 'left';
  }

  ctx.restore();
}

requestAnimationFrame(loop);

console.log('⚡ CHAOS ENGINE initialized');
</script>
