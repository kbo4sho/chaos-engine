function drawTethers(timestamp) {
  tethers.forEach(tether => {
    if (!Composite.get(world, tether.constraint.id, 'constraint')) return;
    const anchor = getConstraintWorldPoint(tether.constraint, 'A');
    const bodyPoint = getConstraintWorldPoint(tether.constraint, 'B');
    const dx = bodyPoint.x - anchor.x;
    const dy = bodyPoint.y - anchor.y;
    const distance = Math.hypot(dx, dy) || 1;
    const nx = -dy / distance;
    const ny = dx / distance;
    const segments = Math.max(8, Math.min(20, Math.round(distance / 16)));
    const pulse = 0.78 + Math.sin(timestamp / 120 + tether.body.id) * 0.18;

    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#ff7ad9';
    ctx.shadowColor = '#ff7ad9';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(anchor.x, anchor.y);
    for (let i = 1; i < segments; i++) {
      const t = i / segments;
      const wave = Math.sin(t * Math.PI * segments) * 4;
      ctx.lineTo(anchor.x + dx * t + nx * wave, anchor.y + dy * t + ny * wave);
    }
    ctx.lineTo(bodyPoint.x, bodyPoint.y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.translate(anchor.x, anchor.y);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#111820';
    ctx.strokeStyle = '#65f7ff';
    ctx.lineWidth = 3;
    ctx.fillRect(-8, -8, 16, 16);
    ctx.strokeRect(-8, -8, 16, 16);
    ctx.rotate(-Math.PI / 4);
    ctx.fillStyle = '#65f7ff';
    ctx.font = '14px VT323';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('T', 0, 1);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#ffcf40';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bodyPoint.x, bodyPoint.y, 7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });

  if (!tetherSelection || currentTool !== 'tether') return;
  if (!Composite.get(world, tetherSelection.body.id, 'body')) {
    resetTetherSelection(true);
    return;
  }
  const point = Vector.add(tetherSelection.body.position, Vector.rotate(tetherSelection.point, tetherSelection.body.angle));
  const pulse = 0.72 + Math.sin(timestamp / 100 + tetherSelection.body.id) * 0.22;
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = '#ff7ad9';
  ctx.fillStyle = '#ff7ad9';
  ctx.shadowColor = '#ff7ad9';
  ctx.shadowBlur = 14;
  ctx.lineWidth = 3;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(point.x, point.y, 18, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.font = '18px VT323';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('A', point.x, point.y + 1);
  ctx.restore();
}

function drawWeldMarker(timestamp) {
  if (!weldSelection || currentTool !== 'weld') return;
  if (!Composite.get(world, weldSelection.body.id, 'body')) {
    resetWeldSelection(true);
    return;
  }
  const body = weldSelection.body;
  const worldPoint = Vector.add(body.position, Vector.rotate(weldSelection.point, body.angle));
  const pulse = 0.72 + Math.sin(timestamp / 105 + body.id) * 0.2;
  ctx.save();
  ctx.translate(worldPoint.x, worldPoint.y);
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = '#ffb347';
  ctx.fillStyle = '#ffb347';
  ctx.shadowColor = '#ffb347';
  ctx.shadowBlur = 14;
  ctx.lineWidth = 3;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.font = '18px VT323';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('A', 0, 1);
  ctx.restore();
}

function drawLaunchMarker(timestamp) {
  if (launchBody && currentTool === 'launch') {
    if (!Composite.get(world, launchBody.id, 'body')) {
      resetLaunchSelection(true);
    } else {
      const pulse = 0.72 + Math.sin(timestamp / 100 + launchBody.id) * 0.2;
      const halfW = (launchBody.bounds.max.x - launchBody.bounds.min.x) / 2;
      const halfH = (launchBody.bounds.max.y - launchBody.bounds.min.y) / 2;
      const radius = Math.max(25, Math.min(70, Math.hypot(halfW, halfH) + 13));
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#ff5c8a';
      ctx.fillStyle = '#ff5c8a';
      ctx.shadowColor = '#ff5c8a';
      ctx.shadowBlur = 14;
      ctx.lineWidth = 3;
      ctx.setLineDash([7, 5]);
      ctx.beginPath();
      ctx.arc(launchBody.position.x, launchBody.position.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      if (launchAimPoint) {
        ctx.beginPath();
        ctx.moveTo(launchBody.position.x, launchBody.position.y);
        ctx.lineTo(launchAimPoint.x, launchAimPoint.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(launchAimPoint.x, launchAimPoint.y, 11, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.font = '18px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('AIM', launchBody.position.x, launchBody.position.y + 1);
      ctx.restore();
    }
  }

  if (!launchFlash) return;
  const progress = Math.max(0, (timestamp - launchFlash.startedAt) / 550);
  if (progress >= 1) {
    launchFlash = null;
    return;
  }
  const alpha = 1 - progress;
  const dx = launchFlash.to.x - launchFlash.from.x;
  const dy = launchFlash.to.y - launchFlash.from.y;
  const angle = Math.atan2(dy, dx);
  const tipX = launchFlash.from.x + dx * Math.min(1, progress * 2.2);
  const tipY = launchFlash.from.y + dy * Math.min(1, progress * 2.2);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#ff5c8a';
  ctx.fillStyle = '#ffdd55';
  ctx.shadowColor = '#ff5c8a';
  ctx.shadowBlur = 14;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(launchFlash.from.x, launchFlash.from.y);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  ctx.translate(tipX, tipY);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-14, -7);
  ctx.lineTo(-14, 7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBlinkMarker(timestamp) {
  if (blinkBody && currentTool === 'blink') {
    if (!Composite.get(world, blinkBody.id, 'body')) {
      resetBlinkSelection(true);
    } else {
      const halfWidth = (blinkBody.bounds.max.x - blinkBody.bounds.min.x) / 2;
      const halfHeight = (blinkBody.bounds.max.y - blinkBody.bounds.min.y) / 2;
      const radius = Math.max(24, Math.min(68, Math.hypot(halfWidth, halfHeight) + 12));
      const pulse = 0.72 + Math.sin(timestamp / 95) * 0.2;
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#66ffff';
      ctx.fillStyle = '#66ffff';
      ctx.shadowColor = '#66ffff';
      ctx.shadowBlur = 14;
      ctx.lineWidth = 3;
      ctx.setLineDash([4, 5]);
      ctx.beginPath();
      ctx.arc(blinkBody.position.x, blinkBody.position.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      if (blinkAimPoint) {
        ctx.beginPath();
        ctx.moveTo(blinkBody.position.x, blinkBody.position.y);
        ctx.lineTo(blinkAimPoint.x, blinkAimPoint.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(blinkAimPoint.x, blinkAimPoint.y, 13, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(blinkAimPoint.x - 18, blinkAimPoint.y);
        ctx.lineTo(blinkAimPoint.x + 18, blinkAimPoint.y);
        ctx.moveTo(blinkAimPoint.x, blinkAimPoint.y - 18);
        ctx.lineTo(blinkAimPoint.x, blinkAimPoint.y + 18);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.font = '18px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚡', blinkBody.position.x, blinkBody.position.y + 1);
      ctx.restore();
    }
  }

  if (!blinkFlash) return;
  const progress = Math.max(0, (timestamp - blinkFlash.startedAt) / 600);
  if (progress >= 1) {
    blinkFlash = null;
    return;
  }
  const alpha = 1 - progress;
  const radius = 10 + progress * 48;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 4;
  ctx.shadowBlur = 16;
  [
    { point:blinkFlash.from, color:'#ff66ff', rotation:-progress * Math.PI * 2 },
    { point:blinkFlash.to, color:'#66ffff', rotation:progress * Math.PI * 2 }
  ].forEach(({ point, color, rotation }) => {
    ctx.save();
    ctx.translate(point.x, point.y);
    ctx.rotate(rotation);
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.setLineDash([10, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
  ctx.restore();
}

function drawSquashFlash(timestamp) {
  if (!squashFlash) return;
  const { body, mode, startedAt } = squashFlash;
  if (!Composite.get(world, body.id, 'body')) {
    squashFlash = null;
    return;
  }

  const progress = Math.max(0, (timestamp - startedAt) / 650);
  if (progress >= 1) {
    squashFlash = null;
    return;
  }

  const halfWidth = (body.bounds.max.x - body.bounds.min.x) / 2 + 8 + progress * 8;
  const halfHeight = (body.bounds.max.y - body.bounds.min.y) / 2 + 8 + progress * 8;
  const horizontal = mode !== 'tall';
  const color = mode === 'normal' ? '#ffffff' : (horizontal ? '#9cff57' : '#ff9cf7');
  const arrow = 10 + progress * 8;
  ctx.save();
  ctx.translate(body.position.x, body.position.y);
  ctx.globalAlpha = 1 - progress;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 4]);
  ctx.strokeRect(-halfWidth, -halfHeight, halfWidth * 2, halfHeight * 2);
  ctx.setLineDash([]);
  [-1, 1].forEach(side => {
    ctx.save();
    ctx.translate(horizontal ? side * halfWidth : 0, horizontal ? 0 : side * halfHeight);
    ctx.rotate(horizontal ? (side < 0 ? Math.PI : 0) : (side < 0 ? -Math.PI / 2 : Math.PI / 2));
    ctx.beginPath();
    ctx.moveTo(arrow, 0);
    ctx.lineTo(0, -6);
    ctx.lineTo(0, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
  ctx.font = 'bold 16px VT323';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(mode === 'wide' ? 'W' : (mode === 'tall' ? 'T' : '1:1'), 0, 1);
  ctx.restore();
}

function drawPulseBursts(timestamp) {
  pulseBursts = pulseBursts.filter(pulse => {
    const progress = Math.max(0, (timestamp - pulse.startedAt) / 720);
    if (progress >= 1) return false;
    const eased = 1 - Math.pow(1 - progress, 3);
    const radius = 10 + PULSE_RADIUS * eased;
    const alpha = 1 - progress;

    ctx.save();
    ctx.translate(pulse.x, pulse.y);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#35f2ff';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#35f2ff';
    ctx.shadowBlur = 18;
    ctx.lineWidth = 4 - progress * 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = alpha * 0.65;
    ctx.strokeStyle = '#ff4de1';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 7]);
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(5, radius - 14), 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.globalAlpha = alpha;
    ctx.rotate(Math.PI / 4 + progress * 0.7);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(-6, -6, 12, 12);
    ctx.rotate(-Math.PI / 4 - progress * 0.7);
    if (pulse.hitCount > 0 && progress < 0.55) {
      ctx.font = 'bold 17px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`×${pulse.hitCount}`, 0, -22 - progress * 15);
    }
    ctx.restore();
    return true;
  });
}

function drawCurveFlash(timestamp) {
  if (!curveFlash) return;
  const { body, direction, fromVelocity, startedAt } = curveFlash;
  if (!Composite.get(world, body.id, 'body')) {
    curveFlash = null;
    return;
  }
  const progress = Math.max(0, (timestamp - startedAt) / 680);
  if (progress >= 1) {
    curveFlash = null;
    return;
  }

  const fromAngle = Math.atan2(fromVelocity.y, fromVelocity.x);
  const radius = Math.max(28, Math.min(64, Math.hypot(fromVelocity.x, fromVelocity.y) * 2.5 + 24));
  const alpha = 1 - progress;
  const color = direction === 1 ? '#59e3ff' : '#ff6bb5';
  const sweep = direction * Math.PI / 2;
  const endAngle = fromAngle + sweep;

  ctx.save();
  ctx.translate(body.position.x, body.position.y);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.lineWidth = 3;
  ctx.setLineDash([7, 4]);
  ctx.beginPath();
  ctx.arc(0, 0, radius + progress * 12, fromAngle, endAngle, direction < 0);
  ctx.stroke();
  ctx.setLineDash([]);
  const arrowRadius = radius + progress * 12;
  ctx.translate(Math.cos(endAngle) * arrowRadius, Math.sin(endAngle) * arrowRadius);
  ctx.rotate(endAngle + (direction === 1 ? Math.PI / 2 : -Math.PI / 2));
  ctx.beginPath();
  ctx.moveTo(8, 0);
  ctx.lineTo(-5, -6);
  ctx.lineTo(-5, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawSwirlBursts(timestamp) {
  swirlBursts = swirlBursts.filter(swirl => {
    const progress = Math.max(0, (timestamp - swirl.startedAt) / 760);
    if (progress >= 1) return false;
    const eased = 1 - Math.pow(1 - progress, 3);
    const alpha = 1 - progress;
    const color = swirl.direction === 1 ? '#b86cff' : '#ff9f43';

    ctx.save();
    ctx.translate(swirl.x, swirl.y);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.lineWidth = 3.5 - progress * 2;
    ctx.setLineDash([8, 5]);
    for (let ring = 0; ring < 3; ring++) {
      const radius = 18 + eased * (SWIRL_RADIUS * (0.34 + ring * 0.23));
      const start = swirl.direction * (progress * 2.8 + ring * 1.55);
      ctx.beginPath();
      ctx.arc(0, 0, radius, start, start + swirl.direction * Math.PI * 1.28, swirl.direction < 0);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.rotate(swirl.direction * progress * Math.PI * 1.5);
    ctx.font = 'bold 22px VT323';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(swirl.direction === 1 ? '↻' : '↺', 0, 1);
    if (swirl.hitCount > 0 && progress < 0.55) {
      ctx.font = 'bold 17px VT323';
      ctx.fillText(`×${swirl.hitCount}`, 0, -27 - progress * 12);
    }
    ctx.restore();
    return true;
  });
}

function drawRotateFlash(timestamp) {
  if (!rotateFlash) return;

// ── MAIN LOOP ──
let lastTime = 0;

function loop(timestamp) {
  requestAnimationFrame(loop);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  pruneStruts();
  pruneHinges();
  pruneSprings();
  pruneWelds();
  pruneTethers();
  prunePivots();
  pruneWebTraps();
  prunePinwheels();

  // Smooth gravity transition (skip during anti-grav pulse and gravity flip)
  if (!antiGravActive && gravityAngle === 0) {
    const currentG = engine.gravity.y;
    engine.gravity.y += (gravityTarget - currentG) * 0.05;
  }

  // Wind
  if (windTimer > 0) {
    windTimer--;
    const allBodies = Composite.allBodies(world);
    allBodies.forEach(b => {
      if (!b.isStatic) Body.applyForce(b, b.position, {x: windForce, y: 0});
    });
  }

  // Flippers snap to their fired angle, then spring back to rest.
  flippers = flippers.filter(f => {
    if (!Composite.get(world, f.body.id, 'body')) return false;
    const active = f.activeFrames > 0;
    if (active && !paused) f.activeFrames--;
    const targetVelocity = getFlipperAngularVelocity(f.side, f.body.angle, active);
    Body.setAngularVelocity(f.body, targetVelocity);
    return true;
  });

  // Persistent per-object motors recover their target speed after collisions.
  motorizedBodies.forEach((direction, b) => {
    if (!Composite.get(world, b.id, 'body')) {
      motorizedBodies.delete(b);
      return;
    }
    if (b.isStatic) return;
    const targetSpeed = direction * 0.24;
    Body.setAngularVelocity(b, b.angularVelocity + (targetSpeed - b.angularVelocity) * 0.35);
  });

  // Ocean mode — water drag + bubbles
  if (oceanMode) {
    const allOcean = Composite.allBodies(world);
    allOcean.forEach(b => {
      if (b.isStatic) return;
      // Water drag: opposing force proportional to velocity
      const drag = 0.0008;
      Body.applyForce(b, b.position, {
        x: -b.velocity.x * drag * b.mass,
        y: -b.velocity.y * drag * b.mass
      });
    });
    // Spawn bubble particles from bottom
    if (Math.random() < 0.3) {
      oceanBubbles.push({
        x: Math.random() * canvas.width,
        y: canvas.height + 5,
        r: 2 + Math.random() * 5,
        speed: 0.5 + Math.random() * 1.5,
        wobble: Math.random() * Math.PI * 2,
        alpha: 0.3 + Math.random() * 0.4
      });
    }
    // Update bubbles
    for (let i = oceanBubbles.length - 1; i >= 0; i--) {
      const bub = oceanBubbles[i];
      bub.y -= bub.speed;
      bub.x += Math.sin(bub.wobble + bub.y * 0.02) * 0.3;
      if (bub.y < -10) oceanBubbles.splice(i, 1);
    }
  }

  // Balloon buoyancy — float upward
  const allBalloons = Composite.allBodies(world);
  allBalloons.forEach(b => {
    if (b.isBalloon && !b.isStatic) {
      // Upward force (anti-gravity + extra lift)
      const lift = -0.0008 - engine.gravity.y * b.mass * 0.0012;
      Body.applyForce(b, b.position, { x: 0, y: lift });
      // Gentle sideways drift
      const drift = Math.sin(timestamp / 800 + b.position.x * 0.01) * 0.00005;
      Body.applyForce(b, b.position, { x: drift, y: 0 });
    }
  });

  // Anti-gravity pulse
  if (antiGravActive && antiGravTimer > 0) {
    antiGravTimer--;
    engine.gravity.y = -0.5; // reversed gravity
    // Floating sparkle particles
    if (antiGravTimer % 8 === 0) {
      particles.push({
        x: Math.random() * canvas.width,
        y: canvas.height * 0.6 + Math.random() * canvas.height * 0.4,
        vx: (Math.random()-0.5)*1.5,
        vy: -(1 + Math.random()*3),
        life: 0.6 + Math.random()*0.6,
        color: ['#0abdc6','#cc00ff','#00ff41'][Math.floor(Math.random()*3)],
        size: 1 + Math.random()*2
      });
    }
    if (antiGravTimer <= 0) {
      antiGravActive = false;
      // Snap gravity back — the "drop" is the fun part
      engine.gravity.y = gravityTarget;
      shakeIntensity = 12;
      playBoom();
    }
  }

  // Black hole
  if (blackHoleActive && blackHoleTimer > 0) {
    blackHoleTimer--;
    const allBH = Composite.allBodies(world);
    allBH.forEach(b => {
      if (b.isStatic) return;
      const dx = blackHolePos.x - b.position.x;
      const dy = blackHolePos.y - b.position.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 5) {
        const strength = 0.004 / Math.max(dist/200, 0.3);
        Body.applyForce(b, b.position, {
          x: (dx/dist) * strength,
          y: (dy/dist) * strength
        });
      }
      // Spaghettification spin
      if (dist < 80) {
        Body.setAngularVelocity(b, b.angularVelocity + (Math.random()-0.5)*0.05);
      }
    });
    if (blackHoleTimer % 10 === 0) shakeIntensity = Math.max(shakeIntensity, 3);
    if (blackHoleTimer <= 0) {
      blackHoleActive = false;
      // Final burst — everything gets flung outward
      allBH.forEach(b => {
        if (b.isStatic) return;
        const dx = b.position.x - blackHolePos.x;
        const dy = b.position.y - blackHolePos.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 0) {
          Body.applyForce(b, b.position, {
            x: (dx/dist) * 0.05,
            y: (dy/dist) * 0.05
          });
        }
      });
      shakeIntensity = 20;
      playBoom();
      // Burst particles
      for (let i = 0; i < 50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 8;
        particles.push({
          x: blackHolePos.x, y: blackHolePos.y,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.5 + Math.random()*1,
          color: ['#9900ff','#6600cc','#cc00ff','#0abdc6','#ffffff'][Math.floor(Math.random()*5)],
          size: 2 + Math.random()*4
        });
      }
    }
  }
  if (blackHoleAlpha > 0 && !blackHoleActive) {
    blackHoleAlpha -= dt * 2;
    if (blackHoleAlpha < 0) blackHoleAlpha = 0;
  }

  // Rocket thrust
  rocketBodies = rocketBodies.filter(r => {
    if (!Composite.get(world, r.id, 'body')) return false;
    if (!r.isSleeping) {
      Body.applyForce(r, r.position, {
        x: Math.sin(r.angle) * 0.002,
        y: -Math.cos(r.angle) * 0.002
      });
    }
    return true;
  });

  // Time warp (slow-motion)
  if (timeWarpActive && timeWarpTimer > 0) {
    timeWarpTimer--;
    if (timeWarpTimer <= 0) {
      timeWarpActive = false;
      // Speed resume burst
      shakeIntensity = 10;
      playSound(800, 0.15, 'sine', 0.1);
      playSound(1200, 0.2, 'square', 0.06);
    }
  }

  // Portal teleportation
  if (portals.length === 2) {
    // Decay cooldowns
    portalCooldowns.forEach((val, key) => {
      if (val <= 0) portalCooldowns.delete(key);
      else portalCooldowns.set(key, val - 1);
    });

    const allPortalBodies = Composite.allBodies(world);
    allPortalBodies.forEach(b => {
      if (b.isStatic) return;
      if (portalCooldowns.has(b.id)) return;
      for (let pi = 0; pi < 2; pi++) {
        const portal = portals[pi];
        const other = portals[portal.partner];
        const dx = b.position.x - portal.x;
        const dy = b.position.y - portal.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < portal.radius) {
          // Teleport!
          Body.setPosition(b, { x: other.x, y: other.y });
          // Preserve velocity direction but add a small outward push
          const speed = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
          Body.setVelocity(b, { x: b.velocity.x * 1.1, y: b.velocity.y * 1.1 });
          portalCooldowns.set(b.id, 30); // cooldown to prevent ping-pong
          // Teleport particles at exit
          for (let i = 0; i < 10; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = 1 + Math.random() * 3;
            particles.push({
              x: other.x, y: other.y,
              vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
              life: 0.3 + Math.random()*0.3,
              color: other.color,
              size: 2 + Math.random()*2
            });
          }
          playSound(1000 + Math.random()*500, 0.1, 'sine', 0.06);
          break; // only teleport through one portal per frame
        }
      }
    });
  }

  // Clean up wrecking balls
  wreckingBalls = wreckingBalls.filter(wb => Composite.get(world, wb.ball.id, 'body'));

  // Bumper flash decay
  bumpers = bumpers.filter(bmp => Composite.get(world, bmp.id, 'body'));
  bumpers.forEach(bmp => {
    if (bmp.hitFlash > 0) bmp.hitFlash -= dt * 5;
    if (bmp.hitFlash < 0) bmp.hitFlash = 0;
  });

  // Mega bounce timer
  if (megaBounceActive && megaBounceTimer > 0) {
    megaBounceTimer--;
    // Apply to newly spawned objects too
    const allMB = Composite.allBodies(world);
    allMB.forEach(b => {
      if (!b.isStatic && !megaBounceOriginal.has(b.id)) {
        megaBounceOriginal.set(b.id, b.restitution);
        b.restitution = 1.2;
      }
    });
    if (megaBounceTimer <= 0) {
      megaBounceActive = false;
      // Restore original restitution
      const allRestore = Composite.allBodies(world);
      allRestore.forEach(b => {
        if (megaBounceOriginal.has(b.id)) {
          b.restitution = megaBounceOriginal.get(b.id);
        }
      });
      walls.forEach(w => { w.restitution = 0.3; });
      megaBounceOriginal.clear();
      playSound(300, 0.2, 'sine', 0.08);
    }
  }

  // Vortex
  if (vortexActive && vortexTimer > 0) {
    vortexTimer--;
    const allV = Composite.allBodies(world);
    allV.forEach(b => {
      if (b.isStatic) return;
      const dx = b.position.x - vortexCenter.x;
      const dy = b.position.y - vortexCenter.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      // Tangential force (spin) + slight inward pull
      const tangentX = -dy / dist;
      const tangentY = dx / dist;
      const spinStrength = 0.003;
      const pullStrength = 0.0008;
      Body.applyForce(b, b.position, {
        x: tangentX * spinStrength - (dx/dist) * pullStrength,
        y: tangentY * spinStrength - (dy/dist) * pullStrength
      });
      Body.setAngularVelocity(b, b.angularVelocity + 0.01);
    });
    // Swirl particles
    if (vortexTimer % 6 === 0) {
      const a = (performance.now()/200) + Math.random()*Math.PI*2;
      const d = 20 + Math.random()*80;
      particles.push({
        x: vortexCenter.x + Math.cos(a)*d, y: vortexCenter.y + Math.sin(a)*d,
        vx: Math.cos(a+Math.PI/2)*2, vy: Math.sin(a+Math.PI/2)*2,
        life: 0.5, color: ['#ff00ff','#cc00ff','#ff66cc'][Math.floor(Math.random()*3)],
        size: 1 + Math.random()*2
      });
    }
    if (vortexTimer <= 0) {
      vortexActive = false;
      shakeIntensity = 12;
      playBoom();
    }
  }

  updateClearVortex(timestamp);

  // Tornado
  if (tornadoActive && tornadoTimer > 0) {
    tornadoTimer--;
    tornadoX += tornadoDir * 2.5;
    const tornadoY = canvas.height * 0.6;
    const tornadoRadius = 120;
    const allT = Composite.allBodies(world);
    allT.forEach(b => {
      if (b.isStatic) return;
      const dx = b.position.x - tornadoX;
      const dy = b.position.y - tornadoY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < tornadoRadius && dist > 5) {
        // Upward suction + circular spin
        const strength = 0.004 * (1 - dist/tornadoRadius);
        const tangentX = -dy / dist;
        const tangentY = dx / dist;
        Body.applyForce(b, b.position, {
          x: tangentX * strength * 0.5 + (tornadoX - b.position.x) / dist * strength * 0.3,
          y: -strength * 1.5
        });
        Body.setAngularVelocity(b, b.angularVelocity + (Math.random()-0.5)*0.1);
      }
    });
    // Debris particles
    if (tornadoTimer % 3 === 0) {
      const angle = Math.random() * Math.PI * 2;
      const d = Math.random() * 60;
      particles.push({
        x: tornadoX + Math.cos(angle)*d,
        y: tornadoY + Math.sin(angle)*d - Math.random()*80,
        vx: Math.cos(angle+Math.PI/2)*3 + tornadoDir,
        vy: -(1 + Math.random()*3),
        life: 0.5 + Math.random()*0.5,
        color: ['#ff8800','#ffaa33','#cc6600','#886633'][Math.floor(Math.random()*4)],
        size: 1 + Math.random()*3
      });
    }
    if (tornadoTimer % 8 === 0) shakeIntensity = Math.max(shakeIntensity, 4);
    if (tornadoTimer <= 0) {
      tornadoActive = false;
      shakeIntensity = 15;
      playBoom();
    }
  }

  // Freeze timer
  if (freezeActive && freezeTimer > 0) {
    freezeTimer--;
    if (freezeTimer <= 0) {
      freezeActive = false;
      // Unfreeze everything!
      const allBodies = Composite.allBodies(world);
      allBodies.forEach(b => {
        if (b._wasFrozen) {
          b.isStatic = false;
          b._wasFrozen = false;
          const saved = frozenVelocities.get(b.id);
          if (saved) {
            Body.setVelocity(b, { x: saved.vx, y: saved.vy });
            Body.setAngularVelocity(b, saved.av);
          }
          // Wake it up
          Body.setStatic(b, false);
        }
      });
      frozenVelocities.clear();
      shakeIntensity = 15;
      playBoom();
      playSound(600, 0.2, 'sine', 0.1);
      // Thaw burst particles
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
          life: 0.5 + Math.random()*0.5,
          color: ['#00ddff','#ffffff'][Math.floor(Math.random()*2)],
          size: 2 + Math.random()*3
        });
      }
    }
  }

  // Conveyor belt physics
  conveyors = conveyors.filter(c => Composite.get(world, c.id, 'body'));
  if (conveyors.length > 0) {
    const allConvBodies = Composite.allBodies(world);
    allConvBodies.forEach(b => {
      if (b.isStatic) return;
      conveyors.forEach(conv => {
        // Check if body is resting on conveyor (overlapping bounds + close Y)
        const bBottom = b.bounds.max.y;
        const cTop = conv.bounds.min.y;
        const cBottom = conv.bounds.max.y;
        const bCenterX = b.position.x;
        if (bBottom >= cTop - 4 && bBottom <= cBottom + 8 &&
            bCenterX >= conv.bounds.min.x - 10 && bCenterX <= conv.bounds.max.x + 10) {
          Body.applyForce(b, b.position, { x: conv.conveyorDir * 0.0008, y: 0 });
        }
      });
    });
  }

  // Fan blower physics
  {
    const allFanBodies = Composite.allBodies(world);
    const fans = allFanBodies.filter(b => b.isFan);
    if (fans.length > 0) {
      allFanBodies.forEach(b => {
        if (b.isStatic) return;
        fans.forEach(fan => {
          const dx = b.position.x - fan.position.x;
          const dy = b.position.y - fan.position.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          // Fan blows upward from its position
          if (dist < fan.fanRange && dist > 5) {
            // Check if object is above the fan and within horizontal cone
            if (dy < 0 && Math.abs(dx) < fan.fanRange * 0.6) {
              const strength = fan.fanStrength * (1 - dist/fan.fanRange);
              Body.applyForce(b, b.position, {
                x: dx * 0.00002, // slight horizontal spread
                y: -strength
              });
            }
          }
        });
      });
      // Wind particles from fans
      if (timestamp % 80 < 16) {
        fans.forEach(fan => {
          particles.push({
            x: fan.position.x + (Math.random()-0.5)*40,
            y: fan.position.y - 20,
            vx: (Math.random()-0.5)*1.5,
            vy: -(3 + Math.random()*4),
            life: 0.4 + Math.random()*0.4,
            color: '#66ddff',
            size: 1 + Math.random()*2
          });
        });
      }
    }
  }

  // Magnet force
  magnets = magnets.filter(m => Composite.get(world, m.body.id, 'body'));
  if (magnets.length > 0) {
    const allMagBodies = Composite.allBodies(world);
    allMagBodies.forEach(b => {
      if (b.isStatic) return;
      magnets.forEach(mag => {
        const dx = mag.body.position.x - b.position.x;
        const dy = mag.body.position.y - b.position.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150 && dist > 10) {
          const strength = 0.002 / (dist / 50);
          const dir = mag.attracting ? 1 : -1;
          Body.applyForce(b, b.position, {
            x: (dx/dist) * strength * dir,
            y: (dy/dist) * strength * dir
          });
        }
      });
    });
  }

  // Target practice timer
  if (targetMode && targetTimer > 0) {
    targetTimer--;
    // Check if all targets hit
    const remaining = targetBodies.filter(t => !t.targetHit);
    if (remaining.length === 0 && !targetCleared) {
      targetCleared = true;
      targetClearedTimer = 180; // 3 seconds of "CLEARED!"
      targetScore += 50; // bonus
      shakeIntensity = 20;
      chromaticAberration = 6;
      playSound(1000, 0.3, 'sine', 0.15);
      playSound(1200, 0.2, 'sine', 0.1);
      playSound(1500, 0.15, 'sine', 0.08);
      // Fanfare particles
      for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 6;
        particles.push({
          x: canvas.width/2, y: canvas.height/2,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 1 + Math.random(), color: ['#ffdd00','#ff3333','#00ff41','#ffffff'][Math.floor(Math.random()*4)],
          size: 3 + Math.random()*4
        });
      }
    }
    if (targetClearedTimer > 0) targetClearedTimer--;
    if (targetTimer <= 0) {
      // Time's up — remove remaining targets
      targetBodies.forEach(t => {
        if (Composite.get(world, t.id, 'body')) Composite.remove(world, t);
      });
      targetBodies = [];
      targetMode = false;
    }
  }

  // Popcorn mode
  if (popcornActive && popcornTimer > 0) {
    popcornTimer--;
    if (popcornTimer % 15 === 0) {
      const dynBods = Composite.allBodies(world).filter(b => !b.isStatic);
      if (dynBods.length > 0) {
        const target = dynBods[Math.floor(Math.random() * dynBods.length)];
        const popForce = 0.03 + Math.random() * 0.04;
        Body.applyForce(target, target.position, { x: (Math.random()-0.5)*0.02, y: -popForce });
        Body.setAngularVelocity(target, (Math.random()-0.5)*0.3);
        // Pop particles
        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          particles.push({
            x: target.position.x, y: target.position.y,
            vx: Math.cos(angle)*2, vy: Math.sin(angle)*2 - 2,
            life: 0.3 + Math.random()*0.3,
            color: ['#ffdd00','#ffffff','#ff8800'][Math.floor(Math.random()*3)],
            size: 2 + Math.random()*2
          });
        }
        if (popcornTimer % 30 === 0) playSound(600 + Math.random()*600, 0.06, 'sine', 0.06);
      }
    }
    if (popcornTimer <= 0) {
      popcornActive = false;
    }
  }

  // Chromatic aberration decay
  if (chromaticAberration > 0) {
    chromaticAberration *= 0.92;
    if (chromaticAberration < 0.3) chromaticAberration = 0;
  }

  // Ultra chaos mode (Konami code)
  if (ultraChaosActive && ultraChaosTimer > 0) {
    ultraChaosTimer--;
    // Every 20 frames, trigger a random chaos event
    if (ultraChaosTimer % 20 === 0) {
      const actions = [
        () => { // mini explosion
          const ex = 50 + Math.random() * (canvas.width-100);
          const ey = 50 + Math.random() * (canvas.height-100);
          explosions.push({ x:ex, y:ey, r:0, maxR:100, alpha:0.8 });
          const ab = Composite.allBodies(world);
          ab.forEach(b => {
            if (b.isStatic) return;
            const ddx = b.position.x - ex, ddy = b.position.y - ey;
            const dd = Math.sqrt(ddx*ddx + ddy*ddy);
            if (dd < 100 && dd > 0) Body.applyForce(b, b.position, {x:(ddx/dd)*0.04, y:(ddy/dd)*0.04});
          });
        },
        () => { // spawn random object
          const types = ['ball','star','duck','bomb','balloon'];
          const old = currentTool;
          currentTool = types[Math.floor(Math.random()*types.length)];
          spawnObject(Math.random()*canvas.width, -20, (Math.random()-0.5)*5, 3+Math.random()*5);
          currentTool = old;
        },
        () => { // random gravity nudge
          const ab = Composite.allBodies(world);
          ab.forEach(b => { if (!b.isStatic) Body.applyForce(b, b.position, {x:(Math.random()-0.5)*0.03, y:(Math.random()-0.5)*0.03}); });
        }
      ];
      actions[Math.floor(Math.random()*actions.length)]();
    }
    // Flashing background tint
    if (ultraChaosTimer % 10 < 5) {
      const hue = (timestamp / 5) % 360;
      // stored for render phase
      window._ultraChaosHue = hue;
    }
    if (ultraChaosTimer <= 0) {
      ultraChaosActive = false;
      window._ultraChaosHue = null;
    }
  }

  // Gravity flip label timer
  if (window._gravFlipTimer > 0) window._gravFlipTimer--;
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) comboCount = 0;
  }
  if (comboFlash > 0) comboFlash = Math.max(0, comboFlash - dt * 3);

  // Shake
  if (shakeIntensity > 0) {
    shakeOffset.x = (Math.random()-0.5) * shakeIntensity;
    shakeOffset.y = (Math.random()-0.5) * shakeIntensity;
    shakeIntensity *= 0.92;
    if (shakeIntensity < 0.5) shakeIntensity = 0;
  } else {
    shakeOffset.x = 0;
    shakeOffset.y = 0;
  }

  // Physics step
  if (!paused) {
    const timeScale = (timeWarpActive || sloMoActive) ? 0.2 : 1;
    applyFloatForces();
    applyLiftForces();
    applyOrbitForces();
    applyThrusterForces();
    applyGyroStabilizers();
    applyChargeForces();
    applyWeldLocks();
    Engine.update(engine, (1000/60) * timeScale);
  }

  // Update object count
  const allBodies = Composite.allBodies(world);
  const objectCount = allBodies.filter(b => !b.isStatic || b.isAnchored).length;
  document.getElementById('obj-count').textContent = objectCount;
  updateSpawnPopAnimations(timestamp);

  // Record trails for fast-moving objects
  allBodies.forEach(b => {
    if (b.isStatic) return;
    const speed = Math.sqrt(b.velocity.x * b.velocity.x + b.velocity.y * b.velocity.y);
    if (speed > 5) {
      const r = b.render || {};
      const trailColor = r.color || '#00ff41';
      const trailSize = r.radius || r.size || r.outerR || 15;
      trails.push({
        x: b.position.x,
        y: b.position.y,
        size: trailSize * 0.6,
        color: trailColor,
        alpha: Math.min(speed / 20, 0.7),
        life: 0.3
      });
    }
  });
  // Decay trails
  for (let i = trails.length - 1; i >= 0; i--) {
    trails[i].life -= dt;
    trails[i].alpha *= 0.92;
    if (trails[i].life <= 0 || trails[i].alpha < 0.02) {
      trails.splice(i, 1);
    }
  }

  // Per-body line trails (speed trails feature)
  const TRAIL_SPEED_THRESHOLD = 5;
  const MAX_TRAIL_LEN = 12;
  allBodies.forEach(b => {
    if (b.isStatic) return;
    const speed = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
    if (speed > TRAIL_SPEED_THRESHOLD) {
      if (!bodyTrails.has(b.id)) bodyTrails.set(b.id, []);
      const trail = bodyTrails.get(b.id);
      trail.unshift({ x: b.position.x, y: b.position.y });
      if (trail.length > MAX_TRAIL_LEN) trail.pop();
    } else {
      const trail = bodyTrails.get(b.id);
      if (trail) {
        trail.pop();
        if (trail.length === 0) bodyTrails.delete(b.id);
      }
    }
  });
  // Cleanup trails for removed bodies
  for (const [id] of bodyTrails) {
    if (!allBodies.find(b => b.id === id)) bodyTrails.delete(id);
  }

  // ── RENDER ──
  ctx.save();
  ctx.translate(shakeOffset.x, shakeOffset.y);

  // Clear
  ctx.fillStyle = '#080c10';
  ctx.fillRect(-10, -10, canvas.width+20, canvas.height+20);

  // Grid
  drawGrid();

  // Collision heatmap
  drawCollisionHeatmap(dt);

  // Tap ripples
  drawRipples(dt);

  // Trails (afterimages - dot system)
  trails.forEach(t => {
    ctx.globalAlpha = t.alpha;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
    ctx.fillStyle = t.color;
    ctx.fill();
    // Glow ring
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size * 1.4, 0, Math.PI * 2);
    ctx.fillStyle = t.color + '22';
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Per-body speed trail lines
  bodyTrails.forEach((trail, bodyId) => {
    if (trail.length < 2) return;
    const b = allBodies.find(b2 => b2.id === bodyId);
    const color = b?.render?.color || '#00ff41';
    ctx.lineCap = 'round';
    for (let i = 0; i < trail.length - 1; i++) {
      const alpha = (1 - i / trail.length) * 0.55;
      const lineWidth = Math.max(1, (1 - i / trail.length) * 4);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(trail[i].x, trail[i].y);
      ctx.lineTo(trail[i+1].x, trail[i+1].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // Walls
  drawWalls();

  // Constraints (car axles)
  drawConstraints();

  // Speed glow on fast objects
  allBodies.forEach(b => {
    if (b.isStatic) return;
    const spd = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
    if (spd > 5) {
      const intensity = Math.min((spd - 5) / 15, 1); // 0 at 5, 1 at 20
      const glowR = (b.render?.radius || b.render?.size || b.render?.outerR || 20) * (1.5 + intensity * 1.5);
      // Color: yellow → orange → red → white
      let glowColor;
      if (intensity < 0.33) glowColor = `rgba(255,255,0,${0.15 + intensity * 0.4})`;
      else if (intensity < 0.66) glowColor = `rgba(255,${Math.floor(165 - (intensity-0.33)*300)},0,${0.2 + intensity * 0.3})`;
      else if (intensity < 0.9) glowColor = `rgba(255,${Math.floor(50 - (intensity-0.66)*100)},0,${0.25 + intensity * 0.25})`;
      else glowColor = `rgba(255,255,255,${0.3 + intensity * 0.2})`;
      // Pulsing
      const pulse = 0.8 + Math.sin(performance.now() / 100 + b.id) * 0.2;
      const grd = ctx.createRadialGradient(b.position.x, b.position.y, 0, b.position.x, b.position.y, glowR * pulse);
      grd.addColorStop(0, glowColor);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(b.position.x, b.position.y, glowR * pulse, 0, Math.PI*2);
      ctx.fillStyle = grd;
      ctx.fill();
    }
  });

  // Magnet field lines
  magnets.forEach(mag => {
    const mx = mag.body.position.x, my = mag.body.position.y;
    const isAttract = mag.attracting;
    const col = isAttract ? 'rgba(255,68,102,' : 'rgba(68,102,255,';
    const time = performance.now();
    // Draw curved field arcs
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI*2/6)*i + time/2000;
      const dist = 60 + Math.sin(time/400 + i)*20;
      ctx.beginPath();
      ctx.arc(mx, my, dist, angle, angle + 0.8);
      ctx.strokeStyle = col + '0.2)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // Range circle
    ctx.beginPath();
    ctx.arc(mx, my, 150, 0, Math.PI*2);
    ctx.strokeStyle = col + '0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Bodies
  allBodies.forEach(b => {
    if (b.label === 'wall') return;
    drawBody(b);
  });
  drawAnchorMarkers(timestamp);
  drawMotorMarkers(timestamp);
  drawAlchemyMarkers(timestamp);
  drawFloatMarkers(timestamp);
  drawPivotMarkers(timestamp);
  drawReverseFlash(timestamp);
  drawBrakeFlash(timestamp);
  drawThrusterMarkers(timestamp);
  drawPhaseMarkers(timestamp);
  drawGyroMarkers(timestamp);
  drawChargeMarkers(timestamp);
  drawTwistFlash(timestamp);
  drawLiftMarkers(timestamp);
  drawOrbitMarkers(timestamp);
  drawTethers(timestamp);
  drawWeldMarker(timestamp);
  drawPunchFlash(timestamp);
  drawSwapMarker(timestamp);
  drawStackMarker(timestamp);
  drawMirrorFlash(timestamp);
  drawRelayMarker(timestamp);
  drawStrutMarker(timestamp);
  drawRotateFlash(timestamp);
  drawFusionMarker(timestamp);
  drawHingeMarker(timestamp);
  drawSpringMarker(timestamp);
  drawLaunchMarker(timestamp);
  drawBlinkMarker(timestamp);
  drawSquashFlash(timestamp);
  drawPulseBursts(timestamp);
  drawCurveFlash(timestamp);
  drawSwirlBursts(timestamp);

  // Effects
  drawRopes();
  drawExplosions(dt);
  drawParticles(dt);
  drawSlingshot();
  drawDrawing();
  // Black hole visual
  if (blackHoleActive || blackHoleAlpha > 0) {
    const bhA = blackHoleActive ? 1 : blackHoleAlpha;
    // Accretion disk rings
    for (let ring = 3; ring >= 0; ring--) {
      const ringR = 30 + ring * 25 + Math.sin(timestamp/200 + ring) * 5;
      ctx.beginPath();
      ctx.arc(blackHolePos.x, blackHolePos.y, ringR, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${ring % 2 === 0 ? '153,0,255' : '10,189,198'},${bhA * (0.15 - ring*0.03)})`;
      ctx.lineWidth = 3 - ring * 0.5;
      ctx.stroke();
    }
    // Event horizon
    const bhR = 20 + Math.sin(timestamp/100) * 3;
    const gradient = ctx.createRadialGradient(
      blackHolePos.x, blackHolePos.y, 0,
      blackHolePos.x, blackHolePos.y, bhR * 2
    );
    gradient.addColorStop(0, `rgba(0,0,0,${bhA})`);
    gradient.addColorStop(0.5, `rgba(40,0,80,${bhA * 0.6})`);
    gradient.addColorStop(1, `rgba(0,0,0,0)`);
    ctx.beginPath();
    ctx.arc(blackHolePos.x, blackHolePos.y, bhR * 2, 0, Math.PI*2);
    ctx.fillStyle = gradient;
    ctx.fill();
    // Core
    ctx.beginPath();
    ctx.arc(blackHolePos.x, blackHolePos.y, bhR * 0.6, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,0,0,${bhA})`;
    ctx.fill();
    // Swirl particles
    if (blackHoleActive) {
      for (let i = 0; i < 5; i++) {
        const sAngle = timestamp/300 + i * Math.PI*2/5;
        const sDist = 40 + Math.sin(timestamp/150 + i) * 20;
        const sx = blackHolePos.x + Math.cos(sAngle) * sDist;
        const sy = blackHolePos.y + Math.sin(sAngle) * sDist;
        ctx.beginPath();
        ctx.arc(sx, sy, 2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(153,0,255,${0.5 + Math.sin(timestamp/100+i)*0.3})`;
        ctx.fill();
      }
    }
    // Label
    if (blackHoleActive) {
      ctx.fillStyle = '#cc00ff';
      ctx.font = '20px VT323';
      ctx.textAlign = 'center';
      ctx.fillText('⚫ BLACK HOLE ACTIVE', blackHolePos.x, blackHolePos.y - 60);
      ctx.textAlign = 'left';
    }
  }

  // Portal rendering
  portals.forEach((portal, idx) => {
    const time = timestamp;
    const r = portal.radius;

    // Outer swirl rings
    for (let ring = 0; ring < 3; ring++) {
      const ringR = r + ring * 8 + Math.sin(time/200 + ring * 2) * 3;
      ctx.beginPath();
      ctx.arc(portal.x, portal.y, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = portal.color + (ring === 0 ? 'aa' : '44');
      ctx.lineWidth = 3 - ring;
      ctx.stroke();
    }

    // Swirling inner vortex
    const segments = 8;
    for (let i = 0; i < segments; i++) {
      const angle = (time / 400) + (Math.PI * 2 * i / segments);
      const innerDist = r * 0.3;
      const outerDist = r * 0.9;
      ctx.beginPath();
      ctx.moveTo(
        portal.x + Math.cos(angle) * innerDist,
        portal.y + Math.sin(angle) * innerDist
      );
      ctx.lineTo(
        portal.x + Math.cos(angle + 0.4) * outerDist,
        portal.y + Math.sin(angle + 0.4) * outerDist
      );
      ctx.strokeStyle = portal.color + '66';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Center glow
    const grd = ctx.createRadialGradient(portal.x, portal.y, 0, portal.x, portal.y, r);
    grd.addColorStop(0, portal.color + '88');
    grd.addColorStop(0.5, portal.color + '33');
    grd.addColorStop(1, portal.color + '00');
    ctx.beginPath();
    ctx.arc(portal.x, portal.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Label
    const label = portals.length === 2 ? (idx === 0 ? 'A' : 'B') : '?';
    ctx.fillStyle = portal.color;
    ctx.font = '18px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🌀 ' + label, portal.x, portal.y - r - 8);
    ctx.textAlign = 'left';

    // Connection line between linked portals
    if (portals.length === 2 && idx === 0) {
      ctx.beginPath();
      ctx.setLineDash([4, 8]);
      ctx.moveTo(portals[0].x, portals[0].y);
      ctx.lineTo(portals[1].x, portals[1].y);
      ctx.strokeStyle = '#cc00ff33';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  drawWindIndicator();

  // Gravity flip direction label
  if (window._gravFlipTimer > 0) {
    const alpha = Math.min(1, window._gravFlipTimer / 30);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffdd00';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('GRAVITY: ' + (window._gravFlipLabel || ''), canvas.width/2, canvas.height/2 - 20);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // Anti-gravity indicator
  if (antiGravActive) {
    ctx.fillStyle = '#cc00ff';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🫧 ZERO-G ACTIVE 🫧', canvas.width/2, 70);
    // Timer bar
    const barW = 200, barH = 6;
    const barX = canvas.width/2 - barW/2;
    const barY = 80;
    const pct = antiGravTimer / 240;
    ctx.fillStyle = '#cc00ff33';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#cc00ff';
    ctx.fillRect(barX, barY, barW * pct, barH);
    ctx.textAlign = 'left';
  }

  // Time warp indicator
  if (timeWarpActive) {
    // Purple tint overlay
    ctx.fillStyle = 'rgba(100,0,180,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Vignette edges
    const vigGrd = ctx.createRadialGradient(
      canvas.width/2, canvas.height/2, canvas.height * 0.3,
      canvas.width/2, canvas.height/2, canvas.height * 0.8
    );
    vigGrd.addColorStop(0, 'rgba(100,0,180,0)');
    vigGrd.addColorStop(1, 'rgba(100,0,180,0.15)');
    ctx.fillStyle = vigGrd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Label
    ctx.fillStyle = '#cc00ff';
    ctx.font = '32px VT323';
    ctx.textAlign = 'center';
    const pulse = 0.7 + Math.sin(timestamp / 300) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.fillText('⏳ S L O W   M O T I O N ⏳', canvas.width/2, 50);
    ctx.globalAlpha = 1;
    // Timer bar
    const barW = 200, barH = 6;
    const barX = canvas.width/2 - barW/2;
    const barY = 62;
    const pct = timeWarpTimer / 300;
    ctx.fillStyle = '#cc00ff33';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#cc00ff';
    ctx.fillRect(barX, barY, barW * pct, barH);
    ctx.textAlign = 'left';
    // Floating clock particles
    if (timeWarpTimer % 12 === 0) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random()-0.5)*0.5,
        vy: (Math.random()-0.5)*0.5,
        life: 1.5,
        color: '#cc00ff',
        size: 1 + Math.random()*2
      });
    }
  }

  // Mega bounce indicator
  if (megaBounceActive) {
    ctx.fillStyle = '#00ff41';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    const pulse = 0.7 + Math.sin(timestamp / 150) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.fillText('🏀 M E G A   B O U N C E 🏀', canvas.width/2, antiGravActive ? 110 : 50);
    ctx.globalAlpha = 1;
    const barW = 200, barH = 6;
    const barX = canvas.width/2 - barW/2;
    const barY = (antiGravActive ? 120 : 62);
    const pct = megaBounceTimer / 300;
    ctx.fillStyle = '#00ff4133';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#00ff41';
    ctx.fillRect(barX, barY, barW * pct, barH);
    ctx.textAlign = 'left';
  }

  // Ocean mode overlay
  if (oceanMode) {
    // Blue tint
    ctx.fillStyle = 'rgba(0,40,120,0.12)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Draw bubbles
    oceanBubbles.forEach(bub => {
      ctx.beginPath();
      ctx.arc(bub.x, bub.y, bub.r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(100,200,255,${bub.alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      // Highlight
      ctx.beginPath();
      ctx.arc(bub.x - bub.r*0.25, bub.y - bub.r*0.25, bub.r*0.3, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,240,255,${bub.alpha * 0.6})`;
      ctx.fill();
    });
    // Label
    const pulse = 0.6 + Math.sin(timestamp / 300) * 0.4;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#0088ff';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🌊 O C E A N   M O D E 🌊', canvas.width/2, antiGravActive ? 140 : megaBounceActive ? 100 : 50);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // Freeze indicator
  if (freezeActive) {
    // Ice blue overlay
    ctx.fillStyle = 'rgba(0,180,255,0.06)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Frost border
    const frostGrd = ctx.createRadialGradient(
      canvas.width/2, canvas.height/2, canvas.height * 0.35,
      canvas.width/2, canvas.height/2, canvas.height * 0.75
    );
    frostGrd.addColorStop(0, 'rgba(0,200,255,0)');
    frostGrd.addColorStop(1, 'rgba(0,200,255,0.12)');
    ctx.fillStyle = frostGrd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Label
    const pulse = 0.7 + Math.sin(timestamp / 200) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#00ddff';
    ctx.font = '32px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🧊 F R O Z E N 🧊', canvas.width/2, 50);
    ctx.globalAlpha = 1;
    // Timer bar
    const barW = 200, barH = 6;
    const barX = canvas.width/2 - barW/2;
    ctx.fillStyle = '#00ddff33';
    ctx.fillRect(barX, 62, barW, barH);
    ctx.fillStyle = '#00ddff';
    ctx.fillRect(barX, 62, barW * (freezeTimer/180), barH);
    ctx.textAlign = 'left';
    // Floating ice crystals
    if (freezeTimer % 10 === 0) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random()-0.5)*0.5, vy: -(0.5 + Math.random()),
        life: 1.5, color: '#aaeeff', size: 1 + Math.random()*2
      });
    }
  }

  // Ultra chaos mode visuals
  if (ultraChaosActive && window._ultraChaosHue != null) {
    const hue = window._ultraChaosHue;
    ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.06)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff3333';
    ctx.font = '36px VT323';
    ctx.textAlign = 'center';
    const pulse = 0.6 + Math.sin(timestamp / 100) * 0.4;
    ctx.globalAlpha = pulse;
    ctx.fillText('☠️ U L T R A   C H A O S ☠️', canvas.width/2, canvas.height/2);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // Vortex visual
  if (vortexActive) {
    const time = timestamp;
    // Spinning rings
    for (let ring = 0; ring < 4; ring++) {
      const ringR = 30 + ring * 35 + Math.sin(time/150 + ring) * 8;
      ctx.beginPath();
      ctx.arc(vortexCenter.x, vortexCenter.y, ringR, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,0,255,${0.25 - ring*0.05})`;
      ctx.lineWidth = 3 - ring*0.5;
      ctx.stroke();
    }
    // Label
    const pulse = 0.6 + Math.sin(time/150)*0.4;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff00ff';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🌀 V O R T E X 🌀', vortexCenter.x, vortexCenter.y - 50);
    ctx.globalAlpha = 1;
    // Timer bar
    const barW = 200, barH = 6;
    ctx.fillStyle = '#ff00ff33';
    ctx.fillRect(vortexCenter.x-barW/2, vortexCenter.y - 38, barW, barH);
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(vortexCenter.x-barW/2, vortexCenter.y - 38, barW*(vortexTimer/300), barH);
    ctx.textAlign = 'left';
  }

  drawClearVortex(timestamp);

  // Lightning bolts between nearby fast objects
  {
    const dynBodies = allBodies.filter(b => !b.isStatic);
    for (let i = 0; i < dynBodies.length; i++) {
      const a = dynBodies[i];
      const sa = Math.sqrt(a.velocity.x*a.velocity.x + a.velocity.y*a.velocity.y);
      if (sa < 6) continue;
      for (let j = i+1; j < dynBodies.length; j++) {
        const b = dynBodies[j];
        const sb = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
        if (sb < 6) continue;
        const ddx = a.position.x - b.position.x;
        const ddy = a.position.y - b.position.y;
        const dist = Math.sqrt(ddx*ddx + ddy*ddy);
        if (dist < 120 && dist > 10 && Math.random() < 0.3) {
          // Draw jagged lightning bolt
          ctx.beginPath();
          ctx.moveTo(a.position.x, a.position.y);
          const segs = 4 + Math.floor(Math.random()*3);
          for (let s = 1; s < segs; s++) {
            const t = s / segs;
            const mx = a.position.x + (b.position.x - a.position.x)*t + (Math.random()-0.5)*20;
            const my = a.position.y + (b.position.y - a.position.y)*t + (Math.random()-0.5)*20;
            ctx.lineTo(mx, my);
          }
          ctx.lineTo(b.position.x, b.position.y);
          ctx.strokeStyle = `rgba(100,200,255,${0.5 + Math.random()*0.5})`;
          ctx.lineWidth = 1 + Math.random()*2;
          ctx.stroke();
          // Glow pass
          ctx.strokeStyle = 'rgba(150,220,255,0.15)';
          ctx.lineWidth = 4 + Math.random()*3;
          ctx.stroke();
        }
      }
    }
  }

  // Tornado visual
  if (tornadoActive) {
    const tornadoY = canvas.height * 0.6;
    // Funnel shape — widening upward
    for (let i = 0; i < 8; i++) {
      const t = i / 8;
      const funnelY = tornadoY - t * canvas.height * 0.5;
      const funnelW = 10 + t * 70;
      const sway = Math.sin(timestamp/200 + i * 0.8) * (5 + t * 15);
      ctx.beginPath();
      ctx.ellipse(tornadoX + sway, funnelY, funnelW, 8 + t * 4, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,136,0,${0.4 - t * 0.04})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    // Label
    const pulse = 0.6 + Math.sin(timestamp/150)*0.4;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff8800';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🌪️ T O R N A D O 🌪️', tornadoX, tornadoY - canvas.height * 0.5 - 15);
    ctx.globalAlpha = 1;
    // Timer bar
    const barW = 150, barH = 5;
    ctx.fillStyle = '#ff880033';
    ctx.fillRect(tornadoX - barW/2, tornadoY - canvas.height * 0.5 - 5, barW, barH);
    ctx.fillStyle = '#ff8800';
    ctx.fillRect(tornadoX - barW/2, tornadoY - canvas.height * 0.5 - 5, barW * (tornadoTimer/360), barH);
    ctx.textAlign = 'left';
  }

  // Fire trails on very fast objects
  {
    const fireThreshold = 10;
    const dynBodies2 = allBodies.filter(b => !b.isStatic);
    dynBodies2.forEach(b => {
      const spd = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
      if (spd > fireThreshold) {
        const intensity = Math.min((spd - fireThreshold) / 15, 1);
        // Draw fire trail behind the object
        const trailLen = 3 + Math.floor(intensity * 5);
        for (let f = 0; f < trailLen; f++) {
          const tx = b.position.x - b.velocity.x * (f * 0.3) + (Math.random()-0.5) * 6;
          const ty = b.position.y - b.velocity.y * (f * 0.3) + (Math.random()-0.5) * 6;
          const fSize = (3 + Math.random()*5) * (1 - f/trailLen);
          const alpha = intensity * (1 - f/trailLen) * 0.8;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(tx, ty, fSize, 0, Math.PI*2);
          // Gradient from yellow core to red outer
          const colorMix = f / trailLen;
          const r2 = 255;
          const g = Math.floor(200 * (1-colorMix));
          ctx.fillStyle = `rgb(${r2},${g},0)`;
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    });
  }

  // Chromatic aberration (RGB split) on big impacts
  if (chromaticAberration > 0.5) {
    const offset = chromaticAberration;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.12;
    // Red channel offset
    ctx.drawImage(canvas, offset, 0);
    // Blue channel offset
    ctx.drawImage(canvas, -offset, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    // White screen flash (brief)
    if (chromaticAberration > 4) {
      ctx.fillStyle = `rgba(255,255,255,${(chromaticAberration - 4) * 0.04})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  // Popcorn indicator
  if (popcornActive) {
    const pulse = 0.6 + Math.sin(timestamp / 150) * 0.4;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffdd00';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🍿 P O P C O R N ! 🍿', canvas.width/2, 50);
    ctx.globalAlpha = 1;
    const barW = 200, barH = 6;
    const barX = canvas.width/2 - barW/2;
    ctx.fillStyle = '#ffdd0033';
    ctx.fillRect(barX, 62, barW, barH);
    ctx.fillStyle = '#ffdd00';
    ctx.fillRect(barX, 62, barW * (popcornTimer/480), barH);
    ctx.textAlign = 'left';
  }

  // Target practice HUD
  if (targetMode) {
    const remaining = targetBodies.filter(t => !t.targetHit).length;
    // Score overlay top-right
    ctx.fillStyle = '#0a0a0acc';
    ctx.fillRect(canvas.width - 180, 8, 172, 60);
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 2;
    ctx.strokeRect(canvas.width - 180, 8, 172, 60);
    ctx.fillStyle = '#ff3333';
    ctx.font = '24px VT323';
    ctx.textAlign = 'right';
    ctx.fillText('🎯 SCORE: ' + targetScore, canvas.width - 16, 34);
    ctx.fillStyle = '#ffdd00';
    ctx.font = '18px VT323';
    ctx.fillText('LEFT: ' + remaining + '  ⏱ ' + Math.ceil(targetTimer/60) + 's', canvas.width - 16, 58);
    ctx.textAlign = 'left';
    // Cleared flash
    if (targetCleared && targetClearedTimer > 0) {
      const alpha = Math.min(1, targetClearedTimer / 60);
      const pulse = 0.7 + Math.sin(performance.now() / 100) * 0.3;
      ctx.globalAlpha = alpha * pulse;
      ctx.fillStyle = '#ffdd00';
      ctx.font = '48px VT323';
      ctx.textAlign = 'center';
      ctx.fillText('🎯 C L E A R E D ! 🎯', canvas.width/2, canvas.height/2);
      ctx.fillStyle = '#ffffff';
      ctx.font = '28px VT323';
      ctx.fillText('BONUS +50!', canvas.width/2, canvas.height/2 + 40);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  }

  // Impact combo callout
  if (comboCount >= 3 && comboTimer > 0) {
    const comboScale = 1 + Math.min(comboCount * 0.035, 0.45);
    const comboColor = comboCount >= 20 ? '#ff3399' : comboCount >= 10 ? '#ff6600' : '#ffdd00';
    const flashAlpha = Math.min(1, 0.72 + comboFlash * 0.28);
    const comboY = (antiGravActive || timeWarpActive || megaBounceActive || freezeActive || popcornActive) ? 112 : 84;
    ctx.save();
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = comboColor;
    ctx.shadowColor = comboColor;
    ctx.shadowBlur = 12 + Math.min(comboCount, 30) * 0.45;
    ctx.font = Math.floor(26 * comboScale) + 'px VT323';
    ctx.textAlign = 'center';
    ctx.fillText(comboCount + 'x COMBO', canvas.width / 2, comboY);
    ctx.font = '16px VT323';
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.fillText('BEST ' + comboBest + 'x', canvas.width / 2, comboY + 22);
    ctx.restore();
  }

  // Destruction level-up banner
  if (destructionLevelBanner) {
    const banner = destructionLevelBanner;
    const alpha = Math.min(1, banner.timer / 25);
    const pulse = 0.85 + Math.sin(timestamp / 90) * 0.15;
    ctx.save();
    ctx.globalAlpha = alpha * pulse;
    ctx.fillStyle = banner.color;
    ctx.shadowColor = banner.color;
    ctx.shadowBlur = 16;
    ctx.font = '34px VT323';
    ctx.textAlign = 'center';
    ctx.fillText(banner.text, canvas.width / 2, canvas.height * 0.38);
    ctx.restore();
    banner.timer--;
    if (banner.timer <= 0) destructionLevelBanner = null;
  }

  // Destruction meter (bottom-left HUD)
  if (destructionMeter > 0) {
    const meterX = 12, meterY = canvas.height - 20;
    const meterW = 160, meterH = 14;
    // Milestones at powers of 10
    const lvl = getDestructionLevel();
    const col = DESTRUCTION_LEVEL_COLORS[lvl];
    // Background
    ctx.fillStyle = '#0a0a0a88';
    ctx.fillRect(meterX - 2, meterY - meterH - 18, meterW + 4, meterH + 22);
    // Label
    ctx.fillStyle = col;
    ctx.font = '14px VT323';
    ctx.textAlign = 'left';
    const flash = destructionFlash > 0 ? 1 : 0.8;
    ctx.globalAlpha = flash;
    ctx.fillText('💥 DESTRUCTION: ' + DESTRUCTION_LEVEL_NAMES[lvl], meterX, meterY - meterH - 4);
    // Bar background
    ctx.fillStyle = col + '33';
    ctx.fillRect(meterX, meterY - meterH, meterW, meterH);
    // Bar fill — progress within current level (log scale)
    const progress = (Math.log10(Math.max(destructionMeter, 1)) % 1);
    ctx.fillStyle = col;
    ctx.fillRect(meterX, meterY - meterH, meterW * progress, meterH);
    // Score
    ctx.fillStyle = col + 'cc';
    ctx.font = '12px VT323';
    ctx.fillText(Math.floor(destructionMeter).toLocaleString(), meterX + meterW + 6, meterY - 3);
    ctx.globalAlpha = 1;
  }
  if (destructionFlash > 0) destructionFlash *= 0.9;

  // Disco mode visuals
  if (discoMode) {
    const t = timestamp;
    const hue = (t / 3) % 360;
    // Pulsing background color wash
    ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.04)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Disco ball spotlight beams
    const beamCount = 6;
    const centerX = canvas.width / 2, centerY = 60;
    for (let i = 0; i < beamCount; i++) {
      const angle = (t / 800) + (Math.PI * 2 * i / beamCount);
      const beamLen = Math.max(canvas.width, canvas.height);
      const endX = centerX + Math.cos(angle) * beamLen;
      const endY = centerY + Math.sin(angle) * beamLen;
      const beamHue = (hue + i * 60) % 360;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(endX - Math.sin(angle)*30, endY + Math.cos(angle)*30);
      ctx.lineTo(endX + Math.sin(angle)*30, endY - Math.cos(angle)*30);
      ctx.closePath();
      ctx.fillStyle = `hsla(${beamHue}, 100%, 60%, 0.06)`;
      ctx.fill();
    }
    // Disco ball
    ctx.beginPath();
    ctx.arc(centerX, centerY, 18, 0, Math.PI*2);
    const dbGrad = ctx.createRadialGradient(centerX-5, centerY-5, 2, centerX, centerY, 18);
    dbGrad.addColorStop(0, '#ffffff');
    dbGrad.addColorStop(0.5, '#cccccc');
    dbGrad.addColorStop(1, '#666666');
    ctx.fillStyle = dbGrad;
    ctx.fill();
    // Mirror tiles on disco ball
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 8; c++) {
        const ta = (Math.PI*2*c/8) + t/500 + r*0.3;
        const tr = 8 + r*4;
        const tx = centerX + Math.cos(ta)*tr;
        const ty = centerY + Math.sin(ta)*tr - 2 + r*3;
        const sparkle = Math.sin(t/100 + c*2 + r*3) > 0.5 ? 1 : 0.3;
        ctx.fillStyle = `rgba(255,255,255,${sparkle})`;
        ctx.fillRect(tx-2, ty-2, 4, 3);
      }
    }
    // Label
    const pulse = 0.7 + Math.sin(t / 150) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
    ctx.font = '24px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🪩 D I S C O   M O D E 🪩', canvas.width/2, canvas.height - 40);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
    // Random sparkle particles
    if (Math.random() < 0.3) {
      const sparkHue = Math.random() * 360;
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.8,
        vx: (Math.random()-0.5)*2,
        vy: -(0.5 + Math.random()*2),
        life: 0.5 + Math.random()*0.5,
        color: `hsl(${sparkHue}, 100%, 70%)`,
        size: 1 + Math.random()*3
      });
    }
  }

  // SLO-MO toggle indicator
  if (sloMoActive) {
    // Green vignette edges
    const sloGrd = ctx.createRadialGradient(
      canvas.width/2, canvas.height/2, canvas.height * 0.3,
      canvas.width/2, canvas.height/2, canvas.height * 0.8
    );
    sloGrd.addColorStop(0, 'rgba(0,180,100,0)');
    sloGrd.addColorStop(1, 'rgba(0,180,100,0.12)');
    ctx.fillStyle = sloGrd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Label
    const sPulse = 0.7 + Math.sin(timestamp / 400) * 0.3;
    ctx.globalAlpha = sPulse;
    ctx.fillStyle = '#00ff41';
    ctx.font = '22px VT323';
    ctx.textAlign = 'right';
    ctx.fillText('SLO-MO', canvas.width - 15, 30);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // GRAB tool indicator
  if (grabActive && grabBody && Composite.get(world, grabBody.id, 'body')) {
    const gr = (grabBody.render?.radius || grabBody.render?.size || 20) * 1.6;
    ctx.beginPath();
    ctx.arc(grabBody.position.x, grabBody.position.y, gr, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffdd00';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    // Grab icon above body
    ctx.fillStyle = '#ffdd00';
    ctx.font = '18px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('✊', grabBody.position.x, grabBody.position.y - gr - 6);
    ctx.textAlign = 'left';
  }

  // Draw mode indicator
  if (drawMode) {
    ctx.fillStyle = '#ff6600';
    ctx.font = '20px VT323';
    ctx.fillText('✏️ DRAW MODE — draw walls & ramps!', 15, 30);
  }

  // Pause overlay
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = '48px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ PAUSED', canvas.width/2, canvas.height/2);
    ctx.textAlign = 'left';
  }

  ctx.restore();
}

requestAnimationFrame(loop);

function isEditableShortcutTarget(target) {
  const tag = target?.tagName;
  return target?.isContentEditable || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

function flashShortcutButton(btn) {
  btn.classList.remove('shortcut-flash');
  void btn.offsetWidth;
  btn.classList.add('shortcut-flash');
  setTimeout(() => btn.classList.remove('shortcut-flash'), 180);
}

function triggerShortcutButton(btn) {
  if (!btn) return false;
  btn.click();
  flashShortcutButton(btn);
  if (btn.scrollIntoView) {
    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  return true;
}

function handleKeyboardShortcut(e) {
  if (isEditableShortcutTarget(e.target)) return false;
  const key = e.key.toLowerCase();

  if (e.shiftKey && key === ' ') {
    const slomoBtn = document.querySelector('[data-tool="slomo"]');
    if (triggerShortcutButton(slomoBtn)) {
      e.preventDefault();
      return true;
    }
  }

  const tool = TOOL_SHORTCUTS[key];
  if (tool) {
    const btn = document.querySelector(`.tool-btn[data-tool="${tool}"]`);
    if (triggerShortcutButton(btn)) {
      e.preventDefault();
      return true;
    }
  }

  const chaosId = CHAOS_SHORTCUTS[key];
  if (chaosId) {
    const btn = document.getElementById(chaosId);
    if (triggerShortcutButton(btn)) {
      e.preventDefault();
      return true;
    }
  }

  if (key === ' ') {
    if (triggerShortcutButton(document.getElementById('btn-pause'))) {
      e.preventDefault();
      return true;
    }
  }

  if (key === 'backspace') {
    if (triggerShortcutButton(document.getElementById('btn-clear'))) {
      e.preventDefault();
      return true;
    }
  }

  return false;
}

// Keyboard shortcuts and Konami code listener
document.addEventListener('keydown', (e) => {
  konamiBuffer.push(e.key);
  if (konamiBuffer.length > konamiCode.length) konamiBuffer.shift();
  if (konamiBuffer.length === konamiCode.length &&
      konamiBuffer.every((k, i) => k === konamiCode[i])) {
    // ULTRA CHAOS!
    ultraChaosActive = true;
    ultraChaosTimer = 600; // 10 seconds of mayhem
    konamiBuffer = [];
    shakeIntensity = 25;
    playBoom();
    playSound(1200, 0.3, 'square', 0.15);
    playSound(800, 0.4, 'sawtooth', 0.1);
    // Massive particle burst
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 8;
      particles.push({
        x: canvas.width/2, y: canvas.height/2,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
        life: 1 + Math.random()*1.5,
        color: ['#ff3333','#ffdd00','#00ff41','#0abdc6','#cc00ff','#ff6600'][Math.floor(Math.random()*6)],
        size: 3 + Math.random()*5
      });
    }
  }

  handleKeyboardShortcut(e);
});

// ═══════════════════════════════════════════════════════════════════════════
// LESSON MODE API - For integration with Lesson Engine
// ═══════════════════════════════════════════════════════════════════════════

const lessonState = {
  active: false,
  config: null,
  goals: [],
  eventCallbacks: [],
  spawnedLessonObjects: [],
  goalsReached: new Set()
};

const gravityPresets = {
  earth: 1, moon: 0.166, mars: 0.38, jupiter: 2.53, space: 0
};

function emitLessonEvent(type, data) {
  lessonState.eventCallbacks.forEach(cb => {
    try { cb({ type, ...data, timestamp: Date.now() }); } catch(e) { console.error('Lesson event callback error:', e); }
  });
}

function checkLessonGoals() {
  if (!lessonState.active || !lessonState.goals.length) return;
  
  const state = window.ChaosEngine.getState();
  
  lessonState.goals.forEach((goal, idx) => {
    if (lessonState.goalsReached.has(idx)) return;
    
    let reached = false;
    switch(goal.type) {
      case 'count-placed':
        reached = state.objectCount >= goal.target;
        break;
      case 'count-exact':
        const diff = Math.abs(state.objectCount - goal.target);
        reached = diff <= (goal.tolerance || 0);
        break;
      case 'height-reached':
        reached = state.objects.some(obj => obj.y <= goal.y);
        break;
      case 'all-objects-below':
        reached = state.objects.every(obj => obj.y >= goal.y);
        break;
      case 'collision-count':
        reached = (state.collisionCount || 0) >= goal.target;
        break;
    }
    
    if (reached) {
      lessonState.goalsReached.add(idx);
      emitLessonEvent('goal-reached', { goalIndex: idx, goal });
      
      if (lessonState.goalsReached.size === lessonState.goals.length) {
        emitLessonEvent('all-goals-reached', { goals: lessonState.goals });
      }
    }
  });
}

// Check goals periodically during lesson mode
setInterval(() => { if (lessonState.active && !paused) checkLessonGoals(); }, 250);

window.ChaosEngine = {
  // Load a lesson configuration
  loadLesson(config) {
    // Clear existing simulation
    finishClear(false);
    
    lessonState.active = true;
    lessonState.config = config;
    lessonState.goals = config.simulation?.goals || [];
    lessonState.spawnedLessonObjects = [];
    lessonState.goalsReached.clear();
    
    // Set gravity
    const grav = config.simulation?.gravity;
    if (grav !== undefined) {
      const gravValue = typeof grav === 'number' ? grav : (gravityPresets[grav] ?? 1);
      gravityTarget = gravValue;
      engine.gravity.y = gravValue;
      // Update planet display
      const planetName = typeof grav === 'string' ? grav.toUpperCase() : 'CUSTOM';
      document.getElementById('planet-name').textContent = planetName;
      document.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
      const matchingBtn = document.querySelector(`[data-gravity="${gravValue}"]`);
      if (matchingBtn) matchingBtn.classList.add('active');
    }
    
    // Spawn fixtures (static objects)
    (config.simulation?.fixtures || []).forEach(fix => {
      if (fix.type === 'rectangle') {
        const body = Bodies.rectangle(fix.x, fix.y, fix.width, fix.height, {
          isStatic: true,
          label: fix.label || 'fixture',
          render: { type: 'block', color: fix.color || '#0abdc6', size: Math.max(fix.width, fix.height) }
        });
        Composite.add(world, body);
        lessonState.spawnedLessonObjects.push(body);
      } else if (fix.type === 'sprite' || fix.type === 'emoji') {
        // Create a marker for sprites/emojis (small static body)
        const body = Bodies.circle(fix.x, fix.y, 20, {
          isStatic: true, label: fix.label || 'sprite',
          render: { type: 'ball', color: '#ffdd00', radius: 20 }
        });
        body.emoji = fix.image || fix.emoji || '📍';
        Composite.add(world, body);
        lessonState.spawnedLessonObjects.push(body);
      }
    });
    
    // Spawn draggable objects
    (config.simulation?.spawnObjects || []).forEach(spec => {
      const toolMap = { circle: 'ball', rectangle: 'block', box: 'block', star: 'star', balloon: 'balloon' };
      const tool = toolMap[spec.type] || spec.type || 'ball';
      const savedTool = currentTool;
      currentTool = tool;
      
      const count = spec.count || 1;
      for (let i = 0; i < count; i++) {
        const x = spec.x ?? (80 + Math.random() * (canvas.width - 160));
        const y = spec.y ?? (60 + i * 40);
        const body = spawnObject(x, y);
        if (body) {
          if (spec.label) body.lessonLabel = spec.label;
          lessonState.spawnedLessonObjects.push(body);
        }
      }
      currentTool = savedTool;
    });
    
    // Hide sandbox UI in lesson mode (optional - controlled by config)
    if (config.hideControls) {
      document.getElementById('toolbar').style.display = 'none';
      document.getElementById('chaos-bar').style.display = 'none';
      document.getElementById('gravity-panel').style.display = 'none';
    }
    
    emitLessonEvent('lesson-loaded', { config });
    return { success: true, objectCount: lessonState.spawnedLessonObjects.length };
  },
  
  // Register event callback
  onEvent(callback) {
    if (typeof callback === 'function') {
      lessonState.eventCallbacks.push(callback);
    }
    return () => {
      const idx = lessonState.eventCallbacks.indexOf(callback);
      if (idx > -1) lessonState.eventCallbacks.splice(idx, 1);
    };
  },
  
  // Get current simulation state
  getState() {
    const allBodies = Composite.allBodies(world);
    const dynamicBodies = allBodies.filter(b => !b.isStatic && b.label !== 'wall');
    
    return {
      lessonActive: lessonState.active,
      lessonId: lessonState.config?.id || null,
      paused,
      gravity: { x: engine.gravity.x, y: engine.gravity.y },
      objectCount: dynamicBodies.length,
      goalsTotal: lessonState.goals.length,
      goalsReached: lessonState.goalsReached.size,
      allGoalsReached: lessonState.goals.length > 0 && lessonState.goalsReached.size === lessonState.goals.length,
      objects: dynamicBodies.map(b => ({
        id: b.id,
        label: b.lessonLabel || b.label || b.render?.type || 'unknown',
        x: Math.round(b.position.x),
        y: Math.round(b.position.y),
        velocity: { x: Math.round(b.velocity.x * 10) / 10, y: Math.round(b.velocity.y * 10) / 10 },
        sleeping: b.isSleeping
      }))
    };
  },
  
  // End lesson mode
  endLesson() {
    lessonState.active = false;
    lessonState.config = null;
    lessonState.goals = [];
    lessonState.goalsReached.clear();
    // Restore UI
    document.getElementById('toolbar').style.display = '';
    document.getElementById('chaos-bar').style.display = '';
    document.getElementById('gravity-panel').style.display = '';
    emitLessonEvent('lesson-ended', {});
  },
  
  // Trigger goal check manually
  checkGoals: checkLessonGoals,
  
  // Utility: pause/unpause
  setPaused(val) { paused = !!val; },
  
  // Get version
  version: '1.1.0-lesson-api'
};

// Emit collision events during lessons
Events.on(engine, 'collisionStart', (e) => {
  if (!lessonState.active) return;
  e.pairs.forEach(pair => {
    emitLessonEvent('collision', {
      bodyA: { id: pair.bodyA.id, label: pair.bodyA.lessonLabel || pair.bodyA.label },
      bodyB: { id: pair.bodyB.id, label: pair.bodyB.lessonLabel || pair.bodyB.label }
    });
  });
});
