// ── COLLISION EVENTS ──
Events.on(engine, 'collisionStart', (e) => {
  e.pairs.forEach(pair => {
    // Target hit detection
    const targetBody = pair.bodyA.isTarget ? pair.bodyA : (pair.bodyB.isTarget ? pair.bodyB : null);
    const hitterBody = targetBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (targetBody && hitterBody && !hitterBody.isStatic && !targetBody.targetHit) {
      targetBody.targetHit = true;
      targetScore += 10;
      // Explosion particles
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x: targetBody.position.x, y: targetBody.position.y,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.4 + Math.random()*0.4,
          color: ['#ff3333','#ffffff','#ffdd00','#ff6600'][Math.floor(Math.random()*4)],
          size: 2 + Math.random()*4
        });
      }
      // Remove target
      Composite.remove(world, targetBody);
      // Ding sound
      playSound(1200, 0.15, 'sine', 0.15);
      playSound(1800, 0.1, 'sine', 0.08);
      shakeIntensity = Math.max(shakeIntensity, 6);
    }

    // Bumper hit detection
    const bumperBody = pair.bodyA.isBumper ? pair.bodyA : (pair.bodyB.isBumper ? pair.bodyB : null);
    const otherBody = bumperBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (bumperBody && otherBody && !otherBody.isStatic) {
      bumperBody.hitFlash = 1;
      const dx = otherBody.position.x - bumperBody.position.x;
      const dy = otherBody.position.y - bumperBody.position.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      Body.setVelocity(otherBody, {
        x: (dx/dist) * 18,
        y: (dy/dist) * 18
      });
      playSound(800 + Math.random()*400, 0.12, 'sine', 0.12);
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x: bumperBody.position.x, y: bumperBody.position.y,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.3 + Math.random()*0.3,
          color: ['#ff3399','#ffdd00','#ffffff'][Math.floor(Math.random()*3)],
          size: 2 + Math.random()*3
        });
      }
      shakeIntensity = Math.max(shakeIntensity, 5);
    }

    // Trampoline super-bounce
    const trampBody = pair.bodyA.isTrampoline ? pair.bodyA : (pair.bodyB.isTrampoline ? pair.bodyB : null);
    const bouncedBody = trampBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (trampBody && bouncedBody && !bouncedBody.isStatic) {
      // Launch upward with extra oomph
      const speed = Math.sqrt(bouncedBody.velocity.x*bouncedBody.velocity.x + bouncedBody.velocity.y*bouncedBody.velocity.y);
      Body.setVelocity(bouncedBody, { x: bouncedBody.velocity.x * 1.2, y: -Math.max(Math.abs(bouncedBody.velocity.y), 8) * 1.5 });
      playSound(300, 0.15, 'sine', 0.12);
      playSound(600, 0.1, 'sine', 0.08);
      // Spring particles
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: bouncedBody.position.x + (Math.random()-0.5)*40,
          y: trampBody.position.y - 5,
          vx: (Math.random()-0.5)*3, vy: -(2 + Math.random()*4),
          life: 0.4 + Math.random()*0.3,
          color: ['#00ff99','#66ffcc','#ffffff'][Math.floor(Math.random()*3)],
          size: 2 + Math.random()*2
        });
      }
      shakeIntensity = Math.max(shakeIntensity, 4);
    }

    // Duck squeak on any collision
    if ((pair.bodyA.isDuck || pair.bodyB.isDuck)) {
      const duckBody = pair.bodyA.isDuck ? pair.bodyA : pair.bodyB;
      const dv = duckBody.velocity;
      const dSpeed = Math.sqrt(dv.x*dv.x + dv.y*dv.y);
      if (dSpeed > 1.5) {
        playSqueak();
        // Yellow particles
        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          particles.push({
            x: duckBody.position.x, y: duckBody.position.y,
            vx: Math.cos(angle)*2, vy: Math.sin(angle)*2 - 1,
            life: 0.4, color: '#ffdd00', size: 2 + Math.random()*2
          });
        }
      }
    }

    // Pixel dust cloud on hard wall/floor impact
    const wallBody = pair.bodyA.label === 'wall' ? pair.bodyA : (pair.bodyB.label === 'wall' ? pair.bodyB : null);
    const impactBody = wallBody === pair.bodyA ? pair.bodyB : pair.bodyA;
    if (wallBody && impactBody && !impactBody.isStatic) {
      const impactSpeed = Math.sqrt(impactBody.velocity.x*impactBody.velocity.x + impactBody.velocity.y*impactBody.velocity.y);
      if (impactSpeed > 6) {
        const dustCount = Math.min(Math.floor(impactSpeed * 1.5), 20);
        const contact = pair.collision.supports && pair.collision.supports[0] ? pair.collision.supports[0] : impactBody.position;
        const dustX = contact.x || impactBody.position.x;
        const dustY = contact.y || impactBody.position.y;
        for (let d = 0; d < dustCount; d++) {
          const angle = Math.random() * Math.PI; // upward arc
          const speed = 1 + Math.random() * 3;
          particles.push({
            x: dustX + (Math.random()-0.5)*20,
            y: dustY,
            vx: Math.cos(angle - Math.PI/2) * speed * (Math.random() > 0.5 ? 1 : -1),
            vy: -Math.abs(Math.sin(angle)) * speed,
            life: 0.4 + Math.random()*0.6,
            color: ['#443322','#665544','#887766','#aa9988'][Math.floor(Math.random()*4)],
            size: 2 + Math.random()*4,
            isDust: true
          });
        }
      }
    }

    const velA = pair.bodyA.velocity || {x:0,y:0};
    const velB = pair.bodyB.velocity || {x:0,y:0};
    const relVel = Math.sqrt(
      Math.pow(velA.x-velB.x,2) + Math.pow(velA.y-velB.y,2)
    );
    if (relVel > 2) {
      // Spark particles at collision point
      const contact = pair.collision.supports && pair.collision.supports[0]
        ? pair.collision.supports[0] : pair.bodyA.position;
      const px = contact.x || pair.bodyA.position.x;
      const py = contact.y || pair.bodyA.position.y;
      const count = Math.min(Math.floor(relVel), 8);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x: px, y: py,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.2 + Math.random()*0.3,
          color: '#00ff41',
          size: 1 + Math.random()*2
        });
      }
      // Block shattering on hard impact
      if (relVel > 9) {
        [pair.bodyA, pair.bodyB].forEach(b => {
          if (!b.isStatic && b.render?.type === 'block' && !b.isFragment && !shatterDebounce.has(b.id)) {
            shatterDebounce.add(b.id);
            setTimeout(() => shatterBlock(b), 0);
          }
        });
      }

      // Material-based impact sounds
      if (relVel > 3) {
        const matA = pair.bodyA.material || 'default';
        const matB = pair.bodyB.material || 'default';
        playImpactSound(matA, matB, relVel);
      }

      // Destruction meter — track energy from all impacts
      destructionMeter += relVel * relVel * 0.1;
      if (relVel > 5) destructionFlash = Math.min(relVel * 0.1, 1);
      
      // Update ambient hum based on new chaos level
      updateAmbientHum();

      // 🎉 CONFETTI BURST on hard impacts!
      if (relVel > 8) {
        const confettiCount = Math.min(Math.floor(relVel * 2), 30);
        const confettiColors = ['#ff3399','#ffdd00','#00ff41','#0abdc6','#ff6600','#cc00ff','#ffffff','#ff3333'];
        for (let c = 0; c < confettiCount; c++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          particles.push({
            x: px, y: py,
            vx: Math.cos(angle)*speed,
            vy: Math.sin(angle)*speed - 2, // bias upward for celebration feel
            life: 0.8 + Math.random()*1.2,
            color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
            size: 2 + Math.random()*4,
            isConfetti: true
          });
        }
        // Impact flash
        explosions.push({ x:px, y:py, r:0, maxR: relVel * 5, alpha: 0.6 });
        // Satisfying crunch sound
        playSound(150 + Math.random()*100, 0.12, 'sawtooth', 0.08);
        // Small screen shake + chromatic aberration
        shakeIntensity = Math.max(shakeIntensity, Math.min(relVel * 0.5, 10));
        chromaticAberration = Math.max(chromaticAberration, Math.min(relVel * 0.6, 8));
      }
    }
  });
});

// ── RENDERING ──
function drawBody(b) {
  const r = b.render || {};
  const type = r.type || 'default';
  const color = r.color || '#00ff41';
  const spawnScale = b.spawnScale || 1;

  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  if (spawnScale !== 1) ctx.scale(spawnScale, spawnScale);

  switch(type) {
    case 'ball': {
      const radius = r.radius || 20;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = color + '33';
      ctx.fill();
      // Inner ring
      ctx.beginPath();
      ctx.arc(0, 0, radius*0.5, 0, Math.PI*2);
      ctx.strokeStyle = color + '88';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'block': {
      const s = r.size || 30;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-s/2, -s/2, s, s);
      ctx.fillStyle = color + '22';
      ctx.fillRect(-s/2, -s/2, s, s);
      // Cross
      ctx.beginPath();
      ctx.moveTo(-s/2, -s/2); ctx.lineTo(s/2, s/2);
      ctx.moveTo(s/2, -s/2); ctx.lineTo(-s/2, s/2);
      ctx.strokeStyle = color + '44';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'rocket': {
      // Body
      ctx.fillStyle = '#ff660044';
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -25);
      ctx.lineTo(9, -10);
      ctx.lineTo(9, 20);
      ctx.lineTo(13, 25);
      ctx.lineTo(-13, 25);
      ctx.lineTo(-9, 20);
      ctx.lineTo(-9, -10);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // Flame
      if (!b.isSleeping) {
        const flicker = 5 + Math.random()*10;
        ctx.fillStyle = `rgba(255,${100+Math.random()*155},0,0.8)`;
        ctx.beginPath();
        ctx.moveTo(-6, 25);
        ctx.lineTo(0, 25 + flicker);
        ctx.lineTo(6, 25);
        ctx.fill();
      }
      break;
    }
    case 'car-body': {
      ctx.fillStyle = color + '33';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-30, -10, 60, 20);
      ctx.fillRect(-30, -10, 60, 20);
      // Window
      ctx.strokeStyle = color + 'aa';
      ctx.strokeRect(-15, -8, 20, 10);
      break;
    }
    case 'wheel': {
      const wr = r.radius || 10;
      ctx.beginPath();
      ctx.arc(0, 0, wr, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Spoke
      ctx.beginPath();
      ctx.moveTo(0, -wr); ctx.lineTo(0, wr);
      ctx.strokeStyle = color + '88';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'bomb': {
      // Dynamite stick body
      const stickW = 14, stickH = 36;
      ctx.fillStyle = '#cc2200';
      ctx.fillRect(-stickW/2, -stickH/2, stickW, stickH);
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 2;
      ctx.strokeRect(-stickW/2, -stickH/2, stickW, stickH);
      // Darker end caps
      ctx.fillStyle = '#991100';
      ctx.fillRect(-stickW/2, -stickH/2, stickW, 5);
      ctx.fillRect(-stickW/2, stickH/2 - 5, stickW, 5);
      // TNT label
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('T', 0, -6);
      ctx.fillText('N', 0, 3);
      ctx.fillText('T', 0, 12);
      ctx.restore();
      // Fuse coming out the top
      ctx.beginPath();
      ctx.moveTo(0, -stickH/2);
      ctx.quadraticCurveTo(8, -stickH/2 - 10, 5, -stickH/2 - 16);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Spark on fuse tip
      const sparkSize = 2 + Math.random()*3;
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.arc(5, -stickH/2 - 16, sparkSize, 0, Math.PI*2);
      ctx.fill();
      // Extra spark glow
      ctx.fillStyle = `rgba(255,200,0,${0.3 + Math.random()*0.3})`;
      ctx.beginPath();
      ctx.arc(5, -stickH/2 - 16, sparkSize + 3, 0, Math.PI*2);
      ctx.fill();
      break;
    }
    case 'balloon': {
      const bRadius = r.radius || 20;
      // Balloon body (oval)
      ctx.beginPath();
      ctx.ellipse(0, 0, bRadius, bRadius * 1.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = color + '88';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Shine highlight
      ctx.beginPath();
      ctx.ellipse(-bRadius*0.3, -bRadius*0.4, bRadius*0.2, bRadius*0.35, -0.3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fill();
      // Knot at bottom
      ctx.beginPath();
      ctx.moveTo(-3, bRadius * 1.2);
      ctx.lineTo(0, bRadius * 1.2 + 6);
      ctx.lineTo(3, bRadius * 1.2);
      ctx.fillStyle = color;
      ctx.fill();
      // String
      ctx.beginPath();
      ctx.moveTo(0, bRadius * 1.2 + 6);
      const time = performance.now();
      const sway = Math.sin(time / 300 + b.position.x) * 4;
      ctx.quadraticCurveTo(sway, bRadius * 1.2 + 20, -sway, bRadius * 1.2 + 35);
      ctx.strokeStyle = color + 'aa';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'star': {
      // Draw star shape
      const outerR = r.outerR || 25;
      const innerR = outerR * 0.45;
      const pts = 5;
      ctx.beginPath();
      for (let i = 0; i < pts * 2; i++) {
        const angle = (Math.PI * 2 * i) / (pts * 2) - Math.PI / 2;
        const rad = i % 2 === 0 ? outerR : innerR;
        const sx = Math.cos(angle) * rad;
        const sy = Math.sin(angle) * rad;
        if (i === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      ctx.fillStyle = color + '55';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Inner glow
      ctx.beginPath();
      ctx.arc(0, 0, innerR * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = color + '44';
      ctx.fill();
      break;
    }
    case 'beachball': {
      const bbR = r.radius || 40;
      // Main circle fill
      ctx.beginPath();
      ctx.arc(0, 0, bbR, 0, Math.PI*2);
      ctx.fillStyle = color + '44';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.stroke();
      // Alternating stripes (6 panels)
      const panelCount = 6;
      const c2 = r.color2 || '#ffdd00';
      for (let i = 0; i < panelCount; i++) {
        const startAngle = (Math.PI * 2 * i) / panelCount;
        const endAngle = (Math.PI * 2 * (i + 0.5)) / panelCount;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, bbR - 1, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = (i % 2 === 0 ? color : c2) + '66';
        ctx.fill();
      }
      // Shine
      ctx.beginPath();
      ctx.ellipse(-bbR*0.3, -bbR*0.3, bbR*0.15, bbR*0.25, -0.5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fill();
      // Outline again on top
      ctx.beginPath();
      ctx.arc(0, 0, bbR, 0, Math.PI*2);
      ctx.strokeStyle = '#ffffff44';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'duck': {
      const dR = r.radius || 18;
      // Body (round yellow)
      ctx.beginPath();
      ctx.arc(0, 0, dR, 0, Math.PI*2);
      ctx.fillStyle = '#ffdd00cc';
      ctx.fill();
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Head bump
      ctx.beginPath();
      ctx.arc(dR*0.4, -dR*0.7, dR*0.55, 0, Math.PI*2);
      ctx.fillStyle = '#ffdd00cc';
      ctx.fill();
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Eye
      ctx.beginPath();
      ctx.arc(dR*0.55, -dR*0.85, 3, 0, Math.PI*2);
      ctx.fillStyle = '#000';
      ctx.fill();
      // Eye shine
      ctx.beginPath();
      ctx.arc(dR*0.6, -dR*0.9, 1.2, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      // Beak
      ctx.beginPath();
      ctx.moveTo(dR*0.85, -dR*0.65);
      ctx.lineTo(dR*1.2, -dR*0.7);
      ctx.lineTo(dR*0.85, -dR*0.5);
      ctx.closePath();
      ctx.fillStyle = '#ff6600';
      ctx.fill();
      // Wing
      ctx.beginPath();
      ctx.ellipse(-dR*0.15, dR*0.1, dR*0.5, dR*0.3, -0.3, 0, Math.PI*2);
      ctx.fillStyle = '#eebb0088';
      ctx.fill();
      ctx.strokeStyle = '#ffaa0066';
      ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'domino': {
      const dW = r.width || 12;
      const dH = r.height || 55;
      // Main tile
      ctx.fillStyle = '#1a1008';
      ctx.fillRect(-dW/2, -dH/2, dW, dH);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-dW/2, -dH/2, dW, dH);
      // Dividing line
      ctx.beginPath();
      ctx.moveTo(-dW/2, 0);
      ctx.lineTo(dW/2, 0);
      ctx.strokeStyle = color + 'aa';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Dots top half
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(0, -dH*0.25, 2.5, 0, Math.PI*2); ctx.fill();
      // Dots bottom half
      ctx.beginPath(); ctx.arc(-2.5, dH*0.18, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.5, dH*0.32, 2, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'anvil': {
      // Draw anvil using vertices
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let vi = 1; vi < verts.length; vi++) ctx.lineTo(verts[vi].x, verts[vi].y);
      ctx.closePath();
      ctx.fillStyle = '#666666';
      ctx.fill();
      ctx.strokeStyle = '#aaaaaa';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Highlight on top face
      if (verts.length >= 2) {
        ctx.beginPath();
        ctx.moveTo(verts[0].x, verts[0].y);
        ctx.lineTo(verts[1].x, verts[1].y);
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      // Weight text
      ctx.fillStyle = '#ffffff88';
      ctx.font = '14px VT323';
      ctx.textAlign = 'center';
      ctx.fillText('ANVIL', b.position.x, b.position.y + 4);
      ctx.textAlign = 'left';
      ctx.restore();
      return;
    }
    case 'trampoline': {
      const tw = r.width || 80;
      const th = r.height || 10;
      // Platform body
      ctx.fillStyle = '#00ff9944';
      ctx.fillRect(-tw/2, -th/2, tw, th);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-tw/2, -th/2, tw, th);
      // Spring coils underneath
      const coils = 5;
      const coilW = tw / (coils * 2);
      ctx.strokeStyle = '#00ff9988';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let ci = 0; ci < coils; ci++) {
        const cx = -tw/2 + coilW + ci * (tw / coils);
        ctx.moveTo(cx - coilW*0.4, th/2);
        ctx.lineTo(cx, th/2 + 8);
        ctx.lineTo(cx + coilW*0.4, th/2);
      }
      ctx.stroke();
      // "BOING" text
      ctx.fillStyle = '#00ff99aa';
      ctx.font = '11px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('BOING', 0, 0);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      break;
    }
    case 'conveyor': {
      const cw = r.width || 100;
      const ch = r.height || 12;
      const dir = r.dir || 1;
      // Belt body
      ctx.fillStyle = '#ff880044';
      ctx.fillRect(-cw/2, -ch/2, cw, ch);
      ctx.strokeStyle = '#ff8800';
      ctx.lineWidth = 2;
      ctx.strokeRect(-cw/2, -ch/2, cw, ch);
      // Animated chevrons showing direction
      const time = performance.now();
      const offset = (time / 80 * dir) % 20;
      ctx.strokeStyle = '#ff880088';
      ctx.lineWidth = 2;
      const chevCount = Math.floor(cw / 20) + 1;
      for (let ci = -1; ci < chevCount; ci++) {
        const cx = -cw/2 + ci * 20 + offset;
        if (cx < -cw/2 - 10 || cx > cw/2 + 10) continue;
        ctx.beginPath();
        if (dir > 0) {
          ctx.moveTo(cx, -ch/2 + 2);
          ctx.lineTo(cx + 6, 0);
          ctx.lineTo(cx, ch/2 - 2);
        } else {
          ctx.moveTo(cx, -ch/2 + 2);
          ctx.lineTo(cx - 6, 0);
          ctx.lineTo(cx, ch/2 - 2);
        }
        ctx.stroke();
      }
      // Direction label
      ctx.fillStyle = '#ff8800aa';
      ctx.font = '10px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(dir > 0 ? '▶▶▶' : '◀◀◀', 0, 0);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      break;
    }
    case 'bumper': {
      const bR = r.radius || 22;
      const flash = b.hitFlash || 0;
      const baseColor = flash > 0 ? '#ffffff' : color;
      const glowAlpha = flash > 0 ? 0.8 : 0.3;
      // Outer glow
      const grd = ctx.createRadialGradient(0, 0, bR*0.5, 0, 0, bR*1.8);
      grd.addColorStop(0, baseColor + Math.round(glowAlpha*255).toString(16).padStart(2,'0'));
      grd.addColorStop(1, baseColor + '00');
      ctx.beginPath();
      ctx.arc(0, 0, bR*1.8, 0, Math.PI*2);
      ctx.fillStyle = grd;
      ctx.fill();
      // Main circle
      ctx.beginPath();
      ctx.arc(0, 0, bR, 0, Math.PI*2);
      ctx.fillStyle = (flash > 0 ? '#ffffff' : color) + '88';
      ctx.fill();
      ctx.strokeStyle = flash > 0 ? '#ffffff' : color;
      ctx.lineWidth = 3;
      ctx.stroke();
      // Inner ring
      ctx.beginPath();
      ctx.arc(0, 0, bR*0.55, 0, Math.PI*2);
      ctx.strokeStyle = (flash > 0 ? '#ffffff' : '#ffdd00');
      ctx.lineWidth = 2;
      ctx.stroke();
      // Center dot
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI*2);
      ctx.fillStyle = flash > 0 ? '#ffffff' : '#ffdd00';
      ctx.fill();
      break;
    }
    case 'wrecking-anchor': {
      // Small red pivot point
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI*2);
      ctx.fillStyle = '#ff444488';
      ctx.fill();
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Mount bracket
      ctx.fillStyle = '#ff444466';
      ctx.fillRect(-10, -3, 20, 6);
      break;
    }
    case 'wrecking-ball': {
      const wbR = r.radius || 25;
      // Heavy dark sphere with metallic sheen
      const grad = ctx.createRadialGradient(-wbR*0.3, -wbR*0.3, wbR*0.1, 0, 0, wbR);
      grad.addColorStop(0, '#888888');
      grad.addColorStop(0.5, '#444444');
      grad.addColorStop(1, '#222222');
      ctx.beginPath();
      ctx.arc(0, 0, wbR, 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#666666';
      ctx.lineWidth = 3;
      ctx.stroke();
      // Highlight
      ctx.beginPath();
      ctx.ellipse(-wbR*0.3, -wbR*0.35, wbR*0.2, wbR*0.15, -0.4, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fill();
      // Ring at top (chain attachment)
      ctx.beginPath();
      ctx.arc(0, -wbR + 3, 5, 0, Math.PI*2);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.stroke();
      break;
    }
    case 'ragdoll-head': {
      const radius = r.radius || 8;
      // Glow
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI*2);
      ctx.fillStyle = color + 'cc';
      ctx.fill();
      ctx.strokeStyle = '#ffaa88';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
      // Eyes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-3, -2, 1.5, 0, Math.PI*2);
      ctx.arc(3, -2, 1.5, 0, Math.PI*2);
      ctx.fill();
      break;
    }
    case 'ragdoll-torso': {
      const tw = r.width || 11;
      const th = r.height || 24;
      ctx.shadowColor = color;
      ctx.shadowBlur = 6;
      ctx.fillStyle = color + 'bb';
      ctx.fillRect(-tw/2, -th/2, tw, th);
      ctx.strokeStyle = '#ffaa88';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-tw/2, -th/2, tw, th);
      ctx.shadowBlur = 0;
      break;
    }
    case 'ragdoll-limb': {
      const lw = r.width || 10;
      const lh = r.height || 6;
      ctx.shadowColor = color;
      ctx.shadowBlur = 5;
      ctx.fillStyle = color + 'aa';
      ctx.fillRect(-lw/2, -lh/2, lw, lh);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.strokeRect(-lw/2, -lh/2, lw, lh);
      ctx.shadowBlur = 0;
      break;
    }
    case 'ice': {
      const iS = r.size || 25;
      // Translucent icy block
      ctx.fillStyle = 'rgba(170,238,255,0.25)';
      ctx.fillRect(-iS/2, -iS/2, iS, iS);
      ctx.strokeStyle = '#aaeeff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-iS/2, -iS/2, iS, iS);
      // Internal cracks
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-iS*0.3, -iS*0.2);
      ctx.lineTo(0, iS*0.1);
      ctx.lineTo(iS*0.2, -iS*0.3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(iS*0.1, iS*0.1);
      ctx.lineTo(iS*0.3, iS*0.35);
      ctx.stroke();
      // Shine highlight
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.moveTo(-iS*0.35, -iS*0.45);
      ctx.lineTo(-iS*0.15, -iS*0.45);
      ctx.lineTo(-iS*0.35, -iS*0.25);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'fan': {
      const fw = r.width || 50;
      const fh = r.height || 40;
      // Housing
      ctx.fillStyle = '#0a2a3a';
      ctx.fillRect(-fw/2, -fh/2, fw, fh);
      ctx.strokeStyle = '#66ddff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-fw/2, -fh/2, fw, fh);
      // Fan blades (animated)
      const time = performance.now();
      const bladeAngle = time / 60;
      ctx.strokeStyle = '#66ddffcc';
      ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        const a = bladeAngle + (Math.PI*2/3)*i;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a)*fh*0.35, Math.sin(a)*fh*0.35);
        ctx.stroke();
      }
      // Center hub
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI*2);
      ctx.fillStyle = '#66ddff';
      ctx.fill();
      // Direction arrow (blows upward)
      ctx.fillStyle = '#66ddff88';
      ctx.font = '14px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('↑↑↑', 0, -fh/2 - 10);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      break;
    }
    case 'drawn': {
      // Draw the rectangle
      const w = b.bounds.max.x - b.bounds.min.x;
      const h = b.bounds.max.y - b.bounds.min.y;
      // Use vertices for drawn segments
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let i = 1; i < verts.length; i++) {
        ctx.lineTo(verts[i].x, verts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#ff660066';
      ctx.fill();
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      return;
    }
    case 'dino': {
      // Draw vertices as polygon
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let i = 1; i < verts.length; i++) {
        ctx.lineTo(verts[i].x, verts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = color + '44';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Eye
      ctx.fillStyle = '#ff0000';
      const cx = b.position.x + 5, cy = b.position.y - 10;
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      return;
    }
    case 'magnet': {
      const mw = r.width || 40;
      const mh = r.height || 50;
      const isAttract = color === '#ff4466';
      // Horseshoe magnet body
      ctx.fillStyle = '#888888';
      ctx.fillRect(-mw/2, -mh/2, mw, mh);
      // Red pole (left)
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(-mw/2, -mh/2, mw/2 - 2, mh*0.4);
      // Blue pole (right)
      ctx.fillStyle = '#3333ff';
      ctx.fillRect(2, -mh/2, mw/2 - 2, mh*0.4);
      // Border
      ctx.strokeStyle = isAttract ? '#ff4466' : '#4466ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-mw/2, -mh/2, mw, mh);
      // Label
      ctx.fillStyle = isAttract ? '#ff4466' : '#4466ff';
      ctx.font = '12px VT323';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isAttract ? 'PULL' : 'PUSH', 0, mh*0.15);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      break;
    }
    case 'target': {
      const tR = r.radius || 25;
      // Concentric rings: red/white/red/white/red
      const ringColors = ['#ff3333','#ffffff','#ff3333','#ffffff','#ff3333'];
      for (let i = 4; i >= 0; i--) {
        const ringR = tR * (i + 1) / 5;
        ctx.beginPath();
        ctx.arc(0, 0, ringR, 0, Math.PI*2);
        ctx.fillStyle = ringColors[i];
        ctx.fill();
      }
      // Bullseye center dot
      ctx.beginPath();
      ctx.arc(0, 0, tR * 0.12, 0, Math.PI*2);
      ctx.fillStyle = '#ffdd00';
      ctx.fill();
      break;
    }
    case 'pin': {
      const pw = r.width || 14;
      const ph = r.height || 60;
      // Main body - cream white
      ctx.fillStyle = '#fff8ee';
      ctx.fillRect(-pw/2, -ph/2, pw, ph);
      // Rounded top cap
      ctx.beginPath();
      ctx.arc(0, -ph/2, pw/2 + 1, Math.PI, 0);
      ctx.fillStyle = '#fff8ee';
      ctx.fill();
      // Red neck stripe
      ctx.fillStyle = '#cc2222';
      ctx.fillRect(-pw/2, -ph*0.15, pw, ph*0.06);
      ctx.fillRect(-pw/2, -ph*0.08, pw, ph*0.06);
      // Outline
      ctx.strokeStyle = '#ccbbaa';
      ctx.lineWidth = 1;
      ctx.strokeRect(-pw/2, -ph/2, pw, ph);
      break;
    }
    case 'seesaw-plank': {
      const sw = r.width || 120;
      const sh = r.height || 8;
      ctx.fillStyle = '#aa8844';
      ctx.fillRect(-sw/2, -sh/2, sw, sh);
      ctx.strokeStyle = '#ccaa55';
      ctx.lineWidth = 1;
      ctx.strokeRect(-sw/2, -sh/2, sw, sh);
      // Wood grain lines
      ctx.strokeStyle = '#99773344';
      ctx.lineWidth = 0.5;
      for (let i = -sw/2 + 10; i < sw/2; i += 20) {
        ctx.beginPath();
        ctx.moveTo(i, -sh/2);
        ctx.lineTo(i, sh/2);
        ctx.stroke();
      }
      break;
    }
    case 'jenga': {
      // Wooden Jenga block with grain lines
      const jw = r.width || 26, jh = r.height || 18;
      const verts = b.vertices;
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let v = 1; v < verts.length; v++) ctx.lineTo(verts[v].x, verts[v].y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      // Wood grain
      ctx.strokeStyle = '#a07830';
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = 0.4;
      for (let g = 0; g < 3; g++) {
        const gy = b.position.y - 6 + g * 5;
        ctx.beginPath();
        ctx.moveTo(b.position.x - 15, gy);
        ctx.lineTo(b.position.x + 15, gy);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // Outline
      ctx.strokeStyle = '#8a6e2f';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      for (let v = 1; v < verts.length; v++) ctx.lineTo(verts[v].x, verts[v].y);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      return;
    }
    case 'seesaw-pivot': {
      const pvH = r.height || 20;
      ctx.beginPath();
      ctx.moveTo(0, -pvH/2);
      ctx.lineTo(pvH*0.6, pvH/2);
      ctx.lineTo(-pvH*0.6, pvH/2);
      ctx.closePath();
      ctx.fillStyle = '#886633';
      ctx.fill();
      ctx.strokeStyle = '#aa8844';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      break;
    }
    default: {
      // Generic polygon
      ctx.restore();
      ctx.save();
      const verts = b.vertices;
      if (verts && verts.length) {
        ctx.beginPath();
        ctx.moveTo(verts[0].x, verts[0].y);
        for (let i = 1; i < verts.length; i++) {
          ctx.lineTo(verts[i].x, verts[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = '#00ff4122';
        ctx.fill();
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
  }
  ctx.restore();
}

function drawWalls() {
  ctx.strokeStyle = '#0abdc644';
  ctx.lineWidth = 2;
  walls.forEach(w => {
    const v = w.vertices;
    ctx.beginPath();
    ctx.moveTo(v[0].x, v[0].y);
    for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath();
    ctx.stroke();
  });

  // Floor indicator line
  if (walls[0]) {
    const floorY = walls[0].position.y - 20;
    ctx.strokeStyle = '#0abdc6';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(0, floorY);
    ctx.lineTo(canvas.width, floorY);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawConstraints() {
  const constraints = Composite.allConstraints(world);
  // Check which constraints are wrecking ball chains
  const wreckingChains = new Set(wreckingBalls.map(wb => wb.chain));
  constraints.forEach(c => {
    if (!c.bodyA || !c.bodyB) return;
    const pA = Vector.add(c.bodyA.position, Vector.rotate(c.pointA, c.bodyA.angle));
    const pB = Vector.add(c.bodyB.position, Vector.rotate(c.pointB, c.bodyB.angle));
    if (wreckingChains.has(c)) {
      // Draw chain links
      const dx = pB.x - pA.x, dy = pB.y - pA.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const links = Math.max(Math.floor(dist / 12), 3);
      for (let i = 0; i < links; i++) {
        const t = i / links;
        const lx = pA.x + dx * t;
        const ly = pA.y + dy * t;
        ctx.beginPath();
        ctx.arc(lx, ly, 3, 0, Math.PI*2);
        ctx.strokeStyle = i % 2 === 0 ? '#888888' : '#666666';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.strokeStyle = '#0abdc688';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
}

function drawSlingshot() {
  if (!slingStart || !slingCurrent || drawMode) return;
  const dx = slingStart.x - slingCurrent.x;
  const dy = slingStart.y - slingCurrent.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 10) return;

  // Direction line
  ctx.beginPath();
  ctx.moveTo(slingStart.x, slingStart.y);
  ctx.lineTo(slingStart.x + dx*0.5, slingStart.y + dy*0.5);
  ctx.strokeStyle = '#00ff41';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Power indicator
  const power = Math.min(dist / 15, 25);
  ctx.fillStyle = '#00ff41';
  ctx.font = '16px VT323';
  ctx.fillText(`PWR: ${Math.round(power)}`, slingStart.x + 15, slingStart.y - 15);

  // Launch dot
  ctx.beginPath();
  ctx.arc(slingStart.x, slingStart.y, 6, 0, Math.PI*2);
  ctx.fillStyle = '#00ff4188';
  ctx.fill();
  ctx.strokeStyle = '#00ff41';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Rubber band lines
  ctx.beginPath();
  ctx.moveTo(slingCurrent.x, slingCurrent.y);
  ctx.lineTo(slingStart.x, slingStart.y);
  ctx.strokeStyle = '#ff660088';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawDrawing() {
  if (!drawMode || drawPoints.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
  for (let i = 1; i < drawPoints.length; i++) {
    ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
  }
  ctx.strokeStyle = '#ff6600';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawRopes() {
  for (const rope of ropes) {
    if (!rope.bodyA || !rope.bodyB) continue;
    const ax = rope.bodyA.position.x, ay = rope.bodyA.position.y;
    const bx = rope.bodyB.position.x, by = rope.bodyB.position.y;
    const dx = bx - ax, dy = by - ay;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const segs = Math.max(6, Math.floor(dist / 15));
    // Draw sagging rope segments
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    for (let s = 1; s <= segs; s++) {
      const t = s / segs;
      const mx = ax + dx * t;
      const sag = Math.sin(t * Math.PI) * dist * 0.08;
      const my = ay + dy * t + sag;
      ctx.lineTo(mx, my);
    }
    ctx.stroke();
    // Rope highlight
    ctx.strokeStyle = '#cc884466';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    for (let s = 1; s <= segs; s++) {
      const t = s / segs;
      const mx = ax + dx * t;
      const sag = Math.sin(t * Math.PI) * dist * 0.08 - 1;
      const my = ay + dy * t + sag;
      ctx.lineTo(mx, my);
    }
    ctx.stroke();
    // Knot dots at ends
    ctx.fillStyle = '#6B4914';
    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI*2); ctx.fill();
  }
  // Highlight selected first body for rope tool
  if (ropeFirstBody && currentTool === 'rope') {
    ctx.strokeStyle = '#cc8844';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(ropeFirstBody.position.x, ropeFirstBody.position.y, 30, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1; // gravity on particles
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;

    if (p.isDust) {
      // Dust: soft round puffs that expand and fade
      p.vx *= 0.96; // air drag
      p.vy *= 0.95;
      p.size += 0.15; // expand as it dissipates
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    } else if (p.isConfetti) {
      // Confetti: tumbling rectangles that flutter
      p.vx *= 0.99; // air drag
      p.vy += Math.sin(p.x * 0.1) * 0.03; // flutter
      if (!p.spin) p.spin = Math.random() * Math.PI * 2;
      p.spin += 0.15;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin);
      const w = p.size * 1.5;
      const h = p.size * 0.7;
      ctx.fillRect(-w/2, -h/2, w, h);
      ctx.restore();
    } else if (p.isBirthFlash) {
      // Bright sparkle that fades
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life / 0.4), 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += (r.maxR - r.r) * 0.22;
    r.alpha -= dt * 1.8;
    if (r.alpha <= 0.01) { ripples.splice(i, 1); continue; }

    const progress = Math.min(r.r / r.maxR, 1);
    ctx.globalAlpha = r.alpha;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = Math.max(0.5, 2.5 - progress * 1.8);
    ctx.shadowColor = r.color;
    ctx.shadowBlur = 8 * (1 - progress);
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.r += (ex.maxR - ex.r) * 0.15;
    ex.alpha -= dt * 2;
    if (ex.alpha <= 0) { explosions.splice(i, 1); continue; }
    if (ex.isBirthRing) {
      // White expanding ring for spawn effect
      ctx.globalAlpha = ex.alpha * 0.7;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00ff41';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ex.alpha -= dt * 1.5; // fade faster
    } else {
      ctx.globalAlpha = ex.alpha * 0.4;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2);
      ctx.fillStyle = '#ff6600';
      ctx.fill();
      ctx.globalAlpha = ex.alpha * 0.6;
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawWindIndicator() {
  if (windTimer <= 0) return;
  const dir = windForce > 0 ? '→' : '←';
  ctx.fillStyle = '#0abdc6';
  ctx.font = '24px VT323';
  ctx.textAlign = 'center';
  ctx.fillText(`WIND ${dir}${dir}${dir}`, canvas.width/2, 40);
  ctx.textAlign = 'left';
}

function drawGrid() {
  ctx.strokeStyle = '#0a1a1a';
  ctx.lineWidth = 0.5;
  const step = 50;
  for (let x = 0; x < canvas.width; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

// ── MAIN LOOP ──
let lastTime = 0;

function loop(timestamp) {
  requestAnimationFrame(loop);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Smooth gravity transition (skip during anti-grav pulse and gravity flip)
  if (!antiGravActive && gravityAngle === 0) {
    const currentG = engine.gravity.y;
    engine.gravity.y += (gravityTarget - currentG) * 0.05;
  }

  // Wind
  if (windTimer > 0) {
    windTimer--;
    const allBodies = Composite.allBodies(world);
    allBodies.forEach(b => {
      if (!b.isStatic) Body.applyForce(b, b.position, {x: windForce, y: 0});
    });
  }

  // Ocean mode — water drag + bubbles
  if (oceanMode) {
    const allOcean = Composite.allBodies(world);
    allOcean.forEach(b => {
      if (b.isStatic) return;
      // Water drag: opposing force proportional to velocity
      const drag = 0.0008;
      Body.applyForce(b, b.position, {
        x: -b.velocity.x * drag * b.mass,
        y: -b.velocity.y * drag * b.mass
      });
    });
    // Spawn bubble particles from bottom
    if (Math.random() < 0.3) {
      oceanBubbles.push({
        x: Math.random() * canvas.width,
        y: canvas.height + 5,
        r: 2 + Math.random() * 5,
        speed: 0.5 + Math.random() * 1.5,
        wobble: Math.random() * Math.PI * 2,
        alpha: 0.3 + Math.random() * 0.4
      });
    }
    // Update bubbles
    for (let i = oceanBubbles.length - 1; i >= 0; i--) {
      const bub = oceanBubbles[i];
      bub.y -= bub.speed;
      bub.x += Math.sin(bub.wobble + bub.y * 0.02) * 0.3;
      if (bub.y < -10) oceanBubbles.splice(i, 1);
    }
  }

  // Balloon buoyancy — float upward
  const allBalloons = Composite.allBodies(world);
  allBalloons.forEach(b => {
    if (b.isBalloon && !b.isStatic) {
      // Upward force (anti-gravity + extra lift)
      const lift = -0.0008 - engine.gravity.y * b.mass * 0.0012;
      Body.applyForce(b, b.position, { x: 0, y: lift });
      // Gentle sideways drift
      const drift = Math.sin(timestamp / 800 + b.position.x * 0.01) * 0.00005;
      Body.applyForce(b, b.position, { x: drift, y: 0 });
    }
  });

  // Anti-gravity pulse
  if (antiGravActive && antiGravTimer > 0) {
    antiGravTimer--;
    engine.gravity.y = -0.5; // reversed gravity
    // Floating sparkle particles
    if (antiGravTimer % 8 === 0) {
      particles.push({
        x: Math.random() * canvas.width,
        y: canvas.height * 0.6 + Math.random() * canvas.height * 0.4,
        vx: (Math.random()-0.5)*1.5,
        vy: -(1 + Math.random()*3),
        life: 0.6 + Math.random()*0.6,
        color: ['#0abdc6','#cc00ff','#00ff41'][Math.floor(Math.random()*3)],
        size: 1 + Math.random()*2
      });
    }
    if (antiGravTimer <= 0) {
      antiGravActive = false;
      // Snap gravity back — the "drop" is the fun part
      engine.gravity.y = gravityTarget;
      shakeIntensity = 12;
      playBoom();
    }
  }

  // Black hole
  if (blackHoleActive && blackHoleTimer > 0) {
    blackHoleTimer--;
    const allBH = Composite.allBodies(world);
    allBH.forEach(b => {
      if (b.isStatic) return;
      const dx = blackHolePos.x - b.position.x;
      const dy = blackHolePos.y - b.position.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 5) {
        const strength = 0.004 / Math.max(dist/200, 0.3);
        Body.applyForce(b, b.position, {
          x: (dx/dist) * strength,
          y: (dy/dist) * strength
        });
      }
      // Spaghettification spin
      if (dist < 80) {
        Body.setAngularVelocity(b, b.angularVelocity + (Math.random()-0.5)*0.05);
      }
    });
    if (blackHoleTimer % 10 === 0) shakeIntensity = Math.max(shakeIntensity, 3);
    if (blackHoleTimer <= 0) {
      blackHoleActive = false;
      // Final burst — everything gets flung outward
      allBH.forEach(b => {
        if (b.isStatic) return;
        const dx = b.position.x - blackHolePos.x;
        const dy = b.position.y - blackHolePos.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 0) {
          Body.applyForce(b, b.position, {
            x: (dx/dist) * 0.05,
            y: (dy/dist) * 0.05
          });
        }
      });
      shakeIntensity = 20;
      playBoom();
      // Burst particles
      for (let i = 0; i < 50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 8;
        particles.push({
          x: blackHolePos.x, y: blackHolePos.y,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 0.5 + Math.random()*1,
          color: ['#9900ff','#6600cc','#cc00ff','#0abdc6','#ffffff'][Math.floor(Math.random()*5)],
          size: 2 + Math.random()*4
        });
      }
    }
  }
  if (blackHoleAlpha > 0 && !blackHoleActive) {
    blackHoleAlpha -= dt * 2;
    if (blackHoleAlpha < 0) blackHoleAlpha = 0;
  }

  // Rocket thrust
  rocketBodies = rocketBodies.filter(r => {
    if (!Composite.get(world, r.id, 'body')) return false;
    if (!r.isSleeping) {
      Body.applyForce(r, r.position, {
        x: Math.sin(r.angle) * 0.002,
        y: -Math.cos(r.angle) * 0.002
      });
    }
    return true;
  });

  // Time warp (slow-motion)
  if (timeWarpActive && timeWarpTimer > 0) {
    timeWarpTimer--;
    if (timeWarpTimer <= 0) {
      timeWarpActive = false;
      // Speed resume burst
      shakeIntensity = 10;
      playSound(800, 0.15, 'sine', 0.1);
      playSound(1200, 0.2, 'square', 0.06);
    }
  }

  // Portal teleportation
  if (portals.length === 2) {
    // Decay cooldowns
    portalCooldowns.forEach((val, key) => {
      if (val <= 0) portalCooldowns.delete(key);
      else portalCooldowns.set(key, val - 1);
    });

    const allPortalBodies = Composite.allBodies(world);
    allPortalBodies.forEach(b => {
      if (b.isStatic) return;
      if (portalCooldowns.has(b.id)) return;
      for (let pi = 0; pi < 2; pi++) {
        const portal = portals[pi];
        const other = portals[portal.partner];
        const dx = b.position.x - portal.x;
        const dy = b.position.y - portal.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < portal.radius) {
          // Teleport!
          Body.setPosition(b, { x: other.x, y: other.y });
          // Preserve velocity direction but add a small outward push
          const speed = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
          Body.setVelocity(b, { x: b.velocity.x * 1.1, y: b.velocity.y * 1.1 });
          portalCooldowns.set(b.id, 30); // cooldown to prevent ping-pong
          // Teleport particles at exit
          for (let i = 0; i < 10; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = 1 + Math.random() * 3;
            particles.push({
              x: other.x, y: other.y,
              vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
              life: 0.3 + Math.random()*0.3,
              color: other.color,
              size: 2 + Math.random()*2
            });
          }
          playSound(1000 + Math.random()*500, 0.1, 'sine', 0.06);
          break; // only teleport through one portal per frame
        }
      }
    });
  }

  // Clean up wrecking balls
  wreckingBalls = wreckingBalls.filter(wb => Composite.get(world, wb.ball.id, 'body'));

  // Bumper flash decay
  bumpers = bumpers.filter(bmp => Composite.get(world, bmp.id, 'body'));
  bumpers.forEach(bmp => {
    if (bmp.hitFlash > 0) bmp.hitFlash -= dt * 5;
    if (bmp.hitFlash < 0) bmp.hitFlash = 0;
  });

  // Mega bounce timer
  if (megaBounceActive && megaBounceTimer > 0) {
    megaBounceTimer--;
    // Apply to newly spawned objects too
    const allMB = Composite.allBodies(world);
    allMB.forEach(b => {
      if (!b.isStatic && !megaBounceOriginal.has(b.id)) {
        megaBounceOriginal.set(b.id, b.restitution);
        b.restitution = 1.2;
      }
    });
    if (megaBounceTimer <= 0) {
      megaBounceActive = false;
      // Restore original restitution
      const allRestore = Composite.allBodies(world);
      allRestore.forEach(b => {
        if (megaBounceOriginal.has(b.id)) {
          b.restitution = megaBounceOriginal.get(b.id);
        }
      });
      walls.forEach(w => { w.restitution = 0.3; });
      megaBounceOriginal.clear();
      playSound(300, 0.2, 'sine', 0.08);
    }
  }

  // Vortex
  if (vortexActive && vortexTimer > 0) {
    vortexTimer--;
    const allV = Composite.allBodies(world);
    allV.forEach(b => {
      if (b.isStatic) return;
      const dx = b.position.x - vortexCenter.x;
      const dy = b.position.y - vortexCenter.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      // Tangential force (spin) + slight inward pull
      const tangentX = -dy / dist;
      const tangentY = dx / dist;
      const spinStrength = 0.003;
      const pullStrength = 0.0008;
      Body.applyForce(b, b.position, {
        x: tangentX * spinStrength - (dx/dist) * pullStrength,
        y: tangentY * spinStrength - (dy/dist) * pullStrength
      });
      Body.setAngularVelocity(b, b.angularVelocity + 0.01);
    });
    // Swirl particles
    if (vortexTimer % 6 === 0) {
      const a = (performance.now()/200) + Math.random()*Math.PI*2;
      const d = 20 + Math.random()*80;
      particles.push({
        x: vortexCenter.x + Math.cos(a)*d, y: vortexCenter.y + Math.sin(a)*d,
        vx: Math.cos(a+Math.PI/2)*2, vy: Math.sin(a+Math.PI/2)*2,
        life: 0.5, color: ['#ff00ff','#cc00ff','#ff66cc'][Math.floor(Math.random()*3)],
        size: 1 + Math.random()*2
      });
    }
    if (vortexTimer <= 0) {
      vortexActive = false;
      shakeIntensity = 12;
      playBoom();
    }
  }

  // Tornado
  if (tornadoActive && tornadoTimer > 0) {
    tornadoTimer--;
    tornadoX += tornadoDir * 2.5;
    const tornadoY = canvas.height * 0.6;
    const tornadoRadius = 120;
    const allT = Composite.allBodies(world);
    allT.forEach(b => {
      if (b.isStatic) return;
      const dx = b.position.x - tornadoX;
      const dy = b.position.y - tornadoY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < tornadoRadius && dist > 5) {
        // Upward suction + circular spin
        const strength = 0.004 * (1 - dist/tornadoRadius);
        const tangentX = -dy / dist;
        const tangentY = dx / dist;
        Body.applyForce(b, b.position, {
          x: tangentX * strength * 0.5 + (tornadoX - b.position.x) / dist * strength * 0.3,
          y: -strength * 1.5
        });
        Body.setAngularVelocity(b, b.angularVelocity + (Math.random()-0.5)*0.1);
      }
    });
    // Debris particles
    if (tornadoTimer % 3 === 0) {
      const angle = Math.random() * Math.PI * 2;
      const d = Math.random() * 60;
      particles.push({
        x: tornadoX + Math.cos(angle)*d,
        y: tornadoY + Math.sin(angle)*d - Math.random()*80,
        vx: Math.cos(angle+Math.PI/2)*3 + tornadoDir,
        vy: -(1 + Math.random()*3),
        life: 0.5 + Math.random()*0.5,
        color: ['#ff8800','#ffaa33','#cc6600','#886633'][Math.floor(Math.random()*4)],
        size: 1 + Math.random()*3
      });
    }
    if (tornadoTimer % 8 === 0) shakeIntensity = Math.max(shakeIntensity, 4);
    if (tornadoTimer <= 0) {
      tornadoActive = false;
      shakeIntensity = 15;
      playBoom();
    }
  }

  // Freeze timer
  if (freezeActive && freezeTimer > 0) {
    freezeTimer--;
    if (freezeTimer <= 0) {
      freezeActive = false;
      // Unfreeze everything!
      const allBodies = Composite.allBodies(world);
      allBodies.forEach(b => {
        if (b._wasFrozen) {
          b.isStatic = false;
          b._wasFrozen = false;
          const saved = frozenVelocities.get(b.id);
          if (saved) {
            Body.setVelocity(b, { x: saved.vx, y: saved.vy });
            Body.setAngularVelocity(b, saved.av);
          }
          // Wake it up
          Body.setStatic(b, false);
        }
      });
      frozenVelocities.clear();
      shakeIntensity = 15;
      playBoom();
      playSound(600, 0.2, 'sine', 0.1);
      // Thaw burst particles
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
          life: 0.5 + Math.random()*0.5,
          color: ['#00ddff','#ffffff'][Math.floor(Math.random()*2)],
          size: 2 + Math.random()*3
        });
      }
    }
  }

  // Conveyor belt physics
  conveyors = conveyors.filter(c => Composite.get(world, c.id, 'body'));
  if (conveyors.length > 0) {
    const allConvBodies = Composite.allBodies(world);
    allConvBodies.forEach(b => {
      if (b.isStatic) return;
      conveyors.forEach(conv => {
        // Check if body is resting on conveyor (overlapping bounds + close Y)
        const bBottom = b.bounds.max.y;
        const cTop = conv.bounds.min.y;
        const cBottom = conv.bounds.max.y;
        const bCenterX = b.position.x;
        if (bBottom >= cTop - 4 && bBottom <= cBottom + 8 &&
            bCenterX >= conv.bounds.min.x - 10 && bCenterX <= conv.bounds.max.x + 10) {
          Body.applyForce(b, b.position, { x: conv.conveyorDir * 0.0008, y: 0 });
        }
      });
    });
  }

  // Fan blower physics
  {
    const allFanBodies = Composite.allBodies(world);
    const fans = allFanBodies.filter(b => b.isFan);
    if (fans.length > 0) {
      allFanBodies.forEach(b => {
        if (b.isStatic) return;
        fans.forEach(fan => {
          const dx = b.position.x - fan.position.x;
          const dy = b.position.y - fan.position.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          // Fan blows upward from its position
          if (dist < fan.fanRange && dist > 5) {
            // Check if object is above the fan and within horizontal cone
            if (dy < 0 && Math.abs(dx) < fan.fanRange * 0.6) {
              const strength = fan.fanStrength * (1 - dist/fan.fanRange);
              Body.applyForce(b, b.position, {
                x: dx * 0.00002, // slight horizontal spread
                y: -strength
              });
            }
          }
        });
      });
      // Wind particles from fans
      if (timestamp % 80 < 16) {
        fans.forEach(fan => {
          particles.push({
            x: fan.position.x + (Math.random()-0.5)*40,
            y: fan.position.y - 20,
            vx: (Math.random()-0.5)*1.5,
            vy: -(3 + Math.random()*4),
            life: 0.4 + Math.random()*0.4,
            color: '#66ddff',
            size: 1 + Math.random()*2
          });
        });
      }
    }
  }

  // Magnet force
  magnets = magnets.filter(m => Composite.get(world, m.body.id, 'body'));
  if (magnets.length > 0) {
    const allMagBodies = Composite.allBodies(world);
    allMagBodies.forEach(b => {
      if (b.isStatic) return;
      magnets.forEach(mag => {
        const dx = mag.body.position.x - b.position.x;
        const dy = mag.body.position.y - b.position.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150 && dist > 10) {
          const strength = 0.002 / (dist / 50);
          const dir = mag.attracting ? 1 : -1;
          Body.applyForce(b, b.position, {
            x: (dx/dist) * strength * dir,
            y: (dy/dist) * strength * dir
          });
        }
      });
    });
  }

  // Target practice timer
  if (targetMode && targetTimer > 0) {
    targetTimer--;
    // Check if all targets hit
    const remaining = targetBodies.filter(t => !t.targetHit);
    if (remaining.length === 0 && !targetCleared) {
      targetCleared = true;
      targetClearedTimer = 180; // 3 seconds of "CLEARED!"
      targetScore += 50; // bonus
      shakeIntensity = 20;
      chromaticAberration = 6;
      playSound(1000, 0.3, 'sine', 0.15);
      playSound(1200, 0.2, 'sine', 0.1);
      playSound(1500, 0.15, 'sine', 0.08);
      // Fanfare particles
      for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 6;
        particles.push({
          x: canvas.width/2, y: canvas.height/2,
          vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 1 + Math.random(), color: ['#ffdd00','#ff3333','#00ff41','#ffffff'][Math.floor(Math.random()*4)],
          size: 3 + Math.random()*4
        });
      }
    }
    if (targetClearedTimer > 0) targetClearedTimer--;
    if (targetTimer <= 0) {
      // Time's up — remove remaining targets
      targetBodies.forEach(t => {
        if (Composite.get(world, t.id, 'body')) Composite.remove(world, t);
      });
      targetBodies = [];
      targetMode = false;
    }
  }

  // Popcorn mode
  if (popcornActive && popcornTimer > 0) {
    popcornTimer--;
    if (popcornTimer % 15 === 0) {
      const dynBods = Composite.allBodies(world).filter(b => !b.isStatic);
      if (dynBods.length > 0) {
        const target = dynBods[Math.floor(Math.random() * dynBods.length)];
        const popForce = 0.03 + Math.random() * 0.04;
        Body.applyForce(target, target.position, { x: (Math.random()-0.5)*0.02, y: -popForce });
        Body.setAngularVelocity(target, (Math.random()-0.5)*0.3);
        // Pop particles
        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          particles.push({
            x: target.position.x, y: target.position.y,
            vx: Math.cos(angle)*2, vy: Math.sin(angle)*2 - 2,
            life: 0.3 + Math.random()*0.3,
            color: ['#ffdd00','#ffffff','#ff8800'][Math.floor(Math.random()*3)],
            size: 2 + Math.random()*2
          });
        }
        if (popcornTimer % 30 === 0) playSound(600 + Math.random()*600, 0.06, 'sine', 0.06);
      }
    }
    if (popcornTimer <= 0) {
      popcornActive = false;
    }
  }

  // Chromatic aberration decay
  if (chromaticAberration > 0) {
    chromaticAberration *= 0.92;
    if (chromaticAberration < 0.3) chromaticAberration = 0;
  }

  // Ultra chaos mode (Konami code)
  if (ultraChaosActive && ultraChaosTimer > 0) {
    ultraChaosTimer--;
    // Every 20 frames, trigger a random chaos event
    if (ultraChaosTimer % 20 === 0) {
      const actions = [
        () => { // mini explosion
          const ex = 50 + Math.random() * (canvas.width-100);
          const ey = 50 + Math.random() * (canvas.height-100);
          explosions.push({ x:ex, y:ey, r:0, maxR:100, alpha:0.8 });
          const ab = Composite.allBodies(world);
          ab.forEach(b => {
            if (b.isStatic) return;
            const ddx = b.position.x - ex, ddy = b.position.y - ey;
            const dd = Math.sqrt(ddx*ddx + ddy*ddy);
            if (dd < 100 && dd > 0) Body.applyForce(b, b.position, {x:(ddx/dd)*0.04, y:(ddy/dd)*0.04});
          });
        },
        () => { // spawn random object
          const types = ['ball','star','duck','bomb','balloon'];
          const old = currentTool;
          currentTool = types[Math.floor(Math.random()*types.length)];
          spawnObject(Math.random()*canvas.width, -20, (Math.random()-0.5)*5, 3+Math.random()*5);
          currentTool = old;
        },
        () => { // random gravity nudge
          const ab = Composite.allBodies(world);
          ab.forEach(b => { if (!b.isStatic) Body.applyForce(b, b.position, {x:(Math.random()-0.5)*0.03, y:(Math.random()-0.5)*0.03}); });
        }
      ];
      actions[Math.floor(Math.random()*actions.length)]();
    }
    // Flashing background tint
    if (ultraChaosTimer % 10 < 5) {
      const hue = (timestamp / 5) % 360;
      // stored for render phase
      window._ultraChaosHue = hue;
    }
    if (ultraChaosTimer <= 0) {
      ultraChaosActive = false;
      window._ultraChaosHue = null;
    }
  }

  // Gravity flip label timer
  if (window._gravFlipTimer > 0) window._gravFlipTimer--;

  // Shake
  if (shakeIntensity > 0) {
    shakeOffset.x = (Math.random()-0.5) * shakeIntensity;
    shakeOffset.y = (Math.random()-0.5) * shakeIntensity;
    shakeIntensity *= 0.92;
    if (shakeIntensity < 0.5) shakeIntensity = 0;
  } else {
    shakeOffset.x = 0;
    shakeOffset.y = 0;
  }

  // Physics step
  if (!paused) {
    const timeScale = (timeWarpActive || sloMoActive) ? 0.2 : 1;
    Engine.update(engine, (1000/60) * timeScale);
  }

  // Update object count
  const allBodies = Composite.allBodies(world);
  const dynamicCount = allBodies.filter(b => !b.isStatic).length;
  document.getElementById('obj-count').textContent = dynamicCount;
  updateSpawnPopAnimations(timestamp);

  // Record trails for fast-moving objects
  allBodies.forEach(b => {
    if (b.isStatic) return;
    const speed = Math.sqrt(b.velocity.x * b.velocity.x + b.velocity.y * b.velocity.y);
    if (speed > 5) {
      const r = b.render || {};
      const trailColor = r.color || '#00ff41';
      const trailSize = r.radius || r.size || r.outerR || 15;
      trails.push({
        x: b.position.x,
        y: b.position.y,
        size: trailSize * 0.6,
        color: trailColor,
        alpha: Math.min(speed / 20, 0.7),
        life: 0.3
      });
    }
  });
  // Decay trails
  for (let i = trails.length - 1; i >= 0; i--) {
    trails[i].life -= dt;
    trails[i].alpha *= 0.92;
    if (trails[i].life <= 0 || trails[i].alpha < 0.02) {
      trails.splice(i, 1);
    }
  }

  // Per-body line trails (speed trails feature)
  const TRAIL_SPEED_THRESHOLD = 5;
  const MAX_TRAIL_LEN = 12;
  allBodies.forEach(b => {
    if (b.isStatic) return;
    const speed = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
    if (speed > TRAIL_SPEED_THRESHOLD) {
      if (!bodyTrails.has(b.id)) bodyTrails.set(b.id, []);
      const trail = bodyTrails.get(b.id);
      trail.unshift({ x: b.position.x, y: b.position.y });
      if (trail.length > MAX_TRAIL_LEN) trail.pop();
    } else {
      const trail = bodyTrails.get(b.id);
      if (trail) {
        trail.pop();
        if (trail.length === 0) bodyTrails.delete(b.id);
      }
    }
  });
  // Cleanup trails for removed bodies
  for (const [id] of bodyTrails) {
    if (!allBodies.find(b => b.id === id)) bodyTrails.delete(id);
  }

  // ── RENDER ──
  ctx.save();
  ctx.translate(shakeOffset.x, shakeOffset.y);

  // Clear
  ctx.fillStyle = '#080c10';
  ctx.fillRect(-10, -10, canvas.width+20, canvas.height+20);

  // Grid
  drawGrid();

  // Tap ripples
  drawRipples(dt);

  // Trails (afterimages - dot system)
  trails.forEach(t => {
    ctx.globalAlpha = t.alpha;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
    ctx.fillStyle = t.color;
    ctx.fill();
    // Glow ring
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size * 1.4, 0, Math.PI * 2);
    ctx.fillStyle = t.color + '22';
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Per-body speed trail lines
  bodyTrails.forEach((trail, bodyId) => {
    if (trail.length < 2) return;
    const b = allBodies.find(b2 => b2.id === bodyId);
    const color = b?.render?.color || '#00ff41';
    ctx.lineCap = 'round';
    for (let i = 0; i < trail.length - 1; i++) {
      const alpha = (1 - i / trail.length) * 0.55;
      const lineWidth = Math.max(1, (1 - i / trail.length) * 4);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(trail[i].x, trail[i].y);
      ctx.lineTo(trail[i+1].x, trail[i+1].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // Walls
  drawWalls();

  // Constraints (car axles)
  drawConstraints();

  // Speed glow on fast objects
  allBodies.forEach(b => {
    if (b.isStatic) return;
    const spd = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
    if (spd > 5) {
      const intensity = Math.min((spd - 5) / 15, 1); // 0 at 5, 1 at 20
      const glowR = (b.render?.radius || b.render?.size || b.render?.outerR || 20) * (1.5 + intensity * 1.5);
      // Color: yellow → orange → red → white
      let glowColor;
      if (intensity < 0.33) glowColor = `rgba(255,255,0,${0.15 + intensity * 0.4})`;
      else if (intensity < 0.66) glowColor = `rgba(255,${Math.floor(165 - (intensity-0.33)*300)},0,${0.2 + intensity * 0.3})`;
      else if (intensity < 0.9) glowColor = `rgba(255,${Math.floor(50 - (intensity-0.66)*100)},0,${0.25 + intensity * 0.25})`;
      else glowColor = `rgba(255,255,255,${0.3 + intensity * 0.2})`;
      // Pulsing
      const pulse = 0.8 + Math.sin(performance.now() / 100 + b.id) * 0.2;
      const grd = ctx.createRadialGradient(b.position.x, b.position.y, 0, b.position.x, b.position.y, glowR * pulse);
      grd.addColorStop(0, glowColor);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(b.position.x, b.position.y, glowR * pulse, 0, Math.PI*2);
      ctx.fillStyle = grd;
      ctx.fill();
    }
  });

  // Magnet field lines
  magnets.forEach(mag => {
    const mx = mag.body.position.x, my = mag.body.position.y;
    const isAttract = mag.attracting;
    const col = isAttract ? 'rgba(255,68,102,' : 'rgba(68,102,255,';
    const time = performance.now();
    // Draw curved field arcs
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI*2/6)*i + time/2000;
      const dist = 60 + Math.sin(time/400 + i)*20;
      ctx.beginPath();
      ctx.arc(mx, my, dist, angle, angle + 0.8);
      ctx.strokeStyle = col + '0.2)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // Range circle
    ctx.beginPath();
    ctx.arc(mx, my, 150, 0, Math.PI*2);
    ctx.strokeStyle = col + '0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Bodies
  allBodies.forEach(b => {
    if (b.label === 'wall') return;
    drawBody(b);
  });

  // Effects
  drawRopes();
  drawExplosions(dt);
  drawParticles(dt);
  drawSlingshot();
  drawDrawing();
  // Black hole visual
  if (blackHoleActive || blackHoleAlpha > 0) {
    const bhA = blackHoleActive ? 1 : blackHoleAlpha;
    // Accretion disk rings
    for (let ring = 3; ring >= 0; ring--) {
      const ringR = 30 + ring * 25 + Math.sin(timestamp/200 + ring) * 5;
      ctx.beginPath();
      ctx.arc(blackHolePos.x, blackHolePos.y, ringR, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${ring % 2 === 0 ? '153,0,255' : '10,189,198'},${bhA * (0.15 - ring*0.03)})`;
      ctx.lineWidth = 3 - ring * 0.5;
      ctx.stroke();
    }
    // Event horizon
    const bhR = 20 + Math.sin(timestamp/100) * 3;
    const gradient = ctx.createRadialGradient(
      blackHolePos.x, blackHolePos.y, 0,
      blackHolePos.x, blackHolePos.y, bhR * 2
    );
    gradient.addColorStop(0, `rgba(0,0,0,${bhA})`);
    gradient.addColorStop(0.5, `rgba(40,0,80,${bhA * 0.6})`);
    gradient.addColorStop(1, `rgba(0,0,0,0)`);
    ctx.beginPath();
    ctx.arc(blackHolePos.x, blackHolePos.y, bhR * 2, 0, Math.PI*2);
    ctx.fillStyle = gradient;
    ctx.fill();
    // Core
    ctx.beginPath();
    ctx.arc(blackHolePos.x, blackHolePos.y, bhR * 0.6, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,0,0,${bhA})`;
    ctx.fill();
    // Swirl particles
    if (blackHoleActive) {
      for (let i = 0; i < 5; i++) {
        const sAngle = timestamp/300 + i * Math.PI*2/5;
        const sDist = 40 + Math.sin(timestamp/150 + i) * 20;
        const sx = blackHolePos.x + Math.cos(sAngle) * sDist;
        const sy = blackHolePos.y + Math.sin(sAngle) * sDist;
        ctx.beginPath();
        ctx.arc(sx, sy, 2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(153,0,255,${0.5 + Math.sin(timestamp/100+i)*0.3})`;
        ctx.fill();
      }
    }
    // Label
    if (blackHoleActive) {
      ctx.fillStyle = '#cc00ff';
      ctx.font = '20px VT323';
      ctx.textAlign = 'center';
      ctx.fillText('⚫ BLACK HOLE ACTIVE', blackHolePos.x, blackHolePos.y - 60);
      ctx.textAlign = 'left';
    }
  }

  // Portal rendering
  portals.forEach((portal, idx) => {
    const time = timestamp;
    const r = portal.radius;

    // Outer swirl rings
    for (let ring = 0; ring < 3; ring++) {
      const ringR = r + ring * 8 + Math.sin(time/200 + ring * 2) * 3;
      ctx.beginPath();
      ctx.arc(portal.x, portal.y, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = portal.color + (ring === 0 ? 'aa' : '44');
      ctx.lineWidth = 3 - ring;
      ctx.stroke();
    }

    // Swirling inner vortex
    const segments = 8;
    for (let i = 0; i < segments; i++) {
      const angle = (time / 400) + (Math.PI * 2 * i / segments);
      const innerDist = r * 0.3;
      const outerDist = r * 0.9;
      ctx.beginPath();
      ctx.moveTo(
        portal.x + Math.cos(angle) * innerDist,
        portal.y + Math.sin(angle) * innerDist
      );
      ctx.lineTo(
        portal.x + Math.cos(angle + 0.4) * outerDist,
        portal.y + Math.sin(angle + 0.4) * outerDist
      );
      ctx.strokeStyle = portal.color + '66';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Center glow
    const grd = ctx.createRadialGradient(portal.x, portal.y, 0, portal.x, portal.y, r);
    grd.addColorStop(0, portal.color + '88');
    grd.addColorStop(0.5, portal.color + '33');
    grd.addColorStop(1, portal.color + '00');
    ctx.beginPath();
    ctx.arc(portal.x, portal.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Label
    const label = portals.length === 2 ? (idx === 0 ? 'A' : 'B') : '?';
    ctx.fillStyle = portal.color;
    ctx.font = '18px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🌀 ' + label, portal.x, portal.y - r - 8);
    ctx.textAlign = 'left';

    // Connection line between linked portals
    if (portals.length === 2 && idx === 0) {
      ctx.beginPath();
      ctx.setLineDash([4, 8]);
      ctx.moveTo(portals[0].x, portals[0].y);
      ctx.lineTo(portals[1].x, portals[1].y);
      ctx.strokeStyle = '#cc00ff33';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  drawWindIndicator();

  // Gravity flip direction label
  if (window._gravFlipTimer > 0) {
    const alpha = Math.min(1, window._gravFlipTimer / 30);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffdd00';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('GRAVITY: ' + (window._gravFlipLabel || ''), canvas.width/2, canvas.height/2 - 20);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // Anti-gravity indicator
  if (antiGravActive) {
    ctx.fillStyle = '#cc00ff';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🫧 ZERO-G ACTIVE 🫧', canvas.width/2, 70);
    // Timer bar
    const barW = 200, barH = 6;
    const barX = canvas.width/2 - barW/2;
    const barY = 80;
    const pct = antiGravTimer / 240;
    ctx.fillStyle = '#cc00ff33';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#cc00ff';
    ctx.fillRect(barX, barY, barW * pct, barH);
    ctx.textAlign = 'left';
  }

  // Time warp indicator
  if (timeWarpActive) {
    // Purple tint overlay
    ctx.fillStyle = 'rgba(100,0,180,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Vignette edges
    const vigGrd = ctx.createRadialGradient(
      canvas.width/2, canvas.height/2, canvas.height * 0.3,
      canvas.width/2, canvas.height/2, canvas.height * 0.8
    );
    vigGrd.addColorStop(0, 'rgba(100,0,180,0)');
    vigGrd.addColorStop(1, 'rgba(100,0,180,0.15)');

    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#cc00ff';
    ctx.font = '32px VT323';
    ctx.textAlign = 'center';

    // Floating clock particles
    if (timeWarpTimer % 12 === 0) {

        y: Math.random() * canvas.height,

      });

  // Mega bounce indicator
  if (megaBounceActive) {
    ctx.fillStyle = '#00ff41';

    ctx.textAlign = 'center';

  // Ocean mode overlay
  if (oceanMode) {

      ctx.beginPath();
      ctx.arc(bub.x - bub.r*0.25, bub.y - bub.r*0.25, bub.r*0.3, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,240,255,${bub.alpha * 0.6})`;

    ctx.fillStyle = '#0088ff';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🌊 O C E A N   M O D E 🌊', canvas.width/2, antiGravActive ? 140 : megaBounceActive ? 100 : 50);

  // Freeze indicator
  if (freezeActive) {
    // Ice blue overlay

    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Frost border
    const frostGrd = ctx.createRadialGradient(
      canvas.width/2, canvas.height/2, canvas.height * 0.35,

    );
    frostGrd.addColorStop(0, 'rgba(0,200,255,0)');
    frostGrd.addColorStop(1, 'rgba(0,200,255,0.12)');
    ctx.fillStyle = frostGrd;

    // Label

    ctx.font = '32px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🧊 F R O Z E N 🧊', canvas.width/2, 50);
    ctx.globalAlpha = 1;
    // Timer bar
    const barW = 200, barH = 6;
    const barX = canvas.width/2 - barW/2;
    ctx.fillStyle = '#00ddff33';
    ctx.fillRect(barX, 62, barW, barH);
    ctx.fillStyle = '#00ddff';
    ctx.fillRect(barX, 62, barW * (freezeTimer/180), barH);
    ctx.textAlign = 'left';
    // Floating ice crystals
    if (freezeTimer % 10 === 0) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,

  // Ultra chaos mode visuals
  if (ultraChaosActive && window._ultraChaosHue != null) {

    ctx.textAlign = 'left';

  // Vortex visual
  if (vortexActive) {
    const time = timestamp;

    for (let ring = 0; ring < 4; ring++) {
      const ringR = 30 + ring * 35 + Math.sin(time/150 + ring) * 8;
      ctx.beginPath();

  // Lightning bolts between nearby fast objects
  {
    const dynBodies = allBodies.filter(b => !b.isStatic);

      const a = dynBodies[i];
      const sa = Math.sqrt(a.velocity.x*a.velocity.x + a.velocity.y*a.velocity.y);
      if (sa < 6) continue;
      for (let j = i+1; j < dynBodies.length; j++) {
        const b = dynBodies[j];
        const sb = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
        if (sb < 6) continue;
        const ddx = a.position.x - b.position.x;
        const ddy = a.position.y - b.position.y;
        const dist = Math.sqrt(ddx*ddx + ddy*ddy);
        if (dist < 120 && dist > 10 && Math.random() < 0.3) {
          // Draw jagged lightning bolt
          ctx.beginPath();
          ctx.moveTo(a.position.x, a.position.y);
          const segs = 4 + Math.floor(Math.random()*3);
          for (let s = 1; s < segs; s++) {
            const t = s / segs;
            const mx = a.position.x + (b.position.x - a.position.x)*t + (Math.random()-0.5)*20;
            const my = a.position.y + (b.position.y - a.position.y)*t + (Math.random()-0.5)*20;
            ctx.lineTo(mx, my);
          }
          ctx.lineTo(b.position.x, b.position.y);
          ctx.strokeStyle = `rgba(100,200,255,${0.5 + Math.random()*0.5})`;
          ctx.lineWidth = 1 + Math.random()*2;
          ctx.stroke();

          ctx.stroke();
        }
      }

  // Tornado visual
  if (tornadoActive) {
    const tornadoY = canvas.height * 0.6;
    // Funnel shape — widening upward
    for (let i = 0; i < 8; i++) {
      const t = i / 8;
      const funnelY = tornadoY - t * canvas.height * 0.5;
      const funnelW = 10 + t * 70;
      const sway = Math.sin(timestamp/200 + i * 0.8) * (5 + t * 15);
      ctx.beginPath();
      ctx.ellipse(tornadoX + sway, funnelY, funnelW, 8 + t * 4, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,136,0,${0.4 - t * 0.04})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    // Label
    const pulse = 0.6 + Math.sin(timestamp/150)*0.4;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff8800';
    ctx.font = '28px VT323';
    ctx.textAlign = 'center';
    ctx.fillText('🌪️ T O R N A D O 🌪️', tornadoX, tornadoY - canvas.height * 0.5 - 15);
    ctx.globalAlpha = 1;
    // Timer bar
    const barW = 150, barH = 5;
    ctx.fillStyle = '#ff880033';
    ctx.fillRect(tornadoX - barW/2, tornadoY - canvas.height * 0.5 - 5, barW, barH);
    ctx.fillStyle = '#ff8800';
    ctx.fillRect(tornadoX - barW/2, tornadoY - canvas.height * 0.5 - 5, barW * (tornadoTimer/360), barH);
    ctx.textAlign = 'left';
  }

  // Fire trails on very fast objects
  {
    const fireThreshold = 10;
    const dynBodies2 = allBodies.filter(b => !b.isStatic);
    dynBodies2.forEach(b => {
      const spd = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.y*b.velocity.y);
      if (spd > fireThreshold) {
        const intensity = Math.min((spd - fireThreshold) / 15, 1);
        // Draw fire trail behind the object
        const trailLen = 3 + Math.floor(intensity * 5);
        for (let f = 0; f < trailLen; f++) {
          const tx = b.position.x - b.velocity.x * (f * 0.3) + (Math.random()-0.5) * 6;
          const ty = b.position.y - b.velocity.y * (f * 0.3) + (Math.random()-0.5) * 6;
          const fSize = (3 + Math.random()*5) * (1 - f/trailLen);
          const alpha = intensity * (1 - f/trailLen) * 0.8;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(tx, ty, fSize, 0, Math.PI*2);
          // Gradient from yellow core to red outer
          const colorMix = f / trailLen;
          const r2 = 255;
          const g = Math.floor(200 * (1-colorMix));
          ctx.fillStyle = `rgb(${r2},${g},0)`;
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    });
  }

  // Chromatic aberration (RGB split) on big impacts
  if (chromaticAberration > 0.5) {

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.12;
    // Red channel offset
    ctx.drawImage(canvas, offset, 0);
    // Blue channel offset
    ctx.drawImage(canvas, -offset, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    // White screen flash (brief)
    if (chromaticAberration > 4) {
      ctx.fillStyle = `rgba(255,255,255,${(chromaticAberration - 4) * 0.04})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  // Popcorn indicator
  if (popcornActive) {
    const pulse = 0.6 + Math.sin(timestamp / 150) * 0.4;

    ctx.textAlign = 'center';

    const barW = 200, barH = 6;
    const barX = canvas.width/2 - barW/2;
    ctx.fillStyle = '#ffdd0033';
    ctx.fillRect(barX, 62, barW, barH);
    ctx.fillStyle = '#ffdd00';
    ctx.fillRect(barX, 62, barW * (popcornTimer/480), barH);
    ctx.textAlign = 'left';
  }

  // Target practice HUD
  if (targetMode) {
    const remaining = targetBodies.filter(t => !t.targetHit).length;
    // Score overlay top-right
    ctx.fillStyle = '#0a0a0acc';
    ctx.fillRect(canvas.width - 180, 8, 172, 60);
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 2;
    ctx.strokeRect(canvas.width - 180, 8, 172, 60);

    ctx.fillText('LEFT: ' + remaining + '  ⏱ ' + Math.ceil(targetTimer/60) + 's', canvas.width - 16, 58);

    if (targetCleared && targetClearedTimer > 0) {
      const alpha = Math.min(1, targetClearedTimer / 60);
      const pulse = 0.7 + Math.sin(performance.now() / 100) * 0.3;
      ctx.globalAlpha = alpha * pulse;
