function getSquashTransition(currentMode = 'normal') {
  const ratio = 1.55;
  if (currentMode === 'normal') {
    return { mode:'wide', factorX:ratio, factorY:1 / ratio, scaleX:ratio, scaleY:1 / ratio, label:'WIDE' };
  }
  if (currentMode === 'wide') {
    return { mode:'tall', factorX:1 / (ratio * ratio), factorY:ratio * ratio, scaleX:1 / ratio, scaleY:ratio, label:'TALL' };
  }
  return { mode:'normal', factorX:ratio, factorY:1 / ratio, scaleX:1, scaleY:1, label:'ORIGINAL' };
}

function isSquashableBody(body) {
  if (!body || body.isStatic || body.label === 'wall' || body.label === 'chain-link' || body.isTarget || body.isFragment || body.parent !== body) return false;
  return !Composite.allConstraints(world).some(constraint => constraint.bodyA === body || constraint.bodyB === body);
}

function findSquashableBodyAt(pos) {
  const candidates = Composite.allBodies(world).filter(isSquashableBody);
  let target = Matter.Query.point(candidates, pos).filter(isSquashableBody).pop();
  if (!target) {
    let nearestDist = 46;
    candidates.forEach(body => {
      const distance = Math.hypot(body.position.x - pos.x, body.position.y - pos.y);
      if (distance < nearestDist) {
        target = body;
        nearestDist = distance;
      }
    });
  }
  return target || null;
}

  const feedback = document.getElementById('squash-feedback');
  feedback.classList.remove('active');
  feedback.textContent = '';
}

function addSquashBurst(body, mode) {
  const horizontal = mode !== 'tall';
  const color = mode === 'normal' ? '#ffffff' : (horizontal ? '#9cff57' : '#ff9cf7');
  const halfWidth = Math.max(10, (body.bounds.max.x - body.bounds.min.x) / 2);
  const halfHeight = Math.max(10, (body.bounds.max.y - body.bounds.min.y) / 2);
  for (let i = 0; i < 18; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const along = (Math.random() - 0.5) * 1.6;
    const direction = horizontal ? { x:side, y:along } : { x:along, y:side };
    const speed = 2 + Math.random() * 3.5;
    particles.push({
      x:body.position.x + (horizontal ? side * halfWidth : along * halfWidth * 0.35),
      y:body.position.y + (horizontal ? along * halfHeight * 0.35 : side * halfHeight),
      vx:direction.x * speed,
      vy:direction.y * speed,
      size:2 + Math.random() * 2.5,
      life:0.28 + Math.random() * 0.28,
      color:i % 4 === 0 ? '#ffffff' : color
    });
  }
}

function squashBodyAt(pos) {
  const target = findSquashableBodyAt(pos);
  if (!target) {
    showSquashFeedback('SQUASH: NO OBJECT', '#888888');
    haptic([3]);
    return false;
  }

  const transition = getSquashTransition(target.squashMode || 'normal');
  const angle = target.angle;
  const velocity = { x:target.velocity.x, y:target.velocity.y };
  const angularVelocity = target.angularVelocity;
  Body.setAngle(target, 0);
  Body.scale(target, transition.factorX, transition.factorY);
  Body.setAngle(target, angle);
  target.squashMode = transition.mode;
  target.squashScaleX = transition.scaleX;
  target.squashScaleY = transition.scaleY;
  Body.setPosition(target, getCanvasSafeBodyPosition(target, canvas.width, canvas.height));
  Body.setVelocity(target, velocity);
  Body.setAngularVelocity(target, angularVelocity);
  Matter.Sleeping.set(target, false);
  squashFlash = { body:target, mode:transition.mode, startedAt:performance.now() };
  addSquashBurst(target, transition.mode);
  showSquashFeedback(`SQUASH: ${transition.label}`, transition.mode === 'tall' ? '#ff9cf7' : '#9cff57');
  haptic(transition.mode === 'normal' ? [8] : [8, 12, 8]);
  playSound(transition.mode === 'tall' ? 720 : 420, 0.1, 'square', 0.07);
  playSound(transition.mode === 'normal' ? 900 : 260, 0.08, 'sine', 0.05);
  shakeIntensity = Math.max(shakeIntensity, 2);
  return transition;
}

function getFloatCounterForce(body, gravity, gravityScale = 0.001) {
  return {
    x:-(gravity.x || 0) * body.mass * gravityScale,
    y:-(gravity.y || 0) * body.mass * gravityScale
  };
}

function isFloatableBody(b) {

  if (b.isFloating) return true;
  if (b.isStatic) return false;
  return !Composite.allConstraints(world).some(c => c.bodyA === b || c.bodyB === b);
}

function findFloatableBodyAt(pos) {
  const candidates = Composite.allBodies(world).filter(isFloatableBody);

}

function toggleFloatAt(pos) {

  Matter.Sleeping.set(target, false);
  addFloatBurst(target, target.isFloating);
  showFloatFeedback(target.isFloating);
  haptic(target.isFloating ? [8, 14, 8] : [8]);
  playSound(target.isFloating ? 760 : 320, 0.12, 'sine', 0.07);
  playSound(target.isFloating ? 980 : 220, 0.08, 'triangle', 0.04);
  shakeIntensity = Math.max(shakeIntensity, target.isFloating ? 1.5 : 2.5);
  return target.isFloating ? 'floating' : 'gravity';
}

function applyFloatForces() {
  Composite.allBodies(world).forEach(b => {
    if (!b.isFloating || b.isStatic) return;
    Body.applyForce(b, b.position, getFloatCounterForce(b, engine.gravity, engine.gravity.scale));
  });
}

function getPivotLocalPoint(body, worldPoint) {
  const dx = worldPoint.x - body.position.x;
  const dy = worldPoint.y - body.position.y;
  const cos = Math.cos(-body.angle);
  const sin = Math.sin(-body.angle);
  return {
    x:dx * cos - dy * sin,
    y:dx * sin + dy * cos
  };
}

function getPivotForBody(body) {
  return pivots.find(pivot => pivot.body === body);
}

function isPivotableBody(body) {
  if (!body || body.label === 'wall' || body.isTarget || body.isFragment || body.parent !== body) return false;
  return Boolean(getPivotForBody(body)) || !body.isStatic;
}

function findPivotableBodyAt(pos) {
  const candidates = Composite.allBodies(world).filter(isPivotableBody);
  const exact = Matter.Query.point(candidates, pos).filter(isPivotableBody).pop();
  if (exact) return { body:exact, point:{ x:pos.x, y:pos.y } };

  let target = null;
  let nearestDist = 46;
  candidates.forEach(body => {
    const distance = Math.hypot(body.position.x - pos.x, body.position.y - pos.y);
    if (distance < nearestDist) {
      target = body;
      nearestDist = distance;
    }
  });
  return target ? { body:target, point:{ x:target.position.x, y:target.position.y } } : null;
}

function showPivotFeedback(message, color = '#ffd166') {

  feedback.classList.remove('active');
  void feedback.offsetWidth;

function addPivotBurst(point, pinned) {
  const color = pinned ? '#ffd166' : '#7df9ff';
  for (let i = 0; i < 14; i++) {
    const angle = Math.PI * 2 * i / 14;
    const speed = 1.2 + Math.random() * 2.8;
    particles.push({
      x:point.x,
      y:point.y,
      vx:Math.cos(angle) * speed,

    });

function togglePivotAt(pos) {
  const hit = findPivotableBodyAt(pos);
  if (!hit) {
    showPivotFeedback('PIVOT: NO OBJECT', '#888888');
    haptic([3]);
    return false;
  }

  const existing = getPivotForBody(hit.body);
  if (existing) {
    Composite.remove(world, existing.constraint, true);
    pivots = pivots.filter(pivot => pivot !== existing);
    Matter.Sleeping.set(hit.body, false);
    addPivotBurst(existing.worldPoint, false);
    showPivotFeedback('PIVOT RELEASED', '#7df9ff');
    haptic([8]);
    playSound(360, 0.1, 'triangle', 0.07);
    return 'released';
  }

  const worldPoint = { x:hit.point.x, y:hit.point.y };
  const localPoint = getPivotLocalPoint(hit.body, worldPoint);
  const constraint = Constraint.create({
    pointA:worldPoint,
    bodyB:hit.body,
    pointB:localPoint,
    length:0,
    stiffness:1,
    damping:0.16,
    render:{ visible:false, type:'pivot' }
  });
  Composite.add(world, constraint);
  pivots.push({ body:hit.body, constraint, worldPoint, localPoint });
  Matter.Sleeping.set(hit.body, false);
  addPivotBurst(worldPoint, true);
  showPivotFeedback('PIVOT PINNED');
  haptic([8, 14, 8]);
  playSound(620, 0.06, 'square', 0.08);
  playSound(980, 0.12, 'sine', 0.05);
  shakeIntensity = Math.max(shakeIntensity, 1.8);
  return constraint;
}

function prunePivots() {
  const liveBodies = new Set(Composite.allBodies(world));
  pivots = pivots.filter(pivot => {
    const inWorld = Composite.get(world, pivot.constraint.id, 'constraint');
    if (inWorld && !liveBodies.has(pivot.body)) Composite.remove(world, pivot.constraint, true);
    return Boolean(inWorld && liveBodies.has(pivot.body));
  });
}

function getReversedMotion(body) {

function getGyroTargetAngle(angle) {

  while (target <= -Math.PI) target += Math.PI * 2;
  return target;
}

function getGyroAngularVelocity(angle, targetAngle) {
  let error = targetAngle - angle;
  while (error > Math.PI) error -= Math.PI * 2;
  while (error < -Math.PI) error += Math.PI * 2;
  if (Math.abs(error) < 0.006) return 0;
  return Math.max(-0.14, Math.min(0.14, error * 0.18));
}

const CHARGE_RANGE = 240;
const CHARGE_MIN_DISTANCE = 16;

function getChargePairForce(chargeA, chargeB, dx, dy, distance) {
  if (!chargeA || !chargeB || !Number.isFinite(distance) || distance <= CHARGE_MIN_DISTANCE || distance >= CHARGE_RANGE) return null;
  const falloff = 1 - distance / CHARGE_RANGE;
  const strength = 0.0016 * falloff * falloff;
  const direction = chargeA === chargeB ? -1 : 1;
  return {
    x:(dx / distance) * strength * direction,
    y:(dy / distance) * strength * direction,
    strength,
    interaction:direction === 1 ? 'attract' : 'repel'
  };
}

function getNextChargeState(charge = 0) {
  if (charge === 1) return -1;
  if (charge === -1) return 0;
  return 1;
}

  if (chargedExact) return chargedExact;

  let target = null;

  candidates.forEach(body => {
    const distance = Math.hypot(body.position.x - pos.x, body.position.y - pos.y);

function applyChargeForces() {
  const charged = Composite.allBodies(world).filter(body => body.electricCharge === 1 || body.electricCharge === -1);
  for (let i = 0; i < charged.length; i++) {
    for (let j = i + 1; j < charged.length; j++) {
      const bodyA = charged[i];
      const bodyB = charged[j];
      const dx = bodyB.position.x - bodyA.position.x;
      const dy = bodyB.position.y - bodyA.position.y;
      const force = getChargePairForce(bodyA.electricCharge, bodyB.electricCharge, dx, dy, Math.hypot(dx, dy));
      if (!force) continue;
      if (!bodyA.isStatic) {
        Matter.Sleeping.set(bodyA, false);
        Body.applyForce(bodyA, bodyA.position, { x:force.x, y:force.y });
      }
      if (!bodyB.isStatic) {
        Matter.Sleeping.set(bodyB, false);
        Body.applyForce(bodyB, bodyB.position, { x:-force.x, y:-force.y });
      }
    }
  }
}

function addLiftBurst(body, enabled) {
  const gx = engine.gravity.x || 0;
  const gy = engine.gravity.y || 1;
  const magnitude = Math.hypot(gx, gy) || 1;
  const liftX = -gx / magnitude;
  const liftY = -gy / magnitude;
  for (let i = 0; i < 18; i++) {
    const spread = (i - 8.5) / 8.5;
    const speed = (enabled ? 2.4 : 1.2) + Math.random() * 2.6;
    particles.push({
      x:body.position.x + spread * 18,
      y:body.position.y,
      vx:liftX * speed - liftY * spread * 1.8,
      vy:liftY * speed + liftX * spread * 1.8,
      size:1.5 + Math.random() * 2.8,
      life:0.3 + Math.random() * 0.3,
      color:i % 3 === 0 ? '#ffffff' : i % 2 ? '#9d7cff' : '#7df9ff'
    });
  }
}

function toggleLiftAt(pos) {
  const target = findLiftableBodyAt(pos);
  if (!target) {
    showLiftFeedback(false, 'LIFT: NO OBJECT');
    haptic([3]);
    return false;
  }

  const enabled = !liftedBodies.has(target);
  if (enabled) {
    liftedBodies.add(target);
    target.isLifted = true;
    target.isFloating = false;
    orbitingBodies.delete(target);
    delete target.isOrbiting;
    Matter.Sleeping.set(target, false);
  } else {
    liftedBodies.delete(target);
    delete target.isLifted;
  }
  addLiftBurst(target, enabled);
  showLiftFeedback(enabled);
  playSound(enabled ? 880 : 320, 0.12, 'triangle', 0.065);
  playSound(enabled ? 1240 : 480, 0.08, 'sine', 0.045);
  haptic(enabled ? [6, 8, 14] : [8]);
  shakeIntensity = Math.max(shakeIntensity, enabled ? 2 : 1);
  return enabled ? 'enabled' : 'disabled';
}

function applyLiftForces() {
  liftedBodies.forEach(body => {
    if (!Composite.get(world, body.id, 'body')) {
      liftedBodies.delete(body);
      return;
    }
    if (body.isStatic) return;
    Matter.Sleeping.set(body, false);
    Body.applyForce(body, body.position, getLiftForce(body, engine.gravity, engine.gravity.scale));
  });
}

const ORBIT_MIN_RADIUS = 70;
const ORBIT_MAX_RADIUS = 260;
const ORBIT_STEP_SQUARED = (1000 / 60) ** 2;

function getOrbitTargetSpeed(radius) {
  return Math.max(4.8, Math.min(7.5, 3.8 + radius * 0.018));
}

function getOrbitForce(body, orbit, gravity = { x:0, y:1 }, gravityScale = 0.001) {
  const mass = Number.isFinite(body?.mass) ? body.mass : 0;
  const dx = (body?.position?.x || 0) - (orbit?.center?.x || 0);
  const dy = (body?.position?.y || 0) - (orbit?.center?.y || 0);
  const distance = Math.max(1, Math.hypot(dx, dy));
  const radial = { x:dx / distance, y:dy / distance };
  const direction = orbit?.direction === -1 ? -1 : 1;
  const tangent = { x:-radial.y * direction, y:radial.x * direction };
  const vx = body?.velocity?.x || 0;
  const vy = body?.velocity?.y || 0;
  const radialVelocity = vx * radial.x + vy * radial.y;
  const tangentialVelocity = vx * tangent.x + vy * tangent.y;
  const radius = Math.max(ORBIT_MIN_RADIUS, orbit?.radius || distance);
  const targetSpeed = getOrbitTargetSpeed(radius);
  const orbitalSpeed = Math.max(0.5, Math.abs(tangentialVelocity));
  const centripetal = (orbitalSpeed * orbitalSpeed / Math.max(distance, ORBIT_MIN_RADIUS)) / ORBIT_STEP_SQUARED;
  const radialCorrection = Math.max(-0.0025, Math.min(0.0025,
    (distance - radius) * 0.00002 + radialVelocity * 0.00012
  ));
  const inwardForce = Math.max(-0.0025, Math.min(0.0035, centripetal + radialCorrection));
  const tangentForce = Math.max(-0.0015, Math.min(0.0015,
    (targetSpeed - tangentialVelocity) * 0.00018
  ));
  return {
    x:mass * (-radial.x * inwardForce + tangent.x * tangentForce - (gravity?.x || 0) * gravityScale),
    y:mass * (-radial.y * inwardForce + tangent.y * tangentForce - (gravity?.y || 0) * gravityScale)
  };
}

function isOrbitableBody(body) {
  return Boolean(body && body.label !== 'wall' && !body.isTarget && !body.isFragment && !body.isStatic && body.parent === body);
}

function findOrbitableBodyAt(pos) {
  const candidates = Composite.allBodies(world).filter(isOrbitableBody);
  const exactMatches = Matter.Query.point(candidates, pos).filter(isOrbitableBody);
  const orbitingExact = exactMatches.find(body => orbitingBodies.has(body));
  if (orbitingExact) return orbitingExact;
  if (exactMatches.length) return exactMatches[exactMatches.length - 1];

  let target = null;
  let nearestDist = 46;
  candidates.forEach(body => {
    const distance = Math.hypot(body.position.x - pos.x, body.position.y - pos.y);
    if (distance < nearestDist) {
      target = body;
      nearestDist = distance;
    }
  });
  return target;
}

function showOrbitFeedback(message, color = '#54f7ff') {
  const feedback = document.getElementById('orbit-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(orbitFeedbackTimer);
  orbitFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 950);
}

function addOrbitBurst(body, color = '#54f7ff') {
  for (let i = 0; i < 18; i++) {
    const angle = Math.PI * 2 * i / 18;
    const speed = 1.4 + Math.random() * 2.8;
    particles.push({
      x:body.position.x,
      y:body.position.y,
      vx:Math.cos(angle) * speed,
      vy:Math.sin(angle) * speed,
      size:1.5 + Math.random() * 2.5,
      life:0.3 + Math.random() * 0.32,
      color:i % 4 === 0 ? '#ffffff' : color
    });
  }
}

function orbitBodyAt(pos) {
  if (orbitSelection && !Composite.get(world, orbitSelection.id, 'body')) orbitSelection = null;
  const target = findOrbitableBodyAt(pos);

  if (!orbitSelection) {
    if (!target) {
      showOrbitFeedback('ORBIT: NO OBJECT', '#888888');
      haptic([3]);
      return false;
    }
    if (orbitingBodies.has(target)) {
      orbitingBodies.delete(target);
      delete target.isOrbiting;
      addOrbitBurst(target, '#ffcf40');
      showOrbitFeedback('ORBIT: RELEASED', '#ffcf40');
      playSound(360, 0.12, 'triangle', 0.06);
      haptic([8]);
      return 'released';
    }
    orbitSelection = target;
    showOrbitFeedback('ORBIT: PICK CENTER');
    playSound(620, 0.08, 'sine', 0.055);
    haptic([6]);
    return 'selected';
  }

  const body = orbitSelection;
  const dx = body.position.x - pos.x;
  const dy = body.position.y - pos.y;
  const rawRadius = Math.hypot(dx, dy);
  if (rawRadius < ORBIT_MIN_RADIUS) {
    showOrbitFeedback('ORBIT: CENTER TOO CLOSE', '#ffcf40');
    playSound(190, 0.08, 'square', 0.04);
    haptic([4]);
    return false;
  }

  const radius = Math.min(ORBIT_MAX_RADIUS, rawRadius);
  const radial = { x:dx / rawRadius, y:dy / rawRadius };
  const center = {
    x:body.position.x - radial.x * radius,
    y:body.position.y - radial.y * radius
  };
  const direction = 1;
  const tangent = { x:-radial.y * direction, y:radial.x * direction };
  const targetSpeed = getOrbitTargetSpeed(radius);
  orbitingBodies.set(body, { center, radius, direction });
  body.isOrbiting = true;
  body.isFloating = false;
  liftedBodies.delete(body);
  delete body.isLifted;
  Body.setVelocity(body, { x:tangent.x * targetSpeed, y:tangent.y * targetSpeed });
  Matter.Sleeping.set(body, false);
  orbitSelection = null;
  addOrbitBurst(body);
  showOrbitFeedback(`ORBIT: ${Math.round(radius)}PX LOCK`);
  playSound(820, 0.12, 'sine', 0.065);
  playSound(1180, 0.09, 'triangle', 0.045);
  haptic([6, 8, 14]);
  shakeIntensity = Math.max(shakeIntensity, 2);
  return { body, center, radius, direction };
}

function applyOrbitForces() {
  orbitingBodies.forEach((orbit, body) => {
    if (!Composite.get(world, body.id, 'body')) {
      orbitingBodies.delete(body);
      return;
    }
    if (body.isStatic) return;
    Matter.Sleeping.set(body, false);
    Body.applyForce(body, body.position, getOrbitForce(body, orbit, engine.gravity, engine.gravity.scale));
  });
}

function getPunchImpulse(body, pos) {
  const halfWidth = Math.max(8, (body.bounds.max.x - body.bounds.min.x) / 2);
  const halfHeight = Math.max(8, (body.bounds.max.y - body.bounds.min.y) / 2);
  const rawOffset = {
    x:pos.x - body.position.x,
    y:pos.y - body.position.y
  };
  const offsetScale = Math.min(1, 1 / Math.max(
    Math.abs(rawOffset.x) / halfWidth,
    Math.abs(rawOffset.y) / halfHeight,
    1
  ));
  const point = {
    x:body.position.x + rawOffset.x * offsetScale,
    y:body.position.y + rawOffset.y * offsetScale
  };
  const horizontal = Math.max(-0.45, Math.min(0.45, (body.position.x - point.x) / halfWidth));
  const length = Math.hypot(horizontal, 1);
  const magnitude = Math.max(0.035, Math.min(0.12, (Number.isFinite(body.mass) ? body.mass : 1) * 0.045));
  return {
    point,
    force:{
      x:(horizontal / length) * magnitude,
      y:(-1 / length) * magnitude
    }
  };
}

function isPunchableBody(body) {
  return Boolean(body && body.label !== 'wall' && !body.isTarget && !body.isStatic);
}

function findPunchableBodyAt(pos) {
  const candidates = Composite.allBodies(world).filter(isPunchableBody);
  const exact = Matter.Query.point(candidates, pos).filter(isPunchableBody).pop();
  if (exact) return exact;

  let target = null;
  let nearestDist = 46;
  candidates.forEach(body => {
    const distance = Math.hypot(body.position.x - pos.x, body.position.y - pos.y);
    if (distance < nearestDist) {
      target = body;
      nearestDist = distance;
    }
  });
  return target;
}

function showPunchFeedback(message, color = '#ff8c42') {
  const feedback = document.getElementById('punch-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(punchFeedbackTimer);
  punchFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 850);
}

function addPunchBurst(point, force) {
  const direction = Math.atan2(force.y, force.x);
  for (let i = 0; i < 18; i++) {
    const angle = direction + Math.PI + (Math.random() - 0.5) * 1.7;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x:point.x,
      y:point.y,
      vx:Math.cos(angle) * speed,
      vy:Math.sin(angle) * speed,
      size:2 + Math.random() * 3,
      life:0.25 + Math.random() * 0.3,
      color:i % 3 === 0 ? '#fff4cc' : (i % 2 ? '#ff8c42' : '#ffdd55')
    });
  }
}

function punchBodyAt(pos) {
  const target = findPunchableBodyAt(pos);
  if (!target) {
    showPunchFeedback('PUNCH: NO OBJECT', '#888888');
    haptic([3]);
    return false;
  }

  const impulse = getPunchImpulse(target, pos);
  Matter.Sleeping.set(target, false);
  Body.applyForce(target, impulse.point, impulse.force);
  punchFlash = { body:target, point:impulse.point, force:impulse.force, startedAt:performance.now() };
  addPunchBurst(impulse.point, impulse.force);
  showPunchFeedback('POW!');
  haptic([12, 8, 18]);
  playSound(160, 0.08, 'square', 0.09);
  playSound(520, 0.06, 'sawtooth', 0.05);
  shakeIntensity = Math.max(shakeIntensity, 4);
  return impulse;
}

const PULSE_RADIUS = 200;
const PULSE_MAX_SPEED = 15;

function getPulseVelocityDelta(bodyPosition, origin, radius = PULSE_RADIUS, maxSpeed = PULSE_MAX_SPEED) {
  const dx = bodyPosition.x - origin.x;
  const dy = bodyPosition.y - origin.y;
  const distance = Math.hypot(dx, dy);
  if (distance >= radius) return null;
  const falloff = 1 - distance / radius;
  const magnitude = maxSpeed * falloff * falloff;
  const direction = distance > 0.001 ? { x:dx / distance, y:dy / distance } : { x:0, y:-1 };
  return {
    x:direction.x * magnitude,
    y:direction.y * magnitude,
    magnitude,
    distance,
    falloff
  };
}

function showPulseFeedback(message, color = '#35f2ff') {
  const feedback = document.getElementById('pulse-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(pulseFeedbackTimer);
  pulseFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 850);
}

function resetPulseFeedback(silent = false) {
  pulseBursts = [];
  if (!silent) return;
  clearTimeout(pulseFeedbackTimer);
  const feedback = document.getElementById('pulse-feedback');
  feedback.classList.remove('active');
  feedback.textContent = '';
}

function addPulseParticles(origin) {
  for (let i = 0; i < 30; i++) {
    const angle = Math.PI * 2 * i / 30;
    const speed = 3.5 + Math.random() * 3.5;
    particles.push({
      x:origin.x,
      y:origin.y,
      vx:Math.cos(angle) * speed,
      vy:Math.sin(angle) * speed,
      size:2 + Math.random() * 2.5,
      life:0.32 + Math.random() * 0.28,
      color:i % 3 === 0 ? '#ffffff' : (i % 2 ? '#35f2ff' : '#ff4de1')
    });
  }
}

function pulseAt(origin) {
  const affected = [];
  Composite.allBodies(world).forEach(body => {
    if (!body || body.label === 'wall' || body.isTarget || body.isStatic) return;
    const delta = getPulseVelocityDelta(body.position, origin);
    if (!delta || delta.magnitude < 0.15) return;
    const next = {
      x:body.velocity.x + delta.x,
      y:body.velocity.y + delta.y
    };
    const speed = Math.hypot(next.x, next.y);
    const scale = speed > 34 ? 34 / speed : 1;
    Matter.Sleeping.set(body, false);
    Body.setVelocity(body, { x:next.x * scale, y:next.y * scale });
    Body.setAngularVelocity(body, body.angularVelocity + Math.sin(body.id * 2.399) * delta.falloff * 0.08);
    affected.push(body);
  });

  pulseBursts.push({ x:origin.x, y:origin.y, hitCount:affected.length, startedAt:performance.now() });
  addPulseParticles(origin);
  if (affected.length > 0) {
    showPulseFeedback(`PULSE ×${affected.length}`);
    playSound(170, 0.12, 'sawtooth', 0.08);
    playSound(720, 0.09, 'sine', 0.05);
    haptic([10, 7, 14]);
    shakeIntensity = Math.max(shakeIntensity, Math.min(7, 2 + affected.length * 0.7));
  } else {
    showPulseFeedback('PULSE: NO TARGETS', '#888888');
    playSound(190, 0.07, 'square', 0.035);
    haptic([3]);
  }
  return affected;
}

const SWIRL_RADIUS = 220;
const SWIRL_MAX_SPEED = 13;

function getSwirlVelocityDelta(bodyPosition, origin, direction = 1, radius = SWIRL_RADIUS, maxSpeed = SWIRL_MAX_SPEED) {
  const dx = bodyPosition.x - origin.x;
  const dy = bodyPosition.y - origin.y;
  const distance = Math.hypot(dx, dy);
  if (distance >= radius) return null;
  const turn = direction >= 0 ? 1 : -1;
  const falloff = 1 - distance / radius;
  const magnitude = maxSpeed * falloff * falloff;
  const radial = distance > 0.001 ? { x:dx / distance, y:dy / distance } : { x:1, y:0 };
  return {
    x:-radial.y * magnitude * turn,
    y:radial.x * magnitude * turn,
    magnitude,
    distance,
    falloff
  };
}

function showSwirlFeedback(message, color = swirlDirection === 1 ? '#b86cff' : '#ff9f43') {
  const feedback = document.getElementById('swirl-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(swirlFeedbackTimer);
  swirlFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 850);
}

function addSwirlParticles(origin, direction) {
  for (let i = 0; i < 32; i++) {
    const angle = Math.PI * 2 * i / 32;
    const radius = 18 + (i % 4) * 12;
    const tangentX = -Math.sin(angle) * direction;
    const tangentY = Math.cos(angle) * direction;
    const speed = 2.5 + Math.random() * 3.5;
    particles.push({
      x:origin.x + Math.cos(angle) * radius,
      y:origin.y + Math.sin(angle) * radius,
      vx:tangentX * speed - Math.cos(angle) * 0.7,
      vy:tangentY * speed - Math.sin(angle) * 0.7,
      size:2 + Math.random() * 2.5,
      life:0.38 + Math.random() * 0.3,
      color:i % 3 === 0 ? '#ffffff' : (direction === 1 ? '#b86cff' : '#ff9f43')
    });
  }
}

function swirlAt(origin) {
  const affected = [];
  Composite.allBodies(world).forEach(body => {
    if (!body || body.label === 'wall' || body.isTarget || body.isStatic) return;
    const delta = getSwirlVelocityDelta(body.position, origin, swirlDirection);
    if (!delta || delta.magnitude < 0.15) return;
    const next = {
      x:body.velocity.x + delta.x,
      y:body.velocity.y + delta.y
    };
    const speed = Math.hypot(next.x, next.y);
    const scale = speed > 34 ? 34 / speed : 1;
    Matter.Sleeping.set(body, false);
    Body.setVelocity(body, { x:next.x * scale, y:next.y * scale });
    Body.setAngularVelocity(body, body.angularVelocity + swirlDirection * delta.falloff * 0.1);
    affected.push(body);
  });

  swirlBursts.push({ x:origin.x, y:origin.y, hitCount:affected.length, direction:swirlDirection, startedAt:performance.now() });
  addSwirlParticles(origin, swirlDirection);
  if (affected.length > 0) {
    showSwirlFeedback(`SWIRL ${swirlDirection === 1 ? 'CW' : 'CCW'} ×${affected.length}`);
    playSound(swirlDirection === 1 ? 260 : 210, 0.13, 'sawtooth', 0.075);
    playSound(swirlDirection === 1 ? 820 : 620, 0.1, 'sine', 0.045);
    haptic([8, 5, 8]);
    shakeIntensity = Math.max(shakeIntensity, Math.min(6, 1.5 + affected.length * 0.6));
  } else {
    showSwirlFeedback('SWIRL: NO TARGETS', '#888888');
    playSound(190, 0.07, 'square', 0.035);
    haptic([3]);
  }
  return affected;
}

function getCurvedVelocity(velocity, direction = 1, minimumSpeed = 0.75) {
  const speed = Math.hypot(velocity.x, velocity.y);
  if (speed < minimumSpeed) return null;
  const turn = direction >= 0 ? 1 : -1;
  return {
    x:-velocity.y * turn,
    y:velocity.x * turn,
    speed
  };
}

function showCurveFeedback(message, color = '#59e3ff') {
  const feedback = document.getElementById('curve-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(curveFeedbackTimer);
  curveFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 850);
}

function addCurveParticles(body, direction, velocity) {
  const speed = Math.hypot(velocity.x, velocity.y) || 1;
  const nx = velocity.x / speed;
  const ny = velocity.y / speed;
  for (let i = 0; i < 18; i++) {
    const spread = (i - 8.5) / 8.5;
    particles.push({
      x:body.position.x - nx * (8 + Math.random() * 18),
      y:body.position.y - ny * (8 + Math.random() * 18),
      vx:-nx * (1.5 + Math.random() * 2.5) - ny * spread * direction,
      vy:-ny * (1.5 + Math.random() * 2.5) + nx * spread * direction,
      size:2 + Math.random() * 2.5,
      life:0.3 + Math.random() * 0.28,
      color:i % 3 === 0 ? '#ffffff' : (direction === 1 ? '#59e3ff' : '#ff6bb5')
    });
  }
}

function isCurvableBody(body) {
  return body && body.label !== 'wall' && !body.isTarget && !body.isStatic && body.parent === body;
}

function findCurvableBodyAt(pos) {
  const curvableBodies = Composite.allBodies(world).filter(isCurvableBody);
  let target = Matter.Query.point(curvableBodies, pos).filter(isCurvableBody).pop();
  if (!target) {
    let nearestDist = 46;
    curvableBodies.forEach(body => {
      const distance = Math.hypot(body.position.x - pos.x, body.position.y - pos.y);
      if (distance < nearestDist) {
        target = body;
        nearestDist = distance;
      }
    });
  }
  return target || null;
}

function curveBodyAt(pos) {
  const target = findCurvableBodyAt(pos);
  if (!target) {
    showCurveFeedback('CURVE: NO OBJECT', '#888888');
    haptic([3]);
    return false;
  }

  const fromVelocity = { x:target.velocity.x, y:target.velocity.y };
  const curved = getCurvedVelocity(fromVelocity, curveDirection);
  if (!curved) {
    showCurveFeedback('CURVE: NEED MOTION', '#888888');
    playSound(190, 0.07, 'square', 0.035);
    haptic([3]);
    return 'stationary';
  }

  Matter.Sleeping.set(target, false);
  Body.setVelocity(target, { x:curved.x, y:curved.y });
  const spinKick = Math.min(0.28, curved.speed * 0.018) * curveDirection;
  Body.setAngularVelocity(target, target.angularVelocity + spinKick);
  addCurveParticles(target, curveDirection, fromVelocity);
  curveFlash = { body:target, direction:curveDirection, fromVelocity, startedAt:performance.now() };
  showCurveFeedback(`CURVED ${curveDirection === 1 ? 'RIGHT ↱' : 'LEFT ↰'}`);
  playSound(curveDirection === 1 ? 680 : 520, 0.09, 'square', 0.07);
  playSound(900, 0.08, 'sine', 0.045);
  haptic([7, 5, 10]);
  shakeIntensity = Math.max(shakeIntensity, 2);
  return curved;
}

const ROTATE_STEP = Math.PI / 2;

function getNextRotateDirection(direction = 1) {
  return direction === 1 ? -1 : 1;
}

function getQuarterTurnAngle(angle, direction = 1) {
  return angle + direction * ROTATE_STEP;
}

function getCanvasSafeBodyPosition(body, canvasWidth, canvasHeight) {
  const halfWidth = (body.bounds.max.x - body.bounds.min.x) / 2;
  const halfHeight = (body.bounds.max.y - body.bounds.min.y) / 2;
  return {
    x: Math.max(halfWidth + 8, Math.min(canvasWidth - halfWidth - 8, body.position.x)),
    y: Math.max(halfHeight + 8, Math.min(canvasHeight - halfHeight - 28, body.position.y))
  };
}

function isRotatableBody(b) {
  if (!b || b.label === 'wall' || b.label === 'chain-link' || b.isTarget || b.isFragment || b.parent !== b) return false;
  if (b.isStatic && !b.isAnchored) return false;
  return !Composite.allConstraints(world).some(c => c.bodyA === b || c.bodyB === b);
}

function findRotatableBodyAt(pos) {
  const candidates = Composite.allBodies(world).filter(isRotatableBody);
  let target = Matter.Query.point(candidates, pos).filter(isRotatableBody).pop();

  // A fingertip-sized fallback keeps thin blocks and dominoes easy to turn.
  if (!target) {
    let nearestDist = 46;
    candidates.forEach(b => {
      const dx = b.position.x - pos.x;

}

function getFusionKinematics(bodyA, bodyB, canvasWidth, canvasHeight) {
  const massA = Number.isFinite(bodyA.mass) ? bodyA.mass : 1;
  const massB = Number.isFinite(bodyB.mass) ? bodyB.mass : 1;
  const mass = Math.max(0.001, massA + massB);
  const radius = Math.max(18, Math.min(68, Math.sqrt(Math.max(1, bodyA.area + bodyB.area) / Math.PI)));
  const rawPosition = {
    x:(bodyA.position.x * massA + bodyB.position.x * massB) / mass,
    y:(bodyA.position.y * massA + bodyB.position.y * massB) / mass
  };
  return {
    mass,
    radius,
    position:{
      x:Math.max(radius + 8, Math.min(canvasWidth - radius - 8, rawPosition.x)),
      y:Math.max(radius + 8, Math.min(canvasHeight - radius - 28, rawPosition.y))
    },
    velocity:{
      x:(bodyA.velocity.x * massA + bodyB.velocity.x * massB) / mass,
      y:(bodyA.velocity.y * massA + bodyB.velocity.y * massB) / mass
    },
    angularVelocity:(bodyA.angularVelocity * massA + bodyB.angularVelocity * massB) / mass
  };
}

function addFusionBurst(bodyA, bodyB, core) {
  const colors = [bodyA.render?.color || '#00ffee', bodyB.render?.color || '#ff66ff'];
  [bodyA, bodyB].forEach((body, sourceIndex) => {
    const dx = core.position.x - body.position.x;
    const dy = core.position.y - body.position.y;
    for (let i = 0; i < 12; i++) {
      particles.push({
        x:body.position.x + dx * (i / 12),
        y:body.position.y + dy * (i / 12),
        vx:dx * 0.02 + (Math.random() - 0.5) * 2,
        vy:dy * 0.02 + (Math.random() - 0.5) * 2,
        size:2 + Math.random() * 2.5,
        life:0.35 + Math.random() * 0.3,
        color:colors[sourceIndex]
      });
    }
  });
  explosions.push({ x:core.position.x, y:core.position.y, r:6, maxR:core.render.radius * 1.8, alpha:0.9, isBirthRing:true });
}

function fuseBodiesAt(pos) {
  if (fusionFirstBody && !Composite.get(world, fusionFirstBody.id, 'body')) fusionFirstBody = null;
  const target = findFusionableBodyAt(pos);
  if (!target) {
    showFusionFeedback('NO SUBJECT', '#888888');
    playSound(180, 0.08, 'square', 0.04);
    haptic([4]);
    return false;
  }

  if (!fusionFirstBody) {
    fusionFirstBody = target;
    showFusionFeedback('FUSION A SET • PICK B');
    playSound(520, 0.08, 'sine', 0.06);
    haptic([6]);
    return 'selected';
  }

  if (target === fusionFirstBody) {
    resetFusionSelection();
    showFusionFeedback('FUSION CANCELLED', '#aaaaaa');
    playSound(260, 0.08, 'square', 0.04);
    return 'cancelled';
  }

  const first = fusionFirstBody;
  const kinematics = getFusionKinematics(first, target, canvas.width, canvas.height);
  const colorA = first.render?.color || '#00ffee';
  const colorB = target.render?.color || '#ff66ff';
  const firstRestitution = megaBounceOriginal.has(first.id) ? megaBounceOriginal.get(first.id) : first.restitution;
  const targetRestitution = megaBounceOriginal.has(target.id) ? megaBounceOriginal.get(target.id) : target.restitution;
  const restitution = (firstRestitution + targetRestitution) / 2;
  const fusionCore = Bodies.circle(kinematics.position.x, kinematics.position.y, kinematics.radius, {
    label:'fusion-core',
    restitution,
    friction:(first.friction + target.friction) / 2,
    frictionAir:(first.frictionAir + target.frictionAir) / 2,
    render:{ type:'fusion-core', color:'#ff66ff', colorA, colorB, radius:kinematics.radius }
  });
  fusionCore.material = 'fusion';
  fusionCore.fusionGeneration = Math.max(first.fusionGeneration || 0, target.fusionGeneration || 0) + 1;
  Body.setMass(fusionCore, kinematics.mass);
  Body.setVelocity(fusionCore, kinematics.velocity);
  Body.setAngularVelocity(fusionCore, kinematics.angularVelocity);
  markSpawnPop(fusionCore);

  addFusionBurst(first, target, fusionCore);
  removeFusionSourceTracking(first);
  removeFusionSourceTracking(target);
  Composite.remove(world, first, true);
  Composite.remove(world, target, true);
  Composite.add(world, fusionCore);
  if (megaBounceActive) {
    megaBounceOriginal.set(fusionCore.id, restitution);
    fusionCore.restitution = 1.2;
  }
  fusionFirstBody = null;
  showFusionFeedback('FUSION COMPLETE');
  haptic([10, 16, 10, 16, 20]);
  playSound(320, 0.12, 'square', 0.07);
  playSound(760, 0.18, 'sine', 0.08);
  shakeIntensity = Math.max(shakeIntensity, 4);
  return fusionCore;
}

function toggleMotorAt(pos) {
  const motorableBodies = Composite.allBodies(world).filter(isMotorableBody);
  let target = Matter.Query.point(motorableBodies, pos).filter(isMotorableBody).pop();

  // Fingertip-sized fallback keeps small parts practical on phones.
  if (!target) {
    let nearestDist = 46;
    motorableBodies.forEach(b => {
      const dx = b.position.x - pos.x;
      const dy = b.position.y - pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) {
        target = b;
        nearestDist = dist;
      }
    });
  }

  if (!target) return false;

  const direction = getNextMotorDirection(motorizedBodies.get(target) || 0);
  if (direction === 0) {
    motorizedBodies.delete(target);
    delete target.motorDirection;
    Body.setAngularVelocity(target, target.angularVelocity * 0.25);
  } else {
    motorizedBodies.set(target, direction);
    target.motorDirection = direction;
    Body.setAngularVelocity(target, direction * 0.24);
  }

  addMotorBurst(target, direction);
  showMotorFeedback(direction);
  haptic(direction === 0 ? [6] : [8, 14, 8]);
  playSound(direction === 1 ? 640 : direction === -1 ? 420 : 220, 0.12, 'square', 0.06);
  shakeIntensity = Math.max(shakeIntensity, direction === 0 ? 1 : 2);

}

function getStackPosition(sourceBounds, targetBounds, canvasWidth, canvasHeight, gap = 4) {
  const halfWidth = (sourceBounds.max.x - sourceBounds.min.x) / 2;
  const halfHeight = (sourceBounds.max.y - sourceBounds.min.y) / 2;
  const targetCenterX = (targetBounds.min.x + targetBounds.max.x) / 2;
  const x = Math.max(halfWidth + 10, Math.min(canvasWidth - halfWidth - 10, targetCenterX));
  const y = targetBounds.min.y - halfHeight - gap;
  if (y - halfHeight < 10 || y + halfHeight > canvasHeight - 28) return null;
  return { x, y };
}

function getMirroredTransform(position, velocity, angle, angularVelocity, bounds, canvasWidth) {
  const halfWidth = (bounds.max.x - bounds.min.x) / 2;
  return {
    position: {
      x:Math.max(halfWidth + 10, Math.min(canvasWidth - halfWidth - 10, canvasWidth - position.x)),
      y:position.y
    },
    velocity:{ x:-velocity.x, y:velocity.y },
    angle:-angle,
    angularVelocity:-angularVelocity
  };
}

function showMirrorFeedback(message, color = '#67e8ff') {
  const feedback = document.getElementById('mirror-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(mirrorFeedbackTimer);
  mirrorFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 900);
}

function addMirrorBurst(point, color, direction) {
  for (let i = 0; i < 16; i++) {
    const angle = Math.PI * 2 * i / 16;
    const speed = 1.8 + Math.random() * 3.2;
    particles.push({
      x:point.x,
      y:point.y,
      vx:Math.cos(angle) * speed + direction * 1.4,
      vy:Math.sin(angle) * speed,
      size:2 + Math.random() * 2.5,
      life:0.3 + Math.random() * 0.26,
      color:i % 3 === 0 ? '#ffffff' : color
    });
  }
}

function mirrorBodyAt(pos) {
  const target = findMirrorableBodyAt(pos);
  if (!target) {
    showMirrorFeedback('MIRROR: NO OBJECT', '#888888');
    playSound(190, 0.07, 'square', 0.035);
    haptic([3]);
    return false;
  }

  const from = { x:target.position.x, y:target.position.y };
  const transform = getMirroredTransform(
    target.position,
    target.velocity,
    target.angle,
    target.angularVelocity,
    target.bounds,
    canvas.width
  );
  Matter.Sleeping.set(target, false);
  Body.setPosition(target, transform.position);
  Body.setVelocity(target, transform.velocity);
  Body.setAngle(target, transform.angle);
  Body.setAngularVelocity(target, transform.angularVelocity);
  mirrorFlash = {
    bodyId:target.id,
    from,
    to:{ x:transform.position.x, y:transform.position.y },
    startedAt:performance.now()
  };
  addMirrorBurst(from, '#ff5fd7', from.x <= canvas.width / 2 ? 1 : -1);
  addMirrorBurst(transform.position, '#67e8ff', transform.position.x <= canvas.width / 2 ? -1 : 1);
  showMirrorFeedback('MIRRORED!');
  playSound(880, 0.08, 'square', 0.06);
  playSound(440, 0.12, 'sine', 0.07);
  haptic([8, 8, 12]);
  shakeIntensity = Math.max(shakeIntensity, 2);
  return { body:target, from, ...transform };
}

const WEB_WIDTH = 84;
const WEB_HEIGHT = 12;
const WEB_MAX_CAPTURES = 3;

function getWebLocalPoint(position, angle, worldPoint) {
  const dx = worldPoint.x - position.x;
  const dy = worldPoint.y - position.y;
  const cos = Math.cos(angle || 0);
  const sin = Math.sin(angle || 0);
  return {
    x:dx * cos + dy * sin,
    y:-dx * sin + dy * cos
  };
}

function getWebAttachmentPoints(webBody, capturedBody, contact) {
  return {
    pointA:getWebLocalPoint(webBody.position, webBody.angle, contact),
    pointB:getWebLocalPoint(capturedBody.position, capturedBody.angle, contact)
  };
}

function showWebFeedback(message, color = '#f58cff') {
  const feedback = document.getElementById('web-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(webFeedbackTimer);
  webFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 900);
}

function addWebBurst(point, color = '#f58cff', count = 14) {
  for (let i = 0; i < count; i++) {
    const angle = Math.PI * 2 * i / count;
    const speed = 1.4 + Math.random() * 2.8;
    particles.push({
      x:point.x,
      y:point.y,
      vx:Math.cos(angle) * speed,
      vy:Math.sin(angle) * speed - 0.5,
      size:2 + Math.random() * 2,
      life:0.3 + Math.random() * 0.28,
      color:i % 3 === 0 ? '#bdfcff' : color
    });
  }
}

function pruneWebTraps() {
  webTraps = webTraps.filter(entry => {
    if (!Composite.get(world, entry.body.id, 'body')) {
      entry.attachments.forEach(attachment => {
        if (Composite.get(world, attachment.constraint.id, 'constraint')) Composite.remove(world, attachment.constraint, true);
      });
      return false;
    }
    entry.attachments = entry.attachments.filter(attachment => (
      Composite.get(world, attachment.body.id, 'body') &&
      Composite.get(world, attachment.constraint.id, 'constraint')
    ));
    return true;
  });
}

function findWebTrapAt(pos) {
  const bodies = webTraps.map(entry => entry.body).filter(body => Composite.get(world, body.id, 'body'));
  let body = Matter.Query.point(bodies, pos).pop();
  if (!body) {
    let nearestDist = 46;
    bodies.forEach(candidate => {
      const distance = Math.hypot(candidate.position.x - pos.x, candidate.position.y - pos.y);
      if (distance < nearestDist) {
        body = candidate;
        nearestDist = distance;
      }
    });
  }
  return body ? webTraps.find(entry => entry.body === body) || null : null;
}

function releaseWebTrap(entry) {
  pruneWebTraps();
  const captured = entry.attachments.filter(attachment => Composite.get(world, attachment.body.id, 'body'));
  captured.forEach(attachment => {
    Composite.remove(world, attachment.constraint, true);
    Matter.Sleeping.set(attachment.body, false);
  });
  entry.attachments = [];
  addWebBurst(entry.body.position, '#bdfcff', 18);
  showWebFeedback(captured.length ? `WEB RELEASED ×${captured.length}` : 'WEB ARMED', captured.length ? '#bdfcff' : '#f58cff');
  playSound(captured.length ? 720 : 420, 0.12, 'triangle', 0.07);
  haptic(captured.length ? [8, 10, 8] : [5]);
  return captured.length;
}

function placeOrReleaseWebAt(pos) {
  pruneWebTraps();
  const existing = findWebTrapAt(pos);
  if (existing) return { released:releaseWebTrap(existing), body:existing.body };

  const x = Math.max(WEB_WIDTH / 2 + 10, Math.min(canvas.width - WEB_WIDTH / 2 - 10, pos.x));
  const y = Math.max(WEB_HEIGHT / 2 + 10, Math.min(canvas.height - WEB_HEIGHT / 2 - 30, pos.y));
  const body = Bodies.rectangle(x, y, WEB_WIDTH, WEB_HEIGHT, {
    isStatic:true,
    friction:0.9,
    restitution:0.05,
    label:'web-trap',
    chamfer:{ radius:6 },
    render:{ type:'web-trap', color:'#f58cff', width:WEB_WIDTH, height:WEB_HEIGHT }
  });
  body.isWebTrap = true;
  body.material = 'rubber';
  Composite.add(world, body);
  markSpawnPop(body);
  webTraps.push({ body, attachments:[] });
  addWebBurst(body.position);
  showWebFeedback('WEB ARMED • CATCH UP TO 3');
  playSound(660, 0.08, 'square', 0.06);
  haptic([7]);
  return { released:0, body };
}

function attachBodyToWeb(webBody, capturedBody, contact) {
  pruneWebTraps();
  const entry = webTraps.find(candidate => candidate.body === webBody);
  if (!entry || !capturedBody || capturedBody.isStatic || capturedBody.isPhased) return false;
  if (entry.attachments.length >= WEB_MAX_CAPTURES) return false;
  if (webTraps.some(candidate => candidate.attachments.some(attachment => attachment.body === capturedBody))) return false;

  const points = getWebAttachmentPoints(webBody, capturedBody, contact);
  const constraint = Constraint.create({
    bodyA:webBody,
    pointA:points.pointA,
    bodyB:capturedBody,
    pointB:points.pointB,
    length:0,
    stiffness:0.92,
    damping:0.28,
    render:{ type:'web-attachment' }
  });
  Composite.add(world, constraint);
  entry.attachments.push({ body:capturedBody, constraint });
  Matter.Sleeping.set(capturedBody, false);
  Body.setVelocity(capturedBody, { x:capturedBody.velocity.x * 0.2, y:capturedBody.velocity.y * 0.2 });
  Body.setAngularVelocity(capturedBody, capturedBody.angularVelocity * 0.25);
  addWebBurst(contact, '#f58cff', 16);
  showWebFeedback(`WEB CAUGHT ${entry.attachments.length}/${WEB_MAX_CAPTURES}`);
  playSound(520 + entry.attachments.length * 90, 0.1, 'triangle', 0.08);
  haptic([8, 8, 10]);
  return constraint;
}

const RAMP_WIDTH = 112;
const RAMP_HEIGHT = 58;

function getRampVertices(direction = 1) {
  return direction === -1
    ? [
      { x:-RAMP_WIDTH / 2, y:-RAMP_HEIGHT / 2 },
      { x:-RAMP_WIDTH / 2, y:RAMP_HEIGHT / 2 },
      { x:RAMP_WIDTH / 2, y:RAMP_HEIGHT / 2 }
    ]
    : [
      { x:-RAMP_WIDTH / 2, y:RAMP_HEIGHT / 2 },
      { x:RAMP_WIDTH / 2, y:RAMP_HEIGHT / 2 },
      { x:RAMP_WIDTH / 2, y:-RAMP_HEIGHT / 2 }
    ];
}

function getRampPlacement(pos, canvasWidth, canvasHeight) {
  return {
    x:Math.max(RAMP_WIDTH / 2 + 10, Math.min(canvasWidth - RAMP_WIDTH / 2 - 10, pos.x)),
    y:Math.max(RAMP_HEIGHT / 2 + 10, Math.min(canvasHeight - RAMP_HEIGHT / 2 - 30, pos.y))
  };
}

function createRampBody(position, direction = 1) {
  const body = Bodies.fromVertices(position.x, position.y, getRampVertices(direction), {
    isStatic:true,
    friction:0.92,
    restitution:0.08,
    label:'ramp',
    render:{ type:'ramp', color:'#ffe66d', width:RAMP_WIDTH, height:RAMP_HEIGHT, direction }
  });
  body.isRamp = true;
  body.rampDirection = direction;
  body.material = 'stone';
  return body;
}

function findRampAt(pos) {
  ramps = ramps.filter(body => Composite.get(world, body.id, 'body'));
  let body = Matter.Query.point(ramps, pos).pop();
  if (!body) {
    let nearestDist = 50;
    ramps.forEach(candidate => {
      const distance = Math.hypot(candidate.position.x - pos.x, candidate.position.y - pos.y);
      if (distance < nearestDist) {
        body = candidate;
        nearestDist = distance;
      }
    });
  }
  return body || null;
}

function showRampFeedback(message, color = '#ffe66d') {
  const feedback = document.getElementById('ramp-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(rampFeedbackTimer);
  rampFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 900);
}

function addRampBurst(position, direction) {
  const travel = direction === -1 ? -1 : 1;
  for (let i = 0; i < 16; i++) {
    const angle = Math.PI + (Math.PI * i / 15);
    const speed = 1.4 + Math.random() * 3;
    particles.push({
      x:position.x,
      y:position.y,
      vx:Math.cos(angle) * speed + travel * 0.8,
      vy:Math.sin(angle) * speed - 0.8,
      size:2 + Math.random() * 2.5,
      life:0.28 + Math.random() * 0.3,
      color:i % 3 === 0 ? '#ffffff' : '#ffe66d'
    });
  }
  explosions.push({ x:position.x, y:position.y, r:5, maxR:52, alpha:0.62, isBirthRing:true });
}

function placeOrFlipRampAt(pos) {
  const existing = findRampAt(pos);
  if (existing) {
    const direction = existing.rampDirection === -1 ? 1 : -1;
    const index = ramps.indexOf(existing);
    const replacement = createRampBody({ x:existing.position.x, y:existing.position.y }, direction);
    Composite.remove(world, existing, true);
    Composite.add(world, replacement);
    ramps[index] = replacement;
    addRampBurst(replacement.position, direction);
    showRampFeedback(direction === 1 ? 'RAMP FLIPPED: RISE RIGHT' : 'RAMP FLIPPED: RISE LEFT');
    playSound(direction === 1 ? 720 : 520, 0.1, 'square', 0.065);
    haptic([7, 8, 7]);
    return { body:replacement, flipped:true, direction };
  }

  const placement = getRampPlacement(pos, canvas.width, canvas.height);
  const body = createRampBody(placement, 1);
  Composite.add(world, body);
  ramps.push(body);
  addRampBurst(body.position, 1);
  showRampFeedback('RAMP PLACED: TAP IT TO FLIP');
  playSpawn();
  playSound(620, 0.08, 'triangle', 0.06);
  haptic([7]);
  return { body, flipped:false, direction:1 };
}

const PINWHEEL_ARM_LENGTH = 104;
const PINWHEEL_ARM_WIDTH = 14;
const PINWHEEL_KICK_SPEED = 0.42;

function getPinwheelPlacement(pos, canvasWidth, canvasHeight) {
  const radius = PINWHEEL_ARM_LENGTH / 2;
  return {
    x:Math.max(radius + 10, Math.min(canvasWidth - radius - 10, pos.x)),
    y:Math.max(radius + 10, Math.min(canvasHeight - radius - 30, pos.y))
  };
}

function getPinwheelKick(direction = 1) {
  const normalizedDirection = direction === -1 ? -1 : 1;
  return {
    angularVelocity:normalizedDirection * PINWHEEL_KICK_SPEED,
    nextDirection:-normalizedDirection
  };
}

function createPinwheelAssembly(position) {
  const partOptions = {
    chamfer:{ radius:PINWHEEL_ARM_WIDTH / 2 },
    friction:0.32,
    restitution:0.78,
    render:{ visible:false }
  };
  const horizontal = Bodies.rectangle(
    position.x, position.y, PINWHEEL_ARM_LENGTH, PINWHEEL_ARM_WIDTH, partOptions
  );
  const vertical = Bodies.rectangle(
    position.x, position.y, PINWHEEL_ARM_WIDTH, PINWHEEL_ARM_LENGTH, partOptions
  );
  const body = Body.create({
    parts:[horizontal, vertical],
    friction:0.32,
    frictionAir:0.012,
    restitution:0.78,

    pointA:{ x:position.x, y:position.y },
    bodyB:body,
    pointB:{ x:0, y:0 },
    length:0,
    stiffness:1,
    damping:0.12,
    render:{ visible:false, type:'pinwheel-pin' }
  });

}

function prunePinwheels() {
  pinwheels = pinwheels.filter(entry => (
    Composite.get(world, entry.body.id, 'body') && Composite.get(world, entry.constraint.id, 'constraint')
  ));
}

function findPinwheelAt(pos) {
  prunePinwheels();
  const bodies = pinwheels.map(entry => entry.body);
  let body = Matter.Query.point(bodies, pos).pop();
  if (!body) {
    let nearestDist = 52;
    bodies.forEach(candidate => {
      const distance = Math.hypot(candidate.position.x - pos.x, candidate.position.y - pos.y);
      if (distance < nearestDist) {
        body = candidate;
        nearestDist = distance;
      }
    });
  }
  return body ? pinwheels.find(entry => entry.body === body) || null : null;
}

function showPinwheelFeedback(message) {
  const feedback = document.getElementById('pinwheel-feedback');
  feedback.textContent = message;
  feedback.style.color = '#7dff7a';
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(pinwheelFeedbackTimer);
  pinwheelFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 900);
}

function addPinwheelBurst(body, direction) {
  for (let i = 0; i < 16; i++) {
    const angle = Math.PI * 2 * i / 16;
    const tangent = angle + direction * Math.PI / 2;
    const radius = 18 + Math.random() * 28;
    particles.push({
      x:body.position.x + Math.cos(angle) * radius,
      y:body.position.y + Math.sin(angle) * radius,
      vx:Math.cos(tangent) * (1.5 + Math.random() * 2.5),
      vy:Math.sin(tangent) * (1.5 + Math.random() * 2.5),
      size:2 + Math.random() * 2.5,
      life:0.3 + Math.random() * 0.28,
      color:i % 3 === 0 ? '#ffffff' : '#7dff7a'
    });
  }
}

function placeOrKickPinwheelAt(pos) {
  const existing = findPinwheelAt(pos);
  if (existing) {
    const kick = getPinwheelKick(existing.body.pinwheelNextDirection);
    Body.setAngularVelocity(existing.body, kick.angularVelocity);
    existing.body.pinwheelNextDirection = kick.nextDirection;
    addPinwheelBurst(existing.body, Math.sign(kick.angularVelocity));
    showPinwheelFeedback(kick.angularVelocity > 0 ? 'PINWHEEL KICKED: CLOCKWISE' : 'PINWHEEL KICKED: COUNTER-CLOCKWISE');
    playSound(kick.angularVelocity > 0 ? 760 : 520, 0.09, 'square', 0.07);
    haptic([8, 10, 8]);
    return { ...existing, placed:false, direction:Math.sign(kick.angularVelocity) };
  }

  const placement = getPinwheelPlacement(pos, canvas.width, canvas.height);
  const assembly = createPinwheelAssembly(placement);
  Composite.add(world, [assembly.body, assembly.constraint]);
  pinwheels.push(assembly);
  addPinwheelBurst(assembly.body, 1);
  showPinwheelFeedback('PINWHEEL PLACED: TAP TO REVERSE');
  playSpawn();
  playSound(650, 0.1, 'triangle', 0.06);
  haptic([7]);
  return { ...assembly, placed:true, direction:1 };
}

const BASKET_WIDTH = 104;
const BASKET_HEIGHT = 74;
const BASKET_WALL = 12;

function getBasketPlacement(pos, canvasWidth, canvasHeight) {

    y:Math.max(BASKET_HEIGHT / 2 + 10, Math.min(canvasHeight - BASKET_HEIGHT / 2 - 30, pos.y))
  };
}

function getBasketTip(direction = 1, velocity = { x:0, y:0 }) {
  const normalizedDirection = direction === -1 ? -1 : 1;
  return {
    angularVelocity:normalizedDirection * BASKET_TIP_SPEED,
    velocity:{
      x:velocity.x + normalizedDirection * 2.2,
      y:Math.min(velocity.y, -4.2)
    },
    nextDirection:-normalizedDirection
  };
}

function createBasketBody(position) {

    restitution:0.16,
    density:0.006,

  );
  const right = Bodies.rectangle(
    position.x + BASKET_WIDTH / 2 - BASKET_WALL / 2, position.y,

  );

    frictionAir:0.012,

    render:{ type:'basket', color:'#ffb86b', width:BASKET_WIDTH, height:BASKET_HEIGHT, wall:BASKET_WALL }
  });

  body.render.offsetY = position.y - body.position.y;

function pruneBaskets() {

function findBasketAt(pos) {

function showBasketFeedback(message) {

function addBasketBurst(body, direction) {
  for (let i = 0; i < 14; i++) {

    const speed = 1.2 + Math.random() * 2.8;

function placeOrTipBasketAt(pos) {

  });

  body.cannonDirection = placement.direction;
  body.material = 'metal';
  body.cannonFiredAt = 0;
  return body;
}

function pruneCannons() {
  cannons = cannons.filter(body => Composite.get(world, body.id, 'body'));
}

function findCannonAt(pos) {
  pruneCannons();
  let body = Matter.Query.point(cannons, pos).pop();
  if (!body) {
    let nearestDist = 58;
    cannons.forEach(candidate => {
      const distance = Math.hypot(candidate.position.x - pos.x, candidate.position.y - pos.y);
      if (distance < nearestDist) {
        body = candidate;
        nearestDist = distance;
      }
    });
  }
  return body || null;
}

function addCannonBurst(shot) {

function fireCannon(cannon) {
  const shot = getCannonShot(cannon.position, cannon.cannonDirection);
  const ball = Bodies.circle(shot.muzzle.x, shot.muzzle.y, CANNON_BALL_RADIUS, {

    friction:0.28,

  ball.firedByCannonId = cannon.id;

  Composite.add(world, ball);
  addCannonBurst(shot);

function placeOrFireCannonAt(pos) {

function isRelayableBody(body) {
  if (!body || body.label === 'wall' || body.label === 'chain-link' || body.isTarget || body.isStatic || body.isFragment || body.parent !== body) return false;
  return !Composite.allConstraints(world).some(constraint => constraint.bodyA === body || constraint.bodyB === body);
}

function getRelayedMotion(firstVelocity, firstAngularVelocity, secondVelocity, secondAngularVelocity) {
  return {
    first: {
      velocity: { x:secondVelocity.x, y:secondVelocity.y },
      angularVelocity: secondAngularVelocity
    },
    second: {
      velocity: { x:firstVelocity.x, y:firstVelocity.y },
      angularVelocity: firstAngularVelocity
    }
  };
}

function resetRelaySelection(clearFeedback = false) {
  relayFirstBody = null;
  if (!clearFeedback) return;
  relayFlash = null;
  clearTimeout(relayFeedbackTimer);

function showRelayFeedback(message, color = '#ffcf40') {

}

function addRelayBurst(position, color, velocity) {
  const speed = Math.hypot(velocity.x, velocity.y);
  const direction = speed > 0.01
    ? { x:velocity.x / speed, y:velocity.y / speed }
    : { x:0, y:-1 };
  for (let i = 0; i < 14; i++) {
    const spread = (i - 6.5) / 6.5;
    particles.push({
      x: position.x,
      y: position.y,
      vx: direction.x * (2 + Math.random() * 3) - direction.y * spread * 2,
      vy: direction.y * (2 + Math.random() * 3) + direction.x * spread * 2,
      size: 2 + Math.random() * 2.5,
      life: 0.3 + Math.random() * 0.28,
      color
    });
  }
}

function findRelayableBodyAt(pos) {
  const relayableBodies = Composite.allBodies(world).filter(isRelayableBody);
  let target = Matter.Query.point(relayableBodies, pos).filter(isRelayableBody).pop();

  if (!target) {
    let nearestDist = 46;
    relayableBodies.forEach(body => {
      const distance = Math.hypot(body.position.x - pos.x, body.position.y - pos.y);
      if (distance < nearestDist) {
        target = body;
        nearestDist = distance;
      }
    });
  }
  return target || null;
}

function relayBodiesAt(pos) {
  if (relayFirstBody && !Composite.get(world, relayFirstBody.id, 'body')) relayFirstBody = null;
  const target = findRelayableBodyAt(pos);
  if (!target) return false;

  if (!relayFirstBody) {
    relayFirstBody = target;
    addRelayBurst(target.position, '#ffcf40', target.velocity);
    showRelayFeedback('RELAY A SET • PICK B');
    haptic([7]);
    playSound(560, 0.08, 'square', 0.06);
    return 'selected';
  }

  if (target === relayFirstBody) {
    resetRelaySelection();
    showRelayFeedback('RELAY CANCELLED', '#aaaaaa');
    haptic([4]);
    playSound(240, 0.08, 'square', 0.05);
    return 'cancelled';
  }

  const first = relayFirstBody;
  const firstPosition = { x:first.position.x, y:first.position.y };
  const secondPosition = { x:target.position.x, y:target.position.y };
  const motion = getRelayedMotion(first.velocity, first.angularVelocity, target.velocity, target.angularVelocity);
  Matter.Sleeping.set(first, false);
  Matter.Sleeping.set(target, false);
  Body.setVelocity(first, motion.first.velocity);
  Body.setAngularVelocity(first, motion.first.angularVelocity);
  Body.setVelocity(target, motion.second.velocity);
  Body.setAngularVelocity(target, motion.second.angularVelocity);
  addRelayBurst(firstPosition, '#ffcf40', motion.first.velocity);
  addRelayBurst(secondPosition, '#ff66cc', motion.second.velocity);
  resetRelaySelection();
  relayFlash = { firstPosition, secondPosition, startedAt:performance.now() };
  showRelayFeedback('MOTION RELAYED!');
  haptic([9, 14, 9]);
  playSound(460, 0.08, 'square', 0.07);
  playSound(760, 0.12, 'sine', 0.08);
  shakeIntensity = Math.max(shakeIntensity, 2);
  return 'relayed';
}

function getConstraintWorldPoint(constraint, side) {
  const body = side === 'A' ? constraint.bodyA : constraint.bodyB;
  const point = (side === 'A' ? constraint.pointA : constraint.pointB) || { x:0, y:0 };
  if (!body) return { x:point.x, y:point.y };
  const cos = Math.cos(body.angle || 0);
  const sin = Math.sin(body.angle || 0);
  return {
    x: body.position.x + point.x * cos - point.y * sin,
    y: body.position.y + point.x * sin + point.y * cos
  };
}

function distancePointToSegment(point, start, end) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const lengthSquared = dx * dx + dy * dy;
  if (lengthSquared === 0) return Math.hypot(point.x - start.x, point.y - start.y);
  const t = Math.max(0, Math.min(1,
    ((point.x - start.x) * dx + (point.y - start.y) * dy) / lengthSquared
  ));
  const closestX = start.x + t * dx;
  const closestY = start.y + t * dy;
  return Math.hypot(point.x - closestX, point.y - closestY);
}

function getConstraintCutPoint(point, start, end) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const lengthSquared = dx * dx + dy * dy;
  if (lengthSquared === 0) return { x:start.x, y:start.y };
  const t = Math.max(0, Math.min(1,
    ((point.x - start.x) * dx + (point.y - start.y) * dy) / lengthSquared
  ));
  return { x:start.x + t * dx, y:start.y + t * dy };
}

function isSnippableConstraint(constraint) {
  return Boolean(
    constraint &&
    (constraint.bodyA || constraint.bodyB) &&
    constraint.render?.visible !== false &&
    constraint.render?.type !== 'flipper-pin'
  );
}

function findSnippableConstraintAt(pos, maxDistance = 28) {
  let match = null;
  Composite.allConstraints(world).forEach(constraint => {
    if (!isSnippableConstraint(constraint)) return;
    const start = getConstraintWorldPoint(constraint, 'A');
    const end = getConstraintWorldPoint(constraint, 'B');
    const distance = distancePointToSegment(pos, start, end);
    if (distance > maxDistance || (match && distance >= match.distance)) return;
    match = {
      constraint,
      distance,
      point: getConstraintCutPoint(pos, start, end)
    };
  });
  return match;
}

function showSnipFeedback(message, color = '#ffdd55') {
  const feedback = document.getElementById('snip-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(snipFeedbackTimer);
  snipFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 800);
}

function addSnipBurst(point) {
  for (let i = 0; i < 16; i++) {
    const angle = (Math.PI * 2 * i) / 16;
    const speed = 1.5 + Math.random() * 3.5;
    particles.push({
      x: point.x,
      y: point.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 2,
      life: 0.25 + Math.random() * 0.3,
      color: i % 2 === 0 ? '#ffdd55' : '#ff5577'
    });
  }
  explosions.push({ x:point.x, y:point.y, r:4, maxR:38, alpha:0.65, isBirthRing:true });
}

function snipConstraintAt(pos) {
  const match = findSnippableConstraintAt(pos);
  if (!match) {
    showSnipFeedback('NO LINK', '#888888');
    haptic([3]);
    return false;
  }

  const { constraint, point } = match;
  [constraint.bodyA, constraint.bodyB].forEach(body => {
    if (body?.chainConnections) body.chainConnections = Math.max(0, body.chainConnections - 1);
  });
  ropes = ropes.filter(rope => rope !== constraint);
  struts = struts.filter(strut => strut !== constraint);
  hinges = hinges.filter(hinge => hinge !== constraint);
  springs = springs.filter(spring => spring !== constraint);
  welds = welds.filter(weld => weld.constraint !== constraint);
  tethers = tethers.filter(tether => tether.constraint !== constraint);
  webTraps.forEach(entry => {
    entry.attachments = entry.attachments.filter(attachment => attachment.constraint !== constraint);
  });
  wreckingBalls = wreckingBalls.filter(wrecking => wrecking.chain !== constraint);
  seesaws = seesaws.filter(seesaw => seesaw.constraint !== constraint);
  flippers = flippers.filter(flipper => flipper.constraint !== constraint);
  Composite.remove(world, constraint, true);
  addSnipBurst(point);
  showSnipFeedback('CONNECTION CUT!');
  haptic([8, 12, 8]);
  playSound(980, 0.05, 'square', 0.08);
  playSound(340, 0.1, 'triangle', 0.06);
  shakeIntensity = Math.max(shakeIntensity, 2);
  return true;
}

let pointerDown = false;
let pointerStartTime = 0;
const TRAJECTORY_DOT_COUNT = 12;
const TRAJECTORY_STEP_FRAMES = 6;
const TRAJECTORY_GRAVITY_ACCEL = 0.28; // Approximate Matter.js gravity per 60fps step.

function getSlingshotLaunch(start, current) {
  const dx = start.x - current.x;
  const dy = start.y - current.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const power = Math.min(dist / 15, 25);
  return {
    dx,
    dy,
    dist,
    power,
    vx: dist > 0 ? (dx / dist) * power : 0,
    vy: dist > 0 ? (dy / dist) * power : 0
  };
}

function getTrajectoryPoint(start, launch, frames) {
  const gx = engine.gravity.x || 0;
  const gy = engine.gravity.y || 0;
  return {
    x: start.x + launch.vx * frames + 0.5 * gx * TRAJECTORY_GRAVITY_ACCEL * frames * frames,
    y: start.y + launch.vy * frames + 0.5 * gy * TRAJECTORY_GRAVITY_ACCEL * frames * frames
  };
}

function drawTrajectoryPreview(start, launch) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 1; i <= TRAJECTORY_DOT_COUNT; i++) {
    const frames = i * TRAJECTORY_STEP_FRAMES;
    const p = getTrajectoryPoint(start, launch, frames);
    const alpha = Math.max(0.12, 0.62 - i * 0.04);
    const size = Math.max(1.6, 4 - i * 0.18);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = i % 3 === 0 ? '#0abdc6' : '#00ff41';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function onDown(e) {
  e.preventDefault();
  if (clearAnimating) return;
  const pos = getPointerPos(e);
  addRipple(pos.x, pos.y);
  pointerDown = true;
  pointerStartTime = Date.now();

  if (drawMode) {
    drawPoints = [pos];
    return;
  }

  // Portal placement
  if (currentTool === 'portal') {
    placePortal(pos.x, pos.y);
    pointerDown = false;
    return;
  }

  // Rope tool — connect two bodies
  if (currentTool === 'rope') {
    const allB = Composite.allBodies(world);
    let nearest = null, nearDist = 50;
    for (const b of allB) {
      if (b.isStatic) continue;
      const dx = b.position.x - pos.x, dy = b.position.y - pos.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < nearDist) { nearest = b; nearDist = d; }
    }
    if (nearest) {
      if (!ropeFirstBody) {
        ropeFirstBody = nearest;
        // Flash to indicate selection
        particles.push({ x: nearest.position.x, y: nearest.position.y, vx:0, vy:-1, size:6, life:0.5, color:'#cc8844' });
        playSound(600, 0.1, 'sine', 0.08);
      } else if (nearest !== ropeFirstBody) {
        const rope = Constraint.create({
          bodyA: ropeFirstBody, bodyB: nearest,
          stiffness: 0.02, damping: 0.05,
          render: { type:'rope' }
        });
        Composite.add(world, rope);
        ropes.push(rope);
        // Particles at both ends
        for (const b of [ropeFirstBody, nearest]) {
          for (let i = 0; i < 5; i++) {
            particles.push({ x: b.position.x, y: b.position.y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, size:3, life:0.4, color:'#cc8844' });
          }
        }
        playSound(400, 0.15, 'sine', 0.1);
        playSound(500, 0.1, 'square', 0.06);
        ropeFirstBody = null;
      }
    }
    pointerDown = false;
    return;
  }

  // Strut tool — tap two build parts to brace them at a fixed distance.
  if (currentTool === 'strut') {
    strutBodiesAt(pos);
    pointerDown = false;
    return;
  }

  // Rotate tool — snap a standalone object through a deliberate quarter-turn.
  if (currentTool === 'rotate') {
    rotateBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Fusion tool — combine two standalone bodies into one momentum-preserving core.
  if (currentTool === 'fusion') {
    fuseBodiesAt(pos);
    pointerDown = false;
    return;
  }

  // Hinge tool — pin two tapped body points together while preserving free rotation.
  if (currentTool === 'hinge') {
    hingeBodiesAt(pos);
    pointerDown = false;
    return;
  }

  // Spring tool — connect two parts with a shortened elastic constraint.
  if (currentTool === 'spring') {
    springBodiesAt(pos);
    pointerDown = false;
    return;
  }

  // Launch tool — select one object, then fire it toward a tapped destination.
  if (currentTool === 'launch') {
    launchBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Float tool — toggle local gravity cancellation on a standalone body.
  if (currentTool === 'float') {
    toggleFloatAt(pos);
    pointerDown = false;
    return;
  }

  // Pivot tool — pin one dynamic part to the world while preserving rotation.
  if (currentTool === 'pivot') {
    togglePivotAt(pos);
    pointerDown = false;
    return;
  }

  // Reverse tool — instantly invert one moving part's linear and angular motion.
  if (currentTool === 'reverse') {
    reverseBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Punch tool — strike one dynamic part upward; off-center hits add torque.
  if (currentTool === 'punch') {
    punchBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Blink tool — select one standalone object, then teleport it to a destination.
  if (currentTool === 'blink') {
    blinkBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Squash tool — cycle one standalone object's proportions through wide, tall, and original.
  if (currentTool === 'squash') {
    squashBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Pulse tool — blast every nearby dynamic body away from the tapped point.
  if (currentTool === 'pulse') {
    pulseAt(pos);
    pointerDown = false;
    return;
  }

  // Relay tool — select two standalone bodies to exchange motion without moving them.
  if (currentTool === 'relay') {
    relayBodiesAt(pos);
    pointerDown = false;
    return;
  }

  // Curve tool — steer one moving body 90 degrees while preserving its speed.
  if (currentTool === 'curve') {
    curveBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Swirl tool — curl every nearby dynamic body around the tapped point.
  if (currentTool === 'swirl') {
    swirlAt(pos);
    pointerDown = false;
    return;
  }

  // Brake tool — remove one dynamic part's movement and spin without anchoring it.
  if (currentTool === 'brake') {
    brakeBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Thruster tool — toggle continuous force along a dynamic part's facing direction.
  if (currentTool === 'thruster') {
    toggleThrusterAt(pos);
    pointerDown = false;
    return;
  }

  // Phase tool — toggle one dynamic part between normal and collision-free physics.
  if (currentTool === 'phase') {
    togglePhaseAt(pos);
    pointerDown = false;
    return;
  }

  // Gyro tool — toggle persistent self-leveling toward the nearest quarter-turn.
  if (currentTool === 'gyro') {
    toggleGyroAt(pos);
    pointerDown = false;
    return;
  }

  // Charge tool — cycle one dynamic part through positive, negative, and neutral polarity.
  if (currentTool === 'charge') {
    cycleChargeAt(pos);
    pointerDown = false;
    return;
  }

  // Twist tool — give one dynamic part a capped one-shot angular kick.
  if (currentTool === 'twist') {
    twistBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Lift tool — toggle inverted local gravity on one dynamic part.
  if (currentTool === 'lift') {
    toggleLiftAt(pos);
    pointerDown = false;
    return;
  }

  // Orbit tool — select one dynamic part, then set a remote center for continuous orbital motion.
  if (currentTool === 'orbit') {
    orbitBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Weld tool — lock two tapped build parts together at a rigid seam.
  if (currentTool === 'weld') {
    weldBodiesAt(pos);
    pointerDown = false;
    return;
  }

  // Tether tool — connect one dynamic part to a remote world point with an elastic cord.
  if (currentTool === 'tether') {
    tetherBodyAt(pos);
    pointerDown = false;
    return;
  }

  // Stack tool — place one standalone movable part neatly on top of another part.
  if (currentTool === 'stack') {
    stackBodiesAt(pos);
    pointerDown = false;
