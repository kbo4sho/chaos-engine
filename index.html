<style>
/* ── RESET & BASE ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#0a0a0a; color:#00ff41;
  font-family:'VT323', monospace; font-size:18px;
  touch-action:manipulation; user-select:none;
  -webkit-user-select:none;
}

/* ── SCANLINE OVERLAY ── */
body::after {
  content:''; position:fixed; inset:0; z-index:9999;
  pointer-events:none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,255,65,0.03) 0px,
    rgba(0,255,65,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
}

/* ── LAYOUT ── */
#app {
  display:flex; flex-direction:column;
  width:100%; height:100%;
}

/* ── TOP BAR ── */
#topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; gap:8px; flex-shrink:0;
  background:#0d1117;
  border-bottom:2px solid #0abdc6;
  box-shadow:0 2px 12px rgba(10,189,198,0.3);
  z-index:10;
}
#topbar .title {
  font-size:28px; color:#00ff41; letter-spacing:4px;
  text-shadow:0 0 10px rgba(0,255,65,0.6);
  white-space:nowrap;
}
#gravity-panel {
  display:flex; align-items:center; gap:6px; flex-wrap:nowrap;
}
#gravity-panel .planet-btn {
  background:#111820; border:1px solid #0abdc6;
  color:#0abdc6; font-family:'VT323',monospace; font-size:16px;
  padding:4px 10px; cursor:pointer; border-radius:2px;
  transition: all .15s;
}
#gravity-panel .planet-btn.active,
#gravity-panel .planet-btn:hover {
  background:#0abdc6; color:#0a0a0a;
  box-shadow:0 0 8px rgba(10,189,198,0.5);
}
#stats {
  font-size:18px; color:#0abdc6; white-space:nowrap;
  text-shadow:0 0 6px rgba(10,189,198,0.4);
}

/* ── CANVAS AREA ── */
#canvas-wrap {
  flex:1; position:relative; overflow:hidden;
  /* CRT curvature */
  border-radius:8px;
  /* subtle barrel distortion via box-shadow inset */
  box-shadow: inset 0 0 60px rgba(0,0,0,0.8), inset 0 0 15px rgba(10,189,198,0.08);
}
#canvas-wrap::before {
  content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
  border-radius:8px;
  box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
}
canvas#game {
  display:block; width:100%; height:100%;
  background:#080c10;
  touch-action:none;
}

  overflow-x:auto; flex-wrap:nowrap;
}
.tool-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:64px; height:58px; padding:2px 6px;
  background:#111820; border:2px solid #1a3a2a;
  color:#00ff41; font-family:'VT323',monospace; font-size:13px;
  cursor:pointer; border-radius:3px; transition:all .15s;
  flex-shrink:0;
}
.tool-btn .icon { font-size:24px; line-height:1; }
.tool-btn.active, .tool-btn:hover {
  border-color:#00ff41; background:#0a2a1a;
  box-shadow:0 0 10px rgba(0,255,65,0.3);
}
.tool-btn.draw-btn.active {

  box-shadow:0 0 10px rgba(255,102,0,0.4);
  color:#ff6600;
}
.tool-btn.slomo-btn.active {
  border-color:#cc00ff; background:#1a0a2a;
  box-shadow:0 0 10px rgba(204,0,255,0.4);
  color:#cc00ff;
}

/* ── CHAOS BUTTONS ── */
#chaos-bar {
  display:flex; align-items:center; justify-content:center;
  gap:4px; padding:6px 8px; flex-shrink:0;
  background:#0d1117;
  border-top:2px solid #00ff41;
  box-shadow:0 -2px 12px rgba(0,255,65,0.15);
}
.chaos-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:68px; height:52px; padding:2px 8px;
  background:#1a0a0a; border:2px solid #ff3333;
  color:#ff3333; font-family:'VT323',monospace; font-size:12px;
  cursor:pointer; border-radius:3px; transition:all .15s;
  flex-shrink:0;
}
.chaos-btn .icon { font-size:20px; line-height:1; }
.chaos-btn:hover, .chaos-btn:active {
  background:#3a0a0a; border-color:#ff6666;
  box-shadow:0 0 12px rgba(255,51,51,0.4);
}
.chaos-btn.safe { border-color:#0abdc6; color:#0abdc6; background:#0a1a1a; }
.chaos-btn.safe:hover { background:#0a2a2a; box-shadow:0 0 12px rgba(10,189,198,0.4); }

.tool-btn.shortcut-flash,
.chaos-btn.shortcut-flash {
  animation: shortcut-pulse .18s ease-out;
}
@keyframes shortcut-pulse {
  0% { transform:scale(1.08); box-shadow:0 0 0 0 rgba(0,255,65,0.75); }
  100% { transform:scale(1); box-shadow:0 0 18px 8px rgba(0,255,65,0); }
}

/* ── SCROLLABLE TOOLBARS ── */
#toolbar, #chaos-bar {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  scrollbar-width: none;
}
#toolbar::-webkit-scrollbar, #chaos-bar::-webkit-scrollbar { display:none; }

/* ── COLLAPSE TOGGLES ── */
.bar-toggle {
  display:none; /* hidden on desktop */
  background:#0d1117; border:1px solid #0abdc6;
  color:#0abdc6; font-family:'VT323',monospace; font-size:16px;
  padding:4px 12px; cursor:pointer; text-align:center;
  width:100%; flex-shrink:0;
}
.bar-toggle:active { background:#0abdc6; color:#0a0a0a; }

/* ── MOBILE TWEAKS ── */
@media(max-width:600px) {
  #topbar {
    flex-wrap:wrap; padding:4px 8px; gap:4px;
  }
  #topbar .title { font-size:18px; letter-spacing:2px; }
  #gravity-panel {

  .bar-toggle { display:block; }
  #toolbar.collapsed, #chaos-bar.collapsed { display:none; }
}

}

function getSpawnPopScale(elapsed) {
  const t = Math.min(Math.max(elapsed / SPAWN_POP_MS, 0), 1);
  if (t < 0.6) return Math.max(0.05, (t / 0.6) * 1.15);
  return 1.15 - ((t - 0.6) / 0.4) * 0.15;
}

function markSpawnPop(target, now = performance.now()) {
  const bodies = Array.isArray(target) ? target : (target?.bodies || (target ? [target] : []));

    b.spawnTime = now;
    b.spawnScale = 0.05;
  });
}

function updateSpawnPopAnimations(now = performance.now()) {
  Composite.allBodies(world).forEach(b => {
    if (b.spawnTime == null) return;
    const elapsed = now - b.spawnTime;
    if (elapsed >= SPAWN_POP_MS) {
      b.spawnScale = 1;
      delete b.spawnTime;
      return;
    }
    b.spawnScale = getSpawnPopScale(elapsed);
  });
}

// ── AMBIENT HUM (reacts to chaos level) ──
let ambientOsc = null;
let ambientGain = null;
let ambientActive = false;

function startAmbientHum() {
  if (ambientActive) return;
  const a = getAudio();
  
  // Create dual oscillators for rich ambient texture
  const osc1 = a.createOscillator();
  const osc2 = a.createOscillator();
  ambientGain = a.createGain();
  
  osc1.type = 'sine';
  osc2.type = 'triangle';
  osc1.frequency.setValueAtTime(40, a.currentTime); // Low bass hum
  osc2.frequency.setValueAtTime(40.5, a.currentTime); // Slight detune for thickness
  
  ambientGain.gain.setValueAtTime(0, a.currentTime);
  ambientGain.gain.linearRampToValueAtTime(0.015, a.currentTime + 0.5); // Fade in
  
  osc1.connect(ambientGain);
  osc2.connect(ambientGain);
  ambientGain.connect(a.destination);
  
  osc1.start();
  osc2.start();
  
  ambientOsc = { osc1, osc2 };
  ambientActive = true;
}

function stopAmbientHum() {
  if (!ambientActive || !ambientOsc || !ambientGain) return;
  const a = getAudio();
  
  // Fade out
  ambientGain.gain.linearRampToValueAtTime(0, a.currentTime + 0.5);
  
  setTimeout(() => {
    if (ambientOsc) {
      ambientOsc.osc1.stop();
      ambientOsc.osc2.stop();
      ambientOsc = null;
    }
    ambientActive = false;
  }, 600);
}

function updateAmbientHum() {
  if (!ambientActive || !ambientOsc || !ambientGain) return;
  const a = getAudio();
  
  // Map destruction meter to frequency and volume
  // Level 0 (CALM): 40Hz, volume 0.015
  // Level 6 (GODLIKE): 120Hz, volume 0.08
  const level = Math.floor(Math.log10(Math.max(destructionMeter, 1)));
  const normalizedChaos = Math.min(level / 6, 1);
  
  const targetFreq = 40 + normalizedChaos * 80; // 40Hz to 120Hz
  const targetVol = 0.015 + normalizedChaos * 0.065; // 0.015 to 0.08
  
  // Smooth transitions
  ambientOsc.osc1.frequency.linearRampToValueAtTime(targetFreq, a.currentTime + 0.3);
  ambientOsc.osc2.frequency.linearRampToValueAtTime(targetFreq + 0.5, a.currentTime + 0.3); // Detune
  ambientGain.gain.linearRampToValueAtTime(targetVol, a.currentTime + 0.3);
}
function playSound(freq, dur, type='square', vol=0.12) {
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, a.currentTime);
    gain.gain.setValueAtTime(vol, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(); osc.stop(a.currentTime + dur);
  } catch(e) {}
}

let lastHapticTime = -Infinity;
function haptic(pattern) {
  try {
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
      navigator.vibrate(pattern);
    }
  } catch(e) {}
}
function hapticThrottled(pattern, minInterval = 50) {
  const now = performance.now();
  if (now - lastHapticTime < minInterval) return;
  lastHapticTime = now;
  haptic(pattern);
}

function playBoom() {
  try {
    const a = getAudio();
    const buf = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const src = a.createBufferSource();
    src.buffer = buf;
    const gain = a.createGain();
    gain.gain.setValueAtTime(0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.5);
    src.connect(gain); gain.connect(a.destination);
    src.start();
  } catch(e) {}
}

const PENTATONIC_IMPACT_SCALE = [
  130.81, 146.83, 164.81, 196.00, 220.00,
  261.63, 293.66, 329.63, 392.00, 440.00,
  523.25, 587.33, 659.25, 783.99, 880.00,
];
const IMPACT_MATERIAL_OCTAVES = {
  wood: 0,
  rubber: 5,
  plastic: 5,
  metal: 10,
  glass: 10,
  ice: 10,
  default: 5,
};

function randomPentatonicNote(octaveStart = IMPACT_MATERIAL_OCTAVES.default) {
  return PENTATONIC_IMPACT_SCALE[octaveStart + Math.floor(Math.random() * 5)];
}

function musicalImpactFreq(material = 'default', intensity = 1) {
  const octaveStart = IMPACT_MATERIAL_OCTAVES[material] ?? IMPACT_MATERIAL_OCTAVES.default;
  const normalizedHit = Math.min(Math.max(intensity / 10, 0), 1);
  const noteOffset = Math.min(Math.floor(normalizedHit * 5), 4);
  return PENTATONIC_IMPACT_SCALE[octaveStart + noteOffset];
}

function musicalImpactHarmony(freq, steps = 2) {
  const nearestIdx = PENTATONIC_IMPACT_SCALE.reduce((bestIdx, note, idx) => {
    const bestDiff = Math.abs(PENTATONIC_IMPACT_SCALE[bestIdx] - freq);
    return Math.abs(note - freq) < bestDiff ? idx : bestIdx;
  }, 0);
  const targetIdx = Math.min(Math.max(nearestIdx + steps, 0), PENTATONIC_IMPACT_SCALE.length - 1);
  return PENTATONIC_IMPACT_SCALE[targetIdx];
}

function playBounce() { playSound(randomPentatonicNote(5), 0.08, 'sine', 0.08); }
function playSqueak() {
  playSound(PENTATONIC_IMPACT_SCALE[12], 0.15, 'sine', 0.15);
  setTimeout(() => playSound(PENTATONIC_IMPACT_SCALE[14], 0.1, 'sine', 0.1), 50);
}
function playSpawn() { playSound(800, 0.1, 'square', 0.06); }
function playWhoosh(power) {
  // Whoosh sound scaled to slingshot power (power range: 0-25)
  // Sweep from low freq upward with volume and duration scaled to power
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    
    // Scale parameters based on power
    const normalizedPower = Math.min(power / 25, 1); // 0-1
    const startFreq = 80 + normalizedPower * 40; // 80-120 Hz
    const endFreq = 200 + normalizedPower * 400; // 200-600 Hz
    const duration = 0.15 + normalizedPower * 0.15; // 0.15-0.3 sec
    const volume = 0.08 + normalizedPower * 0.08; // 0.08-0.16
    
    osc.type = 'sawtooth'; // Airy whoosh sound
    osc.frequency.setValueAtTime(startFreq, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(endFreq, a.currentTime + duration);
    
    gain.gain.setValueAtTime(volume, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(a.destination);
    osc.start();
    osc.stop(a.currentTime + duration);
  } catch(e) {}
}

function playClearVortexSound() {
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(900, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(90, a.currentTime + 0.55);
    gain.gain.setValueAtTime(0.12, a.currentTime);
    gain.gain.linearRampToValueAtTime(0.001, a.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(a.destination);
    osc.start();
    osc.stop(a.currentTime + 0.6);
  } catch(e) {}
}

// ── MATERIAL-BASED IMPACT SOUNDS ──
function playImpactSound(materialA, materialB, intensity) {
  const vol = Math.min(intensity * 0.05, 0.15);
  if (vol < 0.02) return; // Too quiet to play
  
  // Detect material collision type
  const materials = [materialA, materialB].sort().join('-');
  
  // Metal impacts - high, sharp clangs
  if (materials.includes('metal')) {
    const freq = musicalImpactFreq('metal', intensity);
    playSound(freq, 0.08 + intensity * 0.02, 'square', vol);
    setTimeout(() => playSound(musicalImpactHarmony(freq, 2), 0.05, 'sine', vol * 0.6), 20);
  }
  // Rubber impacts - bouncy boings
  else if (materials.includes('rubber')) {
    const freq = musicalImpactFreq('rubber', intensity);
    playSound(freq, 0.12, 'sine', vol);
    playSound(musicalImpactHarmony(freq, 3), 0.08, 'sine', vol * 0.5);
  }
  // Wood impacts - hollow thunks
  else if (materials.includes('wood')) {
    const freq = musicalImpactFreq('wood', intensity);
    playSound(freq, 0.15, 'triangle', vol * 1.2);
    playSound(musicalImpactHarmony(freq, -2), 0.1, 'sawtooth', vol * 0.4);
  }
  // Glass/ice impacts - crystalline tings
  else if (materials.includes('glass') || materials.includes('ice')) {
    const freq = musicalImpactFreq(materials.includes('ice') ? 'ice' : 'glass', intensity);
    playSound(freq, 0.06, 'sine', vol * 0.8);
    playSound(musicalImpactHarmony(freq, 2), 0.04, 'sine', vol * 0.5);
  }
  // Plastic impacts - light taps
  else if (materials.includes('plastic')) {
    const freq = musicalImpactFreq('plastic', intensity);
    playSound(freq, 0.08, 'triangle', vol * 0.7);
  }
  // Default (generic)
  else {
    playSound(musicalImpactFreq('default', intensity), 0.08, 'sine', vol);
  }
}

function getDestructionLevel(value = destructionMeter) {
  const rawLevel = Math.floor(Math.log10(Math.max(value, 1)));
  return Math.min(rawLevel, DESTRUCTION_LEVEL_NAMES.length - 1);
}

function celebrateDestructionLevel(level) {
  const color = DESTRUCTION_LEVEL_COLORS[level] || '#ffffff';
  const burstColors = [color, '#ffffff', '#ffdd00', '#ff3399', '#00ff41'];
  const burstX = canvas.width / 2;

function registerImpactCombo(relVel, x, y) {
  if (relVel <= COMBO_MIN_REL_VELOCITY) return;

  comboCount = comboTimer > 0 ? comboCount + 1 : 1;
  comboTimer = COMBO_WINDOW;
  comboFlash = 1;
  comboBest = Math.max(comboBest, comboCount);

  if (comboCount < 3) return;

  const pitch = Math.min(420 + comboCount * 70, 1800);
  const volume = 0.05 + Math.min(comboCount * 0.006, 0.08);
  playSound(pitch, 0.07, 'sine', volume);

  const comboColors = ['#ffdd00','#ff3399','#00ff41','#0abdc6','#ff6600','#cc00ff'];
  const extraCount = Math.min(4 + comboCount * 2, 24);
  for (let c = 0; c < extraCount; c++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2.5,
      life: 0.7 + Math.random() * 0.6,
      color: comboColors[Math.floor(Math.random() * comboColors.length)],
      size: 2 + Math.random() * 3,
      isConfetti: true
    });
  }

  if (COMBO_MILESTONES.includes(comboCount)) {
    explosions.push({ x, y, r: 0, maxR: 40 + comboCount * 2, alpha: 0.45 });
    shakeIntensity = Math.max(shakeIntensity, 7 + comboCount * 0.25);
    chromaticAberration = Math.max(chromaticAberration, 4 + comboCount * 0.18);
    hapticThrottled([8, 20, 8], 80);
    playBoom();
  }
}

function getRelativeVelocity(bodyA, bodyB) {
  const velA = bodyA?.velocity || {x:0, y:0};
  const velB = bodyB?.velocity || {x:0, y:0};
  return Math.sqrt(
    Math.pow(velA.x - velB.x, 2) + Math.pow(velA.y - velB.y, 2)
  );
}

function popBalloon(balloonBody, popPower = BALLOON_POP_REL_VELOCITY) {
  if (!balloonBody?.isBalloon || balloonBody.balloonPopped) return false;
  if (!Composite.get(world, balloonBody.id, 'body')) return false;

  balloonBody.balloonPopped = true;
  const color = balloonBody.render?.color || '#ff3399';
  const bx = balloonBody.position.x;
  const by = balloonBody.position.y;
  const powerBoost = Math.min(Math.max(popPower - BALLOON_POP_REL_VELOCITY, 0), 8);

  for (let i = 0; i < BALLOON_POP_BURST_PARTICLES; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * (4 + powerBoost * 0.35);
    particles.push({
      x: bx, y: by,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.8,
      life: 0.55 + Math.random() * 0.45,
      color,
      size: 2 + Math.random() * 4,
      isConfetti: true
    });
  }

  for (let i = 0; i < BALLOON_POP_STRING_PARTICLES; i++) {
    particles.push({
      x: bx + (Math.random() - 0.5) * 12,
      y: by + 10,
      vx: (Math.random() - 0.5) * 1.4,
      vy: 1 + Math.random() * 2,
      life: 0.8 + Math.random() * 0.6,
      color: '#cccccc',
      size: 2 + Math.random(),
      spin: Math.random() * Math.PI * 2,
      isBalloonString: true
    });
  }

  explosions.push({ x: bx, y: by, r: 0, maxR: 34, alpha: 0.45 });
  playSound(1200 + Math.random() * 400, 0.06, 'sine', 0.15);
  playSound(300, 0.04, 'sine', 0.06);
  hapticThrottled([8], 40);
  shakeIntensity = Math.max(shakeIntensity, 3);
  destructionMeter += BALLOON_POP_DESTRUCTION_BONUS;

  const destructionLevel = getDestructionLevel();
  if (destructionLevel > lastDestructionLevel) {
    lastDestructionLevel = destructionLevel;
    celebrateDestructionLevel(destructionLevel);
  }
  updateAmbientHum();

  const connectedConstraints = new Set();
  Composite.allConstraints(world).forEach(c => {
    if (c.bodyA === balloonBody || c.bodyB === balloonBody) {
      connectedConstraints.add(c);
    }
  });

  connectedConstraints.forEach(c => {
    const other = c.bodyA === balloonBody ? c.bodyB : c.bodyA;
    if (other?.chainConnections) {
      other.chainConnections = Math.max(0, other.chainConnections - 1);
    }
    Composite.remove(world, c);
  });

  Composite.remove(world, balloonBody);
  bodyTrails.delete(balloonBody.id);
  shatterDebounce.delete(balloonBody.id);
  portalCooldowns.delete(balloonBody.id);
  megaBounceOriginal.delete(balloonBody.id);
  ropes = ropes.filter(r => !connectedConstraints.has(r));
  chainLinks = chainLinks.filter(b => b.id !== balloonBody.id);
  if (ropeFirstBody === balloonBody) ropeFirstBody = null;
  if (grabBody === balloonBody) {
    grabActive = false;
    grabBody = null;
    grabHistory = [];
  }

  return true;
}

function rebuildWalls() {
  walls.forEach(w => Composite.remove(world, w));
  const W = canvas.width, H = canvas.height, T = 40;
  const opts = { isStatic: true, restitution: 0.3, friction: 0.5, label: 'wall' };
  walls = [
    Bodies.rectangle(W/2, H + T/2, W + T*2, T, opts),   // floor
    Bodies.rectangle(W/2, -T/2, W + T*2, T, opts),        // ceiling
    Bodies.rectangle(-T/2, H/2, T, H + T*2, opts),        // left
    Bodies.rectangle(W + T/2, H/2, T, H + T*2, opts),     // right
  ];
  Composite.add(world, walls);
}

// ── COLLISION HEATMAP ──
function initCollisionHeatmap() {
  heatCols = Math.max(1, Math.ceil(canvas.width / HEAT_CELL));
  heatRows = Math.max(1, Math.ceil(canvas.height / HEAT_CELL));
  heatGrid = Array.from({ length: heatRows }, () => new Float32Array(heatCols));
  if (!heatCanvas) {
    heatCanvas = document.createElement('canvas');
    heatCtx = heatCanvas.getContext('2d');
  }
  heatCanvas.width = heatCols;
  heatCanvas.height = heatRows;
}

function resetCollisionHeatmap() {
  heatGrid.forEach(row => row.fill(0));
  if (heatCtx) heatCtx.clearRect(0, 0, heatCols, heatRows);
}

function recordCollisionHeat(x, y, intensity) {
  if (!heatGrid.length) return;
  const col = Math.floor(x / HEAT_CELL);
  const row = Math.floor(y / HEAT_CELL);
  if (row < 0 || row >= heatRows || col < 0 || col >= heatCols) return;

  const boost = Math.min(0.08 + intensity * 0.045, 0.55);
  heatGrid[row][col] = Math.min(1, heatGrid[row][col] + boost);

  // Let hard hits bleed into adjacent cells so chaos zones glow instead of pixelating.
  const neighborBoost = boost * 0.32;
  for (let yy = row - 1; yy <= row + 1; yy++) {
    for (let xx = col - 1; xx <= col + 1; xx++) {
      if (yy === row && xx === col) continue;
      if (yy < 0 || yy >= heatRows || xx < 0 || xx >= heatCols) continue;
      heatGrid[yy][xx] = Math.min(1, heatGrid[yy][xx] + neighborBoost);
    }
  }
}

function drawCollisionHeatmap(dt) {
  if (!heatCtx || !heatGrid.length) return;
  const decay = Math.pow(HEAT_DECAY_PER_FRAME, dt * 60);
  const img = heatCtx.createImageData(heatCols, heatRows);
  let hasHeat = false;

  for (let row = 0; row < heatRows; row++) {
    for (let col = 0; col < heatCols; col++) {
      let value = heatGrid[row][col] * decay;
      if (value < 0.015) value = 0;
      heatGrid[row][col] = value;
      if (value < 0.08) continue;

      hasHeat = true;
      const i = (row * heatCols + col) * 4;
      if (value < 0.35) {
        const t = value / 0.35;
        img.data[i] = 0;
        img.data[i + 1] = Math.floor(80 * t);
        img.data[i + 2] = Math.floor(180 * t);
        img.data[i + 3] = Math.floor(70 * t);
      } else if (value < 0.72) {
        const t = (value - 0.35) / 0.37;
        img.data[i] = Math.floor(80 + 150 * t);
        img.data[i + 1] = Math.floor(20 + 35 * t);
        img.data[i + 2] = Math.floor(190 - 130 * t);
        img.data[i + 3] = Math.floor(85 + 60 * t);
      } else {
        const t = (value - 0.72) / 0.28;
        img.data[i] = 255;
        img.data[i + 1] = Math.floor(80 + 150 * t);
        img.data[i + 2] = Math.floor(20 * (1 - t));
        img.data[i + 3] = Math.floor(150 + 60 * t);
      }
    }
  }

  if (!hasHeat) {
    heatCtx.clearRect(0, 0, heatCols, heatRows);
    return;
  }

  heatCtx.putImageData(img, 0, 0);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.imageSmoothingEnabled = true;
  ctx.filter = 'blur(10px)';
  ctx.drawImage(heatCanvas, 0, 0, canvas.width, canvas.height);
  ctx.restore();
}

const FLIPPER_WIDTH = 92;
const FLIPPER_HEIGHT = 14;
const FLIPPER_ACTIVE_FRAMES = 12;

function getNextFlipperSide(side) {
  return side === 'left' ? 'right' : 'left';
}

function getFlipperAngles(side) {
  return side === 'left'
    ? { rest: 0.18, active: -0.78 }
    : { rest: -0.18, active: 0.78 };
}

function normalizeAngle(angle) {
  while (angle > Math.PI) angle -= Math.PI * 2;
  while (angle < -Math.PI) angle += Math.PI * 2;
  return angle;
}

function getFlipperAngularVelocity(side, angle, active) {
  const targets = getFlipperAngles(side);
  const error = normalizeAngle((active ? targets.active : targets.rest) - angle);
  return Math.max(-0.42, Math.min(0.42, error * 0.55));
}

function createFlipperAssembly(x, y, side) {
  const angles = getFlipperAngles(side);
  const marginX = FLIPPER_WIDTH / 2 + 14;
  const centerX = Math.max(marginX, Math.min(canvas.width - marginX, x));
  const centerY = Math.max(24, Math.min(canvas.height - 34, y));
  const pointB = { x: side === 'left' ? -FLIPPER_WIDTH / 2 : FLIPPER_WIDTH / 2, y: 0 };
  const rotatedPin = Vector.rotate(pointB, angles.rest);
  const pivotX = centerX + rotatedPin.x;
  const pivotY = centerY + rotatedPin.y;
  const color = side === 'left' ? '#ff8800' : '#00ccff';
  const body = Bodies.rectangle(centerX, centerY, FLIPPER_WIDTH, FLIPPER_HEIGHT, {
    angle: angles.rest,
    restitution: 0.8,
    friction: 0.35,
    frictionAir: 0.035,
    density: 0.007,
    label: 'flipper',
    chamfer: { radius: 7 },
    render: { type:'flipper', color, width:FLIPPER_WIDTH, height:FLIPPER_HEIGHT, side }
  });
  body.isFlipper = true;
  body.flipperSide = side;
  body.material = 'rubber';

  const pivot = Bodies.circle(pivotX, pivotY, 7, {
    isStatic: true,
    label: 'flipper-pivot',
    render: { type:'flipper-pivot', color, radius:7, side }
  });
  pivot.isFlipperPivot = true;

  const constraint = Constraint.create({
    bodyA: pivot,
    bodyB: body,
    pointA: { x:0, y:0 },
    pointB,
    length: 0,
    stiffness: 1,
    damping: 0.18,
    render: { visible:false, type:'flipper-pin' }
  });
  return { body, pivot, constraint, side, activeFrames:0 };
}

// ── SPAWN OBJECTS ──
function spawnObject(x, y, vx=0, vy=0) {

    case 'wrecking': {

        friction: 0.01,
        frictionStatic: 0.01,
        frictionAir: 0.0005,
        density: 0.002,

    case 'fan': {

      body.fanRange = 180;
      body.fanStrength = 0.003;

    }
    case 'magnet': {
      // Check if there's already a magnet near this position — toggle to repel
      let existingMagnet = null;
      for (const m of magnets) {
        const mdx = m.body.position.x - x;
        const mdy = m.body.position.y - y;
        if (Math.sqrt(mdx*mdx + mdy*mdy) < 40) { existingMagnet = m; break; }

      if (existingMagnet) {
        existingMagnet.attracting = !existingMagnet.attracting;
        existingMagnet.body.render.color = existingMagnet.attracting ? '#ff4466' : '#4466ff';

      }
      const mW = 40, mH = 50;
      body = Bodies.rectangle(x, y, mW, mH, {

        label: 'magnet',
        render: { type:'magnet', color:'#ff4466', width: mW, height: mH }
      });

      const magEntry = { body, attracting: true };
      magnets.push(magEntry);

    case 'bumper': {
      const r = 22;
      body = Bodies.circle(x, y, r, {
        isStatic: true,
        restitution: 1.5,
        label: 'bumper',
        render: { type:'bumper', color:'#ff3399', radius: r }
      });
      body.isBumper = true;
      body.hitFlash = 0;
      bumpers.push(body);

    case 'pin': {
      const pH = 55 + Math.random()*10;
      const pW = 14;
      body = Bodies.rectangle(x, y, pW, pH, {
        restitution: 0.1,
        friction: 0.5,

        density: 0.001,
        render: { type:'pin', color:'#fff8ee', width: pW, height: pH }

    case 'seesaw': {
      const plankW = 120, plankH = 8;
      const pivotH = 20;
      const plank = Bodies.rectangle(x, y - pivotH/2, plankW, plankH, {
        restitution: 0.1,
        friction: 0.8,
        density: 0.003,

      });
      const pivotVerts = [
        {x: 0, y: -pivotH/2},
        {x: pivotH*0.6, y: pivotH/2},
        {x: -pivotH*0.6, y: pivotH/2}
      ];
      const pivot = Bodies.fromVertices(x, y + pivotH/2, pivotVerts, {
        isStatic: true,
        render: { type:'seesaw-pivot', color:'#886633', height: pivotH }
      });
      const constraint = Constraint.create({
        bodyA: pivot,
        bodyB: plank,
        pointA: { x: 0, y: -pivotH/2 },
        pointB: { x: 0, y: 0 },
        length: 0,
        stiffness: 1,
        render: { visible: false }
      });
      markSpawnPop([plank, pivot]);
      Composite.add(world, [plank, pivot, constraint]);
      seesaws.push({ plank, pivot, constraint });
      playSpawn();
      playSound(300, 0.2, 'triangle', 0.1);
      pointerDown = false;
      return;
    }
    case 'chain-link': {
      const linkW = 36;
      const linkH = 12;
      body = Bodies.rectangle(x, y, linkW, linkH, {
        restitution: 0.25,
        friction: 0.35,
        density: 0.004,
        chamfer: { radius: 6 },
        label: 'chain-link',
        render: { type:'chain-link', color:'#99ccff', width: linkW, height: linkH }
      });
      body.material = 'metal';
      body.chainConnections = 0;
      chainLinks.push(body);
      break;
    }
    case 'flipper': {
      const assembly = createFlipperAssembly(x, y, nextFlipperSide);
      flippers.push(assembly);
      nextFlipperSide = getNextFlipperSide(nextFlipperSide);
      markSpawnPop([assembly.body, assembly.pivot]);
      Composite.add(world, [assembly.body, assembly.pivot, assembly.constraint]);
      showFlipperFeedback(`FLIPPER ${assembly.side === 'left' ? 'L' : 'R'} READY`);
      addFlipperBurst(assembly.body, false);
      playSpawn();
      playSound(280, 0.08, 'square', 0.07);
      haptic([7]);
      pointerDown = false;
      return assembly.body;
    }
  }

  if (body) {
    if (vx || vy) {
      if (body.bodies) {
        // composite
        body.bodies.forEach(b => Body.setVelocity(b, {x:vx, y:vy}));
      } else {
        Body.setVelocity(body, {x:vx, y:vy});
      }
    }
    markSpawnPop(body);
    if (body.bodies) {
      // It's a composite (car)
      Composite.add(world, body);
    } else {
      Composite.add(world, body);
    }
    if (body.label === 'chain-link') connectChainLink(body);
    playSpawn();
    // Birth flash effect
    const spawnX = body.position ? body.position.x : x;
    const spawnY = body.position ? body.position.y : y;
    for (let bf = 0; bf < 8; bf++) {
      const angle = (Math.PI * 2 * bf) / 8;
      particles.push({
        x: spawnX, y: spawnY,
        vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3 - 1,
        size: 3, life: 0.4, color: '#ffffff', isBirthFlash: true
      });
    }
    // Expanding ring stored in explosions array
    explosions.push({ x: spawnX, y: spawnY, r: 5, maxR: 50, alpha: 0.8, isBirthRing: true });
  }
  return body;
}

function connectChainLink(link) {
  const allBodies = Composite.allBodies(world);
  const candidates = allBodies
    .filter(b => {
      if (b === link || b.label === 'wall' || b.isStatic) return false;
      if (b.label === 'chain-link' && (b.chainConnections || 0) >= 2) return false;
      return true;
    })
    .map(b => {
      const dx = b.position.x - link.position.x;
      const dy = b.position.y - link.position.y;
      return {
        body: b,
        dist: Math.sqrt(dx*dx + dy*dy),
        isChain: b.label === 'chain-link'
      };
    })
    .filter(item => item.dist <= 55)
    .sort((a, b) => {
      if (a.isChain !== b.isChain) return a.isChain ? -1 : 1;
      return a.dist - b.dist;
    });

  let madeConnections = 0;
  for (const { body: target, dist } of candidates) {
    if (madeConnections >= 2 || (link.chainConnections || 0) >= 2) break;
    const constraint = Constraint.create({
      bodyA: link,
      bodyB: target,
      length: Math.max(18, dist),
      stiffness: 0.7,
      damping: 0.08,
      render: { type:'chain-link-constraint' }
    });
    Composite.add(world, constraint);
    link.chainConnections = (link.chainConnections || 0) + 1;
    target.chainConnections = (target.chainConnections || 0) + 1;
    madeConnections++;
    const mx = (link.position.x + target.position.x) / 2;
    const my = (link.position.y + target.position.y) / 2;
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: mx, y: my,
        vx: (Math.random()-0.5)*3,
        vy: (Math.random()-0.5)*3,
        size: 2,
        life: 0.25,
        color: '#99ccff'
      });
    }
  }
  if (madeConnections > 0) playSound(900, 0.06, 'square', 0.05);
}

function createCar(x, y) {
  const chassisW = 60, chassisH = 20;
  const wheelR = 10;
  const chassis = Bodies.rectangle(x, y, chassisW, chassisH, {
    friction: 0.5, render: { type:'car-body', color:'#0abdc6' }
  });
  chassis.material = 'metal';
  const wheelL = Bodies.circle(x - 20, y + 15, wheelR, {
    friction: 0.8, restitution: 0.3,
    render: { type:'wheel', color:'#00ff41', radius:wheelR }
  });
  wheelL.material = 'rubber';
  const wheelR2 = Bodies.circle(x + 20, y + 15, wheelR, {
    friction: 0.8, restitution: 0.3,
    render: { type:'wheel', color:'#00ff41', radius:wheelR }
  });
  wheelR2.material = 'rubber';
  const axleL = Constraint.create({ bodyA: chassis, pointA: {x:-20, y:15}, bodyB: wheelL, stiffness: 0.5, damping: 0.1, length: 0 });
  const axleR = Constraint.create({ bodyA: chassis, pointA: {x:20, y:15}, bodyB: wheelR2, stiffness: 0.5, damping: 0.1, length: 0 });

  const comp = Composite.create();
  Composite.add(comp, [chassis, wheelL, wheelR2, axleL, axleR]);
  return comp;
}

function createDino(x, y, color) {
  // T-Rex-ish shape using vertices
  const scale = 0.7 + Math.random() * 0.4;
  const verts = [
    {x:0, y:-30}, {x:15, y:-30}, {x:20, y:-20}, {x:30, y:-20},
    {x:30, y:-10}, {x:20, y:-10}, {x:20, y:0}, {x:25, y:10},
    {x:25, y:30}, {x:15, y:30}, {x:15, y:15}, {x:5, y:15},
    {x:5, y:30}, {x:-5, y:30}, {x:-5, y:10}, {x:-15, y:0},
    {x:-15, y:-15}, {x:-5, y:-20}
  ].map(v => ({x: v.x * scale, y: v.y * scale}));

  const body = Bodies.fromVertices(x, y, verts, {
    restitution: 0.4, friction: 0.5,
    render: { type:'dino', color }
  });
  return body;
}

function createRagdoll(x, y) {
  const scale = 0.8;
  const ragColor = '#ff6644';
  const group = Body.nextGroup(true); // parts don't collide with each other

  // Head
  const head = Bodies.circle(x, y - 40*scale, 10*scale, {
    friction: 0.4, restitution: 0.2, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-head', color: ragColor, radius: 10*scale }
  });

  // Torso
  const torso = Bodies.rectangle(x, y, 14*scale, 30*scale, {
    friction: 0.4, restitution: 0.1, density: 0.003,
    collisionFilter: { group },
    render: { type:'ragdoll-torso', color: ragColor, width: 14*scale, height: 30*scale }
  });

  // Upper arms
  const upperArmL = Bodies.rectangle(x - 18*scale, y - 10*scale, 16*scale, 7*scale, {
    friction: 0.3, restitution: 0.1, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: ragColor, width: 16*scale, height: 7*scale }
  });
  const upperArmR = Bodies.rectangle(x + 18*scale, y - 10*scale, 16*scale, 7*scale, {
    friction: 0.3, restitution: 0.1, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: ragColor, width: 16*scale, height: 7*scale }
  });

  // Lower arms
  const lowerArmL = Bodies.rectangle(x - 34*scale, y - 10*scale, 14*scale, 6*scale, {
    friction: 0.3, restitution: 0.1, density: 0.0015,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: '#ff8866', width: 14*scale, height: 6*scale }
  });
  const lowerArmR = Bodies.rectangle(x + 34*scale, y - 10*scale, 14*scale, 6*scale, {
    friction: 0.3, restitution: 0.1, density: 0.0015,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: '#ff8866', width: 14*scale, height: 6*scale }
  });

  // Upper legs
  const upperLegL = Bodies.rectangle(x - 5*scale, y + 24*scale, 7*scale, 18*scale, {
    friction: 0.4, restitution: 0.1, density: 0.003,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: ragColor, width: 7*scale, height: 18*scale }
  });
  const upperLegR = Bodies.rectangle(x + 5*scale, y + 24*scale, 7*scale, 18*scale, {
    friction: 0.4, restitution: 0.1, density: 0.003,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: ragColor, width: 7*scale, height: 18*scale }
  });

  // Lower legs
  const lowerLegL = Bodies.rectangle(x - 5*scale, y + 44*scale, 6*scale, 16*scale, {
    friction: 0.5, restitution: 0.1, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: '#ff8866', width: 6*scale, height: 16*scale }
  });
  const lowerLegR = Bodies.rectangle(x + 5*scale, y + 44*scale, 6*scale, 16*scale, {
    friction: 0.5, restitution: 0.1, density: 0.002,
    collisionFilter: { group },
    render: { type:'ragdoll-limb', color: '#ff8866', width: 6*scale, height: 16*scale }
  });

  // Constraints (joints)
  const jointStiff = 0.6;
  const jointDamp = 0.1;

  // Neck: head to torso
  const neck = Constraint.create({ bodyA: head, pointA: {x:0, y:10*scale}, bodyB: torso, pointB: {x:0, y:-15*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Shoulders
  const shoulderL = Constraint.create({ bodyA: torso, pointA: {x:-7*scale, y:-10*scale}, bodyB: upperArmL, pointB: {x:8*scale, y:0}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });
  const shoulderR = Constraint.create({ bodyA: torso, pointA: {x:7*scale, y:-10*scale}, bodyB: upperArmR, pointB: {x:-8*scale, y:0}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Elbows
  const elbowL = Constraint.create({ bodyA: upperArmL, pointA: {x:-8*scale, y:0}, bodyB: lowerArmL, pointB: {x:7*scale, y:0}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });
  const elbowR = Constraint.create({ bodyA: upperArmR, pointA: {x:8*scale, y:0}, bodyB: lowerArmR, pointB: {x:-7*scale, y:0}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Hips
  const hipL = Constraint.create({ bodyA: torso, pointA: {x:-5*scale, y:15*scale}, bodyB: upperLegL, pointB: {x:0, y:-9*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });
  const hipR = Constraint.create({ bodyA: torso, pointA: {x:5*scale, y:15*scale}, bodyB: upperLegR, pointB: {x:0, y:-9*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Knees
  const kneeL = Constraint.create({ bodyA: upperLegL, pointA: {x:0, y:9*scale}, bodyB: lowerLegL, pointB: {x:0, y:-8*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });
  const kneeR = Constraint.create({ bodyA: upperLegR, pointA: {x:0, y:9*scale}, bodyB: lowerLegR, pointB: {x:0, y:-8*scale}, stiffness: jointStiff, damping: jointDamp, length: 0, render: { visible: false } });

  // Angle-limit constraints (keep it human-ish, prevent spaghetti)
  const limitStiff = 0.3;
  // Head-to-torso distance limit
  const headLimit = Constraint.create({ bodyA: head, bodyB: torso, stiffness: limitStiff, damping: 0.2, length: 25*scale, render: { visible: false } });
  // Arm span limits
  const armLimitL = Constraint.create({ bodyA: torso, pointA:{x:-7*scale, y:-10*scale}, bodyB: lowerArmL, pointB:{x:-7*scale, y:0}, stiffness: 0.1, damping: 0.15, length: 30*scale, render: { visible: false } });
  const armLimitR = Constraint.create({ bodyA: torso, pointA:{x:7*scale, y:-10*scale}, bodyB: lowerArmR, pointB:{x:7*scale, y:0}, stiffness: 0.1, damping: 0.15, length: 30*scale, render: { visible: false } });
  // Leg limits
  const legLimitL = Constraint.create({ bodyA: torso, pointA:{x:-5*scale, y:15*scale}, bodyB: lowerLegL, pointB:{x:0, y:8*scale}, stiffness: 0.1, damping: 0.15, length: 32*scale, render: { visible: false } });
  const legLimitR = Constraint.create({ bodyA: torso, pointA:{x:5*scale, y:15*scale}, bodyB: lowerLegR, pointB:{x:0, y:8*scale}, stiffness: 0.1, damping: 0.15, length: 32*scale, render: { visible: false } });

  const comp = Composite.create();
  Composite.add(comp, [head, torso, upperArmL, upperArmR, lowerArmL, lowerArmR, upperLegL, upperLegR, lowerLegL, lowerLegR]);
  Composite.add(comp, [neck, shoulderL, shoulderR, elbowL, elbowR, hipL, hipR, kneeL, kneeR]);
  Composite.add(comp, [headLimit, armLimitL, armLimitR, legLimitL, legLimitR]);
  return comp;
}

// ── BOMB EXPLOSION ──
function explodeBomb(bomb) {
  const pos = bomb.position;
  const radius = 150;
  const force = 0.08;

  // Visual explosion
  explosions.push({ x:pos.x, y:pos.y, r:0, maxR:radius, alpha:1 });
  // Particles
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x: pos.x, y: pos.y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.5 + Math.random()*0.5,
      color: ['#ff3333','#ff6600','#ffaa00','#ff0000'][Math.floor(Math.random()*4)],
      size: 2 + Math.random()*4
    });
  }

  // Apply force to nearby bodies
  const allBodies = Composite.allBodies(world);
  allBodies.forEach(b => {
    if (b.isStatic || b === bomb) return;
    const dx = b.position.x - pos.x;
    const dy = b.position.y - pos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < radius && dist > 0) {
      const strength = force * (1 - dist/radius);
      if (b.isBalloon && popBalloon(b, BALLOON_POP_REL_VELOCITY + 3)) return;
      Body.applyForce(b, b.position, {
        x: (dx/dist) * strength,
        y: (dy/dist) * strength
      });
      Body.setAngularVelocity(b, (Math.random()-0.5)*0.3);
    }
  });

  // Chain reaction: check for nearby bombs and trigger them with stagger
  const chainRadius = radius * 1.3;
  allBodies.forEach(b => {
    if (!b.isBomb || b === bomb) return;
    const dx = b.position.x - pos.x;
    const dy = b.position.y - pos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < chainRadius) {
      const delay = 120 + Math.random() * 100; // 120-220ms stagger
      setTimeout(() => {
        if (Composite.get(world, b.id, 'body')) explodeBomb(b);
      }, delay);
    }
  });

  Composite.remove(world, bomb);
  haptic([30, 20, 60]);
  playBoom();
}

// ── BLOCK SHATTERING ──
function shatterBlock(b) {
  if (!Composite.get(world, b.id, 'body')) return; // already removed
  const pos = { x: b.position.x, y: b.position.y };
  const vel = { x: b.velocity.x, y: b.velocity.y };
  const color = b.render?.color || '#00ff41';
  const origSize = (b.render?.size || 30) * (b.resizeScale || 1);

  Composite.remove(world, b);
  shatterDebounce.delete(b.id);

  // Particle burst at impact
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x: pos.x, y: pos.y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.4 + Math.random()*0.5,
      color, size: 2 + Math.random()*4
    });
  }

  // Create 4-6 fragments
  const fragCount = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < fragCount; i++) {
    const angle = (Math.PI * 2 * i / fragCount) + Math.random() * 0.8;
    const fW = origSize * (0.25 + Math.random() * 0.25);
    const fH = origSize * (0.25 + Math.random() * 0.25);
    const fragX = pos.x + Math.cos(angle) * origSize * 0.35;
    const fragY = pos.y + Math.sin(angle) * origSize * 0.35;
    const frag = Bodies.rectangle(fragX, fragY, fW, fH, {
      restitution: 0.3, friction: 0.5,
      angle: Math.random() * Math.PI * 2,
      render: { type: 'block', color, size: Math.max(fW, fH) }
    });
    frag.material = 'wood';
    frag.isFragment = true; // don't shatter fragments again
    const fragSpeed = 3 + Math.random() * 5;
    Body.setVelocity(frag, {
      x: vel.x * 0.2 + Math.cos(angle) * fragSpeed,
      y: vel.y * 0.2 + Math.sin(angle) * fragSpeed
    });
    Body.setAngularVelocity(frag, (Math.random()-0.5)*0.6);
    Composite.add(world, frag);
  }

  explosions.push({ x: pos.x, y: pos.y, r: 0, maxR: origSize * 2.5, alpha: 0.5 });
  playSound(180 + Math.random()*80, 0.12, 'triangle', 0.1);
  shakeIntensity = Math.max(shakeIntensity, 6);
  chromaticAberration = Math.max(chromaticAberration, 2);
}

// ── PORTALS ──
function placePortal(x, y) {
  const portalColors = ['#cc00ff', '#00ffcc'];
  if (portals.length >= 2) {
    // Replace oldest pair — start fresh
    portals = [];
  }
  const idx = portals.length;
  const portal = { x, y, color: portalColors[idx], radius: 30, spawnTime: performance.now() };
  portals.push(portal);
  // Link partners
  if (portals.length === 2) {
    portals[0].partner = 1;
    portals[1].partner = 0;
  }
  playSound(600 + idx * 400, 0.2, 'sine', 0.1);
  playSound(900 + idx * 300, 0.15, 'square', 0.05);
  // Spawn burst
  for (let i = 0; i < 15; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 0.5 + Math.random()*0.5,
      color: portalColors[idx],
      size: 2 + Math.random()*3
    });
  }
}

      color: ['#ff3333','#ff6600','#ffaa00','#ffffff','#00ff41'][Math.floor(Math.random()*5)],

    });

  allBodies.forEach(b => {

}

        const b = Bodies.rectangle(bx, y, blockH, blockW / 3, {
          restitution: 0.1, friction: 0.8, density: 0.002,

          render: { type: 'jenga', color: '#b89448' }

        Composite.add(world, b);

    // Ascending build sound
    setTimeout(() => playSound(300 + row * 60, 0.05, 'square', 0.04), row * 50);
  }
  shakeIntensity = 5;

});

function startClearVortex(bodiesToClear) {
  clearAnimating = true;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const now = performance.now();
  clearVortex = {
    start: now,
    cx,
    cy,
    lastParticle: now
  };

  pointerDown = false;
  slingStart = null;
  slingCurrent = null;
  grabActive = false;
  grabBody = null;
  grabHistory = [];
  bodiesToClear.forEach((b, i) => {
    b.clearVortexSpin = i % 2 === 0 ? 1 : -1;
    if (b.render) b.render.clearScale = 1;
  });

  haptic([10, 10, 10, 10, 10]);
  playClearVortexSound();
  shakeIntensity = Math.max(shakeIntensity, 6);

  for (let i = 0; i < 18; i++) {
    const angle = (Math.PI * 2 * i) / 18;
    const dist = 35 + (i % 3) * 16;
    particles.push({
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      vx: Math.cos(angle + Math.PI / 2) * 2.4,
      vy: Math.sin(angle + Math.PI / 2) * 2.4,
      life: 0.6,
      color: ['#0abdc6','#00ff41','#ffffff'][i % 3],
      size: 2 + (i % 3)
    });
  }
}

function updateClearVortex(timestamp) {
  if (!clearAnimating || !clearVortex) return;

  const elapsed = timestamp - clearVortex.start;
  const t = Math.min(elapsed / CLEAR_VORTEX_MS, 1);
  const eased = t * t;
  const bodies = Composite.allBodies(world).filter(b => b.label !== 'wall');

  bodies.forEach(b => {
    if (b.render) b.render.clearScale = Math.max(0.03, 1 - eased * 0.97);

    if (b.isStatic) return;
    const dx = clearVortex.cx - b.position.x;
    const dy = clearVortex.cy - b.position.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const tangentX = -dy / dist;
    const tangentY = dx / dist;
    const pull = 0.002 + eased * 0.012;
    const spin = 0.0025 * (b.clearVortexSpin || 1);

    Body.applyForce(b, b.position, {
      x: (dx / dist) * pull + tangentX * spin,
      y: (dy / dist) * pull + tangentY * spin
    });
    Body.setAngularVelocity(b, b.angularVelocity + 0.035 * (b.clearVortexSpin || 1));
  });

  if (timestamp - clearVortex.lastParticle > 45) {
    clearVortex.lastParticle = timestamp;
    for (let i = 0; i < 4; i++) {
      const angle = timestamp / 140 + i * Math.PI / 2;
      const dist = 24 + Math.random() * 70 * (1 - t * 0.35);
      particles.push({
        x: clearVortex.cx + Math.cos(angle) * dist,
        y: clearVortex.cy + Math.sin(angle) * dist,
        vx: Math.cos(angle + Math.PI / 2) * 2.1 - Math.cos(angle) * 1.2,
        vy: Math.sin(angle + Math.PI / 2) * 2.1 - Math.sin(angle) * 1.2,
        life: 0.35,
        color: ['#0abdc6','#00ff41','#99ccff','#ffffff'][i],
        size: 1 + Math.random() * 2
      });
    }
  }

  if (t >= 1) finishClear(false);
}

function drawClearVortex(timestamp) {
  if (!clearAnimating || !clearVortex) return;

  const elapsed = timestamp - clearVortex.start;
  const t = Math.min(elapsed / CLEAR_VORTEX_MS, 1);
  const alpha = Math.max(0, 1 - t * 0.25);
  const pulse = 0.75 + Math.sin(timestamp / 80) * 0.25;

  ctx.save();
  ctx.globalAlpha = alpha;
  for (let ring = 0; ring < 5; ring++) {
    const radius = 24 + ring * 26 + Math.sin(timestamp / 110 + ring) * 6;
    ctx.beginPath();
    ctx.arc(clearVortex.cx, clearVortex.cy, radius * (1 - t * 0.35), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(10,189,198,${0.35 - ring * 0.05})`;
    ctx.lineWidth = 3 - ring * 0.35;
    ctx.stroke();
  }

  const grd = ctx.createRadialGradient(clearVortex.cx, clearVortex.cy, 0, clearVortex.cx, clearVortex.cy, 110);
  grd.addColorStop(0, `rgba(0,255,65,${0.18 * pulse})`);
  grd.addColorStop(0.5, `rgba(10,189,198,${0.12 * pulse})`);
  grd.addColorStop(1, 'rgba(10,189,198,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(clearVortex.cx, clearVortex.cy, 110, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0abdc6';
  ctx.shadowColor = '#0abdc6';
  ctx.shadowBlur = 14;
  ctx.font = '26px VT323';
  ctx.textAlign = 'center';
  ctx.globalAlpha = alpha * pulse;
  ctx.fillText('CLEARING', clearVortex.cx, clearVortex.cy - 62);
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function getPointerPosFromEnd(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.changedTouches ? e.changedTouches[0] : e;
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function isErasableBody(b) {
  return b && b.label !== 'wall' && !b.isTarget;
}

function addErasePoof(b) {
  const color = b.render?.color || '#ff4444';
  const width = b.bounds ? b.bounds.max.x - b.bounds.min.x : 24;
  const height = b.bounds ? b.bounds.max.y - b.bounds.min.y : 24;
  const spread = Math.max(12, Math.min(44, Math.max(width, height) * 0.35));
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: b.position.x + (Math.random()-0.5) * spread,
      y: b.position.y + (Math.random()-0.5) * spread,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.7,
      life: 0.28 + Math.random() * 0.28,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

function eraseBodyAt(pos) {
  const erasableBodies = Composite.allBodies(world).filter(isErasableBody);
  let target = Matter.Query.point(erasableBodies, pos).filter(isErasableBody).pop();

  if (!target) {
    let nearestDist = 44;
    erasableBodies.forEach(b => {
      const dx = b.position.x - pos.x;
      const dy = b.position.y - pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) {
        target = b;
        nearestDist = dist;
      }
    });
  }

  if (!target) return false;

  const bodiesToRemove = new Set([target]);
  const constraintsToRemove = new Set();
  const addConstraint = c => { if (c) constraintsToRemove.add(c); };

  seesaws = seesaws.filter(s => {
    if (s.plank === target || s.pivot === target) {
      bodiesToRemove.add(s.plank);
      bodiesToRemove.add(s.pivot);
      addConstraint(s.constraint);
      return false;
    }
    return true;
  });

  wreckingBalls = wreckingBalls.filter(wb => {
    if (wb.anchor === target || wb.ball === target) {
      bodiesToRemove.add(wb.anchor);
      bodiesToRemove.add(wb.ball);
      addConstraint(wb.chain);
      return false;
    }
    return true;
  });

  flippers = flippers.filter(f => {
    if (f.body === target || f.pivot === target) {
      bodiesToRemove.add(f.body);
      bodiesToRemove.add(f.pivot);
      addConstraint(f.constraint);
      return false;
    }
    return true;
  });

  Composite.allConstraints(world).forEach(c => {
    if (bodiesToRemove.has(c.bodyA) || bodiesToRemove.has(c.bodyB)) {
      constraintsToRemove.add(c);
    }
  });

  constraintsToRemove.forEach(c => {
    [c.bodyA, c.bodyB].forEach(b => {
      if (b && !bodiesToRemove.has(b) && b.chainConnections) {
        b.chainConnections = Math.max(0, b.chainConnections - 1);
      }
    });
    Composite.remove(world, c);
  });

  const removedBodyIds = new Set();
  bodiesToRemove.forEach(b => {
    if (!b || !Composite.get(world, b.id, 'body')) return;
    addErasePoof(b);
    removedBodyIds.add(b.id);
    Composite.remove(world, b);
    bodyTrails.delete(b.id);
    shatterDebounce.delete(b.id);
    portalCooldowns.delete(b.id);
    megaBounceOriginal.delete(b.id);
    anchoredBodies.delete(b);
    motorizedBodies.delete(b);
    thrusterBodies.delete(b);
    phaseBodies.delete(b);
    gyroBodies.delete(b);
    liftedBodies.delete(b);
    orbitingBodies.delete(b);
  });

  rocketBodies = rocketBodies.filter(b => !removedBodyIds.has(b.id));
  bumpers = bumpers.filter(b => !removedBodyIds.has(b.id));
  conveyors = conveyors.filter(b => !removedBodyIds.has(b.id));
  magnets = magnets.filter(m => !removedBodyIds.has(m.body.id));
  chainLinks = chainLinks.filter(b => !removedBodyIds.has(b.id));
  ramps = ramps.filter(b => !removedBodyIds.has(b.id));
  pinwheels = pinwheels.filter(entry => !removedBodyIds.has(entry.body.id) && !constraintsToRemove.has(entry.constraint));
  baskets = baskets.filter(b => !removedBodyIds.has(b.id));
  cannons = cannons.filter(b => !removedBodyIds.has(b.id));
  ropes = ropes.filter(r => !constraintsToRemove.has(r));
  struts = struts.filter(strut => !constraintsToRemove.has(strut));
  hinges = hinges.filter(hinge => !constraintsToRemove.has(hinge));
  springs = springs.filter(spring => !constraintsToRemove.has(spring));
  welds = welds.filter(weld => !constraintsToRemove.has(weld.constraint));
  tethers = tethers.filter(tether => !constraintsToRemove.has(tether.constraint));
  pivots = pivots.filter(pivot => !constraintsToRemove.has(pivot.constraint));
  pruneWebTraps();
  if (reverseFlash && removedBodyIds.has(reverseFlash.body.id)) reverseFlash = null;
  if (punchFlash && removedBodyIds.has(punchFlash.body.id)) punchFlash = null;
  if (twistFlash && removedBodyIds.has(twistFlash.body.id)) twistFlash = null;
  if (orbitSelection && removedBodyIds.has(orbitSelection.id)) resetOrbitSelection(true);
  if (ropeFirstBody && removedBodyIds.has(ropeFirstBody.id)) ropeFirstBody = null;
  if (grabBody && removedBodyIds.has(grabBody.id)) {
    grabActive = false;
    grabBody = null;
    grabHistory = [];
  }
  if (swapFirstBody && removedBodyIds.has(swapFirstBody.id)) swapFirstBody = null;
  if (stackFirstBody && removedBodyIds.has(stackFirstBody.id)) resetStackSelection(true);
  if (stackFlash && removedBodyIds.has(stackFlash.bodyId)) stackFlash = null;
  if (mirrorFlash && removedBodyIds.has(mirrorFlash.bodyId)) mirrorFlash = null;
  if (relayFirstBody && removedBodyIds.has(relayFirstBody.id)) resetRelaySelection(true);
  if (strutFirstBody && removedBodyIds.has(strutFirstBody.id)) strutFirstBody = null;
  if (rotateFlash && removedBodyIds.has(rotateFlash.body.id)) rotateFlash = null;
  if (fusionFirstBody && removedBodyIds.has(fusionFirstBody.id)) fusionFirstBody = null;
  if (hingeSelection && removedBodyIds.has(hingeSelection.body.id)) hingeSelection = null;
  if (springFirstBody && removedBodyIds.has(springFirstBody.id)) springFirstBody = null;
  if (weldSelection && removedBodyIds.has(weldSelection.body.id)) resetWeldSelection(true);
  if (tetherSelection && removedBodyIds.has(tetherSelection.body.id)) resetTetherSelection(true);
  if (launchBody && removedBodyIds.has(launchBody.id)) resetLaunchSelection(true);
  if (blinkBody && removedBodyIds.has(blinkBody.id)) resetBlinkSelection(true);
  if (squashFlash && removedBodyIds.has(squashFlash.body.id)) squashFlash = null;

  haptic([8]);
  playSound(650, 0.1, 'sine', 0.08);
  playSound(280, 0.08, 'triangle', 0.05);
  shakeIntensity = Math.max(shakeIntensity, 2);
  return true;
}

function isAnchorableBody(b) {
  return b && b.label !== 'wall' && !b.isTarget && (b.isAnchored || !b.isStatic);
}

function addAnchorBurst(body, anchored) {
  const color = anchored ? '#00e5ff' : '#ffdd00';
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12;
    const speed = 1.5 + Math.random() * 2.5;
    particles.push({
      x: body.position.x,
      y: body.position.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 2,
      life: 0.3 + Math.random() * 0.2,
      color
    });
  }
}

function toggleAnchorAt(pos) {
  const anchorableBodies = Composite.allBodies(world).filter(isAnchorableBody);
  let target = Matter.Query.point(anchorableBodies, pos).filter(isAnchorableBody).pop();

  // A forgiving fallback keeps small objects easy to hit on touch screens.
  if (!target) {
    let nearestDist = 46;
    anchorableBodies.forEach(b => {
      const dx = b.position.x - pos.x;
      const dy = b.position.y - pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) {
        target = b;
        nearestDist = dist;
      }
    });
  }

  if (!target) return false;

  const anchored = !target.isAnchored;
  if (anchored) {
    target.anchorVelocity = { x: target.velocity.x, y: target.velocity.y };
    target.anchorAngularVelocity = target.angularVelocity;
    Body.setVelocity(target, { x: 0, y: 0 });
    Body.setAngularVelocity(target, 0);
    Body.setStatic(target, true);
    target.isAnchored = true;
    anchoredBodies.add(target);
  } else {
    Body.setStatic(target, false);
    target.isAnchored = false;
    Body.setVelocity(target, {
      x: (target.anchorVelocity?.x || 0) * 0.25,
      y: (target.anchorVelocity?.y || 0) * 0.25
    });
    Body.setAngularVelocity(target, (target.anchorAngularVelocity || 0) * 0.25);
    delete target.anchorVelocity;
    delete target.anchorAngularVelocity;
    anchoredBodies.delete(target);
  }

  addAnchorBurst(target, anchored);
  haptic(anchored ? [10, 20, 10] : [8]);
  playSound(anchored ? 260 : 620, 0.12, 'square', 0.07);
  playSound(anchored ? 520 : 880, 0.08, 'sine', 0.05);
  shakeIntensity = Math.max(shakeIntensity, anchored ? 3 : 1.5);
  return true;
}

function getResizeStep(currentScale, mode) {
  const factor = mode === 'grow' ? 1.35 : 1 / 1.35;
  const nextScale = currentScale * factor;
  if (nextScale < 0.4 || nextScale > 3.4) return null;
  return { factor, nextScale };
}

function isResizableBody(b) {
  if (!b || b.label === 'wall' || b.isTarget || b.isStatic || b.parent !== b) return false;
  return !Composite.allConstraints(world).some(c => c.bodyA === b || c.bodyB === b);
}

function addResizeBurst(body, growing) {
  const color = growing ? '#66ff99' : '#ff9966';
  const width = body.bounds.max.x - body.bounds.min.x;
  const height = body.bounds.max.y - body.bounds.min.y;
  const radius = Math.max(width, height) * 0.55;
  for (let i = 0; i < 14; i++) {
    const angle = (Math.PI * 2 * i) / 14;
    const speed = 1.8 + Math.random() * 2.8;
    particles.push({
      x: body.position.x + Math.cos(angle) * radius,
      y: body.position.y + Math.sin(angle) * radius,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 2,
      life: 0.3 + Math.random() * 0.25,
      color
    });
  }
  explosions.push({
    x: body.position.x,
    y: body.position.y,
    r: Math.max(4, radius * 0.35),
    maxR: radius * 1.45,
    alpha: 0.55,
    isBirthRing: true
  });
}

function showResizeFeedback(scale, growing) {
  const feedback = document.getElementById('resize-feedback');
  feedback.textContent = `${growing ? 'GROW' : 'SHRINK'} ${Math.round(scale * 100)}%`;
  feedback.style.color = growing ? '#66ff99' : '#ff9966';
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(resizeFeedbackTimer);
  resizeFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 750);
}

function resizeBodyAt(pos) {
  const resizableBodies = Composite.allBodies(world).filter(isResizableBody);
  let target = Matter.Query.point(resizableBodies, pos).filter(isResizableBody).pop();

  // Keep small bodies practical to target on phones without resizing nearby assemblies.
  if (!target) {
    let nearestDist = 46;
    resizableBodies.forEach(b => {
      const dx = b.position.x - pos.x;
      const dy = b.position.y - pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) {
        target = b;
        nearestDist = dist;
      }
    });
  }

  if (!target) return false;

  const step = getResizeStep(target.resizeScale || 1, resizeMode);
  if (!step) {
    playSound(180, 0.1, 'square', 0.06);
    haptic([4, 30, 4]);
    shakeIntensity = Math.max(shakeIntensity, 1.5);
    return false;
  }

  Body.scale(target, step.factor, step.factor);
  target.resizeScale = step.nextScale;
  addResizeBurst(target, resizeMode === 'grow');
  showResizeFeedback(step.nextScale, resizeMode === 'grow');
  haptic(resizeMode === 'grow' ? [9, 18, 9] : [7]);
  playSound(resizeMode === 'grow' ? 360 / step.nextScale : 620 / step.nextScale, 0.13, 'sine', 0.08);
  playSound(resizeMode === 'grow' ? 240 : 880, 0.07, 'square', 0.04);
  shakeIntensity = Math.max(shakeIntensity, resizeMode === 'grow' ? 3 : 1.5);
  return true;
}

function isCloneableBody(b) {
  if (!b || b.label === 'wall' || b.label === 'chain-link' || b.isTarget || b.isStatic || b.isFragment || b.parent !== b) return false;
  return !Composite.allConstraints(world).some(c => c.bodyA === b || c.bodyB === b);
}

function getClonePosition(source, canvasWidth, canvasHeight) {
  const width = source.bounds.max.x - source.bounds.min.x;
  const height = source.bounds.max.y - source.bounds.min.y;
  const direction = source.position.x > canvasWidth / 2 ? -1 : 1;
  const offset = Math.max(38, Math.min(84, width * 1.15));
  return {
    x: Math.max(width / 2 + 8, Math.min(canvasWidth - width / 2 - 8, source.position.x + direction * offset)),
    y: Math.max(height / 2 + 8, Math.min(canvasHeight - height / 2 - 28, source.position.y - Math.min(24, height * 0.35))),
    direction
  };
}

function createBodyClone(source, position) {
  const localVertices = source.vertices.map(v => Vector.rotate({
    x: v.x - source.position.x,
    y: v.y - source.position.y
  }, -source.angle));
  const clone = Bodies.fromVertices(position.x, position.y, localVertices, {
    label: source.label,
    restitution: source.restitution,
    friction: source.friction,
    frictionStatic: source.frictionStatic,
    frictionAir: source.frictionAir,
    density: source.density,
    isSensor: source.isSensor,
    slop: source.slop,
    collisionFilter: { ...(phaseBodies.get(source) || source.collisionFilter) },
    render: { ...source.render }
  }, true);
  Body.setAngle(clone, source.angle);
  clone.material = source.material;
  clone.resizeScale = source.resizeScale || 1;
  clone.squashMode = source.squashMode || 'normal';
  clone.squashScaleX = source.squashScaleX || 1;
  clone.squashScaleY = source.squashScaleY || 1;
  clone.isBomb = Boolean(source.isBomb);
  clone.isBalloon = Boolean(source.isBalloon);
  clone.isDuck = Boolean(source.isDuck);
  clone.isFloating = Boolean(source.isFloating);
  clone.isLifted = Boolean(source.isLifted);
  if (source.electricCharge) clone.electricCharge = source.electricCharge;
  if (source.alchemyMode) clone.alchemyMode = source.alchemyMode;
  if (source.alchemyOriginal) clone.alchemyOriginal = { ...source.alchemyOriginal };
  return clone;
}

function showCloneFeedback() {
  const feedback = document.getElementById('clone-feedback');
  feedback.textContent = 'CLONED ×2';
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(cloneFeedbackTimer);
  cloneFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 750);
}

function addCloneBurst(source, clone) {
  const color = '#cc99ff';
  const dx = clone.position.x - source.position.x;
  const dy = clone.position.y - source.position.y;
  for (let i = 0; i < 18; i++) {
    const t = i / 17;
    particles.push({
      x: source.position.x + dx * t,
      y: source.position.y + dy * t,
      vx: (Math.random() - 0.5) * 2.5,
      vy: -1 - Math.random() * 2,
      size: 2 + Math.random() * 2,
      life: 0.3 + Math.random() * 0.25,
      color
    });
  }
  explosions.push({ x: clone.position.x, y: clone.position.y, r: 5, maxR: 48, alpha: 0.75, isBirthRing: true });
}

function cloneBodyAt(pos) {
  const cloneableBodies = Composite.allBodies(world).filter(isCloneableBody);
  let source = Matter.Query.point(cloneableBodies, pos).filter(isCloneableBody).pop();

  // Keep small bodies easy to duplicate with a fingertip-sized target.
  if (!source) {
    let nearestDist = 46;
    cloneableBodies.forEach(b => {
      const dx = b.position.x - pos.x;
      const dy = b.position.y - pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) {
        source = b;
        nearestDist = dist;
      }
    });
  }

  if (!source) return false;

  const position = getClonePosition(source, canvas.width, canvas.height);
  const clone = createBodyClone(source, position);
  Body.setVelocity(clone, {
    x: source.velocity.x * 0.45 + position.direction * 1.4,
    y: source.velocity.y * 0.45 - 1.2
  });
  Body.setAngularVelocity(clone, source.angularVelocity * 0.65);
  markSpawnPop(clone);
  Composite.add(world, clone);
  if (clone.isLifted) liftedBodies.add(clone);
  if (clone.render?.type === 'rocket') rocketBodies.push(clone);
  addCloneBurst(source, clone);
  showCloneFeedback();
  haptic([8, 16, 8]);
  playSound(520, 0.1, 'square', 0.06);
  playSound(780, 0.14, 'sine', 0.08);
  shakeIntensity = Math.max(shakeIntensity, 2.5);
  return true;
}

const FISSION_SCALE = Math.SQRT1_2;
const MAX_FISSION_DEPTH = 3;

function isFissionableBody(b) {
  if (!b || b.label === 'wall' || b.label === 'chain-link' || b.isTarget || b.isStatic || b.isFragment || b.parent !== b) return false;
  const width = b.bounds.max.x - b.bounds.min.x;
  const height = b.bounds.max.y - b.bounds.min.y;
  if (Math.min(width, height) < 12 || (b.fissionDepth || 0) >= MAX_FISSION_DEPTH) return false;
  return !Composite.allConstraints(world).some(c => c.bodyA === b || c.bodyB === b);
}

function getFissionLayout(source, canvasWidth, canvasHeight, scale = Math.SQRT1_2) {
  const width = source.bounds.max.x - source.bounds.min.x;
  const height = source.bounds.max.y - source.bounds.min.y;
  const axisAngle = (source.angle || 0) + (height > width ? Math.PI / 2 : 0);
  const direction = { x: Math.cos(axisAngle), y: Math.sin(axisAngle) };
  const offset = Math.max(14, Math.max(width, height) * 0.42);
  const halfWidth = width * scale / 2;
  const halfHeight = height * scale / 2;
  const clamp = sign => ({
    x: Math.max(halfWidth + 8, Math.min(canvasWidth - halfWidth - 8, source.position.x + direction.x * offset * sign)),
    y: Math.max(halfHeight + 8, Math.min(canvasHeight - halfHeight - 28, source.position.y + direction.y * offset * sign))
  });
  return { first: clamp(-1), second: clamp(1), direction };
}

function showFissionFeedback(message = 'FISSION ×2', color = '#b266ff') {
  const feedback = document.getElementById('fission-feedback');
  feedback.textContent = message;
  feedback.style.color = color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(fissionFeedbackTimer);
  fissionFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 850);
}

function addFissionBurst(position, color) {
  for (let i = 0; i < 22; i++) {
    const angle = Math.PI * 2 * i / 22;
    const speed = 2.2 + Math.random() * 4.2;
    particles.push({
      x: position.x,
      y: position.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 3,
      life: 0.3 + Math.random() * 0.3,
      color: i % 3 === 0 ? '#ffffff' : color
    });
  }
  explosions.push({ x:position.x, y:position.y, r:6, maxR:64, alpha:0.8, isBirthRing:true });
}

function fissionBodyAt(pos) {
  const fissionableBodies = Composite.allBodies(world).filter(isFissionableBody);
  let source = Matter.Query.point(fissionableBodies, pos).filter(isFissionableBody).pop();

  // A fingertip-sized fallback keeps narrow dominoes and pins practical on phones.
  if (!source) {
    let nearestDist = 46;
    fissionableBodies.forEach(b => {
      const dx = b.position.x - pos.x;
      const dy = b.position.y - pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) {
        source = b;
        nearestDist = dist;
      }
    });
  }

  if (!source) {
    showFissionFeedback('NO SPLIT', '#888888');
    playSound(180, 0.08, 'square', 0.04);
    haptic([4]);
    return false;
  }

  const layout = getFissionLayout(source, canvas.width, canvas.height, FISSION_SCALE);
  const sourceVelocity = { x:source.velocity.x, y:source.velocity.y };
  const sourceAngularVelocity = source.angularVelocity;
  const sourceDepth = source.fissionDepth || 0;
  const sourceColor = source.render?.color || '#b266ff';
  const sourceMegaBounceRestitution = megaBounceOriginal.get(source);
  const halves = [layout.first, layout.second].map((position, index) => {
    const sign = index === 0 ? -1 : 1;
    const half = createBodyClone(source, position);
    Body.scale(half, FISSION_SCALE, FISSION_SCALE);
    half.resizeScale = (source.resizeScale || 1) * FISSION_SCALE;
    half.fissionDepth = sourceDepth + 1;
    Body.setVelocity(half, {
      x: sourceVelocity.x * 0.7 + layout.direction.x * sign * 4.2,
      y: sourceVelocity.y * 0.7 + layout.direction.y * sign * 4.2 - 1.2
    });
    Body.setAngularVelocity(half, sourceAngularVelocity * 0.65 + sign * 0.1);
    markSpawnPop(half);
    return half;
  });

  Composite.remove(world, source, true);
  Composite.add(world, halves);
  bodyTrails.delete(source.id);
  shatterDebounce.delete(source.id);
  portalCooldowns.delete(source.id);
  anchoredBodies.delete(source);
  motorizedBodies.delete(source);
  thrusterBodies.delete(source);
  phaseBodies.delete(source);
  gyroBodies.delete(source);
  liftedBodies.delete(source);
  orbitingBodies.delete(source);
  delete source.isOrbiting;
  halves.forEach(half => {
    if (half.isLifted) liftedBodies.add(half);
  });
  if (twistFlash?.body === source) twistFlash = null;
  megaBounceOriginal.delete(source);
  if (sourceMegaBounceRestitution !== undefined) {
    halves.forEach(half => megaBounceOriginal.set(half, sourceMegaBounceRestitution));
  }
  rocketBodies = rocketBodies.filter(body => body !== source);
  if (source.render?.type === 'rocket') rocketBodies.push(...halves);

  addFissionBurst(source.position, sourceColor);
  showFissionFeedback();
  haptic([10, 18, 10]);
  playSound(300, 0.08, 'square', 0.07);
  playSound(820, 0.15, 'sine', 0.08);
  shakeIntensity = Math.max(shakeIntensity, 3);
  return halves;
}

const ALCHEMY_STYLES = {
  bouncy: { label:'BOUNCY', badge:'B', color:'#66ff99' },
  heavy: { label:'HEAVY', badge:'H', color:'#ff8844' },
  slippery: { label:'SLIPPERY', badge:'S', color:'#66ddff' },
  normal: { label:'NORMAL', badge:'N', color:'#aaaaaa' }
};

function getNextAlchemyMode(currentMode = 'normal') {
  const order = ['normal', 'bouncy', 'heavy', 'slippery'];
  const index = order.indexOf(currentMode);
  return order[(index + 1) % order.length];
}

function isAlchemyBody(b) {
  if (!b || b.label === 'wall' || b.label === 'chain-link' || b.isTarget || b.isStatic || b.isFragment || b.parent !== b) return false;
  return !Composite.allConstraints(world).some(c => c.bodyA === b || c.bodyB === b);
}

function getAlchemyOriginal(body) {
  if (body.alchemyOriginal) return body.alchemyOriginal;
  return {
    density: body.density,
    restitution: megaBounceOriginal.has(body.id) ? megaBounceOriginal.get(body.id) : body.restitution,
    friction: body.friction,
    frictionStatic: body.frictionStatic,
    frictionAir: body.frictionAir
  };
}

function getAlchemyPhysics(mode, original) {
  if (mode === 'bouncy') {
    return { density:original.density * 0.72, restitution:1.05, friction:0.04, frictionStatic:0.08, frictionAir:0.003 };
  }
  if (mode === 'heavy') {
    return { density:original.density * 3.2, restitution:0.06, friction:0.9, frictionStatic:1.1, frictionAir:original.frictionAir };
  }
  if (mode === 'slippery') {
    return { density:original.density * 0.9, restitution:0.16, friction:0.001, frictionStatic:0, frictionAir:0.001 };
  }
  return { ...original };
}

function showAlchemyFeedback(mode, message = null) {
  const style = ALCHEMY_STYLES[mode] || ALCHEMY_STYLES.normal;
  const feedback = document.getElementById('alchemy-feedback');
  feedback.textContent = message || `ALCHEMY: ${style.label}`;
  feedback.style.color = style.color;
  feedback.classList.remove('active');
  void feedback.offsetWidth;
  feedback.classList.add('active');
  clearTimeout(alchemyFeedbackTimer);
  alchemyFeedbackTimer = setTimeout(() => feedback.classList.remove('active'), 850);
}

function addAlchemyBurst(body, mode) {
  const color = (ALCHEMY_STYLES[mode] || ALCHEMY_STYLES.normal).color;
  const radius = Math.max(18, Math.min(58, Math.max(
    body.bounds.max.x - body.bounds.min.x,
    body.bounds.max.y - body.bounds.min.y
  ) * 0.62));
  for (let i = 0; i < 16; i++) {
    const angle = Math.PI * 2 * i / 16;
    const speed = 1.8 + Math.random() * 3.2;
    particles.push({
      x:body.position.x + Math.cos(angle) * radius * 0.45,
      y:body.position.y + Math.sin(angle) * radius * 0.45,
      vx:Math.cos(angle) * speed,
      vy:Math.sin(angle) * speed - 0.6,
      size:2 + Math.random() * 2.5,
      life:0.3 + Math.random() * 0.28,
      color:i % 4 === 0 ? '#ffffff' : color
    });
  }
  explosions.push({ x:body.position.x, y:body.position.y, r:5, maxR:radius * 1.35, alpha:0.65, isBirthRing:true });
}

function applyAlchemyMode(body, mode) {
  const original = getAlchemyOriginal(body);
  const physics = getAlchemyPhysics(mode, original);
  body.alchemyOriginal = original;
  Body.setDensity(body, physics.density);
  body.friction = physics.friction;
  body.frictionStatic = physics.frictionStatic;
  body.frictionAir = physics.frictionAir;
  if (megaBounceActive && megaBounceOriginal.has(body.id)) {
    megaBounceOriginal.set(body.id, physics.restitution);
    body.restitution = 1.2;
  } else {
    body.restitution = physics.restitution;
  }
  if (mode === 'normal') {
    delete body.alchemyMode;
    delete body.alchemyOriginal;
  } else {
    body.alchemyMode = mode;
  }
  return physics;
}

function transmuteBodyAt(pos) {
  const alchemyBodies = Composite.allBodies(world).filter(isAlchemyBody);
  let target = Matter.Query.point(alchemyBodies, pos).filter(isAlchemyBody).pop();

  // A fingertip-sized fallback keeps narrow objects easy to transmute on phones.
  if (!target) {
    let nearestDist = 46;
    alchemyBodies.forEach(b => {
      const dx = b.position.x - pos.x;
      const dy = b.position.y - pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) {
        target = b;
        nearestDist = dist;
      }
    });
  }

  if (!target) {
    showAlchemyFeedback('normal', 'NO SUBJECT');
    playSound(180, 0.08, 'square', 0.04);
    haptic([4]);
    return false;
  }

  const mode = getNextAlchemyMode(target.alchemyMode || 'normal');
  applyAlchemyMode(target, mode);
  addAlchemyBurst(target, mode);
  showAlchemyFeedback(mode);
  haptic(mode === 'heavy' ? [12, 16, 12] : [8, 12, 8]);
  const pitch = mode === 'bouncy' ? 820 : mode === 'heavy' ? 240 : mode === 'slippery' ? 620 : 460;
  playSound(pitch, 0.12, 'square', 0.06);
  playSound(pitch * 1.5, 0.1, 'sine', 0.05);
  shakeIntensity = Math.max(shakeIntensity, mode === 'heavy' ? 3 : 1.8);
  return mode;
}

function isStruttableBody(b) {
  if (!b || b.label === 'wall' || b.label === 'chain-link' || b.isTarget || b.isFragment || b.parent !== b) return false;
  return !b.isStatic || b.isAnchored;
}

function getStrutLength(bodyA, bodyB) {
  return Math.hypot(
    bodyB.position.x - bodyA.position.x,
    bodyB.position.y - bodyA.position.y
  );
}

function findStrutBodyAt(pos) {
  const candidates = Composite.allBodies(world).filter(isStruttableBody);
  let target = Matter.Query.point(candidates, pos).filter(isStruttableBody).pop();

  // A fingertip-sized fallback keeps narrow build parts practical on phones.
  if (!target) {
    let nearestDist = 46;
    candidates.forEach(b => {
      const dx = b.position.x - pos.x;
      const dy = b.position.y - pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < nearestDist) {
        target = b;
        nearestDist = dist;
      }
    });
  }
  return target;
}

function hasStrutBetween(bodyA, bodyB) {
  struts = struts.filter(strut => Composite.get(world, strut.id, 'constraint'));
  return struts.some(strut =>
    (strut.bodyA === bodyA && strut.bodyB === bodyB) ||
    (strut.bodyA === bodyB && strut.bodyB === bodyA)
  );
}

function pruneStruts() {
  const liveBodies = new Set(Composite.allBodies(world));
  struts = struts.filter(strut => {
    const inWorld = Composite.get(world, strut.id, 'constraint');
    const hasBothEnds = liveBodies.has(strut.bodyA) && liveBodies.has(strut.bodyB);
    if (inWorld && !hasBothEnds) Composite.remove(world, strut, true);

function normalizeWeldAngle(angle) {
  return Math.atan2(Math.sin(angle), Math.cos(angle));
}

function getWeldAngularVelocities(bodyA, bodyB, angleOffset, gain = 0.45, maxCorrection = 0.22) {
  const angleError = normalizeWeldAngle((bodyB.angle - bodyA.angle) - angleOffset);
  const correction = Math.max(-maxCorrection, Math.min(maxCorrection, angleError * gain));
  const velocityA = Number.isFinite(bodyA.angularVelocity) ? bodyA.angularVelocity : 0;
  const velocityB = Number.isFinite(bodyB.angularVelocity) ? bodyB.angularVelocity : 0;

  if (bodyA.isStatic && bodyB.isStatic) return { a:0, b:0, angleError };
  if (bodyA.isStatic) return { a:velocityA, b:-correction, angleError };
  if (bodyB.isStatic) return { a:correction, b:velocityB, angleError };

  const inertiaA = Number.isFinite(bodyA.inertia) && bodyA.inertia > 0 ? bodyA.inertia : 1;
  const inertiaB = Number.isFinite(bodyB.inertia) && bodyB.inertia > 0 ? bodyB.inertia : 1;
  const sharedVelocity = (velocityA * inertiaA + velocityB * inertiaB) / (inertiaA + inertiaB);
  return {
    a:sharedVelocity + correction * 0.5,
    b:sharedVelocity - correction * 0.5,
    angleError
  };
}

function getWeldSeamLength(body, localPoint, otherWorldPoint) {
  const firstWorldPoint = Vector.add(body.position, Vector.rotate(localPoint, body.angle));
  return Math.hypot(otherWorldPoint.x - firstWorldPoint.x, otherWorldPoint.y - firstWorldPoint.y);
}

  candidates.forEach(body => {

    if (distance < nearestDist) {
      nearest = body;
      nearestDist = distance;
    }
  });
  return nearest ? { body:nearest, point:{ x:nearest.position.x, y:nearest.position.y } } : null;
}

  welds = welds.filter(weld => Composite.get(world, weld.constraint.id, 'constraint'));

}

const LAUNCH_MIN_DISTANCE = 36;
const LAUNCH_MIN_SPEED = 8;
const LAUNCH_MAX_SPEED = 24;
const LAUNCH_DISTANCE_PER_SPEED = 12;

function getLaunchVelocity(origin, target) {
  const dx = target.x - origin.x;
  const dy = target.y - origin.y;
  const distance = Math.hypot(dx, dy);
  const speed = distance < LAUNCH_MIN_DISTANCE ? 0 : Math.max(LAUNCH_MIN_SPEED, Math.min(LAUNCH_MAX_SPEED, distance / LAUNCH_DISTANCE_PER_SPEED));
  const scale = distance > 0 ? speed / distance : 0;
  return { x:dx * scale, y:dy * scale, speed, distance };
}

function isLaunchableBody(b) {
  return Boolean(b && !b.isStatic && b.label !== 'wall' && b.label !== 'chain-link' && !b.isTarget && !b.isFragment && b.parent === b);
}

function findLaunchBodyAt(pos) {

    let nearestDist = 46;
    candidates.forEach(b => {
      const dist = Math.hypot(b.position.x - pos.x, b.position.y - pos.y);
      if (dist < nearestDist) {
        target = b;
        nearestDist = dist;
      }
    });
  }
  return target;
}
